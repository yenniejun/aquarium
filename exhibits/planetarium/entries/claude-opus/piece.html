<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lamplighter</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #03040c; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W, H, S, cx, cy, dpr, bgGrad, milky;

  function makeSprite(r, g, b) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
    gr.addColorStop(0.15, `rgba(${r},${g},${b},0.55)`);
    gr.addColorStop(0.45, `rgba(${r},${g},${b},0.12)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr;
    x.fillRect(0, 0, 64, 64);
    return c;
  }
  const spriteCool = makeSprite(215, 228, 255);
  const spriteWarm = makeSprite(255, 196, 120);
  const spriteFlame = makeSprite(255, 150, 70);

  // seeded random so the sky is the same every visit
  let seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  const stars = [];
  for (let i = 0; i < 300; i++) {
    const r = 1.45 * Math.sqrt(rnd());
    const a = rnd() * Math.PI * 2;
    const m = Math.pow(rnd(), 3.2);
    const tint = rnd();
    stars.push({
      x: Math.cos(a) * r, y: Math.sin(a) * r,
      m: m,
      ph: rnd() * 6.28, sp: 0.6 + rnd() * 2.2,
      col: tint < 0.18 ? [255, 220, 190] : tint < 0.4 ? [200, 215, 255] : [235, 238, 255]
    });
  }

  // ---- the figure (unit coords, sky radius ~1) ----
  const HAND = [0.02, -0.12], L = 0.5, A0 = Math.atan2(-0.35, 0.355);
  const base = {
    hat: [-0.22, -0.5], head: [-0.18, -0.37], sh: [-0.15, -0.22], hip: [-0.2, 0.08],
    fk: [-0.05, 0.25], ff: [0.0, 0.45], bk: [-0.31, 0.27], bf: [-0.4, 0.44], hand: HAND
  };
  const segs = [
    ['hat', 'head'], ['head', 'sh'], ['sh', 'hip'], ['hip', 'fk'], ['fk', 'ff'],
    ['hip', 'bk'], ['bk', 'bf'], ['sh', 'hand'], ['hand', 'pm'], ['pm', 'tip'], ['tip', 'lan']
  ];
  const mags = { hat: 0.7, head: 1.0, sh: 0.85, hip: 0.8, fk: 0.6, ff: 0.75, bk: 0.6, bf: 0.7, hand: 0.7, pm: 0.55, tip: 0.75, lan: 1.0 };

  // faint "wick" stars the lantern wakes as it passes
  const wicks = [];
  [-0.88, -1.02, -1.16, -1.3, -1.42, -1.52].forEach((a, i) => {
    const tx = HAND[0] + L * Math.cos(a), ty = HAND[1] + L * Math.sin(a);
    wicks.push({ x: tx + (rnd() - 0.5) * 0.06, y: ty + 0.1 + (rnd() - 0.5) * 0.05 - 0.02, lit: -100, done: false, ph: rnd() * 6 });
  });

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H) / 2; cx = W / 2; cy = H / 2;
    bgGrad = ctx.createRadialGradient(cx, cy * 0.9, 0, cx, cy, Math.hypot(W, H) / 2);
    bgGrad.addColorStop(0, '#0d1230');
    bgGrad.addColorStop(0.55, '#070a1d');
    bgGrad.addColorStop(1, '#020309');
    // milky band
    const m = Math.ceil(S * 3);
    milky = document.createElement('canvas');
    milky.width = milky.height = m;
    const mx = milky.getContext('2d');
    let s2 = 99;
    const r2 = () => { s2 = (s2 * 16807) % 2147483647; return (s2 - 1) / 2147483646; };
    for (let i = 0; i < 140; i++) {
      const u = r2() * 2 - 1;
      const px = m / 2 + u * m * 0.5;
      const py = m / 2 + u * m * 0.32 + Math.sin(u * 3) * m * 0.06 + (r2() - 0.5) * m * 0.12;
      const rr = m * (0.04 + r2() * 0.1);
      const g = mx.createRadialGradient(px, py, 0, px, py, rr);
      const hue = r2() < 0.5 ? '120,110,200' : '90,130,210';
      g.addColorStop(0, `rgba(${hue},0.05)`);
      g.addColorStop(1, `rgba(${hue},0)`);
      mx.fillStyle = g;
      mx.fillRect(px - rr, py - rr, rr * 2, rr * 2);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  let rot = 0;
  function P(x, y) {
    const c = Math.cos(rot), s = Math.sin(rot);
    return [cx + (x * c - y * s) * S, cy + (x * s + y * c) * S];
  }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };

  const sparks = [];
  let meteor = null, nextMeteor = 8;
  const T = 26;
  const t0 = performance.now();
  let lastT = 0, lastCycle = -1;

  function frame(now) {
    const t = (now - t0) / 1000;
    const dt = Math.min(0.05, t - lastT); lastT = t;
    const ph = t % T;
    const cyc = Math.floor(t / T);
    if (cyc !== lastCycle) { lastCycle = cyc; wicks.forEach(w => w.done = false); }

    rot = 0.22 * Math.sin(t * 2 * Math.PI / 240) + 0.03 * Math.sin(t * 0.05);

    // background
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(rot - 0.5);
    ctx.drawImage(milky, -milky.width / 2, -milky.height / 2);
    ctx.restore();

    ctx.globalCompositeOperation = 'lighter';

    // field stars
    for (const st of stars) {
      const tw = 0.65 + 0.35 * Math.sin(t * st.sp + st.ph) * Math.sin(t * st.sp * 0.37 + st.ph * 2);
      const p = P(st.x, st.y);
      const b = (0.25 + st.m * 0.9) * tw;
      const r = Math.max(0.5, S * (0.0025 + st.m * 0.006));
      ctx.fillStyle = `rgba(${st.col[0]},${st.col[1]},${st.col[2]},${b})`;
      ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 6.283); ctx.fill();
      if (st.m > 0.45) {
        const g = S * (0.03 + st.m * 0.04) * tw;
        ctx.globalAlpha = 0.5 * b;
        ctx.drawImage(spriteCool, p[0] - g, p[1] - g, g * 2, g * 2);
        ctx.globalAlpha = 1;
      }
    }

    // phases
    const trace = clamp((ph - 3) / 6, 0, 1);
    const A = smooth((ph - 8.6) / 1.2) * (1 - smooth((ph - 16.5) / 1.5));
    const fade = 1 - smooth((ph - 17) / 4);
    const lineA = ph < 17 ? 1 : fade;

    // pose
    const prog = smooth((ph - 9.6) / 6.6);
    const ang = A0 - 0.76 * Math.sin(Math.PI * prog) + 0.03 * Math.sin(t * 0.7);
    const walk = Math.sin(t * 2.6) * A;
    const pos = {};
    for (const k in base) pos[k] = [base[k][0], base[k][1]];
    pos.fk[0] += 0.025 * walk; pos.ff[0] += 0.04 * walk;
    pos.bk[0] -= 0.025 * walk; pos.bf[0] -= 0.04 * walk;
    const bob = 0.008 * Math.abs(walk);
    ['hat', 'head', 'sh', 'hand'].forEach(k => pos[k][1] -= bob);
    const hx = pos.hand[0], hy = pos.hand[1];
    pos.pm = [hx + 0.45 * L * Math.cos(ang), hy + 0.45 * L * Math.sin(ang)];
    pos.tip = [hx + L * Math.cos(ang), hy + L * Math.sin(ang)];
    pos.lan = [pos.tip[0] + 0.022 * Math.sin(t * 1.9) * (0.3 + A), pos.tip[1] + 0.1];
    const sp = {};
    for (const k in pos) sp[k] = P(pos[k][0], pos[k][1]);

    // wick stars
    for (const w of wicks) {
      if (!w.done && A > 0.5 && Math.hypot(w.x - pos.lan[0], w.y - pos.lan[1]) < 0.075) {
        w.done = true; w.lit = t;
        for (let i = 0; i < 10; i++) sparks.push({ x: w.x, y: w.y, vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12, life: 1, dec: 0.9 + Math.random() });
      }
      const glow = Math.exp(-(t - w.lit) / 7);
      const p = P(w.x, w.y);
      const tw = 0.7 + 0.3 * Math.sin(t * 1.7 + w.ph);
      ctx.fillStyle = `rgba(230,220,255,${0.18 * tw + glow * 0.7})`;
      ctx.beginPath(); ctx.arc(p[0], p[1], Math.max(0.6, S * 0.004 + glow * S * 0.004), 0, 6.283); ctx.fill();
      if (glow > 0.01) {
        const g = S * (0.05 + 0.12 * Math.exp(-(t - w.lit) * 1.5)) * (0.6 + 0.4 * glow);
        ctx.globalAlpha = glow * tw;
        ctx.drawImage(spriteWarm, p[0] - g, p[1] - g, g * 2, g * 2);
        ctx.globalAlpha = 1;
      }
    }

    // lines
    ctx.lineCap = 'round';
    const nSeg = segs.length;
    if (trace > 0 && lineA > 0) {
      // silhouette glow while alive
      if (A > 0.01) {
        ctx.strokeStyle = `rgba(255,190,120,${0.07 * A})`;
        ctx.lineWidth = S * 0.035;
        ctx.beginPath();
        for (const s of segs) { ctx.moveTo(sp[s[0]][0], sp[s[0]][1]); ctx.lineTo(sp[s[1]][0], sp[s[1]][1]); }
        ctx.stroke();
      }
      ctx.lineWidth = Math.max(0.8, S * 0.0055);
      ctx.strokeStyle = `rgba(255,218,160,${0.55 * lineA + 0.2 * A})`;
      ctx.beginPath();
      const f = trace * nSeg;
      for (let i = 0; i < nSeg; i++) {
        const k = clamp(f - i, 0, 1);
        if (k <= 0) break;
        const a = sp[segs[i][0]], b = sp[segs[i][1]];
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k);
        if (k < 1 && k > 0) {
          const hx2 = a[0] + (b[0] - a[0]) * k, hy2 = a[1] + (b[1] - a[1]) * k;
          const g = S * 0.04;
          ctx.drawImage(spriteWarm, hx2 - g, hy2 - g, g * 2, g * 2);
        }
      }
      ctx.stroke();
    }

    // constellation stars
    const lanLit = Math.max(A, trace >= 1 && ph < 17 ? 0.35 : 0) ;
    for (const k in sp) {
      const p = sp[k];
      const m = mags[k];
      const tw = 0.8 + 0.2 * Math.sin(t * 1.3 + m * 20);
      const br = (0.55 + 0.3 * trace * lineA) * tw;
      ctx.fillStyle = `rgba(255,245,225,${br})`;
      ctx.beginPath(); ctx.arc(p[0], p[1], Math.max(0.8, S * (0.006 + m * 0.005)), 0, 6.283); ctx.fill();
      const g = S * (0.04 + m * 0.05) * tw;
      ctx.globalAlpha = 0.7 * br;
      ctx.drawImage(spriteCool, p[0] - g, p[1] - g, g * 2, g * 2);
      ctx.globalAlpha = 1;
    }

    // lantern flame
    {
      const p = sp.lan;
      const fl = 0.85 + 0.1 * Math.sin(t * 11) + 0.06 * Math.sin(t * 17.3);
      const base0 = 0.25 + 0.75 * lanLit;
      let g = S * (0.08 + 0.22 * A) * fl;
      ctx.globalAlpha = 0.55 * base0;
      ctx.drawImage(spriteFlame, p[0] - g, p[1] - g, g * 2, g * 2);
      g = S * (0.05 + 0.07 * A) * fl;
      ctx.globalAlpha = 0.9 * base0;
      ctx.drawImage(spriteWarm, p[0] - g, p[1] - g, g * 2, g * 2);
      ctx.globalAlpha = 1;
      if (A > 0.3 && Math.random() < 0.35) {
        sparks.push({ x: pos.lan[0] + (Math.random() - 0.5) * 0.02, y: pos.lan[1], vx: (Math.random() - 0.5) * 0.03, vy: -0.05 - Math.random() * 0.05, life: 1, dec: 0.5 + Math.random() * 0.5 });
      }
    }

    // sparks
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.98; s.vy *= 0.98;
      s.life -= s.dec * dt;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      const p = P(s.x, s.y);
      ctx.fillStyle = `rgba(255,200,130,${s.life * 0.8})`;
      ctx.beginPath(); ctx.arc(p[0], p[1], Math.max(0.5, S * 0.004 * s.life), 0, 6.283); ctx.fill();
    }

    // occasional meteor
    if (!meteor && t > nextMeteor) {
      const a = Math.random() * 6.283;
      meteor = { x: Math.cos(a) * 0.9, y: Math.sin(a) * 0.9 - 0.2, dx: -Math.cos(a + 0.4) * 1.1, dy: -Math.sin(a + 0.4) * 1.1 + 0.2, life: 0 };
    }
    if (meteor) {
      meteor.life += dt;
      const k = meteor.life / 0.9;
      if (k >= 1) { meteor = null; nextMeteor = t + 14 + Math.random() * 20; }
      else {
        const hx3 = meteor.x + meteor.dx * k * 0.6, hy3 = meteor.y + meteor.dy * k * 0.6;
        const a = P(hx3, hy3), b = P(hx3 - meteor.dx * 0.15, hy3 - meteor.dy * 0.15);
        const gr = ctx.createLinearGradient(a[0], a[1], b[0], b[1]);
        const al = Math.sin(Math.PI * k);
        gr.addColorStop(0, `rgba(240,240,255,${0.8 * al})`);
        gr.addColorStop(1, 'rgba(240,240,255,0)');
        ctx.strokeStyle = gr; ctx.lineWidth = Math.max(0.8, S * 0.004);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
    }

    // gentle vignette
    ctx.globalCompositeOperation = 'source-over';
    const vg = ctx.createRadialGradient(cx, cy, S * 0.6, cx, cy, S * 1.05);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,8,0.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
