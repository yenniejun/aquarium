<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanetArIum</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03050d;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: pan-x pan-y;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');

  let width = 0;
  let height = 0;
  let dpr = 1;
  let radius = 100;
  let cx = 0;
  let cy = 0;

  let nebulaCanvas = document.createElement('canvas');
  let nebulaCtx = nebulaCanvas.getContext('2d');

  // Pointer parallax state (subtle, optional)
  const pointer = { x: 0, y: 0, tx: 0, ty: 0, active: false };

  // Deterministic PRNG so the starfield is crisp and harmonious
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rand = mulberry32(40917);

  // Rotate and place moth constellation in normalized porthole space [-1, 1]
  const TILT = 0.38;
  const OFFSET_X = -0.04;
  const OFFSET_Y = 0.06;
  const cosT = Math.cos(TILT);
  const sinT = Math.sin(TILT);

  function toSkySpace(lx, ly) {
    return {
      x: lx * cosT - ly * sinT + OFFSET_X,
      y: lx * sinT + ly * cosT + OFFSET_Y
    };
  }

  // Constellation star definitions in moth-local coordinates
  const rawStars = [
    { lx:  0.00, ly: -0.18, mag: 0.85, col: '#eef6ff', spike: true  }, // 0: Head
    { lx:  0.00, ly: -0.04, mag: 1.00, col: '#ffffff', spike: true  }, // 1: Thorax (heart star)
    { lx:  0.00, ly:  0.12, mag: 0.72, col: '#dbeafe', spike: false }, // 2: Abdomen
    { lx:  0.00, ly:  0.28, mag: 0.65, col: '#c7d2fe', spike: false }, // 3: Tail base
    { lx: -0.10, ly: -0.34, mag: 0.62, col: '#fef3c7', spike: false }, // 4: Left antenna tip
    { lx:  0.10, ly: -0.34, mag: 0.62, col: '#fef3c7', spike: false }, // 5: Right antenna tip
    { lx: -0.46, ly: -0.22, mag: 0.92, col: '#e0f2fe', spike: true  }, // 6: Left forewing apex
    { lx: -0.39, ly:  0.05, mag: 0.75, col: '#bae6fd', spike: false }, // 7: Left forewing outer
    { lx: -0.22, ly: -0.07, mag: 0.88, col: '#7dd3fc', spike: true  }, // 8: Left eye-spot
    { lx:  0.46, ly: -0.22, mag: 0.92, col: '#e0f2fe', spike: true  }, // 9: Right forewing apex
    { lx:  0.39, ly:  0.05, mag: 0.75, col: '#bae6fd', spike: false }, // 10: Right forewing outer
    { lx:  0.22, ly: -0.07, mag: 0.88, col: '#7dd3fc', spike: true  }, // 11: Right eye-spot
    { lx: -0.28, ly:  0.22, mag: 0.74, col: '#c4b5fd', spike: false }, // 12: Left hindwing outer
    { lx: -0.16, ly:  0.44, mag: 0.84, col: '#e0e7ff', spike: true  }, // 13: Left luna tail
    { lx:  0.28, ly:  0.22, mag: 0.74, col: '#c4b5fd', spike: false }, // 14: Right hindwing outer
    { lx:  0.16, ly:  0.44, mag: 0.84, col: '#e0e7ff', spike: true  }, // 15: Right luna tail
    { lx:  0.00, ly: -0.58, mag: 1.25, col: '#ffd984', spike: true, lantern: true } // 16: The Lantern Star
  ];

  const constellationStars = rawStars.map((s, idx) => {
    const p = toSkySpace(s.lx, s.ly);
    return {
      ...s,
      idx,
      x: p.x,
      y: p.y,
      phase: rand() * Math.PI * 2,
      speed: 1.4 + rand() * 1.4
    };
  });

  // Edges grouped by drawing wave so the figure sketches gracefully outward
  const edges = [
    // Wave 0: Spine & antennae
    { a: 1, b: 0, wave: 0 },
    { a: 1, b: 2, wave: 0 },
    { a: 2, b: 3, wave: 0 },
    { a: 0, b: 4, wave: 0 },
    { a: 0, b: 5, wave: 0 },
    // Wave 1: Forewings & eye-spots
    { a: 1, b: 6, wave: 1 },
    { a: 6, b: 7, wave: 1 },
    { a: 7, b: 2, wave: 1 },
    { a: 1, b: 8, wave: 1 },
    { a: 8, b: 6, wave: 1 },
    { a: 1, b: 9, wave: 1 },
    { a: 9, b: 10, wave: 1 },
    { a: 10, b: 2, wave: 1 },
    { a: 1, b: 11, wave: 1 },
    { a: 11, b: 9, wave: 1 },
    // Wave 2: Hindwings & trailing tails
    { a: 2, b: 12, wave: 2 },
    { a: 12, b: 13, wave: 2 },
    { a: 13, b: 3, wave: 2 },
    { a: 2, b: 14, wave: 2 },
    { a: 14, b: 15, wave: 2 },
    { a: 15, b: 3, wave: 2 }
  ];

  // Background stars across the sky disk (radius up to 1.25 so rotation never shows gaps)
  const starPalette = ['#ffffff', '#dbeafe', '#bfdbfe', '#fef3c7', '#fde68a', '#e0e7ff', '#fbcfe8'];
  const bgStars = [];
  for (let i = 0; i < 210; i++) {
    const r = Math.sqrt(rand()) * 1.24;
    const ang = rand() * Math.PI * 2;
    const size = 0.25 + Math.pow(rand(), 2.6) * 0.95;
    bgStars.push({
      x: Math.cos(ang) * r,
      y: Math.sin(ang) * r,
      size,
      alpha: 0.25 + rand() * 0.65,
      color: starPalette[Math.floor(rand() * starPalette.length)],
      phase: rand() * Math.PI * 2,
      speed: 0.8 + rand() * 2.2,
      depth: 0.4 + rand() * 0.6
    });
  }

  // Golden star-pollen motes drifting between moth and lantern
  const motes = [];
  for (let i = 0; i < 26; i++) {
    motes.push({
      t: rand(),
      speed: 0.08 + rand() * 0.11,
      spread: (rand() - 0.5) * 0.28,
      size: 0.6 + rand() * 1.4,
      phase: rand() * Math.PI * 2
    });
  }

  // Occasional silent shooting star
  const meteor = {
    active: false,
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    life: 0,
    maxLife: 1,
    nextSpawn: 4
  };

  function buildNebula() {
    const size = Math.max(256, Math.ceil(radius * 2.4 * dpr));
    nebulaCanvas.width = size;
    nebulaCanvas.height = size;
    const nctx = nebulaCtx;
    const half = size / 2;

    nctx.clearRect(0, 0, size, size);

    // Base deep sky gradient
    const baseGrad = nctx.createRadialGradient(half, half, 0, half, half, half);
    baseGrad.addColorStop(0, '#0c1633');
    baseGrad.addColorStop(0.55, '#070c1e');
    baseGrad.addColorStop(1, '#02040a');
    nctx.fillStyle = baseGrad;
    nctx.fillRect(0, 0, size, size);

    // Soft diagonal Milky Way dust clouds
    const nRand = mulberry32(8821);
    nctx.save();
    nctx.translate(half, half);
    nctx.rotate(-0.48);

    for (let i = 0; i < 28; i++) {
      const bx = (nRand() - 0.5) * size * 0.85;
      const by = (nRand() - 0.5) * size * 0.28;
      const br = size * (0.12 + nRand() * 0.22);
      const g = nctx.createRadialGradient(bx, by, 0, bx, by, br);
      const huePick = nRand();
      if (huePick < 0.45) {
        g.addColorStop(0, 'rgba(56, 130, 214, 0.055)');
        g.addColorStop(1, 'rgba(56, 130, 214, 0)');
      } else if (huePick < 0.8) {
        g.addColorStop(0, 'rgba(116, 88, 198, 0.048)');
        g.addColorStop(1, 'rgba(116, 88, 198, 0)');
      } else {
        g.addColorStop(0, 'rgba(240, 185, 110, 0.032)');
        g.addColorStop(1, 'rgba(240, 185, 110, 0)');
      }
      nctx.fillStyle = g;
      nctx.beginPath();
      nctx.arc(bx, by, br, 0, Math.PI * 2);
      nctx.fill();
    }
    nctx.restore();
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    cx = width / 2;
    cy = height / 2;
    radius = Math.min(width, height) * 0.5;
    buildNebula();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', (e) => {
    if (!width || !height) return;
    pointer.tx = ((e.clientX - cx) / radius) * 0.028;
    pointer.ty = ((e.clientY - cy) / radius) * 0.028;
    pointer.active = true;
  }, { passive: true });
  window.addEventListener('pointerleave', () => {
    pointer.tx = 0;
    pointer.ty = 0;
    pointer.active = false;
  }, { passive: true });

  function clamp01(v) {
    return v < 0 ? 0 : v > 1 ? 1 : v;
  }

  function smoothstep(v) {
    const t = clamp01(v);
    return t * t * (3 - 2 * t);
  }

  function drawStar(px, py, coreR, glowR, color, alpha, spikeLen, spikeAngle) {
    ctx.save();
    ctx.globalAlpha = alpha;

    const grad = ctx.createRadialGradient(px, py, 0, px, py, glowR);
    grad.addColorStop(0, color);
    grad.addColorStop(0.28, color + '88');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, glowR, 0, Math.PI * 2);
    ctx.fill();

    if (spikeLen > 0) {
      ctx.translate(px, py);
      ctx.rotate(spikeAngle);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.7, coreR * 0.55);
      ctx.lineCap = 'round';

      ctx.globalAlpha = alpha * 0.65;
      ctx.beginPath();
      ctx.moveTo(-spikeLen, 0);
      ctx.lineTo(spikeLen, 0);
      ctx.moveTo(0, -spikeLen);
      ctx.lineTo(0, spikeLen);
      ctx.stroke();

      ctx.globalAlpha = alpha * 0.32;
      const d = spikeLen * 0.55;
      ctx.beginPath();
      ctx.moveTo(-d, -d);
      ctx.lineTo(d, d);
      ctx.moveTo(-d, d);
      ctx.lineTo(d, -d);
      ctx.stroke();
      ctx.translate(-px, -py);
    }

    ctx.globalAlpha = Math.min(1, alpha * 1.15);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px, py, coreR, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Draw the translucent astral moth silhouette during the reveal phase
  function drawMythicMoth(scale, revealAlpha, time) {
    if (revealAlpha <= 0.005) return;

    const flutter = 1 - 0.065 * Math.sin(time * 2.3); // Gentle breathing wingbeat

    function pt(lx, ly, wingScale = 1) {
      const p = toSkySpace(lx * wingScale, ly);
      return { x: p.x * scale, y: p.y * scale };
    }

    const head = pt(0, -0.18);
    const thorax = pt(0, -0.04);
    const abdomen = pt(0, 0.12);
    const tail = pt(0, 0.28);

    const lAnt = pt(-0.10, -0.34);
    const rAnt = pt(0.10, -0.34);
    const lantern = pt(0, -0.58);

    const lApex = pt(-0.46, -0.22, flutter);
    const lOuter = pt(-0.39, 0.05, flutter);
    const lEye = pt(-0.22, -0.07, flutter);

    const rApex = pt(0.46, -0.22, flutter);
    const rOuter = pt(0.39, 0.05, flutter);
    const rEye = pt(0.22, -0.07, flutter);

    const lHind = pt(-0.28, 0.22, flutter);
    const lTail = pt(-0.16, 0.44, flutter);

    const rHind = pt(0.28, 0.22, flutter);
    const rTail = pt(0.16, 0.44, flutter);

    ctx.save();
    ctx.globalAlpha = revealAlpha;

    // Soft gossamer wing membranes
    const wingGrad = ctx.createRadialGradient(thorax.x, thorax.y, scale * 0.04, thorax.x, thorax.y, scale * 0.52);
    wingGrad.addColorStop(0, 'rgba(125, 211, 252, 0.17)');
    wingGrad.addColorStop(0.55, 'rgba(99, 102, 241, 0.10)');
    wingGrad.addColorStop(1, 'rgba(253, 230, 138, 0.04)');

    ctx.fillStyle = wingGrad;
    ctx.strokeStyle = 'rgba(186, 230, 253, 0.34)';
    ctx.lineWidth = Math.max(0.8, scale * 0.0032);

    // Left forewing & hindwing
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    ctx.quadraticCurveTo(pt(-0.26, -0.28, flutter).x, pt(-0.28, -0.28, flutter).y, lApex.x, lApex.y);
    ctx.quadraticCurveTo(pt(-0.48, -0.06, flutter).x, pt(-0.48, -0.06, flutter).y, lOuter.x, lOuter.y);
    ctx.quadraticCurveTo(pt(-0.24, 0.14, flutter).x, pt(-0.24, 0.14, flutter).y, abdomen.x, abdomen.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(abdomen.x, abdomen.y);
    ctx.quadraticCurveTo(pt(-0.26, 0.14, flutter).x, pt(-0.26, 0.14, flutter).y, lHind.x, lHind.y);
    ctx.quadraticCurveTo(pt(-0.25, 0.36, flutter).x, pt(-0.25, 0.36, flutter).y, lTail.x, lTail.y);
    ctx.quadraticCurveTo(pt(-0.07, 0.34, flutter).x, pt(-0.07, 0.34, flutter).y, tail.x, tail.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Right forewing & hindwing
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    ctx.quadraticCurveTo(pt(0.26, -0.28, flutter).x, pt(0.26, -0.28, flutter).y, rApex.x, rApex.y);
    ctx.quadraticCurveTo(pt(0.48, -0.06, flutter).x, pt(0.48, -0.06, flutter).y, rOuter.x, rOuter.y);
    ctx.quadraticCurveTo(pt(0.24, 0.14, flutter).x, pt(0.24, 0.14, flutter).y, abdomen.x, abdomen.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(abdomen.x, abdomen.y);
    ctx.quadraticCurveTo(pt(0.26, 0.14, flutter).x, pt(0.26, 0.14, flutter).y, rHind.x, rHind.y);
    ctx.quadraticCurveTo(pt(0.25, 0.36, flutter).x, pt(0.25, 0.36, flutter).y, rTail.x, rTail.y);
    ctx.quadraticCurveTo(pt(0.07, 0.34, flutter).x, pt(0.07, 0.34, flutter).y, tail.x, tail.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Delicate eye-spot rings
    ctx.strokeStyle = 'rgba(125, 211, 252, 0.48)';
    ctx.lineWidth = Math.max(0.7, scale * 0.0028);
    const eyeRadius = scale * 0.042;
    [lEye, rEye].forEach((eye) => {
      ctx.beginPath();
      ctx.arc(eye.x, eye.y, eyeRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(eye.x, eye.y, eyeRadius * 1.65, 0, Math.PI * 2);
      ctx.globalAlpha = revealAlpha * 0.4;
      ctx.stroke();
      ctx.globalAlpha = revealAlpha;
    });

    // Feathered curved antennae
    ctx.strokeStyle = 'rgba(253, 230, 138, 0.55)';
    ctx.lineWidth = Math.max(0.8, scale * 0.003);
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    ctx.quadraticCurveTo(pt(-0.08, -0.25).x, pt(-0.08, -0.25).y, lAnt.x, lAnt.y);
    ctx.moveTo(head.x, head.y);
    ctx.quadraticCurveTo(pt(0.08, -0.25).x, pt(0.08, -0.25).y, rAnt.x, rAnt.y);
    ctx.stroke();

    // Faint golden thread of longing from antennae toward the Lantern Star
    ctx.save();
    ctx.setLineDash([scale * 0.012, scale * 0.018]);
    ctx.lineDashOffset = -time * scale * 0.04;
    ctx.strokeStyle = 'rgba(255, 217, 132, 0.32)';
    ctx.lineWidth = Math.max(0.6, scale * 0.0024);
    ctx.beginPath();
    ctx.moveTo(lAnt.x, lAnt.y);
    ctx.quadraticCurveTo(pt(-0.06, -0.47).x, pt(-0.06, -0.47).y, lantern.x, lantern.y);
    ctx.moveTo(rAnt.x, rAnt.y);
    ctx.quadraticCurveTo(pt(0.06, -0.47).x, pt(0.06, -0.47).y, lantern.x, lantern.y);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  let lastTime = performance.now();
  let elapsed = 0;

  function render(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    elapsed += dt;

    // Smooth pointer parallax
    pointer.x += (pointer.tx - pointer.x) * Math.min(1, dt * 4);
    pointer.y += (pointer.ty - pointer.y) * Math.min(1, dt * 4);

    const skyRot = elapsed * 0.016; // Slow celestial turning
    const pxScale = radius * 0.92;  // Keep constellation comfortably framed inside porthole

    ctx.save();
    ctx.scale(dpr, dpr);

    // 1. Cached deep sky & Milky Way nebula
    ctx.save();
    ctx.translate(cx + pointer.x * radius * 0.4, cy + pointer.y * radius * 0.4);
    ctx.rotate(skyRot * 0.55);
    const nebSize = radius * 2.4;
    ctx.drawImage(nebulaCanvas, -nebSize / 2, -nebSize / 2, nebSize, nebSize);
    ctx.restore();

    // 2. Background twinkling stars
    const cosR = Math.cos(skyRot);
    const sinR = Math.sin(skyRot);

    for (let i = 0; i < bgStars.length; i++) {
      const s = bgStars[i];
      const rx = s.x * cosR - s.y * sinR;
      const ry = s.x * sinR + s.y * cosR;
      const sx = cx + (rx + pointer.x * s.depth) * radius;
      const sy = cy + (ry + pointer.y * s.depth) * radius;

      if (sx < -10 || sx > width + 10 || sy < -10 || sy > height + 10) continue;

      const twinkle = 0.62 + 0.38 * Math.sin(elapsed * s.speed + s.phase);
      const a = s.alpha * twinkle;
      const r = Math.max(0.55, s.size * (radius / 260) * 1.15);

      ctx.globalAlpha = a;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 3. Occasional shooting star
    meteor.nextSpawn -= dt;
    if (meteor.nextSpawn <= 0 && !meteor.active) {
      const startAng = rand() * Math.PI * 2;
      const travelAng = startAng + Math.PI * (0.72 + rand() * 0.45);
      const dist = 0.65 + rand() * 0.25;
      meteor.x = Math.cos(startAng) * dist;
      meteor.y = Math.sin(startAng) * dist;
      const spd = 0.9 + rand() * 0.5;
      meteor.vx = Math.cos(travelAng) * spd;
      meteor.vy = Math.sin(travelAng) * spd;
      meteor.life = 0;
      meteor.maxLife = 0.75 + rand() * 0.4;
      meteor.active = true;
      meteor.nextSpawn = 9 + rand() * 7;
    }

    if (meteor.active) {
      meteor.life += dt;
      if (meteor.life >= meteor.maxLife) {
        meteor.active = false;
      } else {
        const p = meteor.life / meteor.maxLife;
        const fade = Math.sin(p * Math.PI);
        const mx = cx + (meteor.x + meteor.vx * meteor.life) * radius;
        const my = cy + (meteor.y + meteor.vy * meteor.life) * radius;
        const tailLen = radius * 0.14;
        const mag = Math.hypot(meteor.vx, meteor.vy);
        const tx = mx - (meteor.vx / mag) * tailLen;
        const ty = my - (meteor.vy / mag) * tailLen;

        const mGrad = ctx.createLinearGradient(tx, ty, mx, my);
        mGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        mGrad.addColorStop(1, `rgba(224, 242, 254, ${0.75 * fade})`);
        ctx.strokeStyle = mGrad;
        ctx.lineWidth = Math.max(1, radius * 0.0045);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(mx, my);
        ctx.stroke();
      }
    }

    // 4. Constellation lifecycle (16-second loop)
    // 0-2.5s: pure stars; 2.5-6.5s: lines trace out; 6.0-11.5s: mythic moth awakens; 11.5-14.5s: gentle dissolve
    const CYCLE = 16.0;
    const phaseTime = elapsed % CYCLE;

    let lineAlpha = 1;
    if (phaseTime < 2.2) {
      lineAlpha = 0;
    } else if (phaseTime > 12.2) {
      lineAlpha = 1 - smoothstep((phaseTime - 12.2) / 2.4);
    }

    let revealAlpha = 0;
    if (phaseTime >= 5.6 && phaseTime < 7.6) {
      revealAlpha = smoothstep((phaseTime - 5.6) / 2.0);
    } else if (phaseTime >= 7.6 && phaseTime < 11.4) {
      revealAlpha = 1;
    } else if (phaseTime >= 11.4 && phaseTime < 13.8) {
      revealAlpha = 1 - smoothstep((phaseTime - 11.4) / 2.4);
    }

    // Transform into the rotating constellation frame
    ctx.save();
    ctx.translate(cx + pointer.x * radius * 0.9, cy + pointer.y * radius * 0.9);
    ctx.rotate(skyRot);

    // 4a. Mythic astral figure behind/around the stars
    drawMythicMoth(pxScale, revealAlpha, elapsed);

    // 4b. Constellation lines tracing out wave by wave
    if (lineAlpha > 0.005) {
      ctx.save();
      ctx.lineCap = 'round';
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        const waveStart = 2.2 + e.wave * 1.15;
        const progress = smoothstep((phaseTime - waveStart) / 1.35);
        if (progress <= 0) continue;

        const sa = constellationStars[e.a];
        const sb = constellationStars[e.b];
        const x1 = sa.x * pxScale;
        const y1 = sa.y * pxScale;
        const x2 = x1 + (sb.x * pxScale - x1) * progress;
        const y2 = y1 + (sb.y * pxScale - y1) * progress;

        // Soft outer filament glow
        ctx.strokeStyle = `rgba(147, 197, 253, ${0.22 * lineAlpha})`;
        ctx.lineWidth = Math.max(1.8, pxScale * 0.009);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        // Crisp star-chart line
        ctx.strokeStyle = `rgba(224, 242, 254, ${0.72 * lineAlpha})`;
        ctx.lineWidth = Math.max(0.8, pxScale * 0.0032);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 4c. Golden star-pollen motes drifting toward the Lantern Star
    const headStar = constellationStars[0];
    const lanternStar = constellationStars[16];
    const moteVisibility = 0.25 + 0.75 * revealAlpha;

    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      m.t = (m.t + dt * m.speed) % 1;
      const arc = Math.sin(m.t * Math.PI);
      const sway = Math.sin(elapsed * 1.8 + m.phase) * 0.03 * arc;
      const mx = (headStar.x + (lanternStar.x - headStar.x) * m.t + m.spread * arc * 0.45 + sway) * pxScale;
      const my = (headStar.y + (lanternStar.y - headStar.y) * m.t - m.spread * arc * 0.25) * pxScale;

      ctx.globalAlpha = arc * 0.65 * moteVisibility;
      ctx.fillStyle = '#fde68a';
      ctx.beginPath();
      ctx.arc(mx, my, Math.max(0.6, m.size * (pxScale / 260)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 4d. Constellation stars & the glowing Lantern Star
    for (let i = 0; i < constellationStars.length; i++) {
      const s = constellationStars[i];
      const twinkle = 0.84 + 0.16 * Math.sin(elapsed * s.speed + s.phase);
      const sx = s.x * pxScale;
      const sy = s.y * pxScale;
      const unit = Math.max(1.0, pxScale / 240);

      if (s.lantern) {
        const pulse = 1 + 0.14 * Math.sin(elapsed * 2.1) + 0.12 * revealAlpha;
        const glowR = 16 * unit * pulse;
        const coreR = 2.7 * unit;
        const spike = 11 * unit * pulse;

        // Warm outer lantern aura
        const aura = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowR * 2.2);
        aura.addColorStop(0, `rgba(255, 217, 132, ${0.26 * pulse})`);
        aura.addColorStop(0.5, 'rgba(251, 191, 36, 0.08)');
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(sx, sy, glowR * 2.2, 0, Math.PI * 2);
        ctx.fill();

        drawStar(sx, sy, coreR, glowR, s.col, twinkle, spike, elapsed * 0.15);
      } else {
        const boost = 1 + 0.25 * revealAlpha;
        const coreR = (1.35 + s.mag * 0.9) * unit;
        const glowR = (5.5 + s.mag * 5.0) * unit * boost;
        const spike = s.spike ? (4.5 + s.mag * 3.8) * unit * boost : 0;
        drawStar(sx, sy, coreR, glowR, s.col, twinkle, spike, 0.25);
      }
    }

    ctx.restore();
    ctx.restore();

    requestAnimationFrame(render);
  }

  resize();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
