<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #120e26;
    touch-action: pan-y;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    width: 100dvw;
    height: 100dvh;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seedField();
  }

  // ---------- helpers ----------
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // deterministic pseudo-random
  function rnd(seed) {
    const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  // ---------- field stars / dust ----------
  let fieldStars = [], dust = [];
  function seedField() {
    fieldStars = [];
    dust = [];
    for (let i = 0; i < 70; i++) {
      fieldStars.push({
        x: rnd(i + 1), y: rnd(i + 101) * 0.92,
        r: 0.5 + rnd(i + 201) * 1.3,
        p: rnd(i + 301) * Math.PI * 2,
        s: 0.4 + rnd(i + 401) * 1.2
      });
    }
    for (let i = 0; i < 22; i++) {
      dust.push({
        x: rnd(i + 501), y: rnd(i + 601),
        r: 1 + rnd(i + 701) * 2.4,
        p: rnd(i + 801) * Math.PI * 2,
        sp: 0.15 + rnd(i + 901) * 0.35,
        hue: [46, 175, 285][i % 3]
      });
    }
  }

  // ---------- potion contents ----------
  const bubbles = [];
  for (let i = 0; i < 38; i++) {
    bubbles.push({
      off: (Math.random() * 2 - 1),
      y: Math.random(),
      r: 1.2 + Math.random() * 4.2,
      sp: 0.045 + Math.random() * 0.10,
      wob: Math.random() * Math.PI * 2,
      wobSp: 1 + Math.random() * 2
    });
  }
  const innerStars = [];
  for (let i = 0; i < 46; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = Math.sqrt(Math.random());
    innerStars.push({
      a: a, d: d,
      r: 0.6 + Math.random() * 1.5,
      p: Math.random() * Math.PI * 2,
      s: 0.7 + Math.random() * 1.8,
      gold: Math.random() < 0.35
    });
  }
  const nebulae = [
    { hue: 186, dx: -0.20, dy:  0.16, rx: 0.22, ry: 0.15, sp: 0.31, ph: 0.0, sz: 0.46 },
    { hue: 272, dx:  0.18, dy:  0.02, rx: 0.18, ry: 0.20, sp: 0.23, ph: 2.1, sz: 0.52 },
    { hue: 326, dx: -0.05, dy: -0.14, rx: 0.25, ry: 0.13, sp: 0.39, ph: 4.0, sz: 0.40 },
    { hue: 42,  dx:  0.10, dy:  0.28, rx: 0.20, ry: 0.12, sp: 0.27, ph: 1.2, sz: 0.30 },
    { hue: 222, dx:  0.02, dy:  0.10, rx: 0.10, ry: 0.24, sp: 0.19, ph: 5.3, sz: 0.55 }
  ];

  // ---------- pointer ----------
  let mx = 0.5, my = 0.45, tilt = 0, slosh = 0;
  let tMx = 0.5, tSlosh = 0;
  window.addEventListener('pointermove', function (e) {
    tMx = e.clientX / Math.max(1, window.innerWidth);
    tSlosh = (tMx - 0.5) * 14;
  }, { passive: true });
  window.addEventListener('pointerleave', function () { tMx = 0.5; tSlosh = 0; }, { passive: true });

  // ---------- bottle geometry ----------
  function bottlePath(cx, topY, bw, bh, inset) {
    const s = inset || 0;
    const nw = bw * 0.175 + s * 0.2;
    const half = bw * 0.5 - s;
    const baseY = topY + bh - s;
    const ty = topY + s;
    ctx.beginPath();
    ctx.moveTo(cx - nw, ty);
    ctx.lineTo(cx - nw, ty + bh * 0.23);
    ctx.bezierCurveTo(cx - nw, ty + bh * 0.38, cx - half, ty + bh * 0.44, cx - half, ty + bh * 0.67);
    ctx.bezierCurveTo(cx - half, ty + bh * 0.90, cx - bw * 0.30, baseY, cx, baseY);
    ctx.bezierCurveTo(cx + bw * 0.30, baseY, cx + half, ty + bh * 0.90, cx + half, ty + bh * 0.67);
    ctx.bezierCurveTo(cx + half, ty + bh * 0.44, cx + nw, ty + bh * 0.38, cx + nw, ty + bh * 0.23);
    ctx.lineTo(cx + nw, ty);
    ctx.closePath();
  }

  function sparkle(x, y, r, rot, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(r * 0.16, -r * 0.16, r, 0);
    ctx.quadraticCurveTo(r * 0.16, r * 0.16, 0, r);
    ctx.quadraticCurveTo(-r * 0.16, r * 0.16, -r, 0);
    ctx.quadraticCurveTo(-r * 0.16, -r * 0.16, 0, -r);
    ctx.fill();
    ctx.restore();
  }

  function draw(t, dt) {
    const time = t * 0.001;
    mx = lerp(mx, tMx, 0.04);
    slosh = lerp(slosh, tSlosh + Math.sin(time * 0.8) * 2, 0.05);
    tilt = lerp(tilt, (mx - 0.5) * 0.35, 0.05);

    // ----- background -----
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#171233');
    bg.addColorStop(0.45, '#241647');
    bg.addColorStop(0.78, '#2d1a44');
    bg.addColorStop(1, '#160f2c');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // distant stars
    for (const s of fieldStars) {
      const a = 0.18 + 0.5 * (0.5 + 0.5 * Math.sin(time * s.s + s.p));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#e8e4ff';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ----- geometry -----
    const cx = W * 0.5;
    const bh = Math.min(H * 0.66, W * 1.15);
    const bw = bh * 0.62;
    const baseY = H * 0.885;
    const topY = baseY - bh;
    const bob = Math.sin(time * 1.25) * bh * 0.006;

    // halo glow behind bottle
    const pulse = 0.85 + 0.15 * Math.sin(time * 1.6);
    const glow = ctx.createRadialGradient(cx, topY + bh * 0.58 + bob, 10, cx, topY + bh * 0.58 + bob, bw * 0.95 * pulse);
    glow.addColorStop(0, 'rgba(126,231,255,0.30)');
    glow.addColorStop(0.45, 'rgba(168,130,255,0.20)');
    glow.addColorStop(0.75, 'rgba(255,150,200,0.07)');
    glow.addColorStop(1, 'rgba(255,150,200,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(cx - bw, topY - bh * 0.25, bw * 2, bh * 1.5);

    // ground shadow
    ctx.save();
    ctx.fillStyle = 'rgba(5,3,18,0.55)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY + H * 0.018, bw * 0.48, H * 0.016, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(120,90,255,0.13)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY + H * 0.014, bw * 0.62, H * 0.022, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ----- liquid (clipped) -----
    const liquidY = topY + bh * 0.335 + bob + slosh * 0.35;
    ctx.save();
    bottlePath(cx, topY + bob, bw, bh, bw * 0.035);
    ctx.clip();

    // deep base
    const hueShift = Math.sin(time * 0.22) * 14;
    const base = ctx.createLinearGradient(0, liquidY, 0, baseY);
    base.addColorStop(0, 'hsl(' + (196 + hueShift) + ',85%,58%)');
    base.addColorStop(0.35, 'hsl(' + (243 + hueShift) + ',82%,55%)');
    base.addColorStop(0.68, 'hsl(' + (283 + hueShift) + ',78%,46%)');
    base.addColorStop(1, 'hsl(' + (318 + hueShift) + ',72%,34%)');
    ctx.fillStyle = base;
    ctx.fillRect(cx - bw, liquidY - bh * 0.08, bw * 2, bh);

    // swirling nebula blobs
    ctx.globalCompositeOperation = 'screen';
    for (const n of nebulae) {
      const nx = cx + (n.dx + Math.cos(time * n.sp + n.ph) * n.rx * 0.55) * bw;
      const ny = topY + bob + bh * 0.62 + (n.dy + Math.sin(time * n.sp * 1.3 + n.ph) * n.ry * 0.55) * bh;
      const nr = bw * n.sz * (0.9 + 0.14 * Math.sin(time * 0.7 + n.ph));
      const g = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
      const h = (n.hue + hueShift + 360) % 360;
      g.addColorStop(0, 'hsla(' + h + ',95%,68%,0.55)');
      g.addColorStop(0.55, 'hsla(' + h + ',90%,55%,0.22)');
      g.addColorStop(1, 'hsla(' + h + ',90%,50%,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(nx, ny, nr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // slow spiral swirls
    ctx.save();
    ctx.translate(cx, topY + bob + bh * 0.65);
    ctx.rotate(Math.sin(time * 0.35) * 0.25);
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = Math.max(1, bw * 0.012);
    ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      const start = time * (0.25 + k * 0.07) + k * 2.1;
      ctx.arc(0, 0, bw * (0.13 + k * 0.10), start, start + 1.7);
      ctx.stroke();
    }
    ctx.restore();

    // wavy surface
    ctx.beginPath();
    ctx.moveTo(cx - bw, liquidY + bh * 0.06);
    for (let x = -bw; x <= bw; x += 6) {
      const y = liquidY
        + Math.sin(x * 0.045 + time * 2.1) * bh * 0.008
        + Math.sin(x * 0.018 - time * 1.3) * bh * 0.006
        + (x / bw) * slosh * 0.7;
      ctx.lineTo(cx + x, y);
    }
    ctx.lineTo(cx + bw, liquidY + bh * 0.05);
    ctx.lineTo(cx - bw, liquidY + bh * 0.05);
    ctx.closePath();
    const surf = ctx.createLinearGradient(cx - bw, 0, cx + bw, 0);
    surf.addColorStop(0, 'rgba(160,245,255,0.25)');
    surf.addColorStop(0.5, 'rgba(255,255,255,0.65)');
    surf.addColorStop(1, 'rgba(255,190,235,0.30)');
    ctx.fillStyle = surf;
    ctx.fill();
    // surface shimmer line
    ctx.beginPath();
    for (let x = -bw * 0.44; x <= bw * 0.44; x += 5) {
      const y = liquidY
        + Math.sin(x * 0.045 + time * 2.1) * bh * 0.008
        + Math.sin(x * 0.018 - time * 1.3) * bh * 0.006
        + (x / bw) * slosh * 0.7;
      if (x === -bw * 0.44) ctx.moveTo(cx + x, y); else ctx.lineTo(cx + x, y);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = Math.max(1, bh * 0.003);
    ctx.stroke();

    // inner stars
    for (const s of innerStars) {
      const sx = cx + Math.cos(s.a + time * 0.05) * s.d * bw * 0.40;
      const sy = topY + bob + bh * 0.66 + Math.sin(s.a) * s.d * bh * 0.25 + Math.sin(time * 0.4 + s.p) * 2;
      if (sy < liquidY + 6) continue;
      const a = 0.25 + 0.75 * Math.pow(0.5 + 0.5 * Math.sin(time * s.s + s.p), 2);
      ctx.globalAlpha = a;
      ctx.fillStyle = s.gold ? '#ffe9a8' : '#ffffff';
      ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, Math.PI * 2); ctx.fill();
      if (s.r > 1.7) sparkle(sx, sy, s.r * 3.2, time * 0.6 + s.p, s.gold ? '#ffe9a8' : '#ffffff', a * 0.8);
    }
    ctx.globalAlpha = 1;

    // bubbles
    for (const b of bubbles) {
      b.y -= b.sp * dt * 0.06;
      b.wob += b.wobSp * dt * 0.004;
      if (b.y < 0) { b.y = 1; b.off = Math.random() * 2 - 1; }
      const by = lerp(baseY - bh * 0.04, liquidY + bh * 0.025, b.y);
      // narrow as they enter the neck region
      const squeeze = by < topY + bh * 0.46 ? 0.35 : 1;
      const bx = cx + b.off * bw * 0.36 * squeeze + Math.sin(b.wob) * bw * 0.016;
      const wobR = b.r * (0.9 + 0.15 * Math.sin(b.wob * 1.7));
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.fillStyle = 'rgba(190,240,255,0.16)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(bx, by, wobR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(bx - wobR * 0.3, by - wobR * 0.3, Math.max(0.6, wobR * 0.22), 0, Math.PI * 2); ctx.fill();
      // pop sparkle near surface
      if (b.y > 0.02 && b.y < 0.06) {
        sparkle(bx, by, wobR * 2.2, b.wob, '#c8f4ff', 0.5 * (1 - b.y / 0.06));
      }
    }

    // glitter sediment at bottom
    for (let i = 0; i < 26; i++) {
      const gx = cx + (rnd(i + 42) * 2 - 1) * bw * 0.34 * (1 - rnd(i + 43) * 0.3);
      const gy = baseY - rnd(i + 44) * bh * 0.055 - 2;
      const a = 0.3 + 0.6 * (0.5 + 0.5 * Math.sin(time * (1 + rnd(i + 45)) + i));
      ctx.globalAlpha = a;
      ctx.fillStyle = i % 3 === 0 ? '#ffd98a' : '#bfefff';
      ctx.beginPath(); ctx.arc(gx, gy, 0.7 + rnd(i + 46) * 1.1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore(); // unclip

    // ----- orbiting pearls around the belly -----
    const orbitCY = topY + bob + bh * 0.63;
    for (let i = 0; i < 3; i++) {
      const ang = time * (0.55 + i * 0.06) + i * (Math.PI * 2 / 3);
      const ox = cx + Math.cos(ang) * bw * 0.60;
      const oy = orbitCY + Math.sin(ang) * bh * 0.10;
      const behind = Math.sin(ang) < 0;
      ctx.globalAlpha = behind ? 0.25 : 0.95;
      const cols = ['#8be9ff', '#ffb7e3', '#ffe29a'];
      const g = ctx.createRadialGradient(ox - 1.5, oy - 1.5, 0, ox, oy, bw * 0.035);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, cols[i]);
      g.addColorStop(1, 'rgba(255,255,255,0.05)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ox, oy, bw * 0.032 * (behind ? 0.8 : 1), 0, Math.PI * 2); ctx.fill();
      if (!behind) sparkle(ox, oy, bw * 0.07, time + i, cols[i], 0.55);
    }
    ctx.globalAlpha = 1;

    // ----- glass body -----
    bottlePath(cx, topY + bob, bw, bh, 0);
    ctx.strokeStyle = 'rgba(225,240,255,0.55)';
    ctx.lineWidth = Math.max(1.6, bw * 0.012);
    ctx.stroke();
    bottlePath(cx, topY + bob, bw, bh, bw * 0.035);
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = Math.max(1, bw * 0.006);
    ctx.stroke();

    // thick glass base glint
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, baseY - bh * 0.018, bw * 0.26, bh * 0.016, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(170,225,255,0.12)';
    ctx.fill();
    ctx.restore();

    // left highlight sweep
    ctx.save();
    ctx.translate(cx, topY + bob);
    ctx.rotate(0.06 + tilt * 0.3);
    const hg = ctx.createLinearGradient(-bw * 0.36, 0, -bw * 0.18, 0);
    hg.addColorStop(0, 'rgba(255,255,255,0)');
    hg.addColorStop(0.5, 'rgba(255,255,255,0.38)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(-bw * 0.27, bh * 0.62, bw * 0.055, bh * 0.20, 0.12, 0, Math.PI * 2);
    ctx.fill();
    // neck highlight
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    rr(-bw * 0.115, bh * 0.045, bw * 0.045, bh * 0.17, bw * 0.02);
    ctx.fill();
    ctx.restore();

    // small right sparkle on shoulder
    sparkle(cx + bw * 0.30, topY + bob + bh * 0.47, bw * 0.045 * (0.8 + 0.3 * Math.sin(time * 2.2)), time * 0.8, '#ffffff', 0.7);

    // ----- lip -----
    const lipW = bw * 0.46, lipH = bh * 0.045;
    const lipGrad = ctx.createLinearGradient(cx - lipW / 2, 0, cx + lipW / 2, 0);
    lipGrad.addColorStop(0, 'rgba(150,200,235,0.55)');
    lipGrad.addColorStop(0.25, 'rgba(255,255,255,0.85)');
    lipGrad.addColorStop(0.55, 'rgba(190,220,255,0.65)');
    lipGrad.addColorStop(1, 'rgba(140,170,225,0.5)');
    ctx.fillStyle = lipGrad;
    rr(cx - lipW / 2, topY + bob - lipH * 0.35, lipW, lipH, lipH * 0.5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // ----- crystal stem into neck -----
    ctx.fillStyle = 'rgba(210,235,255,0.75)';
    rr(cx - bw * 0.055, topY + bob - bh * 0.075, bw * 0.11, bh * 0.085, bw * 0.03);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(cx - bw * 0.035, topY + bob - bh * 0.07, bw * 0.018, bh * 0.07);

    // ----- crescent moon stopper -----
    const moonCX = cx + tilt * bw * 0.22;
    const moonCY = topY + bob - bh * 0.155 + Math.sin(time * 1.25 + 0.6) * bh * 0.008;
    const moonR = bw * 0.20;
    ctx.save();
    ctx.translate(moonCX, moonCY);
    ctx.rotate(-0.38 + tilt * 0.6 + Math.sin(time * 0.7) * 0.05);
    // glow
    const mg = ctx.createRadialGradient(0, 0, moonR * 0.2, 0, 0, moonR * 2.1);
    mg.addColorStop(0, 'rgba(255,224,150,0.35)');
    mg.addColorStop(1, 'rgba(255,224,150,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(0, 0, moonR * 2.1, 0, Math.PI * 2); ctx.fill();
    // crescent via two circles
    ctx.beginPath(); ctx.arc(0, 0, moonR, 0, Math.PI * 2);
    ctx.save();
    ctx.clip();
    const gold = ctx.createLinearGradient(-moonR, -moonR, moonR, moonR);
    gold.addColorStop(0, '#fff3c4');
    gold.addColorStop(0.45, '#ffd76e');
    gold.addColorStop(1, '#f0a63e');
    ctx.fillStyle = gold;
    ctx.fillRect(-moonR, -moonR, moonR * 2, moonR * 2);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(moonR * 0.42, -moonR * 0.30, moonR * 0.82, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
    // crescent edge shine
    ctx.beginPath(); ctx.arc(0, 0, moonR * 0.97, Math.PI * 0.55, Math.PI * 1.25);
    ctx.strokeStyle = 'rgba(255,255,230,0.8)';
    ctx.lineWidth = Math.max(1, moonR * 0.07);
    ctx.lineCap = 'round';
    ctx.stroke();
    // tiny craters
    ctx.fillStyle = 'rgba(214,150,50,0.35)';
    ctx.beginPath(); ctx.arc(-moonR * 0.48, moonR * 0.28, moonR * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-moonR * 0.30, -moonR * 0.42, moonR * 0.09, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // star dangle from moon tip
    const dangleX = moonCX + Math.sin(time * 1.4) * bw * 0.02 + moonR * 0.72;
    const dangleY = moonCY + moonR * 0.78 + Math.cos(time * 1.4) * 2;
    ctx.strokeStyle = 'rgba(255,230,160,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(moonCX + moonR * 0.60, moonCY + moonR * 0.55);
    ctx.quadraticCurveTo(dangleX, moonCY + moonR * 0.62, dangleX, dangleY - bw * 0.03);
    ctx.stroke();
    sparkle(dangleX, dangleY, bw * 0.055 * (0.85 + 0.25 * Math.sin(time * 3)), time * 1.2, '#ffe9a8', 0.95);

    // ----- floating dust motes -----
    for (const d of dust) {
      const dx = ((d.x + Math.sin(time * 0.12 + d.p) * 0.03) % 1) * W;
      const dy = ((d.y - time * 0.008 * d.sp) % 1 + 1) % 1 * H * 0.96;
      const a = 0.12 + 0.30 * (0.5 + 0.5 * Math.sin(time * d.sp * 3 + d.p));
      ctx.globalAlpha = a;
      ctx.fillStyle = 'hsl(' + d.hue + ',90%,78%)';
      ctx.beginPath(); ctx.arc(dx, dy, d.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // a few ambient sparkles around bottle
    for (let i = 0; i < 5; i++) {
      const a = time * (0.3 + i * 0.05) + i * 1.9;
      const sx = cx + Math.cos(a) * bw * (0.62 + 0.08 * Math.sin(time * 0.5 + i));
      const sy = topY + bh * (0.25 + 0.13 * i) + Math.sin(time * 1.1 + i * 2) * 6;
      const tw = Math.pow(0.5 + 0.5 * Math.sin(time * 2 + i * 1.7), 2);
      sparkle(sx, sy, bw * 0.035 * (0.5 + tw), a, i % 2 ? '#ffc7ec' : '#a5ecff', tw * 0.85);
    }

    // ----- vignette -----
    const vg = ctx.createRadialGradient(W / 2, H * 0.48, Math.min(W, H) * 0.32, W / 2, H * 0.52, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(6,4,20,0)');
    vg.addColorStop(1, 'rgba(6,4,20,0.5)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  let last = 0;
  function frame(ts) {
    const dt = Math.min(50, ts - last || 16);
    last = ts;
    draw(ts, dt);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
