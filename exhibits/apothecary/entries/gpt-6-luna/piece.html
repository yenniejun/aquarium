<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #171a29;
  }
  body { display: grid; place-items: center; }
  svg {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 600px;
  }
  .halo { animation: breathe 5s ease-in-out infinite; transform-origin: 50% 49%; }
  .bottle-sway { animation: sway 7s ease-in-out infinite; transform-origin: 200px 350px; }
  .wave-drift { animation: drift 6s ease-in-out infinite alternate; }
  .bubble { animation: rise 4s ease-in infinite; transform-box: fill-box; }
  .bubble:nth-child(2n) { animation-duration: 5.2s; }
  .bubble:nth-child(3n) { animation-duration: 3.6s; }
  .twinkle { animation: twinkle 2.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .twinkle:nth-child(2n) { animation-delay: -1.3s; }
  .orbit { animation: orbit 18s linear infinite; transform-origin: 200px 345px; }
  @keyframes breathe { 0%,100% { opacity:.55; transform:scale(.96); } 50% { opacity:.9; transform:scale(1.04); } }
  @keyframes sway { 0%,100% { transform:rotate(-1deg) translateY(1px); } 50% { transform:rotate(1deg) translateY(-2px); } }
  @keyframes drift { from { transform:translateX(-18px); } to { transform:translateX(18px); } }
  @keyframes rise { 0% { transform:translateY(38px); opacity:0; } 15% { opacity:.85; } 85% { opacity:.65; } 100% { transform:translateY(-95px); opacity:0; } }
  @keyframes twinkle { from { opacity:.3; transform:scale(.75); } to { opacity:1; transform:scale(1.2); } }
  @keyframes orbit { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:12s !important; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A glowing potion bottle full of tiny floating lights">
  <defs>
    <radialGradient id="backGlow">
      <stop offset="0" stop-color="#564b88" stop-opacity=".48"/>
      <stop offset=".55" stop-color="#34324f" stop-opacity=".2"/>
      <stop offset="1" stop-color="#191b2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e0fbec" stop-opacity=".31"/>
      <stop offset=".22" stop-color="#a8e8dc" stop-opacity=".08"/>
      <stop offset=".65" stop-color="#9ddce8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f4e2ba" stop-opacity=".36"/>
    </linearGradient>
    <linearGradient id="potion" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#9d77df"/>
      <stop offset=".38" stop-color="#5d72ca"/>
      <stop offset=".72" stop-color="#347c9c"/>
      <stop offset="1" stop-color="#235968"/>
    </linearGradient>
    <linearGradient id="potionLight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4a9df" stop-opacity=".8"/>
      <stop offset="1" stop-color="#a7dbff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0ba"/>
      <stop offset=".42" stop-color="#d8a85d"/>
      <stop offset="1" stop-color="#8e5b37"/>
    </linearGradient>
    <linearGradient id="stopper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff4cc"/>
      <stop offset=".42" stop-color="#f1b879"/>
      <stop offset="1" stop-color="#a75f78"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="inside">
      <path d="M169 181H231V226C231 250 250 266 276 285C307 307 323 346 323 391V456C323 496 296 516 263 516H137C104 516 77 496 77 456V391C77 346 93 307 124 285C150 266 169 250 169 226Z"/>
    </clipPath>
  </defs>

  <ellipse cx="200" cy="311" rx="185" ry="246" fill="url(#backGlow)" class="halo"/>
  <ellipse cx="200" cy="532" rx="115" ry="14" fill="#090f20" opacity=".65"/>
  <ellipse cx="200" cy="528" rx="78" ry="6" fill="#9ed8ea" opacity=".12" filter="url(#smallGlow)"/>

  <g class="orbit" opacity=".65">
    <path d="M72 344c10-105 56-170 128-170s118 65 128 170" fill="none" stroke="#e5c990" stroke-opacity=".22" stroke-width="1" stroke-dasharray="2 8"/>
    <circle cx="74" cy="342" r="3" fill="#ffe7a5" class="twinkle"/>
    <circle cx="326" cy="342" r="2.5" fill="#b8e5ff" class="twinkle"/>
  </g>

  <g class="twinkle" fill="#ffe4aa">
    <path d="M86 236l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <circle cx="307" cy="230" r="2"/>
    <path d="M318 442l1.5 4.5L324 448l-4.5 1.5L318 454l-1.5-4.5L312 448l4.5-1.5z"/>
    <circle cx="70" cy="420" r="1.6"/>
  </g>
  <g class="twinkle" fill="#b8e8ff">
    <circle cx="105" cy="292" r="1.8"/>
    <path d="M295 275l1.4 4.2 4.2 1.4-4.2 1.4-1.4 4.2-1.4-4.2-4.2-1.4 4.2-1.4z"/>
  </g>

  <g class="bottle-sway">
    <!-- The glowing contents -->
    <g clip-path="url(#inside)">
      <rect x="69" y="377" width="262" height="155" fill="url(#potion)"/>
      <ellipse cx="192" cy="431" rx="110" ry="86" fill="#a555d2" opacity=".18" filter="url(#softGlow)"/>
      <path d="M62 390 C105 376 127 398 164 388 S224 376 259 389 S314 400 339 384 V420 H62Z" fill="url(#potionLight)" opacity=".72" class="wave-drift"/>
      <path d="M52 403 C91 389 128 407 164 399 S229 389 267 401 S317 408 350 392" fill="none" stroke="#ffcfed" stroke-opacity=".62" stroke-width="2" class="wave-drift"/>
      <path d="M70 476c41-22 73 13 112-7s63-9 104 2v60H70z" fill="#183e62" opacity=".34"/>
      <path d="M88 502c28-14 53-8 75 0" fill="none" stroke="#9fe8ea" stroke-opacity=".28" stroke-width="2"/>

      <g fill="#d9f7ff" opacity=".9">
        <circle class="bubble" cx="137" cy="473" r="3"/>
        <circle class="bubble" cx="173" cy="455" r="2"/>
        <circle class="bubble" cx="215" cy="481" r="3.5"/>
        <circle class="bubble" cx="250" cy="449" r="2.4"/>
        <circle class="bubble" cx="282" cy="475" r="2"/>
        <circle class="bubble" cx="190" cy="493" r="1.6"/>
        <circle class="bubble" cx="111" cy="450" r="1.8"/>
      </g>
      <g class="twinkle">
        <path d="M154 444l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffe6a2"/>
      </g>
      <g class="twinkle">
        <path d="M244 423l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#f9d5ff"/>
      </g>
      <circle cx="190" cy="466" r="20" fill="#c391ff" opacity=".13" filter="url(#smallGlow)"/>
    </g>

    <!-- Bottle silhouette -->
    <path d="M160 166H240V225C240 252 260 268 284 286C316 310 333 347 333 394V460C333 503 303 528 266 528H134C97 528 67 503 67 460V394C67 347 84 310 116 286C140 268 160 252 160 225Z"
          fill="url(#glass)" stroke="#c6f1e7" stroke-opacity=".8" stroke-width="2.2"/>
    <path d="M169 181H231V226C231 250 250 266 276 285C307 307 323 346 323 391V456C323 496 296 516 263 516H137C104 516 77 496 77 456V391C77 346 93 307 124 285C150 266 169 250 169 226Z"
          fill="none" stroke="#edfff1" stroke-opacity=".32" stroke-width="1.2"/>

    <!-- Neck and delicate gold bands -->
    <path d="M157 165v-7h86v7" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M158 177h84" stroke="#fff1c7" stroke-opacity=".7" stroke-width="2"/>
    <path d="M159 185h82" stroke="#9ad9d2" stroke-opacity=".55" stroke-width="1"/>
    <path d="M166 196h6v37c0 23-16 38-39 55-25 18-44 49-49 83" fill="none" stroke="url(#shine)" stroke-width="5" stroke-linecap="round" opacity=".52"/>
    <path d="M239 196v31c0 26 20 43 44 62 25 20 39 49 42 81" fill="none" stroke="#fff4d1" stroke-opacity=".48" stroke-width="3" stroke-linecap="round"/>
    <path d="M78 445v16c0 30 18 49 42 54" fill="none" stroke="#fff" stroke-opacity=".37" stroke-width="3" stroke-linecap="round"/>
    <path d="M316 431v25c0 22-8 37-23 48" fill="none" stroke="#c9f4ff" stroke-opacity=".34" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M119 510c23 11 139 12 162-1" fill="none" stroke="#f7e9c8" stroke-opacity=".38" stroke-width="2"/>

    <!-- Tiny star inlaid on the glass -->
    <path d="M200 292l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="none" stroke="#f4dc9c" stroke-width="1.5" opacity=".78"/>
    <circle cx="200" cy="307" r="2" fill="#fff0bd"/>
    <path d="M112 360c8-5 14-5 21 0M267 355c7-4 13-4 18 0" fill="none" stroke="#f6e1b4" stroke-opacity=".28" stroke-width="1.5"/>

    <!-- Stopper: a little flame-shaped piece of warm glass -->
    <path d="M172 163c-8-12-8-30 1-42 7-9 14-15 16-29 14 11 31 25 35 41 5 18-5 32-20 37-12 4-25 1-32-7Z"
          fill="url(#stopper)" stroke="#ffe9b4" stroke-width="2"/>
    <path d="M188 148c-4-8 1-17 7-23 2 9 11 13 10 22-1 7-12 10-17 1Z" fill="#fff1c4" opacity=".8"/>
    <path d="M177 160c12 6 29 6 41-1" fill="none" stroke="#fff4d1" stroke-opacity=".74" stroke-width="2"/>
    <circle cx="183" cy="139" r="2.2" fill="#fff7d9"/>
    <path d="M175 165h50v10h-50z" rx="4" fill="url(#gold)" stroke="#fff0c3" stroke-width="1"/>
    <path d="M179 170h42" stroke="#fff8da" stroke-opacity=".7" stroke-width="1.5"/>
    <circle cx="176" cy="170" r="2" fill="#ffedbe"/>
    <circle cx="224" cy="170" r="2" fill="#ffedbe"/>
  </g>

  <g class="twinkle" fill="#fff0bd">
    <circle cx="124" cy="250" r="2"/>
    <circle cx="280" cy="249" r="1.5"/>
    <path d="M83 482l1.5 4.5L89 488l-4.5 1.5L83 494l-1.5-4.5L77 488l4.5-1.5z"/>
  </g>
</svg>
</body>
</html>
