<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Wibble-Wobble Wonder Elixir</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#161009; }
  canvas { display:block; width:100vw; height:100vh; touch-action:pan-y; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, G = null;

function buildPath(g) {
  const p = new Path2D();
  p.moveTo(g.cx - g.r, g.yNeck);
  p.lineTo(g.cx - g.r, g.ySh);
  p.bezierCurveTo(g.cx - g.r, g.ySh + (g.yBot - g.ySh) * 0.22,
                  g.cx - g.R, g.ySh + (g.yBot - g.ySh) * 0.30,
                  g.cx - g.R, g.ySh + (g.yBot - g.ySh) * 0.55);
  p.bezierCurveTo(g.cx - g.R, g.yBot - g.R * 0.10,
                  g.cx - g.R * 0.72, g.yBot,
                  g.cx, g.yBot);
  p.bezierCurveTo(g.cx + g.R * 0.72, g.yBot,
                  g.cx + g.R, g.yBot - g.R * 0.10,
                  g.cx + g.R, g.ySh + (g.yBot - g.ySh) * 0.55);
  p.bezierCurveTo(g.cx + g.R, g.ySh + (g.yBot - g.ySh) * 0.30,
                  g.cx + g.r, g.ySh + (g.yBot - g.ySh) * 0.22,
                  g.cx + g.r, g.ySh);
  p.lineTo(g.cx + g.r, g.yNeck);
  p.closePath();
  return p;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const BW = Math.min(W * 0.72, H * 0.42);
  const BH = H * 0.90;
  G = {
    cx: W / 2, R: BW / 2, r: BW * 0.14,
    yStopTop: H * 0.045, yNeck: H * 0.155, ySh: H * 0.335, yBot: H * 0.945,
    yLiq: H * 0.545
  };
  G.path = buildPath(G);
  G.inner = buildPath(Object.assign({}, G, { R: G.R - W * 0.012, r: G.r * 0.82,
    ySh: G.ySh + H * 0.004, yBot: G.yBot - H * 0.006, yNeck: G.yNeck }));
}
window.addEventListener('resize', resize);
resize();

// pointer (gentle influence only)
let px = -999, py = -999, tilt = 0;
window.addEventListener('pointermove', e => {
  px = e.clientX; py = e.clientY;
  tilt = Math.max(-1, Math.min(1, (px - G.cx) / (W * 0.5)));
}, { passive: true });
window.addEventListener('pointerleave', () => { tilt = 0; });

// denizens
const bubbles = [], rings = [], motes = [], sparkles = [];
for (let i = 0; i < 26; i++)
  sparkles.push({ a: Math.random() * Math.PI * 2, s: 0.5 + Math.random() * 1.6,
    x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.2 });
for (let i = 0; i < 9; i++)
  motes.push({ x: Math.random(), y: Math.random(), s: 0.2 + Math.random() * 0.5,
    ph: Math.random() * 7, r: 0.7 + Math.random() * 1.1 });

let nextBubble = 0.4, nextDrop = 5, drop = null;

function surfY(x, t) {
  return G.yLiq
    + G.R * 0.045 * Math.sin(x * 0.022 + t * 1.1 + tilt * 2.2)
    + G.R * 0.028 * Math.sin(x * 0.047 - t * 0.7);
}
function bandTop(x, t, base, k, ph) {
  return base + G.R * 0.05 * Math.sin(x * k + t * 0.35 + ph)
              + G.R * 0.03 * Math.sin(x * k * 2.3 - t * 0.22 + ph * 2.0);
}
function wavyRegion(topFn, bottom) {
  const p = new Path2D();
  p.moveTo(-10, topFuncSafe(-10));
  for (let x = -10; x <= W + 10; x += 7) p.lineTo(x, topFuncSafe(x));
  p.lineTo(W + 10, bottom + 10); p.lineTo(-10, bottom + 10); p.closePath();
  return p;
  function topFuncSafe(x) { return topFn(x); }
}

let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  ctx.clearRect(0, 0, W, H);

  // room
  let bg = ctx.createRadialGradient(G.cx, H * 0.42, 10, G.cx, H * 0.5, Math.max(W, H) * 0.85);
  bg.addColorStop(0, '#241a10'); bg.addColorStop(1, '#0e0a06');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // floor light pool + shadow
  let pool = ctx.createRadialGradient(G.cx, G.yBot + H * 0.01, 2, G.cx, G.yBot + H * 0.01, G.R * 1.6);
  pool.addColorStop(0, 'rgba(255,190,110,0.20)'); pool.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.fillStyle = pool;
  ctx.beginPath(); ctx.ellipse(G.cx, G.yBot + H * 0.012, G.R * 1.7, G.R * 0.30, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(G.cx, G.yBot + H * 0.014, G.R * 1.05, G.R * 0.16, 0, 0, 7); ctx.fill();

  // ===== liquid =====
  ctx.save();
  ctx.clip(G.inner);

  const depth = G.yBot - G.yLiq;
  let base = ctx.createLinearGradient(0, G.yLiq, 0, G.yBot);
  base.addColorStop(0, '#1b5a4a'); base.addColorStop(0.5, '#0d3a30'); base.addColorStop(1, '#06241d');
  ctx.fillStyle = base;
  ctx.fill(wavyRegion(x => surfY(x, t), G.yBot));

  // suspended bands (amber sediment layers, gently rolling)
  const b1 = G.yLiq + depth * 0.22, b2 = G.yLiq + depth * 0.50;
  ctx.fillStyle = 'rgba(214,150,60,0.20)';
  ctx.fill(wavyRegion(x => bandTop(x, t, b1, 0.030, 1.4), G.yBot));
  ctx.fillStyle = 'rgba(190,92,58,0.16)';
  ctx.fill(wavyRegion(x => bandTop(x, t, b2, 0.024, 4.1), G.yBot));

  // living glow — drifting warm orbs
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const gx = G.cx + G.R * 0.55 * Math.sin(t * 0.31 + i * 2.1);
    const gy = b2 + depth * 0.34 * Math.cos(t * 0.23 + i * 1.7);
    const rad = G.R * (0.42 + 0.14 * Math.sin(t * 0.6 + i));
    let gl = ctx.createRadialGradient(gx, gy, 1, gx, gy, rad);
    const a = 0.07 + 0.03 * Math.sin(t * 0.8 + i * 2.6);
    gl.addColorStop(0, `rgba(235,170,80,${a})`); gl.addColorStop(1, 'rgba(235,170,80,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(gx, gy, rad, 0, 7); ctx.fill();
  }
  // sparkles in the depths
  for (const s of sparkles) {
    const al = 0.25 + 0.75 * Math.max(0, Math.sin(t * s.s + s.a));
    if (al < 0.3) continue;
    const sx = G.cx + (s.x - 0.5) * G.R * 1.6;
    const sy = G.yLiq + depth * 0.15 + s.y * depth * 0.8 + Math.sin(t * 0.4 + s.a) * 4;
    ctx.fillStyle = `rgba(255,225,160,${al * 0.8})`;
    ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // meniscus highlight
  ctx.strokeStyle = 'rgba(255,235,190,0.35)'; ctx.lineWidth = Math.max(1, W * 0.004);
  ctx.beginPath();
  for (let x = G.cx - G.R; x <= G.cx + G.R; x += 6) {
    const y = surfY(x, t) + 1;
    x === G.cx - G.R ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // bubbles
  if (t > nextBubble) {
    nextBubble = t + 0.35 + Math.random() * 1.3;
    bubbles.push({ x: G.cx + (Math.random() - 0.5) * G.R * 1.1,
      y: G.yBot - 6, r: 1 + Math.random() * 3.2, v: 8 + Math.random() * 16,
      ph: Math.random() * 7, born: t });
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.v * 0.016 * (1 + (t - b.born) * 0.1);
    let bx = b.x + Math.sin(t * 2.2 + b.ph) * 3;
    if (Math.abs(px - bx) < 70 && Math.abs(py - b.y) < 70)
      bx += Math.sign(bx - px) * 10 * 0.016 * 60 * 0.016 * 60;
    const sy = surfY(bx, t);
    if (b.y - b.r <= sy) {
      rings.push({ x: bx, y: sy, born: t });
      bubbles.splice(i, 1); continue;
    }
    ctx.fillStyle = 'rgba(255,244,210,0.14)';
    ctx.beginPath(); ctx.arc(bx, b.y, b.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,244,210,0.30)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(bx, b.y, b.r, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,235,0.7)';
    ctx.beginPath(); ctx.arc(bx - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.28, 0, 7); ctx.fill();
  }
  // pop rings at the surface
  for (let i = rings.length - 1; i >= 0; i--) {
    const rg = rings[i], age = t - rg.born;
    if (age > 0.7) { rings.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(255,240,200,${0.45 * (1 - age / 0.7)})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, 2 + age * 22, 0, 7); ctx.stroke();
  }
  ctx.restore();

  // ===== glass =====
  // body tint
  ctx.save(); ctx.clip(G.path);
  let glass = ctx.createLinearGradient(G.cx - G.R, 0, G.cx + G.R, 0);
  glass.addColorStop(0, 'rgba(255,245,220,0.10)');
  glass.addColorStop(0.3, 'rgba(255,245,220,0.02)');
  glass.addColorStop(0.75, 'rgba(255,245,220,0.05)');
  glass.addColorStop(1, 'rgba(255,245,220,0.12)');
  ctx.fillStyle = glass;
  ctx.fillRect(G.cx - G.R, G.yNeck, G.R * 2, G.yBot - G.yNeck);
  ctx.restore();

  // streak highlights
  let streak = ctx.createLinearGradient(0, 0, W * 0.05, 0);
  streak.addColorStop(0, 'rgba(255,250,235,0)'); streak.addColorStop(0.5, 'rgba(255,250,235,0.35)');
  streak.addColorStop(1, 'rgba(255,250,235,0)');
  ctx.strokeStyle = streak; ctx.lineWidth = Math.max(2, W * 0.014); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(G.cx - G.R * 0.62, G.ySh + (G.yBot - G.ySh) * 0.34);
  ctx.quadraticCurveTo(G.cx - G.R * 0.70, (G.ySh + G.yBot) * 0.55, G.cx - G.R * 0.60, G.yBot - G.R * 0.16);
  ctx.stroke();
  ctx.lineWidth = Math.max(1, W * 0.006);
  ctx.beginPath();
  ctx.moveTo(G.cx + G.R * 0.45, G.ySh + (G.yBot - G.ySh) * 0.30);
  ctx.quadraticCurveTo(G.cx + G.R * 0.52, (G.ySh + G.yBot) * 0.5, G.cx + G.R * 0.46, G.yBot - G.R * 0.20);
  ctx.stroke();

  // neck + rim
  ctx.strokeStyle = 'rgba(255,240,210,0.35)'; ctx.lineWidth = Math.max(1, W * 0.004);
  ctx.stroke(G.path);
  ctx.fillStyle = 'rgba(255,245,225,0.10)';
  ctx.beginPath(); ctx.ellipse(G.cx, G.yNeck, G.r, G.r * 0.28, 0, 0, 7); ctx.fill();

  // ===== stopper =====
  const sTop = G.yStopTop, sNeck = G.yNeck - H * 0.008, sw = G.r * 1.55;
  ctx.save();
  const sp = new Path2D();
  sp.moveTo(G.cx - G.r * 1.02, sNeck);
  sp.bezierCurveTo(G.cx - sw, sNeck - (sNeck - sTop) * 0.28, G.cx - sw * 0.72, sTop, G.cx, sTop);
  sp.bezierCurveTo(G.cx + sw * 0.72, sTop, G.cx + sw, sNeck - (sNeck - sTop) * 0.28, G.cx + G.r * 1.02, sNeck);
  sp.closePath();
  let sg = ctx.createLinearGradient(G.cx - sw, sTop, G.cx + sw, sNeck);
  sg.addColorStop(0, 'rgba(205,150,75,0.55)'); sg.addColorStop(0.45, 'rgba(160,110,55,0.35)');
  sg.addColorStop(1, 'rgba(220,170,95,0.5)');
  ctx.fillStyle = sg; ctx.fill(sp);
  // travelling glint on the stopper
  const glx = G.cx + Math.sin(t * 0.4) * sw * 0.7;
  let gl2 = ctx.createRadialGradient(glx, (sTop + sNeck) / 2, 1, glx, (sTop + sNeck) / 2, sw * 0.55);
  gl2.addColorStop(0, 'rgba(255,240,200,0.30)'); gl2.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.save(); ctx.clip(sp); ctx.fillStyle = gl2; ctx.fillRect(G.cx - sw, sTop, sw * 2, sNeck - sTop); ctx.restore();
  ctx.strokeStyle = 'rgba(255,235,200,0.5)'; ctx.lineWidth = 1.2; ctx.stroke(sp);
  ctx.restore();

  // ===== condensation drop sliding down the glass =====
  if (!drop && t > nextDrop) {
    nextDrop = t + 7 + Math.random() * 9;
    drop = { x: G.cx - G.R * (0.4 + Math.random() * 0.35), y: G.ySh + (G.yBot - G.ySh) * 0.25, v: 0, born: t };
  }
  if (drop) {
    drop.v += 6 * 0.016;
    drop.y += drop.v;
    if (drop.y > G.yBot - G.R * 0.2) drop = null;
    else {
      const dr = Math.max(1.5, W * 0.005);
      ctx.fillStyle = 'rgba(220,245,230,0.35)';
      ctx.beginPath(); ctx.ellipse(drop.x, drop.y, dr * 0.75, dr * 1.25, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,250,0.8)';
      ctx.beginPath(); ctx.arc(drop.x - dr * 0.22, drop.y - dr * 0.45, dr * 0.25, 0, 7); ctx.fill();
    }
  }

  // drifting dust motes in the cubby air
  for (const m of motes) {
    const mx = (m.x + 0.03 * Math.sin(t * m.s + m.ph)) * W;
    const my = ((m.y + 0.02 * Math.sin(t * m.s * 0.7 + m.ph * 2)) % 1) * H;
    const al = 0.10 + 0.10 * Math.sin(t * 1.3 + m.ph);
    if (al <= 0) continue;
    ctx.fillStyle = `rgba(255,230,180,${al})`;
    ctx.beginPath(); ctx.arc(mx, my, m.r, 0, 7); ctx.fill();
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
