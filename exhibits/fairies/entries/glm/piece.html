  <path d="M185,160 C183,172 182,182 183,190" fill="none" stroke="#8a3d1f" stroke-width="1.4" opacity=".8"/>

 <circle r="22" fill="#7c3d1e" stroke="#4e2410" stroke-width="2.5"/>
 <circle r="9" fill="#0b1617"/>
 <circle r="15" fill="none" stroke="#a55224" stroke-width="1.5" opacity=".55"/>

 <path d="M-8,-19 A21,21 0 0 1 12,-17" stroke="#d98a4a" stroke-width="1.5" fill="none" id="glint2"/>
 <g id="pits"></g>
</g>

<g id="flakes">
 <path class="sfl" d="M120,180 L126,186 L119,190 L114,184 Z" fill="#b0562a" opacity=".7"/>
 <path class="sfl" d="M285,210 L291,214 L286,220 L280,215 Z" fill="#8a3d1f" opacity=".7"/>
 <path class="sfl" d="M152,330 L158,333 L154,339 L147,335 Z" fill="#c96a33" opacity=".6"/>
 <path class="sfl" d="M262,120 L267,125 L261,129 L256,124 Z" fill="#b0562a" opacity=".6"/>
 <path class="sfl" d="M228,392 L233,396 L228,401 L223,396 Z" fill="#8a3d1f" opacity=".6"/>

</svg>
<canvas id="front"></canvas>
</div>

<script>
(function(){
"use strict";
var seed=7;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
var svg=document.getElementById('svg');
function $(id){return document.getElementById(id);}
var fairy=$('fairy'),head=$('head'),eyes=$('eyes'),aura=$('aura'),
    glint=$('glint'),glint2=$('glint2'),
    wings=[{e:$('wL1'),px:196,py:252,ph:0,f:8.5,a:9},
           {e:$('wL2'),px:196,py:258,ph:0.6,f:7,a:7},
           {e:$('wR1'),px:204,py:252,ph:0.3,f:8.5,a:9},
           {e:$('wR2'),px:204,py:258,ph:0.9,f:7,a:7}],
    ants=[{e:$('antL'),x:191,y:153,s:1},{e:$('antR'),x:209,y:153,s:-1}],
    sfls=[].slice.call(document.querySelectorAll('.sfl'));

function inside(pathEl,x,y){
  try{return pathEl.isPointInFill(new DOMPoint(x,y));}catch(e){return true;}
}
function speck(g,n,x0,x1,y0,y1,path,cols,rmin,rmax,op){
  var NS='http://www.w3.org/2000/svg',made=0,tries=0;
  while(made<n&&tries<n*14){tries++;
    var x=x0+rnd()*(x1-x0),y=y0+rnd()*(y1-y0);
    if(path&&!inside(path,x,y))continue;
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));
    c.setAttribute('r',(rmin+rnd()*(rmax-rmin)).toFixed(1));
    c.setAttribute('fill',cols[(rnd()*cols.length)|0]);
    c.setAttribute('opacity',(op*(0.5+rnd()*0.8)).toFixed(2));
    g.appendChild(c);made++;
  }
}
var rustCols=['#d17a3d','#8a3d1f','#6b2f14','#c96a33'];
var patCols=['#4e8a7c','#3f6b62'];
speck($('wL1'),16,80,196,122,258,null,rustCols.concat(patCols.slice(0,1)),0.7,2.2,0.5);
speck($('wL2'),10,104,196,262,318,null,rustCols,0.6,1.8,0.5);
speck($('wR1'),16,204,320,122,258,null,rustCols.concat(patCols.slice(0,1)),0.7,2.2,0.5);
speck($('wR2'),10,204,296,262,318,null,rustCols,0.6,1.8,0.5);
speck($('body'),9,189,211,208,286,$('torso'),patCols,0.7,1.8,0.55);
(function(){var p=$('pits'),NS='http://www.w3.org/2000/svg';
 for(var i=0;i<16;i++){var c=document.createElementNS(NS,'circle'),x,y;
   var k=rnd();
   if(k<0.5){x=22+rnd()*98;y=-2+rnd()*3;}
   else if(k<0.8){var an=rnd()*Math.PI*2,r=11+rnd()*9;x=Math.cos(an)*r;y=Math.sin(an)*r;}
   else{x=128+rnd()*17;y=-3+rnd()*20;}
   c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));
   c.setAttribute('r',(0.9+rnd()*1.6).toFixed(1));
   c.setAttribute('fill','#3c1c0c');c.setAttribute('opacity','0.8');
   p.appendChild(c);}
})();

var backC=$('back'),frontC=$('front'),
    bctx=backC.getContext('2d'),fctx=frontC.getContext('2d');
var W=innerWidth,H=innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
function blob(col){var s=document.createElement('canvas');s.width=s.height=256;
  var g=s.getContext('2d'),r=g.createRadialGradient(128,128,0,128,128,128);
  r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,256,256);return s;}
var tealB=blob('rgba(64,138,126,0.11)'),warmB=blob('rgba(214,122,54,0.10)');

var parts=[],NP=110;
var cols=['#c96a33','#b0562a','#8a3d1f','#d17a3d','#d17a3d','#5f9c8d'];
function mk(fresh){
 var k=Math.random(),p={};
 if(k<0.55){p.type=0;p.fx=0.25+Math.random()*0.43;p.fy=0.76+Math.random()*0.1;
   p.vy=-(9+Math.random()*17)/600;}
 else{p.type=1;p.fx=0.42+Math.random()*0.16;p.fy=0.36+Math.random()*0.1;
   p.vy=(7+Math.random()*11)/600;}
 p.r=0.8+Math.random()*2.2;
 p.col=cols[(Math.random()*cols.length)|0];
 p.a=0.2+Math.random()*0.6;
 p.ph=Math.random()*6.28;p.fr=0.3+Math.random()*0.8;
 p.sw=(p.type?14:8)+Math.random()*12;
 p.max=6+Math.random()*8;
 p.age=fresh?0:Math.random()*p.max;
 return p;
}
for(var i=0;i<NP;i++)parts.push(mk(false));

function resize(){
 var nw=innerWidth,nh=innerHeight,rx=nw/W,ry=nh/H;
 W=nw;H=nh;dpr=Math.min(window.devicePixelRatio||1,2);
 [backC,frontC].forEach(function(c){c.width=W*dpr;c.height=H*dpr;});
 bctx.setTransform(dpr,0,0,dpr,0,0);fctx.setTransform(dpr,0,0,dpr,0,0);
 parts.forEach(function(p){p.x*=rx;p.y*=ry;});
 parts.forEach(function(p){if(p.x===undefined){p.x=p.fx*W;p.y=p.fy*H;}});
}
resize();
addEventListener('resize',resize);

var tPx=0,tPy=0,px=0,py=0;
addEventListener('pointermove',function(e){
 tPx=(e.clientX/W)*2-1;tPy=(e.clientY/H)*2-1;});

var blobs=[{x:.25,y:.72,s:.7,ph:1.2},{x:.78,y:.6,s:.55,ph:3.1},
           {x:.6,y:.85,s:.8,ph:5.0},{x:.15,y:.3,s:.6,ph:2.2}];

var last=performance.now()/1000,t=0,
    nextBlink=2.5,blink=0;

function frame(){
 var now=performance.now()/1000,dt=Math.min(0.05,now-last);last=now;t+=dt;
 px+=(tPx-px)*dt*2.5;py+=(tPy-py)*dt*2.5;

 fairy.setAttribute('transform',
  'translate('+(px*10+2*Math.sin(t*0.5)).toFixed(1)+','+
  (5*Math.sin(t*0.8)+2*Math.sin(t*1.7)-py*5).toFixed(1)+
  ') rotate('+(3*Math.sin(t*0.4)).toFixed(1)+',200,300)');

 for(var w=0;w<wings.length;w++){var wg=wings[w];
  var a=Math.sin(t*wg.f+wg.ph)*wg.a+Math.sin(t*2.1)*4;
  var s=(wg.px>200?-1:1);
  wg.e.setAttribute('transform','rotate('+(a*s).toFixed(1)+','+wg.px+','+wg.py+')');}

 head.setAttribute('transform','rotate('+(7*Math.sin(t*0.21)+px*6).toFixed(1)+',200,192)');
 for(var n=0;n<ants.length;n++){var an=ants[n];
  an.e.setAttribute('transform','rotate('+(Math.sin(t*1.3+n*1.7)*7*an.s).toFixed(1)+','+an.x+','+an.y+')');}

 if(t>nextBlink){blink=0.16;nextBlink=t+3+Math.random()*4;}
 var es=1;
 if(blink>0){blink-=dt;es=blink>0.08?(0.16-blink)/0.08:Math.max(0.08,blink/0.08);}
 eyes.setAttribute('transform','translate(200,168) scale(1,'+es.toFixed(2)+') translate(-200,-168)');

 aura.setAttribute('opacity',(0.75+0.25*Math.sin(t*1.1)).toFixed(2));
 var g=0.3+0.35*Math.max(0,Math.sin(t*0.9))+0.05*Math.sin(t*7);
 glint.setAttribute('opacity',g.toFixed(2));glint2.setAttribute('opacity',(g*0.9).toFixed(2));

 for(var f=0;f<sfls.length;f++){
  sfls[f].setAttribute('transform','translate(0,'+(4*Math.sin(t*0.7+f*1.3)).toFixed(1)+')');}

 bctx.clearRect(0,0,W,H);
 for(var b=0;b<blobs.length;b++){var bl=blobs[b],sz=bl.s*Math.min(W,H)*1.6;
  bctx.drawImage(tealB,(bl.x+0.03*Math.sin(t*0.15+bl.ph))*W-sz/2,(bl.y+0.03*Math.cos(t*0.12+bl.ph))*H-sz/2,sz,sz);}
 var wz=Math.min(W,H)*0.9*(1+0.05*Math.sin(t*1.1));
 bctx.drawImage(warmB,0.5*W-wz/2,(0.39-py*0.02)*H-wz/2,wz,wz);

 fctx.clearRect(0,0,W,H);
 for(var pI=0;pI<parts.length;pI++){var p=parts[pI];
  p.age+=dt;
  if(p.x===undefined){p.x=p.fx*W;p.y=p.fy*H;}
  p.y+=p.vy*H*dt;
  p.x+=Math.sin(t*p.fr+p.ph)*p.sw*dt;
  if(p.age>p.max||p.y<-10||p.y>H+10){
   var q=mk(true);q.x=q.fx*W;q.y=q.fy*H;parts[pI]=p=q;}
  var fade=Math.min(1,p.age/1.2,(p.max-p.age)/1.5);
  if(fade<=0)continue;
  fctx.globalAlpha=Math.min(1,fade*p.a);
  fctx.fillStyle=p.col;
  if(p.r>2&&p.type===1){
   fctx.save();fctx.translate(p.x,p.y);fctx.rotate(t*0.8+p.ph);
   fctx.beginPath();fctx.moveTo(0,-p.r*1.4);fctx.lineTo(p.r,0);
   fctx.lineTo(0,p.r*1.4);fctx.lineTo(-p.r,0);fctx.closePath();fctx.fill();fctx.restore();
  }else{
   fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,6.283);fctx.fill();}
 }
 fctx.globalAlpha=1;

 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
