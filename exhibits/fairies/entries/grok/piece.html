<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  function el(name, attrs) {
    var n = document.createElementNS(NS, name);
    if (attrs) {
      for (var k in attrs) n.setAttribute(k, attrs[k]);
    }
    return n;
  }
  function rnd(seed) {
    var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  var stars = document.getElementById("stars");
  var i, x, y, dxm, dym, s, dur, begin;
  for (i = 0; i < 30; i++) {
    x = -16 + rnd(i + 1) * 432;
    y = 6 + rnd(i + 2) * 188;
    dxm = x - 92;
    dym = y - 112;
    if (dxm * dxm + dym * dym < 70 * 70) continue;
    s = el("circle", {
      cx: x.toFixed(1),
      cy: y.toFixed(1),
      r: (0.35 + rnd(i + 3) * 1.05).toFixed(2),
      fill: rnd(i + 4) > 0.82 ? "#ffe0c0" : "#fff"
    });
    s.appendChild(el("animate", {
      attributeName: "opacity",
      values: "0.12;0.9;0.12",
      dur: (2.4 + rnd(i + 5) * 5.5).toFixed(2) + "s",
      begin: (-rnd(i + 6) * 6).toFixed(2) + "s",
      repeatCount: "indefinite"
    }));
    stars.appendChild(s);
  }
  var motes = document.getElementById("motes");
  var colors = ["#ffe6b0", "#ffc8d0", "#e6ffd8", "#fff4e0", "#ffd0a8"];
  for (i = 0; i < 18; i++) {
    x = 20 + rnd(i + 20) * 360;
    var y0 = 440 + rnd(i + 21) * 110;
    var y1 = 140 + rnd(i + 22) * 130;
    var c = el("circle", {
      cx: x.toFixed(1),
      cy: y0.toFixed(1),
      r: (0.45 + rnd(i + 23) * 1.45).toFixed(2),
      fill: colors[i % colors.length]
    });
    dur = (9 + rnd(i + 24) * 12).toFixed(1);
    begin = (-rnd(i + 25) * 14).toFixed(2) + "s";
    c.appendChild(el("animate", {
      attributeName: "cy",
      values: y0.toFixed(1) + ";" + y1.toFixed(1),
      dur: dur + "s",
      begin: begin,
      repeatCount: "indefinite"
    }));
    c.appendChild(el("animate", {
      attributeName: "cx",
      values: x.toFixed(1) + ";" + (x + (rnd(i + 26) - 0.5) * 30).toFixed(1),
      dur: dur + "s",
      begin: begin,
      repeatCount: "indefinite"
    }));
    c.appendChild(el("animate", {
      attributeName: "opacity",
      values: "0;0.8;0.75;0",
      keyTimes: "0;0.12;0.78;1",
      dur: dur + "s",
      begin: begin,
      repeatCount: "indefinite"
    }));
    motes.appendChild(c);
  }
  var svg = document.getElementById("scene");
  var layers = [
    { el: document.getElementById("far"), d: 7 },
    { el: document.getElementById("mid"), d: 11 },
    { el: document.getElementById("near"), d: 17 }
  ];
  var tx = 0, ty = 0, cx = 0, cy = 0;
  window.addEventListener("pointermove", function (e) {
    tx = e.clientX / (window.innerWidth || 1) - 0.5;
    ty = e.clientY / (window.innerHeight || 1) - 0.5;
  }, { passive: true });
  document.addEventListener("pointerleave", function () {
    tx = 0;
    ty = 0;
  });
  function frame() {
    cx += (tx - cx) * 0.045;
    cy += (ty - cy) * 0.045;
    var w = svg.getBoundingClientRect().width || 400;
    var k = 400 / w;
    for (var n = 0; n < layers.length; n++) {
      if (!layers[n].el) continue;
      layers[n].el.setAttribute("transform", "translate(" + (cx * layers[n].d * k).toFixed(2) + "," + (cy * layers[n].d * 0.62 * k).toFixed(2) + ")");
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
