<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0c24}
canvas{display:block;width:100%;height:100%;touch-action:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,dpr,u,ox,oy,bg,fg;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function glowSprite(r,g,b){var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d');var gr=x.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba('+r+','+g+','+b+',1)');gr.addColorStop(.25,'rgba('+r+','+g+','+b+',.45)');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');x.fillStyle=gr;x.fillRect(0,0,64,64);return c}
var gWarm=glowSprite(255,200,120),gCool=glowSprite(150,220,255),gPink=glowSprite(255,160,210),gWhite=glowSprite(255,255,255);
var mist=(function(){var c=document.createElement('canvas');c.width=256;c.height=64;var x=c.getContext('2d');x.setTransform(1,0,0,.25,0,0);var g=x.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(175,155,225,1)');g.addColorStop(.5,'rgba(150,130,205,.45)');g.addColorStop(1,'rgba(130,110,190,0)');x.fillStyle=g;x.fillRect(0,0,256,256);return c})();
function glowOn(c,s,x,y,r,a){c.globalCompositeOperation='lighter';c.globalAlpha=Math.min(1,a);c.drawImage(s,x-r,y-r,2*r,2*r);c.globalAlpha=1;c.globalCompositeOperation='source-over'}
function glow(s,x,y,r,a){glowOn(ctx,s,x,y,r,a)}
function clamp(v,a,b){return v<a?a:v>b?b:v}

/* geometry */
function topL(x){return x>=30?91:91-.22*(30-x)+1.2*Math.sin(x*.9)+.8*Math.sin(x*2.3)}
function topR(x){return x<=70?93:93-.28*(x-70)+1.1*Math.sin(x*1.1)+.7*Math.sin(x*2.7)}
var N=11,RR=26.17,CX=50,CY=110.17,HT=2.2;
var aL=Math.atan2(96-CY,28-50)-.06,aR=Math.atan2(96-CY,72-50)+.06,step=(aR-aL)/N;
function P(r,a){return[CX+r*Math.cos(a),CY+r*Math.sin(a)]}
var stones=[];
for(var i=0;i<N;i++){var a0=aL+i*step+.006,a1=aL+(i+1)*step-.006,am=(a0+a1)/2,C=P(RR,am);
 var cs=[P(RR+HT,a0),P(RR+HT,a1),P(RR-HT,a1),P(RR-HT,a0)].map(function(p){return[p[0]-C[0],p[1]-C[1]]});
 stones.push({C:C,cs:cs,lamp:P(RR+HT,am),lampTop:P(RR+HT+2.1,am),cx:C[0],cy:C[1],e:1})}

/* static random data */
var rs=rng(11),stars=[];
for(var i=0;i<95;i++){var sx=rs()*100,sy=rs()*78;if(Math.hypot(sx-70,sy-36)<19)continue;stars.push({x:sx,y:sy,r:.12+rs()*.2,ph:rs()*6.28,tw:rs()<.35})}
var flies=[];
for(var i=0;i<46;i++){flies.push({x:24+rs()*52,sp:.018+rs()*.03,off:rs(),ph:rs()*6.28,sz:1.2+rs()*2,warm:rs()<.65,front:rs()<.25})}
var tblades=[];
for(var x=-10;x<31;x+=1.1)tblades.push({x:x,L:true,len:2.5+rs()*3.2,ph:rs()*6});
for(var x=70;x<111;x+=1.1)tblades.push({x:x,L:false,len:2.5+rs()*3.2,ph:rs()*6});
var fblades=[];
for(var i=0;i<34;i++){fblades.push({x:-8+rs()*32,len:9+rs()*17,lean:(rs()-.3)*7,ph:rs()*6})}
for(var i=0;i<34;i++){fblades.push({x:76+rs()*32,len:9+rs()*17,lean:(rs()-.7)*7,ph:rs()*6})}
var bells=[{x:12,h:5,c:0},{x:19,h:6.5,c:1},{x:25,h:4.5,c:0},{x:28,h:6,c:1},{x:74,h:5.5,c:1},{x:80,h:4.5,c:0},{x:88,h:6.5,c:1},{x:96,h:5,c:0}];
var tips=[];
var bands=[{y:96,sp:.7,x0:10,w:90,h:14,a:.14},{y:104,sp:1.2,x0:0,w:80,h:16,a:.22},{y:114,sp:-.8,x0:80,w:90,h:20,a:.28},{y:126,sp:1.6,x0:150,w:100,h:22,a:.3},{y:136,sp:-1.1,x0:40,w:100,h:22,a:.3}];
var fbands=[{y:141,sp:.9,x0:30,w:110,h:18,a:.32},{y:147,sp:-.7,x0:120,w:120,h:18,a:.3}];

/* layers */
function layer(fn){var c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;var x=c.getContext('2d');x.setTransform(dpr*u,0,0,dpr*u,dpr*ox,dpr*oy);fn(x);return c}
function ridge(seed,base,amp){return function(x){return base-amp*(.5*Math.sin(x*.07+seed)+.3*Math.sin(x*.17+seed*2.3)+.2*Math.sin(x*.41+seed*1.7)+.5)}}
function drawBG(x){
 var g=x.createLinearGradient(0,-20,0,110);
 g.addColorStop(0,'#080a26');g.addColorStop(.4,'#17194a');g.addColorStop(.7,'#3b2c67');g.addColorStop(.88,'#8a4a7a');g.addColorStop(1,'#e0906e');
 x.fillStyle=g;x.fillRect(-80,-60,260,270);
 for(var i=0;i<stars.length;i++){var s=stars[i];x.fillStyle='rgba(235,235,255,.45)';x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()}
 glowOn(x,gCool,70,36,60,.5);
 var mg=x.createRadialGradient(67,33,1,70,36,14);mg.addColorStop(0,'#fffaf0');mg.addColorStop(1,'#dde2f2');
 x.fillStyle=mg;x.beginPath();x.arc(70,36,14,0,6.3);x.fill();
 x.fillStyle='rgba(120,130,170,.13)';
 [[64,31,3],[75,40,3.6],[68,43,2],[76,30,1.8],[62,39,1.5]].forEach(function(c){x.beginPath();x.arc(c[0],c[1],c[2],0,6.3);x.fill()});
 var layers=[[1,80,14,'#2d2560'],[2.7,90,12,'#241e53'],[4.1,98,9,'#1b1743']];
 layers.forEach(function(L,li){
  var f=ridge(L[0],L[1],L[2]);
  x.fillStyle=L[3];x.beginPath();x.moveTo(-80,215);for(var xx=-80;xx<=180;xx+=2)x.lineTo(xx,f(xx));x.lineTo(180,215);x.fill();
  var fg2=x.createLinearGradient(0,L[1]-8,0,L[1]+18);fg2.addColorStop(0,'rgba(200,110,150,0)');fg2.addColorStop(1,'rgba(200,110,150,.32)');
  x.fillStyle=fg2;x.fillRect(-80,L[1]-8,260,30);
  if(li===1){var r=rng(5);for(var k=0;k<9;k++){var vx=76+r()*20,vy=f(vx)+2+r()*5;glowOn(x,gWarm,vx,vy,1.4,.55);x.fillStyle='#ffe3a0';x.beginPath();x.arc(vx,vy,.14,0,6.3);x.fill()}}
 });
 var cg=x.createLinearGradient(0,92,0,128);cg.addColorStop(0,'rgba(10,8,38,0)');cg.addColorStop(1,'rgba(10,8,38,1)');
 x.fillStyle=cg;x.fillRect(-80,92,260,120);
 var dg=x.createRadialGradient(50,155,0,50,155,45);dg.addColorStop(0,'rgba(110,80,200,.38)');dg.addColorStop(1,'rgba(110,80,200,0)');
 x.fillStyle=dg;x.fillRect(0,100,100,60);
}
function drawFG(x){
 var r=rng(23);
 var g=x.createLinearGradient(-20,0,30,0);g.addColorStop(0,'#08071e');g.addColorStop(1,'#1b1844');
 x.fillStyle=g;x.beginPath();x.moveTo(-80,215);x.lineTo(-80,topL(-80));
 for(var xx=-80;xx<=30;xx+=2)x.lineTo(xx,topL(xx));
 var edgeL=[];for(var y=91;y<=215;y+=4){var ex=30-(y-91)*.12+1.6*Math.sin(y*.7)+1.2*Math.sin(y*1.9);edgeL.push([ex,y]);x.lineTo(ex,y)}
 x.closePath();x.fill();
 x.strokeStyle='rgba(170,170,255,.38)';x.lineWidth=.35;x.beginPath();edgeL.forEach(function(p,i){i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.stroke();
 x.strokeStyle='rgba(190,190,255,.22)';x.lineWidth=.3;x.beginPath();for(var xx=-10;xx<=30;xx+=2){xx===-10?x.moveTo(xx,topL(xx)):x.lineTo(xx,topL(xx))}x.stroke();
 g=x.createLinearGradient(70,0,120,0);g.addColorStop(0,'#1a1743');g.addColorStop(1,'#08071e');
 x.fillStyle=g;x.beginPath();x.moveTo(180,215);x.lineTo(180,topR(180));
 for(var xx=180;xx>=70;xx-=2)x.lineTo(xx,topR(xx));
 var edgeR=[];for(var y=93;y<=215;y+=4){var ex=70+(y-93)*.1+1.6*Math.sin(y*.8+1)+1.2*Math.sin(y*2.1);edgeR.push([ex,y]);x.lineTo(ex,y)}
 x.closePath();x.fill();
 x.strokeStyle='rgba(170,170,255,.2)';x.lineWidth=.35;x.beginPath();edgeR.forEach(function(p,i){i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.stroke();
 x.strokeStyle='rgba(200,200,255,.34)';x.lineWidth=.3;x.beginPath();for(var xx=70;xx<=110;xx+=2){xx===70?x.moveTo(xx,topR(xx)):x.lineTo(xx,topR(xx))}x.stroke();
 x.strokeStyle='rgba(130,120,210,.13)';x.lineWidth=.25;
 for(var k=0;k<26;k++){var left=k<13,y=96+r()*100,sx=left?-40+r()*60:76+r()*34,len=4+r()*10;x.beginPath();x.moveTo(sx,y);x.quadraticCurveTo(sx+len/2,y+(r()-.5)*1.5,sx+len,y+(r()-.5)*1.2);x.stroke()}
 x.strokeStyle='#080720';x.lineCap='round';tips.length=0;
 var tr=rng(7);
 (function branch(x1,y1,ang,len,w,d){
  var x2=x1+Math.cos(ang)*len,y2=y1+Math.sin(ang)*len;
  x.lineWidth=w;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
  if(d>0){branch(x2,y2,ang-.35-tr()*.4,len*.76,w*.68,d-1);branch(x2,y2,ang+.3+tr()*.4,len*.76,w*.68,d-1);if(d>3&&tr()<.4)branch(x2,y2,ang+(tr()-.5)*.3,len*.6,w*.6,d-2)}
  else if(tr()<.28)tips.push([x2,y2,tr()*6]);
 })(6,topL(6)+3,-1.38,10,2.4,6);
 var vg=x.createRadialGradient(50,75,38,50,75,115);vg.addColorStop(0,'rgba(4,3,18,0)');vg.addColorStop(1,'rgba(4,3,18,.6)');
 x.fillStyle=vg;x.fillRect(-80,-60,260,270);
}
function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr));
 u=Math.max(W/100,H/150);ox=(W-100*u)/2;oy=(H-150*u)/2;
 bg=layer(drawBG);fg=layer(drawFG);
}
window.addEventListener('resize',resize);resize();

/* pointer */
var px=null,py=null,dust=[],dacc=0;
window.addEventListener('pointermove',function(e){px=(e.clientX-ox)/u;py=(e.clientY-oy)/u;if(Math.random()<.5)dust.push({x:px,y:py,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:1.2,max:1.2,c:gCool,s:1.2})});
window.addEventListener('pointerleave',function(){px=null;py=null});

/* fairy */
function wing(x,y,a,L,w,al,t,ph){
 ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.globalAlpha=al;
 var h=190+Math.sin(t*.8+ph)*45;
 var g=ctx.createLinearGradient(0,0,L,0);
 g.addColorStop(0,'hsla('+(h+110)+',90%,85%,.55)');g.addColorStop(.5,'hsla('+h+',90%,80%,.5)');g.addColorStop(1,'hsla('+(h+70)+',85%,78%,.18)');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(L*.2,-w*1.2,L*.75,-w,L,0);ctx.bezierCurveTo(L*.75,w*.6,L*.25,w*.5,0,0);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=.12;ctx.stroke();
 ctx.globalAlpha=al*.55;ctx.lineWidth=.07;ctx.beginPath();
 for(var j=-1;j<=1;j++){ctx.moveTo(0,0);ctx.quadraticCurveTo(L*.5,j*w*.5-w*.15,L*.88,j*w*.35)}
 ctx.stroke();ctx.restore();
}
function drawFairy(fx,fy,face,t,k){
 ctx.save();ctx.translate(fx,fy);ctx.scale(face*k,k);
 var fl=Math.sin(t*15),fl2=Math.sin(t*15-.8),sk='#f9e3d0';
 wing(0,-2.4,-2.0+fl*.32,9.5,4.2,.5,t,0);
 wing(0,-2,2.35-fl*.25,6,2.6,.4,t,1.5);
 // hair
 ctx.lineCap='round';
 var hc=['#e8e4ff','#c9bff0','#f6e7c8'];
 for(var j=0;j<3;j++){
  ctx.strokeStyle=hc[j];ctx.lineWidth=1.1-j*.25;ctx.beginPath();ctx.moveTo(-1,-6.5+j*.6);
  ctx.bezierCurveTo(-3.5,-8+Math.sin(t*2.5+j)*.8,-6,-4.5+Math.sin(t*2.2+j*1.3)*1.2,-8.5-j,-3+j*1.2+Math.sin(t*2.8+j)*1.3);ctx.stroke();
 }
 // legs
 ctx.strokeStyle=sk;ctx.lineWidth=.45;
 ctx.beginPath();ctx.moveTo(-.3,2.6);ctx.quadraticCurveTo(-1.2,5,-1.6+Math.sin(t*2.2)*.6,8.2);ctx.moveTo(.5,2.6);ctx.quadraticCurveTo(1,5,.8+Math.sin(t*2.2+1)*.6,7.8);ctx.stroke();
 // back arm
 ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(-.2,-3);ctx.quadraticCurveTo(-1.8,-2,-2.6,.2+Math.sin(t*2)*.3);ctx.stroke();
 // dress
 var dg=ctx.createLinearGradient(0,-3.5,0,7);dg.addColorStop(0,'#ffe08a');dg.addColorStop(1,'#ee7a45');
 ctx.fillStyle=dg;ctx.beginPath();ctx.moveTo(-1.1,-3.5);ctx.quadraticCurveTo(-1.3,-.5,-1,1.2);
 var hx=[-3,-1.5,0,1.5,3],hy=[5.8,6.9,5.6,7,5.9];
 ctx.quadraticCurveTo(-2.6,3,hx[0]+Math.sin(t*2)*.3,hy[0]);
 for(var j=1;j<5;j++){ctx.quadraticCurveTo((hx[j-1]+hx[j])/2,hy[j]+1.2,hx[j]+Math.sin(t*2+j)*.3,hy[j])}
 ctx.quadraticCurveTo(2.6,3,1,1.2);ctx.quadraticCurveTo(1.3,-.5,1.1,-3.5);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#3fc8b8';ctx.lineWidth=.45;ctx.beginPath();ctx.moveTo(-1.25,.7);ctx.lineTo(1.25,.7);ctx.stroke();
 // front arm
 var hy2=-1.4+Math.sin(t*2)*.3;
 ctx.strokeStyle=sk;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(.6,-3);ctx.quadraticCurveTo(2.4,-2.6,4.7,hy2);ctx.stroke();
 // head
 ctx.save();ctx.translate(.3,-4);ctx.rotate(.08*Math.sin(t*.8)+.05);ctx.translate(-.3,4);
 ctx.fillStyle=sk;ctx.beginPath();ctx.arc(.3,-5.7,1.75,0,6.3);ctx.fill();
 ctx.beginPath();ctx.moveTo(-1.5,-6.1);ctx.lineTo(-3.3,-7.3+Math.sin(t*3)*.15);ctx.lineTo(-1.2,-5.1);ctx.fill();
 ctx.beginPath();ctx.moveTo(2,-5.7);ctx.lineTo(2.35,-5.3);ctx.lineTo(1.9,-5.2);ctx.fill();
 ctx.fillStyle='rgba(255,150,150,.35)';ctx.beginPath();ctx.arc(.8,-5.0,.4,0,6.3);ctx.fill();
 ctx.fillStyle='#2a1a4a';ctx.beginPath();ctx.ellipse(1.1,-5.9,.3,.18,.15,0,6.3);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(1.18,-5.95,.07,0,6.3);ctx.fill();
 ctx.strokeStyle='#8a4a5a';ctx.lineWidth=.1;ctx.beginPath();ctx.arc(1.1,-5,.45,.3,1.9);ctx.stroke();
 ctx.fillStyle='#ece8ff';ctx.beginPath();ctx.moveTo(2,-6.4);ctx.quadraticCurveTo(1,-8.2,-1,-7.5);ctx.quadraticCurveTo(-2.3,-6.7,-1.8,-4.8);ctx.lineTo(-1,-5.6);ctx.quadraticCurveTo(.5,-6.2,2,-6.4);ctx.fill();
 ctx.strokeStyle='#ffe9a8';ctx.lineWidth=.16;
 var wg=Math.sin(t*2.1)*.4;
 ctx.beginPath();ctx.moveTo(.9,-7.4);ctx.quadraticCurveTo(1.8,-9,2.4+wg,-10.2);ctx.moveTo(0,-7.5);ctx.quadraticCurveTo(-.2,-9.2,-.9-wg,-10.5);ctx.stroke();
 glow(gWarm,2.4+wg,-10.2,2,.9);glow(gWarm,-.9-wg,-10.5,1.7,.8);
 ctx.restore();
 // near wings
 wing(.3,-2.4,-1.65+fl2*.3,10.5,4.6,.75,t,.6);
 wing(.3,-1.9,2.7-fl2*.22,6.6,2.9,.6,t,2.1);
 // orb
 glow(gWarm,4.7,hy2,3.2,.95);glow(gWhite,4.7,hy2,1.1,.9);
 ctx.restore();
}

/* main */
var last=performance.now(),face=1,fox=0,foy=0,T=30,PH=.44;
function frame(now){
 requestAnimationFrame(frame);
 var dt=Math.min(.05,(now-last)/1000);last=now;var t=now/1000;
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 ctx.drawImage(bg,0,0);
 ctx.setTransform(dpr*u,0,0,dpr*u,dpr*ox,dpr*oy);
 // stars
 for(var i=0;i<stars.length;i++){var s=stars[i];if(!s.tw)continue;var a=.3+.7*Math.max(0,Math.sin(t*1.3+s.ph));glow(gWhite,s.x,s.y,s.r*5,a*.7)}
 // back mist
 for(var i=0;i<bands.length;i++){var b=bands[i],mx=(((b.x0+t*b.sp)%240)+240)%240-100;ctx.globalAlpha=b.a;ctx.drawImage(mist,mx,b.y,b.w,b.h)}
 ctx.globalAlpha=1;
 // back fireflies
 drawFlies(t,false);
 // motion state
 var w=2*Math.PI*t/T+PH,f=5.5+3.5*Math.sin(w),dir=Math.cos(w)>=0?1:-1;
 face+=(dir-face)*Math.min(1,dt*2.2);
 var ang=aL+step*(f+.7*face);
 var fp=P(RR+8.5,ang);
 var tx=0,ty=0;
 if(px!==null){tx=clamp((px-fp[0])*.08,-3,3);ty=clamp((py-fp[1])*.08,-2.5,2.5)}
 fox+=(tx-fox)*Math.min(1,dt*2);foy+=(ty-foy)*Math.min(1,dt*2);
 var fx=fp[0]+fox+Math.sin(t*1.1)*.5,fy=fp[1]+foy+Math.sin(t*1.7)*.8,k=1.15;
 // fairy light on world
 glow(gWarm,fx,fy,26,.5);
 // bridge
 for(var i=0;i<N;i++){
  var S=stones[i],s=(i<2||i===10)?1:clamp(f-i,0,1),e=s*s*(3-2*s),fo=1-e;
  var offx=Math.sin(t*.6+i*2.1)*1.6,offy=-4.5-Math.min(Math.max(i-f,0),3)*1.4+Math.sin(t*.9+i*1.3)*1.1,rot=Math.sin(t*.5+i*1.7)*.3*fo;
  var cx=S.C[0]+offx*fo,cy=S.C[1]+offy*fo;S.cx=cx;S.cy=cy;S.e=e;
  var d2=(cx-fx)*(cx-fx)+(cy-fy)*(cy-fy),lit=Math.exp(-d2/150),br=.78+.32*e;
  var cr=Math.round(58*br+(255-58*br)*lit*.7),cg=Math.round(62*br+(205-62*br)*lit*.7),cb=Math.round(104*br+(140-104*br)*lit*.5);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.beginPath();for(var j=0;j<4;j++){j?ctx.lineTo(S.cs[j][0],S.cs[j][1]):ctx.moveTo(S.cs[j][0],S.cs[j][1])}ctx.closePath();
  ctx.fillStyle='rgb('+cr+','+cg+','+cb+')';ctx.fill();
  ctx.save();ctx.scale(.68,.68);ctx.fillStyle='rgba(0,0,25,.13)';ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(12,10,36,.55)';ctx.lineWidth=.16;ctx.stroke();
  ctx.strokeStyle='rgba(215,225,255,'+(.2+.5*e)+')';ctx.lineWidth=.28;ctx.beginPath();ctx.moveTo(S.cs[0][0],S.cs[0][1]);ctx.lineTo(S.cs[1][0],S.cs[1][1]);ctx.stroke();
  ctx.strokeStyle='rgba(8,6,28,.6)';ctx.lineWidth=.3;ctx.beginPath();ctx.moveTo(S.cs[2][0],S.cs[2][1]);ctx.lineTo(S.cs[3][0],S.cs[3][1]);ctx.stroke();
  if(fo>.02){ctx.strokeStyle='rgba(150,210,255,'+(.5*fo)+')';ctx.lineWidth=.22;ctx.beginPath();for(var j=0;j<4;j++){j?ctx.lineTo(S.cs[j][0],S.cs[j][1]):ctx.moveTo(S.cs[j][0],S.cs[j][1])}ctx.closePath();ctx.stroke()}
  ctx.restore();
  if(fo>.02)glow(gCool,cx,cy,5,.4*fo);
  if(s>0&&s<1)glow(gWarm,cx,cy,10,Math.sin(Math.PI*s)*.8);
 }
 // lamps
 [1,3,5,7,9].forEach(function(i){
  var S=stones[i],vis=S.e;if(vis<.03)return;
  var dx=S.cx-S.C[0],dy=S.cy-S.C[1],fl=.85+.15*Math.sin(t*7+i*3);
  ctx.strokeStyle='rgba(10,8,30,'+vis+')';ctx.lineWidth=.18;ctx.beginPath();ctx.moveTo(S.lamp[0]+dx,S.lamp[1]+dy);ctx.lineTo(S.lampTop[0]+dx,S.lampTop[1]+dy);ctx.stroke();
  glow(gWarm,S.lampTop[0]+dx,S.lampTop[1]+dy,4.6*fl,.85*vis);
  ctx.globalAlpha=vis;ctx.fillStyle='#fff2c0';ctx.beginPath();ctx.arc(S.lampTop[0]+dx,S.lampTop[1]+dy,.38,0,6.3);ctx.fill();ctx.globalAlpha=1;
 });
 // cliffs
 ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(fg,0,0);
 ctx.setTransform(dpr*u,0,0,dpr*u,dpr*ox,dpr*oy);
 // tree lanterns
 for(var i=0;i<tips.length;i++){var p=tips[i];glow(i%2?gWarm:gPink,p[0],p[1],2.6,.45+.4*Math.sin(t*1.6+p[2]))}
 // top grass
 ctx.strokeStyle='#07061c';ctx.lineWidth=.45;ctx.lineCap='round';ctx.beginPath();
 for(var i=0;i<tblades.length;i++){var b=tblades[i],ty2=(b.L?topL(b.x):topR(b.x))+.6,sw=Math.sin(t*1.2+b.x*.7+b.ph)*.7;ctx.moveTo(b.x,ty2);ctx.quadraticCurveTo(b.x+sw*.3,ty2-b.len*.6,b.x+sw+(b.L?-.4:.4),ty2-b.len)}
 ctx.stroke();
 // bells
 for(var i=0;i<bells.length;i++){
  var b=bells[i],tp=(b.x<50?topL(b.x):topR(b.x))+.5,sw=Math.sin(t*1.2+b.x*.7)*.8,tx2=b.x+sw*.5,ty3=tp-b.h;
  ctx.strokeStyle='#0a0a26';ctx.lineWidth=.22;ctx.beginPath();ctx.moveTo(b.x,tp);ctx.quadraticCurveTo(b.x+sw*.2,tp-b.h*.6,tx2,ty3);ctx.stroke();
  glow(b.c?gPink:gCool,tx2,ty3+.5,3,.55+.4*Math.sin(t*1.8+b.x));
 }
 // fairy
 var hx=fx+face*k*4.7,hyy=fy+k*(-1.4+Math.sin(t*2)*.3);
 var tgt=stones[Math.min(9,Math.floor(f+.0001))];
 for(var q=0;q<2;q++){
  var ts=q?stones[Math.min(10,Math.floor(f+.0001)+1)]:tgt;if(q&&Math.floor(f+.0001)>=9)break;
  var ex=ts.cx,ey=ts.cy,mxx=(hx+ex)/2,myy=(hy_(hyy,ey))+3+Math.sin(t*2+q)*.8,al=q?.3:.85;
  ctx.strokeStyle='rgba(255,210,140,'+al*.25+')';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(hx,hyy);ctx.quadraticCurveTo(mxx,myy,ex,ey);ctx.stroke();
  ctx.strokeStyle='rgba(255,240,200,'+al+')';ctx.lineWidth=.16;ctx.stroke();
  for(var j=0;j<3;j++){var qq=(t*.5+j/3)%1,a1=(1-qq)*(1-qq),a2=2*qq*(1-qq),a3=qq*qq;glow(gWarm,a1*hx+a2*mxx+a3*ex,a1*hyy+a2*myy+a3*ey,1.6,al)}
 }
 drawFairy(fx,fy,face,t,k);
 // dust
 dacc+=dt*26;
 while(dacc>1){dacc--;if(dust.length<110)dust.push({x:fx-face*k*3+(Math.random()-.5)*4,y:fy+(Math.random()-.3)*5,vx:-face*(Math.random()*1.2)+(Math.random()-.5),vy:.8+Math.random()*1.6,life:1.6+Math.random()*1.4,max:3,c:Math.random()<.6?gWarm:gWhite,s:.8+Math.random()*1.1})}
 for(var i=dust.length-1;i>=0;i--){var d=dust[i];d.life-=dt;if(d.life<=0){dust.splice(i,1);continue}d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx+=Math.sin(t*3+i)*.02;glow(d.c,d.x,d.y,d.s,clamp(d.life/(d.max<d.life?d.life:Math.min(d.max,1.6)),0,1)*.9)}
 // front fireflies and mist, ferns
 drawFlies(t,true);
 for(var i=0;i<fbands.length;i++){var b=fbands[i],mx=(((b.x0+t*b.sp)%260)+260)%260-110;ctx.globalAlpha=b.a;ctx.drawImage(mist,mx,b.y,b.w,b.h)}
 ctx.globalAlpha=1;
 ctx.strokeStyle='#05041a';ctx.lineWidth=.9;ctx.beginPath();
 for(var i=0;i<fblades.length;i++){var b=fblades[i],sw=Math.sin(t*1.1+b.ph+b.x*.2)*1.2;ctx.moveTo(b.x,154);ctx.quadraticCurveTo(b.x+b.lean*.3,154-b.len*.6,b.x+b.lean+sw,154-b.len)}
 ctx.stroke();
}
function hy_(a,b){return (a+b)/2}
function drawFlies(t,front){
 for(var i=0;i<flies.length;i++){var o=flies[i];if(o.front!==front)continue;
  var p=(t*o.sp+o.off)%1,y=148-p*86,x=o.x+Math.sin(t*.6+o.ph+p*5)*4;
  var a=Math.sin(Math.PI*p)*(.5+.5*Math.sin(t*3+o.ph));
  glow(o.warm?gWarm:gCool,x,y,o.sz,a*.9)}
}
requestAnimationFrame(frame);
})();
