<!doctype html>
<!-- Shown for any card with no piece.html yet: a faint shimmer behind the card's art window. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awaiting arrival</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(circle at 50% 45%, #2a2142, #0b0816 70%); }
  .glow {
    position: absolute; left: 50%; top: 45%; width: 30vmin; height: 30vmin; border-radius: 50%;
    background: radial-gradient(circle, rgba(230, 196, 120, .3), transparent 70%);
    translate: -50% -50%; animation: breathe 4s ease-in-out infinite alternate;
  }
  @keyframes breathe { to { scale: 1.3; opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
</style>
</head>
<body><div class="glow"></div></body>
</html>
