<!doctype html>
<!-- Shown on any canvas whose entry has no piece.html yet: primed linen with an underdrawing that sketches itself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work in progress</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      repeating-linear-gradient(0deg, rgba(120,100,70,.05) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,100,70,.05) 0 1px, transparent 1px 3px),
      radial-gradient(circle at 50% 40%, #fbf8f0, #ece4d2);
  }
  svg { display: block; width: 100%; height: 100%; }
  path {
    fill: none; stroke: #6b6253; stroke-width: .5; stroke-linecap: round; opacity: .45;
    stroke-dasharray: 300; stroke-dashoffset: 300;
    animation: sketch 9s ease-in-out infinite;
  }
  path:nth-child(2) { animation-delay: .8s; }
  path:nth-child(3) { animation-delay: 1.6s; }
  @keyframes sketch {
    0% { stroke-dashoffset: 300; opacity: .45; }
    60% { stroke-dashoffset: 0; opacity: .45; }
    85%, 100% { stroke-dashoffset: 0; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { path { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 100 100">
  <path d="M22 70 C 30 40, 45 30, 55 42 S 72 70, 80 34"/>
  <path d="M30 28 Q 50 20 70 30 Q 76 50 62 62 Q 44 72 34 58 Q 26 44 30 28"/>
  <path d="M18 80 L 84 80"/>
</svg>
</body>
</html>
