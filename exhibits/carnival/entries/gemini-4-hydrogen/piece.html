    <!-- Prop 2: Bioluminescent Firefly -->

<script>
(() => {
  const SVG_NS = "http://www.w3.org/2000/svg";
  const LOOP_MS = 9000;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (t) => {
    const c = clamp(t, 0, 1);
    return c * c * (3 - 2 * c);
  };
  const easeOutBack = (t) => {
    const c = clamp(t, 0, 1);
    const s = 1.70158;
    return 1 + (s + 1) * Math.pow(c - 1, 3) + s * Math.pow(c - 1, 2);
  };

  function el(tag, attrs = {}) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) {
      node.setAttribute(k, v);
    }
    return node;
  }

  // Build an articulated Venus Flytrap head split into back & front layers
  function createTrap(backContainer, frontContainer, opts) {
    const { scale, hasCuff, isHead } = opts;

    const backRoot = el("g");
    const frontRoot = el("g");
    backContainer.appendChild(backRoot);
    frontContainer.appendChild(frontRoot);

    const backScale = el("g", { transform: `scale(${scale})` });
    const frontScale = el("g", { transform: `scale(${scale})` });
    backRoot.appendChild(backScale);
    frontRoot.appendChild(frontScale);

    // Optional ruffled pierrot wrist cuff for hand traps
    if (hasCuff) {
      const cuff = el("path", {
        d: "M-17,12 C-22,20 -13,25 -8,19 C-4,25 4,25 8,19 C13,25 22,20 17,12 C9,14 -9,14 -17,12 Z",
        fill: "url(#collarIvory)",
        stroke: "#9f1239",
        "stroke-width": "1.6",
        "stroke-linejoin": "round"
      });
      backScale.appendChild(cuff);
    }

    // Back / Upper Lobe
    const upperGroup = el("g");
    const upperOuter = el("path", {
      fill: "url(#leafOuter)",
      stroke: "#1b431e",
      "stroke-width": "1.6",
      "stroke-linejoin": "round"
    });
    const upperInner = el("path", {
      fill: "url(#leafInner)",
      stroke: "#881337",
      "stroke-width": "1",
      "stroke-linejoin": "round"
    });
    const upperVeins = el("path", {
      fill: "none",
      stroke: "#8ce063",
      "stroke-width": "1",
      opacity: "0.45",
      "stroke-linecap": "round"
    });
    const upperTeeth = el("path", {
      fill: "none",
      stroke: "#b5e86c",
      "stroke-width": "2.4",
      "stroke-linecap": "round"
    });
    const upperTeethEdge = el("path", {
      fill: "none",
      stroke: "#1f4d25",
      "stroke-width": "0.9",
      "stroke-linecap": "round"
    });
    upperGroup.append(upperOuter, upperInner, upperVeins, upperTeeth, upperTeethEdge);

    // Throat cavity connecting upper & lower lobes
    const throat = el("path", {
      fill: "#6b0a26"
    });

    // Trigger bristles inside upper/lower inner pad
    const triggers = el("g", { stroke: "#450516", "stroke-width": "1.2", "stroke-linecap": "round" });
    for (const tx of [-12, 0, 12]) {
      triggers.appendChild(el("line", { x1: tx, y1: 2, x2: tx * 0.85, y2: -4 }));
    }

    backScale.append(throat, upperGroup, triggers);

    // Front / Lower Lobe
    const lowerGroup = el("g");
    const lowerInner = el("path", {
      fill: "url(#leafInner)"
    });
    const lowerOuter = el("path", {
      fill: "url(#leafOuter)",
      stroke: "#1b431e",
      "stroke-width": "1.6",
      "stroke-linejoin": "round"
    });
    const lowerVeins = el("path", {
      fill: "none",
      stroke: "#266326",
      "stroke-width": "1.1",
      opacity: "0.55",
      "stroke-linecap": "round"
    });
    const lowerTeeth = el("path", {
      fill: "none",
      stroke: "#c9f27d",
      "stroke-width": "2.4",
      "stroke-linecap": "round"
    });
    const lowerTeethEdge = el("path", {
      fill: "none",
      stroke: "#1f4d25",
      "stroke-width": "0.9",
      "stroke-linecap": "round"
    });

    // Belly glow inside closed head trap when swallowing firefly
    let glowEl = null;
    if (isHead) {
      glowEl = el("ellipse", {
        cx: 0, cy: 2, rx: 28, ry: 17,
        fill: "url(#bellyGlow)",
        opacity: "0"
      });
      lowerGroup.append(lowerInner, lowerOuter, glowEl, lowerVeins, lowerTeeth, lowerTeethEdge);
    } else {
      lowerGroup.append(lowerInner, lowerOuter, lowerVeins, lowerTeeth, lowerTeethEdge);
    }
    frontScale.appendChild(lowerGroup);

    // Update trap articulation for openAmt in [-0.08, 1.1]
    function update(x, y, angleDeg, openAmt, glowAlpha = 0) {
      const tr = `translate(${x.toFixed(2)}, ${y.toFixed(2)}) rotate(${angleDeg.toFixed(2)})`;
      backRoot.setAttribute("transform", tr);
      frontRoot.setAttribute("transform", tr);

      const o = clamp(openAmt, -0.08, 1.15);
      const w = lerp(35, 31, clamp(o, 0, 1));
      const upLipY = -2 - o * 18;
      const upCrownY = -22 - o * 15;
      const loLipY = 2 + o * 18;
      const loChinY = 18 + o * 12;

      // Upper outer shell + inner crimson lining
      upperOuter.setAttribute("d",
        `M ${-w},0 C ${-w * 0.92},${upCrownY * 1.05} ${w * 0.92},${upCrownY * 1.05} ${w},0 Q 0,${upLipY * 0.85} ${-w},0 Z`
      );
      upperInner.setAttribute("d",
        `M ${-w * 0.86},0 C ${-w * 0.65},${upLipY * 1.35} ${w * 0.65},${upLipY * 1.35} ${w * 0.86},0 Q 0,${upLipY * 0.4} ${-w * 0.86},0 Z`
      );
      upperVeins.setAttribute("d",
        `M -16,${upLipY * 0.5} Q -18,${upCrownY * 0.65} -12,${upCrownY * 0.85} ` +
        `M 0,${upLipY * 0.55} L 0,${upCrownY * 0.88} ` +
        `M 16,${upLipY * 0.5} Q 18,${upCrownY * 0.65} 12,${upCrownY * 0.85}`
      );

      // Throat bridge
      throat.setAttribute("d",
        `M ${-w * 0.88},0 Q 0,${upLipY * 1.1} ${w * 0.88},0 Q 0,${loLipY * 1.1} ${-w * 0.88},0 Z`
      );
      triggers.setAttribute("opacity", clamp(o * 1.6, 0, 1).toFixed(2));

      // Lower outer cup + inner crimson pad
      lowerInner.setAttribute("d",
        `M ${-w * 0.88},0 Q 0,${loLipY * 1.25} ${w * 0.88},0 Q 0,${loLipY * 0.35} ${-w * 0.88},0 Z`
      );
      lowerOuter.setAttribute("d",
        `M ${-w},0 Q 0,${loLipY * 0.85} ${w},0 C ${w * 0.88},${loChinY * 1.08} ${-w * 0.88},${loChinY * 1.08} ${-w},0 Z`
      );
      lowerVeins.setAttribute("d",
        `M -17,${loLipY * 0.55} Q -18,${loChinY * 0.72} -10,${loChinY * 0.88} ` +
        `M 0,${loLipY * 0.65} L 0,${loChinY * 0.9} ` +
        `M 17,${loLipY * 0.55} Q 18,${loChinY * 0.72} 10,${loChinY * 0.88}`
      );

      if (glowEl) {
        glowEl.setAttribute("opacity", glowAlpha.toFixed(2));
      }

      // Interlocking cilia / teeth along upper and lower rims
      const toothReach = 8.5;
      let upD = "";
      let upEdgeD = "";
      const upCount = 7;
      for (let i = 0; i < upCount; i++) {
        const s = (i / (upCount - 1)) * 2 - 1; // -1..1
        const rx = s * (w * 0.78);
        const ry = (1 - s * s) * (upLipY * 0.42);
        const tipX = rx * 1.12;
        const tipY = ry + lerp(toothReach, -toothReach * 0.65, clamp(o, 0, 1));
        upD += `M ${rx.toFixed(1)},${ry.toFixed(1)} Q ${(rx * 1.08).toFixed(1)},${((ry + tipY) * 0.5).toFixed(1)} ${tipX.toFixed(1)},${tipY.toFixed(1)} `;
        upEdgeD += `M ${rx.toFixed(1)},${ry.toFixed(1)} L ${tipX.toFixed(1)},${tipY.toFixed(1)} `;
      }
      upperTeeth.setAttribute("d", upD);
      upperTeethEdge.setAttribute("d", upEdgeD);

      let loD = "";
      let loEdgeD = "";
      const loCount = 6;
      for (let i = 0; i < loCount; i++) {
        const s = ((i + 0.5) / loCount) * 2 - 1; // staggered between upper teeth
        const rx = s * (w * 0.78);
        const ry = (1 - s * s) * (loLipY * 0.42);
        const tipX = rx * 1.12;
        const tipY = ry - lerp(toothReach, -toothReach * 0.55, clamp(o, 0, 1));
        loD += `M ${rx.toFixed(1)},${ry.toFixed(1)} Q ${(rx * 1.08).toFixed(1)},${((ry + tipY) * 0.5).toFixed(1)} ${tipX.toFixed(1)},${tipY.toFixed(1)} `;
        loEdgeD += `M ${rx.toFixed(1)},${ry.toFixed(1)} L ${tipX.toFixed(1)},${tipY.toFixed(1)} `;
      }
      lowerTeeth.setAttribute("d", loD);
      lowerTeethEdge.setAttribute("d", loEdgeD);

      return { upCrownY: upCrownY * scale };
    }

    return { update };
  }

  // Draw a smooth tapered petiole stem from anchor (ax,ay) to trap base (bx,by)
  function updateStem(pathEl, ribEl, ax, ay, cx, cy, bx, by, baseW, tipW) {
    const N = 12;
    const leftPts = [];
    const rightPts = [];
    const midPts = [];

    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const omt = 1 - t;
      const x = omt * omt * ax + 2 * omt * t * cx + t * t * bx;
      const y = omt * omt * ay + 2 * omt * t * cy + t * t * by;
      const dx = 2 * omt * (cx - ax) + 2 * t * (bx - cx);
      const dy = 2 * omt * (cy - ay) + 2 * t * (by - cy);
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      // Winged petiole swell in the middle
      const swell = Math.sin(t * Math.PI) * 2.2;
      const halfW = lerp(baseW, tipW, t) * 0.5 + swell;

      leftPts.push(`${(x + nx * halfW).toFixed(1)},${(y + ny * halfW).toFixed(1)}`);
      rightPts.unshift(`${(x - nx * halfW).toFixed(1)},${(y - ny * halfW).toFixed(1)}`);
      midPts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    }

    pathEl.setAttribute("d", `M ${leftPts.join(" L ")} L ${rightPts.join(" L ")} Z`);
    ribEl.setAttribute("d", `M ${midPts.join(" L ")}`);
  }

  // Build trap instances
  const trapL = createTrap(
    document.getElementById("trapBackL"),
    document.getElementById("trapFrontL"),
    { scale: 0.65, hasCuff: true, isHead: false }
  );
  const trapR = createTrap(
    document.getElementById("trapBackR"),
    document.getElementById("trapFrontR"),
    { scale: 0.65, hasCuff: true, isHead: false }
  );
  const trapC = createTrap(
    document.getElementById("trapBackC"),
    document.getElementById("trapFrontC"),
    { scale: 1.08, hasCuff: false, isHead: true }
  );

  // Elements
  const stemL = document.getElementById("stemL");
  const stemLrib = document.getElementById("stemLrib");
  const stemR = document.getElementById("stemR");
  const stemRrib = document.getElementById("stemRrib");
  const stemC = document.getElementById("stemC");
  const stemCrib = document.getElementById("stemCrib");

  const collarBack = document.getElementById("collarBack");
  const collarFront = document.getElementById("collarFront");
  const frontLeafL = document.getElementById("frontLeafL");
  const frontLeafR = document.getElementById("frontLeafR");
  const backLeafL = document.getElementById("backLeafL");
  const backLeafR = document.getElementById("backLeafR");

  const propBall = document.getElementById("propBall");
  const propPin = document.getElementById("propPin");
  const propFirefly = document.getElementById("propFirefly");
  const fireflyWingL = document.getElementById("fireflyWingL");
  const fireflyWingR = document.getElementById("fireflyWingR");

  const headHat = document.getElementById("headHat");
  const hatPom = document.getElementById("hatPom");

  // Pre-allocated particle system
  const particlesGroup = document.getElementById("particles");
  const particles = [];
  for (let i = 0; i < 16; i++) {
    const isStar = i % 2 === 0;
    const node = isStar
      ? el("path", { d: "M0,-5 L1.3,-1.3 L5,0 L1.3,1.3 L0,5 L-1.3,1.3 L-5,0 L-1.3,-1.3 Z", fill: "#fde047", opacity: "0" })
      : el("circle", { r: "2.4", fill: "#fef08a", opacity: "0" });
    particlesGroup.appendChild(node);
    particles.push({ node, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, scale: 1 });
  }
  const shockRing = el("circle", {
    cx: 150, cy: 155, r: 10,
    fill: "none", stroke: "#fde047", "stroke-width": "2.2", opacity: "0"
  });
  particlesGroup.appendChild(shockRing);

  function spawnBurst(cx, cy, count, colorA, colorB) {
    let spawned = 0;
    for (const p of particles) {
      if (p.life <= 0 && spawned < count) {
        const ang = (spawned / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
        const spd = 28 + Math.random() * 44;
        p.x = cx;
        p.y = cy;
        p.vx = Math.cos(ang) * spd;
        p.vy = Math.sin(ang) * spd - 16;
        p.maxLife = 0.45 + Math.random() * 0.35;
        p.life = p.maxLife;
        p.scale = 0.65 + Math.random() * 0.7;
        p.node.setAttribute("fill", spawned % 2 === 0 ? colorA : colorB);
        spawned++;
      }
    }
  }

  // Optional gentle pointer awareness (never blocks scrolling)
  let pointerX = 0;
  let pointerY = 0;
  let pointerActive = 0;
  window.addEventListener("pointermove", (e) => {
    const w = window.innerWidth || 1;
    const h = window.innerHeight || 1;
    pointerX = clamp((e.clientX / w) * 2 - 1, -1, 1);
    pointerY = clamp((e.clientY / h) * 2 - 1, -1, 1);
    pointerActive = 1;
  }, { passive: true });

  // Parabolic arc helper
  function arcPos(x0, y0, x1, y1, peakY, t) {
    const c = clamp(t, 0, 1);
    const x = lerp(x0, x1, c);
    // Quadratic passing through (0,y0), (0.5, peakY), (1, y1)
    const y = (1 - c) * (1 - c) * y0 + 2 * (1 - c) * c * (2 * peakY - 0.5 * (y0 + y1)) + c * c * y1;
    return { x, y };
  }

  let lastU = 0;
  let lastTime = performance.now();
  let shockLife = 0;
  let shockX = 150;
  let shockY = 155;

  function frame(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    const u = (now % LOOP_MS) / LOOP_MS;
    pointerActive *= Math.pow(0.4, dt);

    // Detect loop triggers for bursts
    if ((lastU < 0.62 && u >= 0.62)) {
      spawnBurst(150, 152, 8, "#fde047", "#fb7185");
      shockLife = 0.38;
      shockX = 150;
      shockY = 152;
    }
    if ((lastU < 0.72 && u >= 0.72)) {
      spawnBurst(150, 138, 10, "#a3e635", "#fde047");
    }
    lastU = u;

    // --- 1. Compute Hand Trap & Central Head Choreography ---
    // Bow envelope at [0.86 .. 1.00]
    let bow = 0;
    if (u >= 0.86) {
      const bt = (u - 0.86) / 0.14;
      bow = Math.sin(bt * Math.PI); // smooth 0 -> 1 -> 0
      bow = Math.pow(bow, 0.85);
    }

    // Subtle idle breathing sway
    const sway = Math.sin(u * Math.PI * 2 * 3);
    const swaySlow = Math.sin(u * Math.PI * 2);

    // Hand L & R base positions + bounce on catches/tosses
    function handPulse(targetU, width = 0.04) {
      const d = Math.abs(u - targetU);
      return d < width ? Math.cos((d / width) * Math.PI * 0.5) : 0;
    }

    const lDip =
      handPulse(0.08, 0.04) * 11 +
      handPulse(0.20, 0.035) * 9 +
      handPulse(0.26, 0.035) * 10 +
      handPulse(0.32, 0.035) * 9 +
      handPulse(0.38, 0.035) * 10 +
      handPulse(0.46, 0.035) * 9 +
      handPulse(0.54, 0.035) * 10 +
      handPulse(0.73, 0.035) * 9 +
      handPulse(0.77, 0.035) * 10 +
      handPulse(0.87, 0.04) * 9;

    const rDip =
      handPulse(0.16, 0.04) * 11 +
      handPulse(0.24, 0.035) * 9 +
      handPulse(0.30, 0.035) * 10 +
      handPulse(0.40, 0.035) * 9 +
      handPulse(0.46, 0.035) * 10 +
      handPulse(0.54, 0.035) * 9 +
      handPulse(0.60, 0.035) * 10 +
      handPulse(0.68, 0.035) * 9 +
      handPulse(0.75, 0.035) * 10 +
      handPulse(0.88, 0.04) * 9;

    const lx = 66 + sway * 4 - bow * 16;
    const ly = 220 + lDip + bow * 16;
    const lAngle = -72 - bow * 24 + sway * 4;

    const rx = 234 - sway * 4 + bow * 16;
    const ry = 220 + rDip + bow * 16;
    const rAngle = -108 + bow * 24 - sway * 4;

    // Determine hand jaw openness (wider when empty/catching, softly cradling when holding)
    const lHolding =
      (u >= 0.00 && u < 0.08) ||
      (u >= 0.20 && u < 0.26) ||
      (u >= 0.32 && u < 0.38) ||
      (u >= 0.46 && u < 0.54) ||
      (u >= 0.73 && u < 0.77) ||
      (u >= 0.87 && u <= 1.00);
    const rHolding =
      (u >= 0.00 && u < 0.16) ||
      (u >= 0.24 && u < 0.30) ||
      (u >= 0.40 && u < 0.46) ||
      (u >= 0.54 && u < 0.60) ||
      (u >= 0.68 && u < 0.75) ||
      (u >= 0.88 && u <= 1.00);

    const lOpen = lHolding ? 0.36 : 0.72 + Math.sin(u * Math.PI * 12) * 0.08;
    const rOpen = rHolding ? 0.36 : 0.72 + Math.cos(u * Math.PI * 12) * 0.08;

    // Central Head position, tilt, and jaw snap choreography
    let hx = 150 + swaySlow * 7 + pointerX * 5 * pointerActive;
    let hy = 166 + Math.sin(u * Math.PI * 4) * 4 + bow * 46;
    let hTilt = swaySlow * 6 + pointerX * 6 * pointerActive;
    let hOpen = 0.26 + Math.sin(u * Math.PI * 6) * 0.07;
    let headGlow = 0;

    // Distracted stalk -> SNAP -> chew -> spit -> bow!
    if (u >= 0.52 && u < 0.62) {
      // Stalking the cheeky firefly!
      const st = smoothstep((u - 0.52) / 0.10);
      hx = lerp(hx, 150, st);
      hy = lerp(hy, 158, st);
      hOpen = lerp(0.3, 0.92, st);
      hTilt = lerp(hTilt, Math.sin(u * 90) * 2.5, st);
    } else if (u >= 0.62 && u < 0.72) {
      // SNAP & chew!
      const ct = (u - 0.62) / 0.10;
      const snapRecoil = ct < 0.2 ? Math.sin((ct / 0.2) * Math.PI) * 7 : 0;
      const chew = Math.sin(ct * Math.PI * 4);
      hy = 158 + snapRecoil + Math.abs(chew) * 3;
      hTilt = chew * 5;
      hOpen = -0.05 + Math.max(0, chew) * 0.05;
      headGlow = Math.sin(ct * Math.PI) * 0.95;
    } else if (u >= 0.72 && u < 0.80) {
      // PTOOEY! Spit firefly upward!
      const pt = (u - 0.72) / 0.08;
      const openCurve = pt < 0.35 ? easeOutBack(pt / 0.35) : 1 - smoothstep((pt - 0.35) / 0.65);
      hOpen = lerp(0.28, 0.98, openCurve);
      hy = 158 - openCurve * 6;
      hTilt = 0;
    } else if (u >= 0.80 && u < 0.86) {
      hOpen = 0.32;
    } else if (u >= 0.86) {
      // Bowing proudly
      hOpen = 0.22 + bow * 0.18;
      hTilt = bow * 5;
    }

    // --- 2. Update Stems & Foliage ---
    const collarDy = bow * 4;
    const collarRot = swaySlow * 2.5 + bow * 4;
    collarBack.setAttribute("transform", `translate(0, ${collarDy.toFixed(1)}) rotate(${collarRot.toFixed(1)} 150 315)`);
    collarFront.setAttribute("transform", `translate(0, ${collarDy.toFixed(1)}) rotate(${collarRot.toFixed(1)} 150 315)`);

    // Basal leaves sway gently
    const lf = Math.sin(u * Math.PI * 2 * 2) * 2.5;
    frontLeafL.setAttribute("transform", `rotate(${(lf - bow * 3).toFixed(2)} 135 322)`);
    frontLeafR.setAttribute("transform", `rotate(${(-lf + bow * 3).toFixed(2)} 165 322)`);
    backLeafL.setAttribute("transform", `rotate(${(-lf * 0.7).toFixed(2)} 132 316)`);
    backLeafR.setAttribute("transform", `rotate(${(lf * 0.7).toFixed(2)} 168 316)`);

    // Left, Right & Center stems
    updateStem(
      stemL, stemLrib,
      138, 315,
      86, 282 + lDip * 0.4,
      lx + 4, ly + 8,
      11, 6.5
    );
    updateStem(
      stemR, stemRrib,
      162, 315,
      214, 282 + rDip * 0.4,
      rx - 4, ry + 8,
      11, 6.5
    );
    updateStem(
      stemC, stemCrib,
      150, 316,
      150 - swaySlow * 12 + (hx - 150) * 0.3, 240 + bow * 24,
      hx, hy + 16,
      14, 9.5
    );

    // --- 3. Update Traps & Hat ---
    trapL.update(lx, ly, lAngle, lOpen);
    trapR.update(rx, ry, rAngle, rOpen);
    const headMetrics = trapC.update(hx, hy, hTilt, hOpen, headGlow);

    // Position tilted hat right on the crown of the central head's upper lobe
    const hatLocalX = 11;
    const hatLocalY = headMetrics.upCrownY + 3;
    const rad = (hTilt * Math.PI) / 180;
    const hatX = hx + hatLocalX * Math.cos(rad) - hatLocalY * Math.sin(rad);
    const hatY = hy + hatLocalX * Math.sin(rad) + hatLocalY * Math.cos(rad);
    const hatBob = Math.sin(u * Math.PI * 16) * 1.5 + bow * 6;
    headHat.setAttribute("transform", `translate(${hatX.toFixed(2)}, ${hatY.toFixed(2)}) rotate(${(hTilt + hatBob * 0.5).toFixed(2)})`);
    hatPom.setAttribute("transform", `translate(${(3 + Math.sin(u * Math.PI * 12) * 2).toFixed(1)}, ${(-41 + Math.cos(u * Math.PI * 12) * 1.5).toFixed(1)})`);

    // --- 4. Update Juggling Props ---
    // Prop 0: Striped Ball
    let bPos, bRot = u * 720;
    if (u < 0.08) {
      bPos = { x: lx, y: ly - 4 }; bRot = u * 180;
    } else if (u < 0.24) {
      bPos = arcPos(lx, ly - 4, rx, ry - 4, 56, (u - 0.08) / 0.16);
    } else if (u < 0.30) {
      bPos = { x: rx, y: ry - 4 }; bRot = 200;
    } else if (u < 0.46) {
      bPos = arcPos(rx, ry - 4, lx, ly - 4, 52, (u - 0.30) / 0.16);
    } else if (u < 0.54) {
      bPos = { x: lx, y: ly - 4 }; bRot = 420;
    } else if (u < 0.68) {
      bPos = arcPos(lx, ly - 4, rx, ry - 4, 56, (u - 0.54) / 0.14);
    } else if (u < 0.75) {
      bPos = { x: rx, y: ry - 4 }; bRot = 580;
    } else if (u < 0.87) {
      bPos = arcPos(rx, ry - 4, lx, ly - 4, 44, (u - 0.75) / 0.12);
    } else {
      bPos = { x: lx, y: ly - 4 }; bRot = 720;
    }
    propBall.setAttribute("transform", `translate(${bPos.x.toFixed(2)}, ${bPos.y.toFixed(2)}) rotate(${bRot.toFixed(1)})`);

    // Prop 1: Juggling Pin
    let pPos, pRot = 0;
    if (u < 0.16) {
      pPos = { x: rx, y: ry - 6 }; pRot = -15 + bow * 15;
    } else if (u < 0.32) {
      const t = (u - 0.16) / 0.16;
      pPos = arcPos(rx, ry - 6, lx, ly - 6, 52, t);
      pRot = t * 720;
    } else if (u < 0.38) {
      pPos = { x: lx, y: ly - 6 }; pRot = 18;
    } else if (u < 0.54) {
      const t = (u - 0.38) / 0.16;
      pPos = arcPos(lx, ly - 6, rx, ry - 6, 54, t);
      pRot = 18 - t * 720;
    } else if (u < 0.60) {
      pPos = { x: rx, y: ry - 6 }; pRot = -15;
    } else if (u < 0.73) {
      const t = (u - 0.60) / 0.13;
      pPos = arcPos(rx, ry - 6, lx, ly - 6, 58, t);
      pRot = t * 720;
    } else if (u < 0.77) {
      pPos = { x: lx, y: ly - 6 }; pRot = 18;
    } else if (u < 0.88) {
      const t = (u - 0.77) / 0.11;
      pPos = arcPos(lx, ly - 6, rx, ry - 6, 48, t);
      pRot = 18 - t * 720;
    } else {
      pPos = { x: rx, y: ry - 6 }; pRot = -15 + bow * 15;
    }
    propPin.setAttribute("transform", `translate(${pPos.x.toFixed(2)}, ${pPos.y.toFixed(2)}) rotate(${pRot.toFixed(1)})`);

    // Prop 2: Cheeky Bioluminescent Firefly
    let fPos = { x: 150, y: 76 };
    let fScale = 1;
    let fVis = 1;
    let fRot = 0;

    // Compute perch above hat cleanly
    const perchX = hx + 28;
    const perchY = hy - 78;

    if (u < 0.10) {
      // Hovering playfully above hat
      fPos.x = perchX + Math.sin(u * Math.PI * 20) * 6;
      fPos.y = perchY + Math.cos(u * Math.PI * 20) * 4;
      fRot = Math.sin(u * Math.PI * 20) * 12;
    } else if (u < 0.20) {
      const t = smoothstep((u - 0.10) / 0.10);
      fPos = arcPos(perchX, perchY, lx, ly - 5, 70, t);
      fRot = -25 * Math.sin(t * Math.PI);
    } else if (u < 0.26) {
      fPos = { x: lx, y: ly - 5 };
    } else if (u < 0.40) {
      const t = (u - 0.26) / 0.14;
      fPos = arcPos(lx, ly - 5, rx, ry - 5, 62, t);
      fRot = 25 * Math.sin(t * Math.PI);
    } else if (u < 0.46) {
      fPos = { x: rx, y: ry - 5 };
    } else if (u < 0.56) {
      // Arcs right in front of the Head Trap instead of L!
      const t = smoothstep((u - 0.46) / 0.10);
      fPos = arcPos(rx, ry - 5, 150, 154, 88, t);
    } else if (u < 0.62) {
      // Cheeky figure-8 right in front of open jaws
      const bt = (u - 0.56) / 0.06;
      fPos.x = 150 + Math.sin(bt * Math.PI * 4) * 9;
      fPos.y = 154 + Math.sin(bt * Math.PI * 8) * 3.5;
      fRot = Math.sin(bt * Math.PI * 4) * 18;
    } else if (u < 0.72) {
      // Swallowed inside closed head!
      fPos = { x: hx, y: hy + 2 };
      fVis = 0;
    } else if (u < 0.88) {
      // Launched upward in a celebratory fountain arc back to perch!
      const t = (u - 0.72) / 0.16;
      fPos = arcPos(hx, hy - 8, perchX, perchY, 36, t);
      fScale = lerp(0.55, 1, smoothstep(t * 2.5));
      fRot = t * 360;
    } else {
      // Hovering & bowing above hat
      fPos.x = perchX + Math.sin((u - 0.88) * Math.PI * 24) * 6;
      fPos.y = perchY + Math.cos((u - 0.88) * Math.PI * 24) * 4;
      fRot = Math.sin((u - 0.88) * Math.PI * 24) * 12;
    }

    propFirefly.setAttribute("opacity", fVis.toFixed(2));
    propFirefly.setAttribute("transform", `translate(${fPos.x.toFixed(2)}, ${fPos.y.toFixed(2)}) rotate(${fRot.toFixed(1)}) scale(${fScale.toFixed(2)})`);

    // Flutter firefly wings rapidly
    const wingFlap = Math.sin(now * 0.055) * 32;
    fireflyWingL.setAttribute("transform", `translate(-2,-3) rotate(${wingFlap.toFixed(1)})`);
    fireflyWingR.setAttribute("transform", `translate(2,-3) rotate(${(-wingFlap).toFixed(1)})`);

    // --- 5. Update Sparkle Particles & Shock Ring ---
    for (const p of particles) {
      if (p.life > 0) {
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 45 * dt; // gentle gravity
        const alpha = clamp(p.life / p.maxLife, 0, 1);
        const s = p.scale * (0.5 + 0.5 * alpha);
        p.node.setAttribute("opacity", alpha.toFixed(2));
        p.node.setAttribute("transform", `translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)}) scale(${s.toFixed(2)})`);
      } else {
        p.node.setAttribute("opacity", "0");
      }
    }

    if (shockLife > 0) {
      shockLife -= dt;
      const st = 1 - clamp(shockLife / 0.38, 0, 1);
      shockRing.setAttribute("cx", shockX);
      shockRing.setAttribute("cy", shockY);
      shockRing.setAttribute("r", (12 + st * 34).toFixed(1));
      shockRing.setAttribute("opacity", ((1 - st) * 0.75).toFixed(2));
    } else {
      shockRing.setAttribute("opacity", "0");
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
