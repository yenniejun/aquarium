<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f3e7d6;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: auto;
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  const view = { w: 0, h: 0, unit: 1 };
  const origin = { x: 0, y: 0 };
  const pot = { cx: 0, top: 0, base: 0, rx: 1, ry: 1, h: 1 };
  const pointer = { x: -9999, y: -9999, on: false, hot: false, seen: 0, R: 90 };

  let leaves = [];
  let insects = [];
  let motes = [];
  let moss = [];
  let stones = [];
  let pulses = [];
  let lureCooldown = 1.2;
  let lastT = 0;

  const BLUSH = ["#7a3048", "#8d4452", "#642838", "#934858", "#5c3044", "#7a3858", "#6e2e42"];
  const MOSS_C = ["#1b4634", "#2a6244", "#3e7a52", "#24563c", "#4d8a5e", "#173f30"];

  function hash(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeDew() {
    const c = document.createElement("canvas");
    c.width = 48;
    c.height = 48;
    const g = c.getContext("2d");
    g.fillStyle = "rgba(110, 62, 16, 0.30)";
    g.beginPath();
    g.arc(24, 27, 15, 0, Math.PI * 2);
    g.fill();
    const rad = g.createRadialGradient(19, 17, 1, 24, 24, 15);
    rad.addColorStop(0, "rgba(255,255,255,0.98)");
    rad.addColorStop(0.2, "rgba(255, 242, 214, 0.96)");
    rad.addColorStop(0.48, "rgba(255, 196, 86, 0.94)");
    rad.addColorStop(0.78, "rgba(214, 132, 36, 0.9)");
    rad.addColorStop(1, "rgba(150, 78, 18, 0)");
    g.fillStyle = rad;
    g.beginPath();
    g.arc(24, 23.5, 14.5, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "rgba(255,255,255,0.9)";
    g.beginPath();
    g.ellipse(19, 17.5, 3.1, 1.9, -0.7, 0, Math.PI * 2);
    g.fill();
    return c;
  }

  function makeGlow() {
    const c = document.createElement("canvas");
    c.width = 64;
    c.height = 64;
    const g = c.getContext("2d");
    const rad = g.createRadialGradient(32, 32, 2, 32, 32, 32);
    rad.addColorStop(0, "rgba(255, 206, 110, 0.62)");
    rad.addColorStop(0.45, "rgba(255, 170, 60, 0.18)");
    rad.addColorStop(1, "rgba(255, 160, 40, 0)");
    g.fillStyle = rad;
    g.fillRect(0, 0, 64, 64);
    return c;
  }

  const dewImg = makeDew();
  const glowImg = makeGlow();

  function makeTent(leafI, t, side, tip, spread) {
    const n = leafI * 17 + Math.round(t * 80) + side * 5 + Math.round(spread * 8);
    const h = hash(n + 2);
    return {
      t: t,
      side: side,
      tip: tip,
      spread: spread,
      phase: h * Math.PI * 2,
      lenF: tip ? (spread === 0 ? 0.132 : 0.096) + h * 0.018 : 0.064 + h * 0.02,
      sizeF: 0.84 + hash(n + 8) * 0.32,
      color: tip
        ? "rgb(" + (198 + (n % 4) * 8) + "," + (150 + (n % 3) * 8) + ",64)"
        : "rgb(" + (164 + (n % 5) * 7) + "," + (108 + (n % 4) * 6) + ",44)",
      wx: 0,
      wy: 0,
      len: 1,
      r: 1,
      hit: 1
    };
  }

  function makeTents(i) {
    const tents = [];
    const ts = [0.4, 0.58, 0.76];
    for (let k = 0; k < ts.length; k++) {
      tents.push(makeTent(i, ts[k], -1, false, 0));
      tents.push(makeTent(i, ts[k] + 0.045, 1, false, 0));
    }
    tents.push(makeTent(i, 0.98, 1, true, -0.48));
    tents.push(makeTent(i, 0.98, 1, true, 0));
    tents.push(makeTent(i, 0.98, 1, true, 0.48));
    return tents;
  }

  function sizeLeaves() {
    if (!leaves.length) {
      const n = 7;
      for (let i = 0; i < n; i++) {
        const u = i / (n - 1);
        const angle = -2.52 + u * 5.04;
        leaves.push({
          i: i,
          angle: angle,
          drawAngle: angle,
          phase: i * 0.86,
          curl: 0.035,
          targetCurl: 0.035,
          mode: "idle",
          modeT: 0,
          heat: 0,
          catchBug: null,
          catchTent: null,
          tents: makeTents(i),
          blush: BLUSH[i % BLUSH.length]
        });
      }
    }
    const baseL = view.unit * 0.4;
    const baseW = view.unit * 0.074;
    for (let i = 0; i < leaves.length; i++) {
      const leaf = leaves[i];
      const up = Math.max(0, -Math.sin(leaf.angle));
      const side = Math.abs(Math.cos(leaf.angle));
      const down = Math.max(0, Math.sin(leaf.angle));
      leaf.L = baseL * (0.78 + up * 0.36 - side * 0.08) * (1 - down * 0.4);
      leaf.W = baseW * (0.8 + up * 0.12 + (i % 2) * 0.05);
      for (let k = 0; k < leaf.tents.length; k++) {
        const tent = leaf.tents[k];
        tent.len = view.unit * tent.lenF * (tent.tip ? 1 : 0.7 + tent.t * 0.45);
        tent.r = view.unit * (tent.tip ? 0.0165 : 0.012) * tent.sizeF;
        tent.hit = tent.r * 1.2 + view.unit * 0.009;
      }
    }
  }

  function buildMoss() {
    const rand = mulberry32(11);
    moss = [];
    for (let i = 0; i < 78; i++) {
      const a = rand() * Math.PI * 2;
      const rad = Math.pow(rand(), 0.62);
      moss.push({
        x: Math.cos(a) * pot.rx * 0.9 * rad,
        y: Math.sin(a) * pot.ry * 0.95 * rad + pot.ry * 0.12,
        r: pot.rx * (0.04 + rand() * 0.07),
        a: rand() * Math.PI,
        c: MOSS_C[i % MOSS_C.length],
        bump: rand()
      });
    }
  }

  function buildDecor() {
    const rand = mulberry32(23);
    stones = [];
    for (let i = 0; i < 6; i++) {
      stones.push({
        x: (rand() - 0.5) * pot.rx * 1.15,
        y: (rand() - 0.15) * pot.ry * 0.9,
        rx: view.unit * (0.01 + rand() * 0.012),
        ry: view.unit * (0.007 + rand() * 0.007),
        c: rand() > 0.45 ? "#b7ab9c" : "#7e756c"
      });
    }
  }

  function createInsects() {
    const specs = [
      ["gnat", 0.0105],
      ["gnat", 0.0088],
      ["gnat", 0.012],
      ["gnat", 0.0094],
      ["moth", 0.019],
      ["beetle", 0.0145],
      ["gnat", 0.008]
    ];
    insects = [];
    for (let i = 0; i < specs.length; i++) {
      insects.push({
        kind: specs[i][0],
        sf: specs[i][1],
        id: i + 1,
        x: view.w * (0.18 + ((i * 0.13) % 0.64)),
        y: view.h * (0.1 + ((i * 0.09) % 0.36)),
        vx: (hash(i + 4) - 0.5) * 20,
        vy: (hash(i + 9) - 0.5) * 16,
        phase: i * 1.63,
        state: "free",
        alpha: 1,
        scale: 1,
        immune: 0.3 + i * 0.18,
        lureT: 0,
        lureLeaf: null,
        lureTi: 0,
        struggle: 0,
        facing: hash(i + 2) * 6,
        leaf: null,
        tent: null,
        s: 1,
        hit: 1,
        hist: []
      });
    }
  }

  function createMotes() {
    motes = [];
    for (let i = 0; i < 18; i++) {
      motes.push({
        id: 40 + i,
        x: hash(i + 1) * view.w,
        y: hash(i + 5) * view.h * 0.72,
        vx: 0,
        vy: 0,
        phase: hash(i + 8) * 6.2,
        sf: 0.0028 + hash(i + 3) * 0.0035,
        s: 2,
        alpha: 0.22 + hash(i + 6) * 0.32
      });
    }
  }

  function rescaleFlyers() {
    for (let i = 0; i < insects.length; i++) {
      const b = insects[i];
      b.s = view.unit * b.sf;
      b.hit = b.s * (b.kind === "gnat" ? 1.7 : 1.25);
    }
    for (let i = 0; i < motes.length; i++) motes[i].s = view.unit * motes[i].sf;
  }

  function layout() {
    const w = view.w;
    const h = view.h;
    const unit = view.unit;
    pot.cx = w * 0.5;
    pot.rx = Math.min(w * 0.33, unit * 0.44);
    pot.ry = pot.rx * 0.2;
    pot.base = h - Math.max(1, h * 0.003);
    pot.h = pot.rx * 0.7;
    pot.top = pot.base - pot.h;
    origin.x = pot.cx;
    origin.y = pot.top + pot.ry * 0.22;
    pointer.R = Math.max(58, unit * 0.26);
    sizeLeaves();
    buildMoss();
    buildDecor();
    if (!insects.length) createInsects();
    if (!motes.length) createMotes();
    rescaleFlyers();
    for (let i = 0; i < insects.length; i++) {
      insects[i].x = Math.max(8, Math.min(w - 8, insects[i].x));
      insects[i].y = Math.max(8, Math.min(h - 8, insects[i].y));
    }
  }

  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    const bw = Math.round(w * dpr);
    const bh = Math.round(h * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (w !== view.w || h !== view.h) {
      view.w = w;
      view.h = h;
      view.unit = Math.min(w, h * 0.78);
      layout();
    }
  }

  function geom(leaf, t, curl) {
    const L = leaf.L;
    const hook = curl * L * 0.6 * t * t;
    const idle = Math.sin(t * Math.PI) * leaf.W * 0.2;
    return {
      x: t * L * (1 - curl * 0.05) - hook * 0.05,
      y: -hook * 0.9 + idle * (1 - curl * 0.45)
    };
  }

  function norm(leaf, t, curl) {
    const d = 0.02;
    const a = geom(leaf, Math.max(0, t - d), curl);
    const b = geom(leaf, Math.min(1, t + d), curl);
    let dx = b.x - a.x;
    let dy = b.y - a.y;
    const m = Math.hypot(dx, dy) || 1;
    return { x: -dy / m, y: dx / m };
  }

  function halfW(leaf, t) {
    return leaf.W * (0.075 + Math.pow(Math.sin(t * Math.PI), 0.68) * (0.18 + 0.88 * t));
  }

  function leafOrigin(leaf) {
    const a = leaf.drawAngle;
    return {
      x: origin.x + Math.cos(a) * view.unit * 0.014,
      y: origin.y + Math.sin(a) * view.unit * 0.01
    };
  }

  function toWorld(leaf, lx, ly) {
    const a = leaf.drawAngle;
    const c = Math.cos(a);
    const s = Math.sin(a);
    const o = leafOrigin(leaf);
    return { x: o.x + lx * c - ly * s, y: o.y + lx * s + ly * c };
  }

  function tentacleLocal(leaf, tent, time) {
    const curl = leaf.curl;
    const sway = Math.sin(time * 1.12 + tent.phase) * 0.2 * (1 - curl * 0.9);
    if (tent.tip) {
      const p = geom(leaf, 0.97, curl);
      const q = geom(leaf, 0.9, curl);
      const tang = Math.atan2(p.y - q.y, p.x - q.x);
      const ang = tang + tent.spread * (1 - curl * 0.35) + sway;
      const len = tent.len * (1 - curl * 0.12);
      return {
        bx: p.x,
        by: p.y,
        tx: p.x + Math.cos(ang) * len,
        ty: p.y + Math.sin(ang) * len,
        cpx: p.x + Math.cos(ang - tent.spread * 0.35) * len * 0.52,
        cpy: p.y + Math.sin(ang - tent.spread * 0.35) * len * 0.52
      };
    }
    const p = geom(leaf, tent.t, curl);
    const n = norm(leaf, tent.t, curl);
    const w = halfW(leaf, tent.t) * 0.9;
    const bx = p.x + n.x * w * tent.side;
    const by = p.y + n.y * w * tent.side;
    const ang = Math.atan2(n.y * tent.side, n.x * tent.side) + sway - tent.side * curl * 1.2;
    const len = tent.len * (1 - curl * 0.2);
    return {
      bx: bx,
      by: by,
      tx: bx + Math.cos(ang) * len,
      ty: by + Math.sin(ang) * len,
      cpx: bx + Math.cos(ang) * len * 0.46 + n.x * tent.side * 1.5,
      cpy: by + Math.sin(ang) * len * 0.46 + n.y * tent.side * 1.5
    };
  }

  function catchCount() {
    let n = 0;
    for (let i = 0; i < leaves.length; i++) {
      const m = leaves[i].mode;
      if (m === "strike" || m === "digest") n++;
    }
    return n;
  }

  function startle(x, y) {
    for (let i = 0; i < insects.length; i++) {
      const o = insects[i];
      if (o.state !== "free") continue;
      const dx = o.x - x;
      const dy = o.y - y;
      const d = Math.hypot(dx, dy);
      if (d < view.unit * 0.22 && d > 0.1) {
        o.vx += (dx / d) * 56;
        o.vy += (dy / d) * 56;
      }
    }
  }

  function respawn(b) {
    b.state = "free";
    b.scale = 1;
    b.alpha = 0;
    b.struggle = 0;
    b.immune = 2.1;
    b.lureT = 0;
    b.lureLeaf = null;
    b.leaf = null;
    b.tent = null;
    b.x = view.w * (0.16 + Math.random() * 0.68);
    b.y = view.h * (0.07 + Math.random() * 0.26);
    b.vx = (Math.random() - 0.5) * 22;
    b.vy = 10 + Math.random() * 14;
    if (b.x < view.w * 0.22 && b.y < view.h * 0.18) b.x = view.w * 0.38;
    if (b.x > view.w * 0.78 && b.y < view.h * 0.18) b.x = view.w * 0.62;
  }

  function beginCatch(b, leaf, tent) {
    leaf.mode = "strike";
    leaf.modeT = 0;
    leaf.catchBug = b;
    leaf.catchTent = tent;
    b.state = "stuck";
    b.leaf = leaf;
    b.tent = tent;
    b.struggle = 1;
    b.lureT = 0;
    pulses.push({ x: tent.wx, y: tent.wy, t: 0, life: 0.75 });
    startle(tent.wx, tent.wy);
  }

  function advanceLeaf(leaf, dt, time) {
    if (leaf.mode === "idle") {
      leaf.targetCurl = 0.03 + 0.02 * Math.sin(time * 0.65 + leaf.phase);
      leaf.heat = 0;
      return;
    }
    leaf.modeT += dt;
    if (leaf.mode === "strike") {
      leaf.targetCurl = 0.7;
      leaf.heat = Math.min(0.45, leaf.modeT / 0.9);
      if (leaf.modeT > 0.92) {
        leaf.mode = "digest";
        leaf.modeT = 0;
      }
    } else if (leaf.mode === "digest") {
      leaf.targetCurl = 1;
      leaf.heat = Math.min(1, 0.45 + leaf.modeT / 1.1);
      if (leaf.modeT > 3.05) {
        leaf.mode = "open";
        leaf.modeT = 0;
        leaf.catchTent = null;
        if (leaf.catchBug) {
          respawn(leaf.catchBug);
          leaf.catchBug = null;
        }
      }
    } else if (leaf.mode === "open") {
      leaf.targetCurl = 0.03;
      leaf.heat = Math.max(0, 1 - leaf.modeT / 1.65);
      if (leaf.modeT > 1.7) leaf.mode = "idle";
    }
  }

  function field(id, time) {
    return {
      x: Math.sin(time * 0.41 + id * 2.2) + Math.sin(time * 0.17 + id * 4.1) * 0.55,
      y: Math.cos(time * 0.33 + id * 1.8) + Math.cos(time * 0.14 + id * 3.4) * 0.55
    };
  }

  function pushCorners(b, dt) {
    const rad = view.unit * 0.3;
    const spots = [[0, 0], [view.w, 0]];
    for (let i = 0; i < spots.length; i++) {
      const dx = b.x - spots[i][0];
      const dy = b.y - spots[i][1];
      const d = Math.hypot(dx, dy);
      if (d < rad && d > 0.1) {
        b.vx += (dx / d) * 90 * dt;
        b.vy += (dy / d) * 90 * dt;
      }
    }
  }

  function contain(b, dt, floorY) {
    const m = Math.max(10, view.w * 0.05);
    if (b.x < m) b.vx += 70 * dt;
    if (b.x > view.w - m) b.vx -= 70 * dt;
    if (b.y < view.h * 0.055) b.vy += 70 * dt;
    if (b.y > floorY) b.vy -= 80 * dt;
    pushCorners(b, dt);
  }

  function influence(b, dt, amount) {
    if (!pointer.hot) return;
    const dx = b.x - pointer.x;
    const dy = b.y - pointer.y;
    const d = Math.hypot(dx, dy);
    const R = pointer.R;
    if (d < R && d > 0.4) {
      const f = (1 - d / R) * amount;
      b.vx += (dx / d) * f * dt;
      b.vy += (dy / d) * f * dt;
    }
  }

  function capSpeed(b, max) {
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > max) {
      b.vx = (b.vx / sp) * max;
      b.vy = (b.vy / sp) * max;
    }
  }

  function maybeLure(dt) {
    lureCooldown -= dt;
    if (lureCooldown > 0) return;
    lureCooldown = 2.4 + Math.random() * 2.2;
    const idle = [];
    for (let i = 0; i < leaves.length; i++) if (leaves[i].mode === "idle") idle.push(leaves[i]);
    if (!idle.length) return;
    const free = [];
    for (let i = 0; i < insects.length; i++) {
      const b = insects[i];
      if (b.state === "free" && b.immune <= 0 && b.lureT <= 0) free.push(b);
    }
    if (!free.length) return;
    const near = [];
    for (let i = 0; i < free.length; i++) if (free[i].y > view.h * 0.34) near.push(free[i]);
    const pool = near.length ? near : free;
    const b = pool[Math.floor(Math.random() * pool.length)];
    const leaf = idle[Math.floor(Math.random() * idle.length)];
    b.lureLeaf = leaf;
    b.lureTi = leaf.tents.length - 1 - Math.floor(Math.random() * 3);
    b.lureT = 4.4;
  }

  function updateBug(b, dt, time, floorY) {
    if (b.state === "stuck") {
      if (b.tent) {
        const wob = b.struggle * view.unit * 0.012;
        b.x = b.tent.wx + Math.sin(time * 36 + b.phase) * wob;
        b.y = b.tent.wy + Math.cos(time * 29 + b.phase) * wob * 0.8;
      }
      b.struggle = Math.max(0, b.struggle - dt * 0.42);
      let digest = 0;
      if (b.leaf && b.leaf.mode === "digest") digest = Math.min(1, b.leaf.modeT / 3.05);
      if (b.leaf && b.leaf.mode === "open") digest = 1;
      b.scale = 1 - digest;
      b.alpha = 1 - digest;
      return;
    }
    const f = field(b.id, time);
    b.vx += f.x * 16 * dt;
    b.vy += f.y * 13 * dt;
    if (b.kind !== "moth") {
      b.vx += (origin.x - b.x) * 0.07 * dt;
      b.vy += (origin.y - view.unit * 0.18 - b.y) * 0.05 * dt;
    } else if (b.lureT <= 0 && b.y > view.h * 0.4) {
      b.vy -= 16 * dt;
    }
    if (b.kind === "beetle" && b.y < view.h * 0.48 && b.lureT <= 0) b.vy += 10 * dt;
    if (b.lureT > 0 && b.lureLeaf && b.lureLeaf.mode === "idle") {
      b.lureT -= dt;
      const tent = b.lureLeaf.tents[b.lureTi];
      if (tent) {
        const dx = tent.wx - b.x;
        const dy = tent.wy - b.y;
        const d = Math.hypot(dx, dy) || 1;
        b.vx += (dx / d) * 78 * dt;
        b.vy += (dy / d) * 78 * dt;
      }
    } else {
      b.lureT = 0;
    }
    influence(b, dt, 560);
    contain(b, dt, floorY);
    b.vx *= Math.exp(-dt * 1.25);
    b.vy *= Math.exp(-dt * 1.25);
    capSpeed(b, pointer.hot ? 150 : 72);
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.x = Math.max(view.w * 0.04, Math.min(view.w * 0.96, b.x));
    b.y = Math.max(view.h * 0.045, Math.min(floorY, b.y));
    if (b.alpha < 1) b.alpha = Math.min(1, b.alpha + dt * 0.55);
    if (b.immune > 0) b.immune -= dt;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 6) {
      const aim = Math.atan2(b.vy, b.vx);
      let dlt = aim - b.facing;
      while (dlt > Math.PI) dlt -= Math.PI * 2;
      while (dlt < -Math.PI) dlt += Math.PI * 2;
      b.facing += dlt * Math.min(1, dt * 5);
    }
    if (b.kind === "moth") {
      b.hist.push(b.x, b.y);
      if (b.hist.length > 12) b.hist.splice(0, 2);
    }
    if (b.immune > 0 || b.alpha < 0.85) return;
    if (catchCount() >= 2) return;
    for (let i = 0; i < leaves.length; i++) {
      const leaf = leaves[i];
      if (leaf.mode !== "idle") continue;
      for (let k = 0; k < leaf.tents.length; k++) {
        const tent = leaf.tents[k];
        const dx = b.x - tent.wx;
        const dy = b.y - tent.wy;
        const r = tent.hit + b.hit;
        if (dx * dx + dy * dy < r * r) {
          beginCatch(b, leaf, tent);
          return;
        }
      }
    }
  }

  function updateMote(m, dt, floorY) {
    const f = field(m.id, dt + m.phase);
    m.vx += f.x * 8 * dt;
    m.vy += f.y * 6 * dt;
    m.vx += (view.w * 0.48 - m.x) * 0.03 * dt;
    m.vy += (view.h * 0.24 - m.y) * 0.015 * dt;
    influence(m, dt, 220);
    contain(m, dt, floorY);
    m.vx *= Math.exp(-dt * 0.8);
    m.vy *= Math.exp(-dt * 0.8);
    capSpeed(m, 36);
    m.x += m.vx * dt;
    m.y += m.vy * dt;
  }

  function update(dt, time) {
    pointer.hot = pointer.on && (performance.now() - pointer.seen < 800);
    for (let i = 0; i < leaves.length; i++) advanceLeaf(leaves[i], dt, time);
    for (let i = 0; i < leaves.length; i++) {
      const leaf = leaves[i];
      leaf.curl += (leaf.targetCurl - leaf.curl) * (1 - Math.exp(-dt * 3.2));
      leaf.drawAngle = leaf.angle + Math.sin(time * 0.42 + leaf.phase) * 0.03 * (1 - leaf.curl);
    }
    for (let i = 0; i < leaves.length; i++) {
      const leaf = leaves[i];
      for (let k = 0; k < leaf.tents.length; k++) {
        const tent = leaf.tents[k];
        const loc = tentacleLocal(leaf, tent, time);
        const wpt = toWorld(leaf, loc.tx, loc.ty);
        tent.wx = wpt.x;
        tent.wy = wpt.y;
      }
    }
    const floorY = pot.top + pot.ry * 1.55;
    if (pointer.hot) {
      for (let i = 0; i < insects.length; i++) insects[i].lureT = 0;
    } else {
      maybeLure(dt);
    }
    for (let i = 0; i < insects.length; i++) updateBug(insects[i], dt, time, floorY);
    for (let i = 0; i < motes.length; i++) updateMote(motes[i], dt, floorY - view.unit * 0.02);
    for (let i = pulses.length - 1; i >= 0; i--) {
      pulses[i].t += dt;
      if (pulses[i].t > pulses[i].life) pulses.splice(i, 1);
    }
  }

  function drawSky(time) {
    const w = view.w;
    const h = view.h;
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#f6ead8");
    g.addColorStop(0.3, "#e6f0e7");
    g.addColorStop(0.64, "#c7d7cf");
    g.addColorStop(1, "#89a197");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    const lx = w * (0.44 + Math.sin(time * 0.07) * 0.03);
    const rg = ctx.createRadialGradient(lx, h * 0.02, w * 0.02, lx, h * 0.24, w * 0.75);
    rg.addColorStop(0, "rgba(255, 248, 230, 0.78)");
    rg.addColorStop(0.5, "rgba(255, 236, 206, 0.16)");
    rg.addColorStop(1, "rgba(255, 236, 206, 0)");
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, w, h);
    const spots = [[0.28, 0.2, 0.16], [0.7, 0.14, 0.11], [0.52, 0.36, 0.18]];
    for (let i = 0; i < spots.length; i++) {
      const x = w * spots[i][0] + Math.sin(time * 0.11 + i) * 10;
      const y = h * spots[i][1] + Math.cos(time * 0.09 + i) * 8;
      const r = Math.min(w, h) * spots[i][2];
      const bg = ctx.createRadialGradient(x, y, 0, x, y, r);
      bg.addColorStop(0, "rgba(255, 252, 244, 0.28)");
      bg.addColorStop(1, "rgba(255, 252, 244, 0)");
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPot(time) {
    const cx = pot.cx;
    const top = pot.top;
    const base = pot.base;
    const rx = pot.rx;
    const ry = pot.ry;
    const bodyH = base - top;
    ctx.fillStyle = "rgba(16, 28, 26, 0.2)";
    ctx.beginPath();
    ctx.ellipse(cx, base, rx * 0.84, ry * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    const g = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
    g.addColorStop(0, "#121e1c");
    g.addColorStop(0.24, "#1b322e");
    g.addColorStop(0.46, "#3c635b");
    g.addColorStop(0.68, "#274640");
    g.addColorStop(1, "#0e1816");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx - rx, top);
    ctx.bezierCurveTo(cx - rx * 1.03, top + bodyH * 0.38, cx - rx * 0.84, base - ry, cx - rx * 0.72, base);
    ctx.bezierCurveTo(cx - rx * 0.28, base + ry * 0.9, cx + rx * 0.28, base + ry * 0.9, cx + rx * 0.72, base);
    ctx.bezierCurveTo(cx + rx * 0.84, base - ry, cx + rx * 1.03, top + bodyH * 0.38, cx + rx, top);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(255, 250, 240, 0.07)";
    ctx.beginPath();
    ctx.ellipse(cx - rx * 0.36, top + bodyH * 0.4, rx * 0.12, bodyH * 0.2, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#1e3834";
    ctx.beginPath();
    ctx.ellipse(cx, top, rx * 1.03, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(212, 168, 74, " + (0.72 + 0.18 * Math.sin(time * 0.85)) + ")";
    ctx.lineWidth = Math.max(1.1, rx * 0.026);
    ctx.beginPath();
    ctx.ellipse(cx, top, rx * 1.03, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255, 236, 196, 0.55)";
    ctx.lineWidth = Math.max(0.8, rx * 0.01);
    ctx.beginPath();
    ctx.ellipse(cx, top, rx * 1.03, ry, 0, Math.PI * 1.12, Math.PI * 1.72);
    ctx.stroke();
    ctx.fillStyle = "#16120e";
    ctx.beginPath();
    ctx.ellipse(cx, top + ry * 0.06, rx * 0.84, ry * 0.66, 0, 0, Math.PI * 2);
    ctx.fill();
    const soil = ctx.createLinearGradient(0, top - ry, 0, top + ry);
    soil.addColorStop(0, "#3c2e22");
    soil.addColorStop(1, "#22180f");
    ctx.fillStyle = soil;
    ctx.beginPath();
    ctx.ellipse(cx, top + ry * 0.12, rx * 0.76, ry * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawMoss() {
    for (let i = 0; i < moss.length; i++) {
      const m = moss[i];
      ctx.fillStyle = m.c;
      ctx.beginPath();
      ctx.ellipse(pot.cx + m.x, pot.top + m.y, m.r, m.r * 0.7, m.a, 0, Math.PI * 2);
      ctx.fill();
      if (m.bump > 0.72) {
        ctx.fillStyle = "rgba(214, 224, 170, 0.55)";
        ctx.beginPath();
        ctx.arc(pot.cx + m.x - m.r * 0.15, pot.top + m.y - m.r * 0.18, m.r * 0.26, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawStones() {
    for (let i = 0; i < stones.length; i++) {
      const s = stones[i];
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.ellipse(pot.cx + s.x, pot.top + s.y, s.rx, s.ry, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.28)";
      ctx.beginPath();
      ctx.ellipse(pot.cx + s.x - s.rx * 0.25, pot.top + s.y - s.ry * 0.2, s.rx * 0.35, s.ry * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFiddles(time) {
    const spots = [
      [-0.58, 0.15, 0.09, 0.3],
      [0.5, 0.32, 0.062, 1.8]
    ];
    for (let i = 0; i < spots.length; i++) {
      const s = spots[i];
      const x = pot.cx + pot.rx * s[0];
      const y = pot.top + pot.ry * s[1];
      const sc = view.unit * s[2];
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.5 + Math.sin(time * 0.5 + s[3]) * 0.04);
      ctx.strokeStyle = "#1c4a34";
      ctx.lineWidth = Math.max(1, sc * 0.16);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, sc * 0.2);
      ctx.quadraticCurveTo(sc * 0.15, -sc * 0.7, sc * 0.55, -sc * 0.62);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(sc * 0.62, -sc * 0.42, sc * 0.24, 0.4, 4.3);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawScape(time) {
    const sway = Math.sin(time * 0.55) * view.unit * 0.012;
    const x0 = origin.x + view.unit * 0.018;
    const y0 = origin.y - view.unit * 0.01;
    const x1 = x0 + sway;
    const y1 = y0 - view.unit * 0.56;
    ctx.strokeStyle = "#6a4636";
    ctx.lineWidth = Math.max(1, view.unit * 0.0055);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(x0 - sway * 0.4, (y0 + y1) * 0.5, x1, y1);
    ctx.stroke();
    ctx.save();
    ctx.translate(x1, y1);
    ctx.rotate(-0.55 + sway * 0.02);
    ctx.fillStyle = "#2d5640";
    ctx.beginPath();
    ctx.ellipse(0, view.unit * 0.012, view.unit * 0.012, view.unit * 0.008, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#f3e4ea";
    ctx.beginPath();
    ctx.ellipse(0, -view.unit * 0.008, view.unit * 0.016, view.unit * 0.026, 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#e2b3c0";
    ctx.beginPath();
    ctx.ellipse(view.unit * 0.003, -view.unit * 0.004, view.unit * 0.008, view.unit * 0.014, 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSpent() {
    const bits = [
      [-0.9, 0.08, -0.04],
      [0.7, 0.07, 0.05],
      [2.4, 0.06, 0.01]
    ];
    for (let i = 0; i < bits.length; i++) {
      const L = view.unit * bits[i][1];
      ctx.save();
      ctx.translate(origin.x + view.unit * bits[i][2], origin.y + view.unit * 0.012);
      ctx.rotate(bits[i][0]);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(L * 0.45, -L * 0.35, L * 0.85, L * 0.05);
      ctx.quadraticCurveTo(L * 0.5, L * 0.18, L * 0.12, L * 0.04);
      ctx.closePath();
      ctx.fillStyle = "#6a3040";
      ctx.fill();
      ctx.strokeStyle = "rgba(212, 168, 74, 0.35)";
      ctx.lineWidth = 0.7;
      ctx.stroke();
      ctx.restore();
    }
  }

  function traceBlade(leaf, curl) {
    const steps = 14;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const p = geom(leaf, t, curl);
      const n = norm(leaf, t, curl);
      const w = halfW(leaf, t);
      const x = p.x + n.x * w;
      const y = p.y + n.y * w;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    for (let i = steps; i >= 0; i--) {
      const t = i / steps;
      const p = geom(leaf, t, curl);
      const n = norm(leaf, t, curl);
      const w = halfW(leaf, t);
      ctx.lineTo(p.x - n.x * w, p.y - n.y * w);
    }
    ctx.closePath();
  }

  function drawTentacle(leaf, tent, time) {
    const loc = tentacleLocal(leaf, tent, time);
    ctx.beginPath();
    ctx.moveTo(loc.bx, loc.by);
    ctx.quadraticCurveTo(loc.cpx, loc.cpy, loc.tx, loc.ty);
    ctx.strokeStyle = tent.color;
    ctx.lineWidth = Math.max(1, view.unit * (tent.tip ? 0.0046 : 0.0034));
    ctx.lineCap = "round";
    ctx.stroke();
    const pulse = 1 + 0.055 * Math.sin(time * 2.2 + tent.phase);
    const caught = leaf.catchTent === tent ? 1.38 : 1;
    const drawW = tent.r * pulse * 3.2 * caught;
    ctx.drawImage(dewImg, loc.tx - drawW / 2, loc.ty - drawW / 2, drawW, drawW);
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.beginPath();
    ctx.ellipse(loc.tx - drawW * 0.1, loc.ty - drawW * 0.12, drawW * 0.06, drawW * 0.035, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLeaf(leaf, time) {
    const curl = leaf.curl;
    ctx.save();
    const o = leafOrigin(leaf);
    ctx.translate(o.x, o.y);
    ctx.rotate(leaf.drawAngle);
    ctx.save();
    ctx.translate(0.7, 1.3);
    traceBlade(leaf, curl);
    ctx.fillStyle = "rgba(10, 26, 22, 0.4)";
    ctx.fill();
    ctx.restore();
    traceBlade(leaf, curl);
    const grd = ctx.createLinearGradient(0, 0, leaf.L, 0);
    grd.addColorStop(0, "#1a3c34");
    grd.addColorStop(0.38, "#2d6b50");
    grd.addColorStop(0.74, "#3e7c58");
    grd.addColorStop(1, leaf.blush);
    ctx.fillStyle = grd;
    ctx.fill();
    if (leaf.heat > 0.02) {
      ctx.fillStyle = "rgba(122, 36, 52, " + leaf.heat * 0.28 + ")";
      ctx.fill();
    }
    ctx.strokeStyle = "rgba(212, 168, 74, " + (0.32 + leaf.heat * 0.5) + ")";
    ctx.lineWidth = Math.max(0.7, view.unit * 0.0032);
    ctx.stroke();
    const mid = geom(leaf, 0.66, curl);
    ctx.fillStyle = "rgba(255, 244, 220, 0.1)";
    ctx.beginPath();
    ctx.ellipse(mid.x, mid.y, halfW(leaf, 0.66) * 0.42, leaf.W * 0.15, 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      const p = geom(leaf, i / 10, curl);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = "rgba(236, 214, 160, 0.26)";
    ctx.lineWidth = 0.8;
    ctx.stroke();
    for (let i = 0; i < leaf.tents.length; i++) drawTentacle(leaf, leaf.tents[i], time);
    ctx.restore();
  }

  function drawDigestGlows() {
    for (let i = 0; i < leaves.length; i++) {
      const leaf = leaves[i];
      if (!leaf.catchTent || leaf.heat < 0.04) continue;
      const rad = view.unit * 0.16 * (0.7 + leaf.heat * 0.5);
      ctx.globalAlpha = 0.85 * leaf.heat;
      ctx.drawImage(glowImg, leaf.catchTent.wx - rad, leaf.catchTent.wy - rad, rad * 2, rad * 2);
      ctx.globalAlpha = 1;
    }
  }

  function drawGnat(b, time) {
    const s = b.s;
    const flap = Math.sin(time * (b.state === "stuck" ? 48 : 28) + b.phase);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.facing);
    ctx.scale(b.scale, b.scale);
    ctx.globalAlpha = b.alpha;
    ctx.fillStyle = "rgba(255,255,255,0.62)";
    ctx.beginPath();
    ctx.ellipse(-s * 0.2, -s * 1.15, s * 1.7, s * 0.72, -0.55 + flap * 0.45, 0, Math.PI * 2);
    ctx.ellipse(-s * 0.2, s * 1.15, s * 1.7, s * 0.72, 0.55 - flap * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#241c16";
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 1.15, s * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#241c16";
    ctx.lineWidth = Math.max(0.6, s * 0.16);
    ctx.beginPath();
    ctx.moveTo(s * 0.8, -s * 0.15);
    ctx.lineTo(s * 1.7, -s * 0.55);
    ctx.moveTo(s * 0.8, s * 0.15);
    ctx.lineTo(s * 1.7, s * 0.55);
    ctx.stroke();
    ctx.restore();
  }

  function drawMoth(b, time) {
    const s = b.s;
    const flap = Math.sin(time * (b.state === "stuck" ? 22 : 8.5) + b.phase);
    if (b.hist.length > 2 && b.state === "free") {
      for (let i = 0; i < b.hist.length; i += 2) {
        ctx.globalAlpha = 0.06 + (i / b.hist.length) * 0.12;
        ctx.fillStyle = "#f0ddc0";
        ctx.beginPath();
        ctx.arc(b.hist[i], b.hist[i + 1], s * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.facing);
    ctx.scale(b.scale, b.scale);
    ctx.globalAlpha = b.alpha;
    ctx.fillStyle = "rgba(244, 228, 196, 0.82)";
    ctx.beginPath();
    ctx.ellipse(-s * 0.15, -s * 0.85, s * 1.55, s * 0.78, -0.45 + flap * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(226, 190, 182, 0.78)";
    ctx.beginPath();
    ctx.ellipse(-s * 0.2, s * 0.8, s * 1.35, s * 0.66, 0.45 - flap * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(236, 214, 170, 0.7)";
    ctx.beginPath();
    ctx.ellipse(s * 0.15, -s * 0.35, s * 0.85, s * 0.4, -0.3, 0, Math.PI * 2);
    ctx.ellipse(s * 0.15, s * 0.35, s * 0.75, s * 0.34, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#5a4032";
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.72, s * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#5a4032";
    ctx.lineWidth = Math.max(0.7, s * 0.08);
    ctx.beginPath();
    ctx.moveTo(s * 0.55, -s * 0.08);
    ctx.quadraticCurveTo(s * 1.3, -s * 0.55, s * 1.15, -s * 1.15);
    ctx.moveTo(s * 0.55, s * 0.08);
    ctx.quadraticCurveTo(s * 1.3, s * 0.55, s * 1.15, s * 1.15);
    ctx.stroke();
    ctx.restore();
  }

  function drawBeetle(b, time) {
    const s = b.s;
    const flick = Math.sin(time * 16 + b.phase);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.facing);
    ctx.scale(b.scale, b.scale);
    ctx.globalAlpha = b.alpha;
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath();
    ctx.ellipse(-s * 0.2, -s * 0.95, s * 1.1, s * 0.42, -0.4 + flick * 0.2, 0, Math.PI * 2);
    ctx.ellipse(-s * 0.2, s * 0.95, s * 1.1, s * 0.42, 0.4 - flick * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#7a3e24";
    ctx.beginPath();
    ctx.ellipse(-s * 0.1, 0, s * 1.25, s * 0.78, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#c48448";
    ctx.beginPath();
    ctx.ellipse(s * 0.15, -s * 0.18, s * 0.55, s * 0.22, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#3d2216";
    ctx.lineWidth = Math.max(0.7, s * 0.1);
    ctx.beginPath();
    ctx.moveTo(-s * 0.15, 0);
    ctx.lineTo(s * 0.95, 0);
    ctx.stroke();
    ctx.fillStyle = "#4a2818";
    ctx.beginPath();
    ctx.arc(s * 1.15, 0, s * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#4a2818";
    ctx.beginPath();
    ctx.moveTo(s * 1.35, -s * 0.12);
    ctx.lineTo(s * 1.9, -s * 0.32);
    ctx.moveTo(s * 1.35, s * 0.12);
    ctx.lineTo(s * 1.9, s * 0.32);
    ctx.stroke();
    ctx.restore();
  }

  function drawInsects(time) {
    const order = insects.slice().sort(function (a, b) { return a.y - b.y; });
    for (let i = 0; i < order.length; i++) {
      const b = order[i];
      if (b.alpha < 0.02 || b.scale < 0.02) continue;
      if (b.kind === "moth") drawMoth(b, time);
      else if (b.kind === "beetle") drawBeetle(b, time);
      else drawGnat(b, time);
    }
  }

  function drawMotes(time) {
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      const tw = 0.65 + 0.35 * Math.sin(time * 1.4 + m.phase);
      ctx.globalAlpha = m.alpha * tw;
      ctx.fillStyle = "#fff8ec";
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPulses() {
    for (let i = 0; i < pulses.length; i++) {
      const p = pulses[i];
      const k = p.t / p.life;
      ctx.strokeStyle = "rgba(212, 168, 74, " + (1 - k) * 0.7 + ")";
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, view.unit * 0.015 + k * view.unit * 0.1, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function draw(time) {
    drawSky(time);
    drawMotes(time);
    drawPot(time);
    drawMoss();
    drawStones();
    drawFiddles(time);
    ctx.fillStyle = "rgba(20, 32, 28, 0.16)";
    ctx.beginPath();
    ctx.ellipse(origin.x, origin.y + 3, pot.rx * 0.42, pot.ry * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();
    drawSpent();
    drawScape(time);
    const order = leaves.slice().sort(function (a, b) {
      return Math.sin(a.drawAngle) - Math.sin(b.drawAngle);
    });
    for (let i = 0; i < order.length; i++) drawLeaf(order[i], time);
    ctx.fillStyle = "#4a2432";
    ctx.beginPath();
    ctx.ellipse(origin.x, origin.y, view.unit * 0.028, view.unit * 0.016, 0, 0, Math.PI * 2);
    ctx.fill();
    drawDigestGlows();
    drawInsects(time);
    drawPulses();
  }

  window.addEventListener("pointermove", function (e) {
    const rect = canvas.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
    pointer.on = true;
    pointer.seen = performance.now();
  }, { passive: true });

  window.addEventListener("pointerleave", function () {
    pointer.on = false;
  }, { passive: true });

  window.addEventListener("blur", function () {
    pointer.on = false;
  });

  function frame(now) {
    const time = now * 0.001;
    const dt = Math.min(0.033, lastT ? time - lastT : 0.016);
    lastT = time;
    fit();
    update(dt, time);
    draw(time);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
