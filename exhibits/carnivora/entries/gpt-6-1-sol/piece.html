<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Amber Archivist</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #081b1b; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas aria-label="A luminous, velvet-leaved sundew catches small moths in its amber-tipped fingers."></canvas>
<script>
(() => {
  "use strict";
  const canvas = document.querySelector("canvas");
  const ctx = canvas.getContext("2d", { alpha: false });
  const W = 600, H = 800, TAU = Math.PI * 2;
  let scaleX = 1, scaleY = 1, time = 0, last = 0;
  let seed = 74193;
  const random = () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const mix = (a, b, t) => a + (b - a) * t;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  function ellipse(c, x, y, rx, ry, color, angle = 0) {
    c.beginPath();
    c.ellipse(x, y, rx, ry, angle, 0, TAU);
    c.fillStyle = color;
    c.fill();
  }
  function curve(c, points, color, width) {
    c.beginPath();
    c.moveTo(points[0], points[1]);
    c.bezierCurveTo(...points.slice(2));
    c.strokeStyle = color;
    c.lineWidth = width;
    c.stroke();
  }

  const glow = document.createElement("canvas");
  glow.width = glow.height = 80;
  {
    const g = glow.getContext("2d");
    const r = g.createRadialGradient(40, 40, 0, 40, 40, 40);
    r.addColorStop(0, "rgba(255,224,147,.65)");
    r.addColorStop(.12, "rgba(255,193,85,.26)");
    r.addColorStop(.4, "rgba(222,154,56,.07)");
    r.addColorStop(1, "rgba(222,154,56,0)");
    g.fillStyle = r;
    g.fillRect(0, 0, 80, 80);
  }
  function halo(c, x, y, radius, alpha = 1) {
    c.globalAlpha *= alpha;
    c.drawImage(glow, x - radius, y - radius, radius * 2, radius * 2);
    c.globalAlpha /= alpha || 1;
  }

  const background = document.createElement("canvas");
  background.width = W; background.height = H;
  const foreground = document.createElement("canvas");
  foreground.width = W; foreground.height = H;

  function makeWorld() {
    const b = background.getContext("2d");
    let g = b.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#102c2c");
    g.addColorStop(.45, "#142e2b");
    g.addColorStop(1, "#061314");
    b.fillStyle = g; b.fillRect(0, 0, W, H);

    g = b.createRadialGradient(305, 275, 15, 305, 300, 400);
    g.addColorStop(0, "rgba(133,143,91,.13)");
    g.addColorStop(.55, "rgba(95,132,107,.04)");
    g.addColorStop(1, "rgba(0,8,10,.38)");
    b.fillStyle = g; b.fillRect(0, 0, W, H);

    for (let i = 0; i < 6500; i++) {
      const x = random() * W, y = random() * H;
      b.fillStyle = random() < .55 ? "rgba(190,204,164,.025)" : "rgba(0,0,0,.04)";
      b.fillRect(x, y, 1 + random(), 1 + random());
    }

    // Out-of-focus reeds, far behind the specimen.
    for (let i = 0; i < 19; i++) {
      const x = random() * W, y = 540 + random() * 190;
      curve(b, [x, 798, x - 30, 700, x + 50, y + 50, x + 12, y],
        "rgba(79,112,90,.07)", 2 + random() * 4);
    }

    g = b.createRadialGradient(300, 756, 40, 300, 756, 320);
    g.addColorStop(0, "#263a2d");
    g.addColorStop(.6, "#14251f");
    g.addColorStop(1, "#091717");
    ellipse(b, 300, 800, 410, 105, g);
    ellipse(b, 306, 753, 151, 24, "rgba(0,0,0,.39)");

    for (let i = 0; i < 460; i++) {
      const x = random() * 660 - 30, y = 735 + random() * 95;
      const a = Math.abs(x - 300) / 340;
      if (y < 726 + a * 35) continue;
      const shades = ["#304331", "#3d4b33", "#263c30", "#172c25", "#596047"];
      ellipse(b, x, y, 1 + random() * 6, .5 + random() * 2,
        shades[(random() * shades.length) | 0], random() * 2);
    }
    for (let i = 0; i < 52; i++) {
      const x = 28 + random() * 544, y = 748 + random() * 44;
      const h = 5 + random() * 19;
      curve(b, [x, y, x - 5, y - h * .4, x + 6, y - h, x + 2, y - h],
        "rgba(109,128,70,.29)", .65);
    }

    const f = foreground.getContext("2d");
    // The small, hand-thrown vessel.
    f.beginPath();
    f.moveTo(188, 659);
    f.bezierCurveTo(198, 684, 210, 729, 234, 743);
    f.bezierCurveTo(264, 758, 337, 758, 369, 743);
    f.bezierCurveTo(391, 727, 402, 685, 412, 659);
    f.closePath();
    g = f.createLinearGradient(187, 0, 413, 0);
    g.addColorStop(0, "#28443d");
    g.addColorStop(.16, "#668175");
    g.addColorStop(.38, "#a1b09a");
    g.addColorStop(.57, "#829582");
    g.addColorStop(.85, "#47675b");
    g.addColorStop(1, "#203e36");
    f.fillStyle = g; f.fill();
    f.save(); f.clip();
    for (let i = 0; i < 30; i++) {
      const y = 670 + i * 2.8;
      f.beginPath();
      f.ellipse(300, y - 8, 111 - i * 1.04, 15, 0, .04, Math.PI - .04);
      f.strokeStyle = i % 3 === 0 ? "rgba(223,231,193,.10)" : "rgba(15,50,41,.12)";
      f.lineWidth = .7; f.stroke();
    }
    for (let i = 0; i < 1200; i++) {
      f.fillStyle = random() < .5 ? "rgba(17,46,38,.1)" : "rgba(232,228,187,.09)";
      f.fillRect(185 + random() * 230, 658 + random() * 100, 1, 1);
    }
    // Restrained seed-shaped impressions in the clay.
    for (let i = 0; i < 13; i++) {
      const x = 207 + i * 15.5;
      const y = 699 + 12 * (1 - Math.pow((x - 300) / 100, 2));
      f.beginPath();
      f.moveTo(x, y - 7);
      f.quadraticCurveTo(x - 6, y, x, y + 7);
      f.quadraticCurveTo(x + 6, y, x, y - 7);
      f.strokeStyle = "rgba(28,63,49,.25)"; f.lineWidth = .8; f.stroke();
    }
    f.restore();
    ellipse(f, 300, 657, 113, 24, "#82937b");
    ellipse(f, 300, 656, 106, 19, "#24382a");
    ellipse(f, 300, 657, 99, 15, "#17271e");

    for (let i = 0; i < 240; i++) {
      const a = random() * TAU, r = Math.sqrt(random());
      const x = 300 + Math.cos(a) * 101 * r, y = 656 + Math.sin(a) * 15 * r;
      ellipse(f, x, y, 1 + random() * 3.5, .5 + random() * 1.2,
        ["#52613b", "#3b4c2d", "#716a44", "#22392a"][(random() * 4) | 0]);
    }
    f.beginPath();
    f.ellipse(300, 657, 109, 21, 0, 0, Math.PI);
    f.strokeStyle = "rgba(189,198,155,.44)"; f.lineWidth = 2; f.stroke();

    for (let i = 0; i < 38; i++) {
      const x = 211 + random() * 178, y = 654 + random() * 12;
      if (Math.abs(x - 300) < 22) continue;
      const h = 3 + random() * 13;
      curve(f, [x, y, x - 3, y - 4, x + 4, y - h, x + 1, y - h],
        ["#7c8d4b", "#4c7045", "#9c9e60"][(random() * 3) | 0], .8);
    }
  }
  makeWorld();

  const leaves = [
    { x: 319, y: 451, angle: .22, length: 112, width: 31, back: true },
    { x: 229, y: 384, angle: -.67, length: 124, width: 36, back: true },
    { x: 388, y: 378, angle: .66, length: 131, width: 39 },
    { x: 302, y: 357, angle: -.075, length: 153, width: 45 },
    { x: 224, y: 535, angle: -1.03, length: 125, width: 38 },
    { x: 376, y: 551, angle: 1.02, length: 122, width: 39 },
    { x: 294, y: 574, angle: -.18, length: 100, width: 31 }
  ].map((l, i) => ({ ...l, index: i, caught: -100, shimmer: random() * TAU }));

  const pointer = { x: -1000, y: -1000, vx: 0, vy: 0, at: -100 };
  canvas.addEventListener("pointermove", e => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * W;
    const y = (e.clientY - rect.top) / rect.height * H;
    pointer.vx = clamp(x - pointer.x, -25, 25);
    pointer.vy = clamp(y - pointer.y, -25, 25);
    pointer.x = x; pointer.y = y; pointer.at = time;
  }, { passive: true });
  canvas.addEventListener("pointerleave", () => { pointer.at = -100; }, { passive: true });

  function pose(l) {
    const age = time - l.caught;
    let fold = 0;
    if (age >= 0 && age < 7.8) {
      fold = age < 1.6 ? smooth(age / 1.6) :
        age < 4.4 ? 1 : 1 - smooth((age - 4.4) / 3.4);
    }
    return {
      x: l.x + Math.sin(time * .48 + l.index * 1.7) * 3,
      y: l.y + Math.sin(time * .55 + l.index) * 1.6,
      a: l.angle + Math.sin(time * .42 + l.index * 1.3) * .024,
      fold, age
    };
  }
  function localToWorld(p, x, y) {
    return {
      x: p.x + x * Math.cos(p.a) - y * Math.sin(p.a),
      y: p.y + x * Math.sin(p.a) + y * Math.cos(p.a)
    };
  }
  function targetOf(l) {
    const p = pose(l);
    return localToWorld(p, p.fold * l.length * .12, -l.length * .59);
  }

  const bugs = Array.from({ length: 6 }, (_, i) => ({
    x: 85 + random() * 430,
    y: 160 + random() * 360,
    vx: (random() - .5) * 24, vy: (random() - .5) * 20,
    phase: random() * TAU, size: .72 + random() * .35,
    hidden: 0, target: -1
  }));
  let nextInvitation = 3.2, invitations = 0;
  const parcels = [];

  function update(dt) {
    if (time > nextInvitation) {
      const choices = leaves.filter(l => time - l.caught > 11);
      const free = bugs.filter(b => time > b.hidden && b.target < 0);
      if (choices.length && free.length) {
        const l = choices[(invitations * 3 + 3) % choices.length];
        const t = targetOf(l);
        free.sort((a, b) => Math.hypot(a.x-t.x, a.y-t.y) - Math.hypot(b.x-t.x, b.y-t.y));
        free[0].target = l.index;
        invitations++;
      }
      nextInvitation = time + 5.8 + Math.sin(time) * .8;
    }

    for (const b of bugs) {
      if (time < b.hidden) continue;
      let ax = Math.sin(time * 1.5 + b.phase) * 13 +
        Math.sin(time * .53 + b.phase * 3) * 8;
      let ay = Math.cos(time * 1.28 + b.phase * 2) * 12;
      if (b.target >= 0) {
        const l = leaves[b.target];
        if (time - l.caught < 8) b.target = -1;
        else {
          const t = targetOf(l);
          ax += (t.x - b.x) * .43;
          ay += (t.y - b.y) * .43;
        }
      }
      const activity = Math.max(0, 1 - (time - pointer.at) / 1.4);
      const dx = b.x - pointer.x, dy = b.y - pointer.y;
      const distance = Math.hypot(dx, dy);
      if (activity > 0 && distance < 105) {
        const f = (1 - distance / 105) * activity;
        ax += dx / (distance + 1) * 145 * f + pointer.vx * f * 1.7;
        ay += dy / (distance + 1) * 145 * f + pointer.vy * f * 1.7;
      }
      if (b.x < 55) ax += (55 - b.x) * 1.4;
      if (b.x > 545) ax -= (b.x - 545) * 1.4;
      if (b.y < 140) ay += (140 - b.y) * 1.4;
      if (b.y > 592) ay -= (b.y - 592) * 1.4;
      const drag = Math.exp(-dt * 1.1);
      b.vx = (b.vx + ax * dt) * drag;
      b.vy = (b.vy + ay * dt) * drag;
      const speed = Math.hypot(b.vx, b.vy);
      if (speed > 54) { b.vx *= 54 / speed; b.vy *= 54 / speed; }
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.x = clamp(b.x, 28, 572); b.y = clamp(b.y, 100, 625);

      for (const l of leaves) {
        if (time - l.caught < 10) continue;
        const t = targetOf(l);
        if (Math.hypot(b.x - t.x, b.y - t.y) < 17) {
          l.caught = time;
          l.preyPhase = b.phase;
          parcels.push({ leaf: l, born: time + 2.7 });
          b.hidden = time + 7.5;
          b.target = -1;
          b.x = random() < .5 ? 70 : 530;
          b.y = 180 + random() * 230;
          b.vx = (300 - b.x) * .08; b.vy = 0;
          break;
        }
      }
    }
    for (let i = parcels.length - 1; i >= 0; i--) {
      if (time - parcels[i].born > 3) parcels.splice(i, 1);
    }
  }

  function moth(c, x, y, size, phase, alpha = 1, caught = false) {
    c.save();
    c.translate(x, y);
    c.rotate(Math.sin(phase * .4) * .24);
    c.scale(size, size);
    c.globalAlpha = alpha;
    halo(c, 0, 0, 19, .35);
    const flap = caught ? .55 + Math.sin(phase * 1.7) * .12 :
      .32 + Math.abs(Math.sin(phase)) * .68;
    c.scale(flap, 1);
    c.fillStyle = "#e4d7ad";
    c.beginPath();
    c.moveTo(-.4, 1);
    c.bezierCurveTo(-13, -11, -13, 3, -.5, 5);
    c.bezierCurveTo(-9, 11, -1, 12, 0, 3);
    c.bezierCurveTo(9, 12, 10, 6, 1, 4);
    c.bezierCurveTo(15, 1, 10, -12, .4, 1);
    c.fill();
    c.strokeStyle = "rgba(102,86,55,.5)"; c.lineWidth = .55;
    c.beginPath(); c.moveTo(-1, 2); c.lineTo(-8, -1);
    c.moveTo(1, 2); c.lineTo(8, -1); c.stroke();
    c.restore();
    c.save(); c.translate(x, y); c.globalAlpha = alpha;
    ellipse(c, 0, 1, .95 * size, 3.4 * size, "#fbdda0");
    c.strokeStyle = "#baa875"; c.lineWidth = .55;
    c.beginPath();
    c.moveTo(0, -1); c.quadraticCurveTo(-1, -5, -3, -5);
    c.moveTo(0, -1); c.quadraticCurveTo(1, -5, 3, -5);
    c.stroke(); c.restore();
  }

  function stem(l, p) {
    const startX = 300 + (l.index - 3) * 2;
    const points = [startX, 662, startX - 12 + (l.x - 300) * .2, 555,
      p.x - Math.sin(p.a) * 35, p.y + 86, p.x, p.y];
    curve(ctx, points, "#142f27", l.back ? 6 : 7);
    curve(ctx, points, l.back ? "#496348" : "#61794d", l.back ? 3 : 3.6);
    const highlight = [...points];
    for (let i = 0; i < 8; i += 2) highlight[i] -= 1;
    curve(ctx, highlight, "rgba(164,166,100,.35)", .8);
    for (const parcel of parcels) {
      if (parcel.leaf !== l) continue;
      const t = (time - parcel.born) / 3;
      if (t < 0 || t > 1) continue;
      const u = 1 - t;
      const x = t*t*t*points[0] + 3*t*t*u*points[2] +
        3*t*u*u*points[4] + u*u*u*points[6];
      const y = t*t*t*points[1] + 3*t*t*u*points[3] +
        3*t*u*u*points[5] + u*u*u*points[7];
      halo(ctx, x, y, 13, .65 * Math.sin(t * Math.PI));
      ellipse(ctx, x, y, 1.5, 2.8, "rgba(243,207,114,.75)");
    }
  }

  function drawLeaf(l, p) {
    const L = l.length, fold = p.fold;
    const width = l.width * (1 - fold * .62);
    const mid = t => fold * L * .17 * Math.sin(t * Math.PI * .85);
    const yAt = t => -L * t + fold * L * .16 * Math.pow(t, 4);
    const edge = t => width * Math.pow(Math.sin(Math.PI * t), .78);
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.a);
    ctx.beginPath(); ctx.moveTo(0, 0);
    for (let i = 1; i <= 28; i++) {
      const t = i / 28;
      ctx.lineTo(mid(t) - edge(t), yAt(t));
    }
    for (let i = 27; i >= 0; i--) {
      const t = i / 28;
      ctx.lineTo(mid(t) + edge(t), yAt(t));
    }
    ctx.closePath();
    let g = ctx.createLinearGradient(-l.width, -L / 2, l.width, -L / 2);
    g.addColorStop(0, "#7c7950");
    g.addColorStop(.10, "#5b493e");
    g.addColorStop(.34, l.back ? "#443c37" : "#613e3b");
    g.addColorStop(.54, "#342d2b");
    g.addColorStop(.78, "#68473e");
    g.addColorStop(.95, "#99935d");
    g.addColorStop(1, "#b3a46a");
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "#9b9965"; ctx.lineWidth = .9; ctx.stroke();

    // Fine, branching venation on the velvet lamina.
    for (let i = 1; i < 14; i++) {
      const t = i / 15, y = yAt(t), x = mid(t);
      for (const side of [-1, 1]) {
        const t2 = Math.min(.98, t + .12);
        const ex = mid(t2) + side * edge(t2) * .93, ey = yAt(t2);
        curve(ctx, [x, y, x + side * edge(t) * .3, y - 3,
          ex * .85, ey + 5, ex, ey], "rgba(198,151,100,.22)", .6);
      }
    }
    ctx.beginPath(); ctx.moveTo(0, 0);
    for (let i = 1; i <= 30; i++) {
      const t = i / 30; ctx.lineTo(mid(t), yAt(t));
    }
    ctx.strokeStyle = "rgba(196,171,102,.59)"; ctx.lineWidth = 1; ctx.stroke();

    // The captive remains visible between the curling fingers.
    if (p.age >= 0 && p.age < 4.1) {
      const a = 1 - smooth((p.age - 2.4) / 1.7);
      moth(ctx, mid(.59), yAt(.59), .73 * (1 - smooth(p.age / 4.2) * .5),
        time * 24 + (l.preyPhase || 0), a, true);
    }

    function filament(t, side, interior, j) {
      const e = edge(t);
      const x = mid(t) + side * e * (interior ? .49 : 1);
      const y = yAt(t);
      const len = (interior ? 9 : 14) + 5 * Math.sin(t * Math.PI);
      const tremble = Math.sin(time * 1.6 + j * 2.1 + l.index) * 1.1;
      let dx = side * len * (interior ? .32 : .79) * (1 - fold * 1.72);
      let dy = -len * (.55 + .23 * t) - fold * 7;
      const tx = x + dx + tremble * (1 - fold * .7), ty = y + dy;
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.bezierCurveTo(x + side * len * .3, y - 3, tx - side * 2, ty + 3, tx, ty);
      ctx.strokeStyle = interior ? "rgba(186,118,83,.64)" : "#af8561";
      ctx.lineWidth = interior ? .6 : .8; ctx.stroke();
      const r = (interior ? 1.45 : 2.05) + .33 * Math.sin(j * 8 + l.index);
      const light = .76 + Math.sin(time * .8 + j * 1.4) * .16;
      if (!interior && j % 3 === 0) halo(ctx, tx, ty, 10, .25 * light);
      ellipse(ctx, tx, ty, r, r * 1.16, "#bd813c");
      ellipse(ctx, tx - .25, ty - .5, r * .76, r * .74, "#edc571");
      ellipse(ctx, tx - .55, ty - 1, r * .29, r * .31, "#fff4cf");
    }

    for (let j = 1; j < 18; j++) {
      for (const side of [-1, 1]) filament(j / 18, side, false, j);
    }
    for (let j = 1; j < 9; j++) {
      for (const side of [-1, 1]) filament(.14 + j * .085, side, true, j + 20);
    }
    // A last drop at the very tip.
    const tipX = mid(1), tipY = yAt(1);
    curve(ctx, [tipX, tipY, tipX - 2, tipY - 7, tipX + 2, tipY - 9, tipX, tipY - 13],
      "#b69c6d", .8);
    halo(ctx, tipX, tipY - 14, 14, .35);
    ellipse(ctx, tipX, tipY - 14, 2.4, 3, "#eaca7c");
    ellipse(ctx, tipX - .6, tipY - 15, .7, .9, "#fff3d1");
    ctx.restore();
  }

  function juvenile(x, y, angle, height) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
    curve(ctx, [0, 0, -12, -height * .45, 6, -height * .9, 0, -height],
      "#557348", 3);
    ctx.beginPath();
    for (let i = 0; i <= 50; i++) {
      const a = i / 50 * Math.PI * 2.15;
      const r = 13 * (1 - i / 60);
      const x1 = -13 + Math.cos(a) * r, y1 = -height + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x1, y1); else ctx.lineTo(x1, y1);
    }
    ctx.strokeStyle = "#7f8a50"; ctx.lineWidth = 3; ctx.stroke();
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * TAU, r = 15;
      const x1 = -13 + Math.cos(a) * r, y1 = -height + Math.sin(a) * r;
      ellipse(ctx, x1, y1, 1.1, 1.3, "#c8ac68");
    }
    ctx.restore();
  }

  const dust = Array.from({ length: 32 }, () => ({
    x: random() * W, y: random() * 680,
    r: .4 + random() * .8, phase: random() * TAU
  }));

  function draw() {
    ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
    ctx.globalAlpha = 1;
    ctx.drawImage(background, 0, 0);
    for (const d of dust) {
      const x = d.x + Math.sin(time * .12 + d.phase) * 12;
      const y = (d.y - time * (1.5 + d.r) % 680 + 680) % 680;
      ellipse(ctx, x, y, d.r, d.r, `rgba(194,196,148,${.07 + .09 * Math.sin(time * .6 + d.phase) ** 2})`);
    }

    const poses = leaves.map(pose);
    leaves.forEach((l, i) => stem(l, poses[i]));
    juvenile(281, 659, -.47 + Math.sin(time * .5) * .02, 108);
    juvenile(320, 659, .50 + Math.sin(time * .5 + 1) * .02, 76);
    leaves.forEach((l, i) => drawLeaf(l, poses[i]));

    ctx.drawImage(foreground, 0, 0);
    for (const b of bugs) {
      if (time < b.hidden) continue;
      moth(ctx, b.x, b.y, b.size, time * 17 + b.phase);
    }
  }

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 1.65);
    const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    canvas.width = Math.round(w * ratio);
    canvas.height = Math.round(h * ratio);
    scaleX = canvas.width / W; scaleY = canvas.height / H;
    draw();
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  function frame(now) {
    requestAnimationFrame(frame);
    if (last && now - last < 25) return;
    const dt = last ? Math.min((now - last) / 1000, .065) : .025;
    last = now;
    time += dt;
    update(dt);
    draw();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
