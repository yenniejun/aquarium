<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specimen</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050811;
    touch-action: pan-y;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: pan-y;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  const offCanvas = document.createElement('canvas');
  const offCtx = offCanvas.getContext('2d');

  let W = 0, H = 0, dpr = 1, s = 1, cx = 0, by = 0;

  // Gentle environmental state
  const pointer = { x: 0, y: 0, active: false, smoothX: 0, smoothY: 0, breeze: 0 };

  // Deterministic pseudo-random helper for consistent botanical details
  function mulberry32(seed) {
    return function() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Specimen definitions (relative to base anchor cx, by and scale s)
  const specimens = [
    {
      // Tall primary mother specimen
      bx: -16, by: -6,
      tx: -10, ty: -188,
      ctrl1x: -38, ctrl1y: -68,
      ctrl2x: 12, ctrl2y: -132,
      stemWBase: 10.5, stemWTop: 5.5,
      rx: 66, ry: 54, rimDip: 15, tilt: 0.08,
      ribs: 9, phase: 0.0, breathSpeed: 0.72,
      veilLen: 36, isBud: false,
      hueShift: 0
    },
    {
      // Medium leaning companion on right
      bx: 24, by: 2,
      tx: 72, ty: -124,
      ctrl1x: 42, ctrl1y: -44,
      ctrl2x: 56, ctrl2y: -90,
      stemWBase: 8.0, stemWTop: 4.2,
      rx: 46, ry: 38, rimDip: 12, tilt: 0.28,
      ribs: 8, phase: 2.1, breathSpeed: 0.84,
      veilLen: 26, isBud: false,
      hueShift: 14
    },
    {
      // Smaller left companion
      bx: -44, by: 6,
      tx: -82, ty: -92,
      ctrl1x: -56, ctrl1y: -36,
      ctrl2x: -76, ctrl2y: -64,
      stemWBase: 6.5, stemWTop: 3.6,
      rx: 34, ry: 31, rimDip: 9, tilt: -0.32,
      ribs: 7, phase: 4.0, breathSpeed: 0.92,
      veilLen: 20, isBud: false,
      hueShift: -12
    },
    {
      // Young glowing bud emerging near center-right
      bx: 6, by: 12,
      tx: 14, ty: -34,
      ctrl1x: 8, ctrl1y: -6,
      ctrl2x: 15, ctrl2y: -22,
      stemWBase: 4.4, stemWTop: 2.8,
      rx: 13, ry: 16, rimDip: 3, tilt: 0.14,
      ribs: 5, phase: 1.2, breathSpeed: 1.1,
      veilLen: 7, isBud: true,
      hueShift: 6
    }
  ];

  // Cached mycelium paths (normalized offsets from cx, by)
  const myceliumPaths = [
    { pts: [[-16, -4], [-34, 8], [-64, 14], [-96, 28], [-126, 36]], phase: 0.0 },
    { pts: [[-16, -4], [-8, 12], [-20, 26], [-36, 42]], phase: 1.4 },
    { pts: [[24, 4], [46, 14], [78, 18], [108, 30], [134, 44]], phase: 2.6 },
    { pts: [[24, 4], [14, 20], [28, 36], [42, 48]], phase: 0.7 },
    { pts: [[-44, 8], [-68, 22], [-86, 38], [-110, 46]], phase: 3.5 },
    { pts: [[6, 14], [-4, 28], [6, 44]], phase: 4.2 }
  ];

  // Background depth motes & released spores
  const bgMotes = [];
  const spores = [];
  const MAX_SPORES = 58;

  function initParticles() {
    const rand = mulberry32(4207);
    bgMotes.length = 0;
    for (let i = 0; i < 24; i++) {
      bgMotes.push({
        nx: rand(),
        ny: rand() * 0.85,
        r: 1.2 + rand() * 2.8,
        speedY: 0.006 + rand() * 0.012,
        driftX: (rand() - 0.5) * 0.01,
        phase: rand() * Math.PI * 2,
        alpha: 0.08 + rand() * 0.18,
        hue: rand() > 0.5 ? '110, 240, 225' : '255, 210, 120'
      });
    }

    spores.length = 0;
    for (let i = 0; i < MAX_SPORES; i++) {
      spores.push(createSpore(rand(), true));
    }
  }

  function createSpore(seedVal, initialSpread = false) {
    const r1 = Math.sin(seedVal * 123.45) * 0.5 + 0.5;
    const r2 = Math.cos(seedVal * 321.12) * 0.5 + 0.5;
    // Choose a mature specimen to spawn from
    const specIdx = Math.floor((seedVal * 97) % 3);
    const sp = specimens[specIdx];
    const angle = (r1 - 0.5) * 2.1;
    const xOff = Math.sin(angle) * sp.rx * (0.4 + r2 * 0.55);
    const startX = sp.tx + xOff;
    const startY = sp.ty + 6 + r2 * 14;

    const palette = [
      [125, 248, 232], // aqua
      [255, 214, 118], // warm amber
      [204, 168, 255]  // soft violet
    ];
    const col = palette[Math.floor((seedVal * 53) % palette.length)];

    const maxLife = 6.5 + r1 * 6.5;
    return {
      x: startX,
      y: initialSpread ? startY - r2 * 210 : startY,
      vx: (r1 - 0.5) * 8,
      vy: -(11 + r2 * 14),
      size: 1.1 + r1 * 1.9,
      life: initialSpread ? r2 * maxLife : 0,
      maxLife,
      wobbleFreq: 0.7 + r2 * 0.9,
      wobbleAmp: 6 + r1 * 10,
      phase: r1 * Math.PI * 2,
      col
    };
  }

  // Evaluate cubic bezier point and tangent
  function evalBezier(p0x, p0y, c1x, c1y, c2x, c2y, p1x, p1y, t) {
    const u = 1 - t;
    const tt = t * t, uu = u * u;
    const uuu = uu * u, ttt = tt * t;
    const x = uuu * p0x + 3 * uu * t * c1x + 3 * u * tt * c2x + ttt * p1x;
    const y = uuu * p0y + 3 * uu * t * c1y + 3 * u * tt * c2y + ttt * p1y;
    const dx = 3 * uu * (c1x - p0x) + 6 * u * t * (c2x - c1x) + 3 * tt * (p1x - c2x);
    const dy = 3 * uu * (c1y - p0y) + 6 * u * t * (c2y - c1y) + 3 * tt * (p1y - c2y);
    return { x, y, dx, dy };
  }

  // Build static substrate (midnight slate/bark, moss clusters, fern shoots, dewdrops)
  function buildSubstrateCache() {
    offCanvas.width = Math.max(1, Math.floor(W * dpr));
    offCanvas.height = Math.max(1, Math.floor(H * dpr));
    offCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    offCtx.clearRect(0, 0, W, H);

    const rand = mulberry32(9081);

    // 1. Deep nocturnal background gradient
    const bgGrad = offCtx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#040710');
    bgGrad.addColorStop(0.52, '#08111d');
    bgGrad.addColorStop(0.82, '#0c1824');
    bgGrad.addColorStop(1, '#060b12');
    offCtx.fillStyle = bgGrad;
    offCtx.fillRect(0, 0, W, H);

    // Soft radial depth vignette
    const vig = offCtx.createRadialGradient(cx, by - 120 * s, 20 * s, cx, by - 90 * s, Math.max(W, H) * 0.72);
    vig.addColorStop(0, 'rgba(26, 62, 82, 0.20)');
    vig.addColorStop(0.55, 'rgba(10, 22, 36, 0.08)');
    vig.addColorStop(1, 'rgba(2, 4, 9, 0.55)');
    offCtx.fillStyle = vig;
    offCtx.fillRect(0, 0, W, H);

    // 2. Weathered dark bark / mossy stone mound across the bottom
    const moundTop = by - 18 * s;
    offCtx.beginPath();
    offCtx.moveTo(-10, H + 10);
    offCtx.lineTo(-10, by + 22 * s);
    offCtx.bezierCurveTo(
      cx - 120 * s, by + 4 * s,
      cx - 65 * s, moundTop,
      cx - 10 * s, by - 8 * s
    );
    offCtx.bezierCurveTo(
      cx + 48 * s, moundTop - 4 * s,
      cx + 115 * s, by + 6 * s,
      W + 10, by + 26 * s
    );
    offCtx.lineTo(W + 10, H + 10);
    offCtx.closePath();

    const barkGrad = offCtx.createLinearGradient(0, moundTop, 0, H);
    barkGrad.addColorStop(0, '#19222b');
    barkGrad.addColorStop(0.35, '#11171f');
    barkGrad.addColorStop(1, '#070a0f');
    offCtx.fillStyle = barkGrad;
    offCtx.fill();

    // Organic bark ridge striations
    offCtx.save();
    offCtx.clip();
    for (let i = 0; i < 28; i++) {
      const rx = (i / 27) * (W + 80) - 40;
      const ry = by - 16 * s + rand() * 34 * s;
      const len = (40 + rand() * 80) * s;
      offCtx.beginPath();
      offCtx.moveTo(rx, ry);
      offCtx.quadraticCurveTo(
        rx + (rand() - 0.5) * 28 * s,
        ry + len * 0.5,
        rx + (rand() - 0.5) * 20 * s,
        ry + len
      );
      offCtx.strokeStyle = i % 2 === 0 ? 'rgba(42, 60, 74, 0.22)' : 'rgba(4, 7, 12, 0.45)';
      offCtx.lineWidth = (1 + rand() * 2.5) * s;
      offCtx.stroke();
    }
    offCtx.restore();

    // 3. Soft moss cushions along the mound crest
    const mossZones = [
      { x: cx - 105 * s, y: by + 10 * s, w: 72 * s, h: 18 * s },
      { x: cx - 42 * s,  y: by - 4 * s,  w: 66 * s, h: 16 * s },
      { x: cx + 24 * s,  y: by - 2 * s,  w: 74 * s, h: 18 * s },
      { x: cx + 96 * s,  y: by + 12 * s, w: 68 * s, h: 16 * s }
    ];

    for (const mz of mossZones) {
      const mGrad = offCtx.createRadialGradient(mz.x, mz.y - 2 * s, 2 * s, mz.x, mz.y, mz.w * 0.65);
      mGrad.addColorStop(0, 'rgba(54, 126, 102, 0.62)');
      mGrad.addColorStop(0.55, 'rgba(26, 74, 64, 0.42)');
      mGrad.addColorStop(1, 'rgba(12, 32, 32, 0)');
      offCtx.fillStyle = mGrad;
      offCtx.beginPath();
      offCtx.ellipse(mz.x, mz.y + 4 * s, mz.w * 0.65, mz.h, 0, 0, Math.PI * 2);
      offCtx.fill();

      // Tiny velvety moss blades
      const bladeCount = 34;
      for (let b = 0; b < bladeCount; b++) {
        const bx = mz.x + (rand() - 0.5) * mz.w * 1.1;
        const byPos = mz.y + (rand() - 0.3) * mz.h * 0.9;
        const bh = (4 + rand() * 9) * s;
        const lean = (rand() - 0.5) * 6 * s;
        offCtx.beginPath();
        offCtx.moveTo(bx, byPos);
        offCtx.quadraticCurveTo(bx + lean * 0.4, byPos - bh * 0.6, bx + lean, byPos - bh);
        offCtx.strokeStyle = rand() > 0.35
          ? `rgba(${58 + Math.floor(rand() * 35)}, ${135 + Math.floor(rand() * 45)}, ${105 + Math.floor(rand() * 30)}, ${0.35 + rand() * 0.4})`
          : `rgba(110, 200, 165, ${0.25 + rand() * 0.3})`;
        offCtx.lineWidth = (0.9 + rand() * 0.8) * s;
        offCtx.lineCap = 'round';
        offCtx.stroke();
      }
    }

    // 4. Tiny curled fiddlehead fern tendrils & moss dewdrops
    const shoots = [
      { x: cx - 78 * s, y: by + 6 * s, dir: -1, h: 24 * s },
      { x: cx + 62 * s, y: by + 4 * s, dir: 1, h: 20 * s },
      { x: cx - 120 * s, y: by + 16 * s, dir: -1, h: 16 * s }
    ];
    for (const sh of shoots) {
      offCtx.beginPath();
      offCtx.moveTo(sh.x, sh.y);
      offCtx.bezierCurveTo(
        sh.x + sh.dir * 4 * s, sh.y - sh.h * 0.5,
        sh.x + sh.dir * 10 * s, sh.y - sh.h * 0.95,
        sh.x + sh.dir * 3 * s, sh.y - sh.h
      );
      offCtx.strokeStyle = 'rgba(72, 158, 128, 0.55)';
      offCtx.lineWidth = 1.6 * s;
      offCtx.lineCap = 'round';
      offCtx.stroke();

      // Tiny spiral curl tip
      offCtx.beginPath();
      offCtx.arc(sh.x + sh.dir * 3.5 * s, sh.y - sh.h + 2.2 * s, 2.2 * s, 0, Math.PI * 1.5);
      offCtx.strokeStyle = 'rgba(118, 212, 174, 0.65)';
      offCtx.lineWidth = 1.3 * s;
      offCtx.stroke();
    }

    // Glistening moss dewdrops
    const dewdrops = [
      [cx - 56 * s, by + 1 * s, 2.1 * s],
      [cx + 38 * s, by + 3 * s, 1.8 * s],
      [cx + 88 * s, by + 12 * s, 2.3 * s],
      [cx - 94 * s, by + 11 * s, 1.7 * s]
    ];
    for (const [dx, dy, dr] of dewdrops) {
      const dGrad = offCtx.createRadialGradient(dx - dr * 0.3, dy - dr * 0.3, dr * 0.1, dx, dy, dr);
      dGrad.addColorStop(0, 'rgba(225, 255, 250, 0.9)');
      dGrad.addColorStop(0.55, 'rgba(95, 210, 200, 0.45)');
      dGrad.addColorStop(1, 'rgba(30, 90, 95, 0.1)');
      offCtx.fillStyle = dGrad;
      offCtx.beginPath();
      offCtx.arc(dx, dy, dr, 0, Math.PI * 2);
      offCtx.fill();
    }
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(W * dpr));
    canvas.height = Math.max(1, Math.floor(H * dpr));

    s = Math.min(W / 320, H / 440);
    cx = W * 0.5;
    by = H * 0.82;

    buildSubstrateCache();
  }

  // Draw animated bioluminescent mycelium filaments on the dark bark
  function drawMycelium(t) {
    ctx.save();
    ctx.lineCap = 'round';
    for (const mp of myceliumPaths) {
      const pts = mp.pts;
      // Base faint cyan filament
      ctx.beginPath();
      ctx.moveTo(cx + pts[0][0] * s, by + pts[0][1] * s);
      for (let i = 1; i < pts.length; i++) {
        const prev = pts[i - 1];
        const curr = pts[i];
        const mx = cx + (prev[0] + curr[0]) * 0.5 * s;
        const my = by + (prev[1] + curr[1]) * 0.5 * s;
        ctx.quadraticCurveTo(cx + prev[0] * s, by + prev[1] * s, mx, my);
      }
      const last = pts[pts.length - 1];
      ctx.lineTo(cx + last[0] * s, by + last[1] * s);

      const pulse = 0.5 + 0.5 * Math.sin(t * 1.15 + mp.phase);
      ctx.strokeStyle = `rgba(92, 232, 214, ${0.14 + pulse * 0.16})`;
      ctx.lineWidth = 1.2 * s;
      ctx.stroke();

      // Traveling energy node along the thread
      const travel = (t * 0.24 + mp.phase * 0.3) % 1;
      const segFloat = travel * (pts.length - 1);
      const idx = Math.min(pts.length - 2, Math.floor(segFloat));
      const frac = segFloat - idx;
      const nx = cx + (pts[idx][0] + (pts[idx + 1][0] - pts[idx][0]) * frac) * s;
      const ny = by + (pts[idx][1] + (pts[idx + 1][1] - pts[idx][1]) * frac) * s;

      const nodeAlpha = Math.sin(travel * Math.PI) * 0.65;
      const nGrad = ctx.createRadialGradient(nx, ny, 0, nx, ny, 6 * s);
      nGrad.addColorStop(0, `rgba(180, 255, 240, ${nodeAlpha})`);
      nGrad.addColorStop(1, 'rgba(80, 220, 200, 0)');
      ctx.fillStyle = nGrad;
      ctx.beginPath();
      ctx.arc(nx, ny, 6 * s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Draw a single mushroom specimen
  function drawSpecimen(sp, t) {
    const breath = 0.5 + 0.5 * Math.sin(t * sp.breathSpeed + sp.phase);
    const sway = Math.sin(t * 0.65 + sp.phase) * 2.2 + pointer.breeze * (sp.isBud ? 1.5 : 4.5);

    const p0x = cx + sp.bx * s;
    const p0y = by + sp.by * s;
    const c1x = cx + (sp.ctrl1x + sway * 0.35) * s;
    const c1y = by + sp.ctrl1y * s;
    const c2x = cx + (sp.ctrl2x + sway * 0.75) * s;
    const c2y = by + sp.ctrl2y * s;
    const p1x = cx + (sp.tx + sway) * s;
    const p1y = by + (sp.ty - breath * 2.5) * s;

    // 1. Stem (translucent pearlescent ribbon)
    const steps = 18;
    const leftPts = [];
    const rightPts = [];
    const centerPts = [];

    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const pt = evalBezier(p0x, p0y, c1x, c1y, c2x, c2y, p1x, p1y, u);
      const len = Math.hypot(pt.dx, pt.dy) || 1;
      const nx = -pt.dy / len;
      const ny = pt.dx / len;
      // Slight bulb flare at very base, graceful taper upward
      const bulb = Math.exp(-u * 6.5) * 0.35;
      const halfW = (sp.stemWBase * (1 - u) + sp.stemWTop * u + sp.stemWBase * bulb) * 0.5 * s;
      leftPts.push([pt.x + nx * halfW, pt.y + ny * halfW]);
      rightPts.push([pt.x - nx * halfW, pt.y - ny * halfW]);
      centerPts.push([pt.x, pt.y]);
    }

    ctx.beginPath();
    ctx.moveTo(leftPts[0][0], leftPts[0][1]);
    for (let i = 1; i <= steps; i++) ctx.lineTo(leftPts[i][0], leftPts[i][1]);
    for (let i = steps; i >= 0; i--) ctx.lineTo(rightPts[i][0], rightPts[i][1]);
    ctx.closePath();

    const stemGrad = ctx.createLinearGradient(p0x, p0y, p1x, p1y);
    stemGrad.addColorStop(0, 'rgba(62, 138, 132, 0.78)');
    stemGrad.addColorStop(0.35, 'rgba(176, 224, 226, 0.78)');
    stemGrad.addColorStop(0.75, 'rgba(225, 240, 244, 0.85)');
    stemGrad.addColorStop(1, 'rgba(255, 226, 175, 0.92)');
    ctx.fillStyle = stemGrad;
    ctx.fill();

    // Subtle rising bioluminescent sap pulse inside stem
    const sapPos = (t * 0.32 + sp.phase * 0.4) % 1;
    const sapIdx = Math.min(steps - 1, Math.floor(sapPos * steps));
    const sapPt = centerPts[sapIdx];
    const sapAlpha = Math.sin(sapPos * Math.PI) * 0.55;
    const sapGrad = ctx.createRadialGradient(sapPt[0], sapPt[1], 0, sapPt[0], sapPt[1], 16 * s);
    sapGrad.addColorStop(0, `rgba(140, 255, 236, ${sapAlpha})`);
    sapGrad.addColorStop(1, 'rgba(140, 255, 236, 0)');
    ctx.fillStyle = sapGrad;
    ctx.beginPath();
    ctx.arc(sapPt[0], sapPt[1], 16 * s, 0, Math.PI * 2);
    ctx.fill();

    // Fine vertical stem highlight
    ctx.beginPath();
    ctx.moveTo(centerPts[1][0], centerPts[1][1]);
    for (let i = 2; i < steps; i++) {
      ctx.lineTo(centerPts[i][0] * 0.6 + leftPts[i][0] * 0.4, centerPts[i][1] * 0.6 + leftPts[i][1] * 0.4);
    }
    ctx.strokeStyle = 'rgba(245, 255, 255, 0.35)';
    ctx.lineWidth = 1.1 * s;
    ctx.stroke();

    // Delicate annulus (stem collar) on mature specimens
    if (!sp.isBud) {
      const ringIdx = Math.floor(steps * 0.66);
      const rc = centerPts[ringIdx];
      const rl = leftPts[ringIdx];
      const rr = rightPts[ringIdx];
      const ringAngle = Math.atan2(rr[1] - rl[1], rr[0] - rl[0]);
      ctx.save();
      ctx.translate(rc[0], rc[1]);
      ctx.rotate(ringAngle);
      ctx.beginPath();
      ctx.ellipse(0, 2 * s, sp.stemWTop * 1.15 * s, sp.stemWTop * 0.48 * s, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(185, 245, 238, 0.35)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(220, 255, 248, 0.55)';
      ctx.lineWidth = 0.8 * s;
      ctx.stroke();
      ctx.restore();
    }

    // 2. Cap & Hanging Crystalline Veil
    const capExpand = 1 + breath * 0.055;
    const rx = sp.rx * s * capExpand;
    const ry = sp.ry * s * (1 - breath * 0.02);
    const rimDip = sp.rimDip * s;
    const capTilt = sp.tilt + sway * 0.012;

    ctx.save();
    ctx.translate(p1x, p1y);
    ctx.rotate(capTilt);

    // Soft outer lantern halo around cap
    const haloR = Math.max(rx, ry) * 1.65;
    const haloGrad = ctx.createRadialGradient(0, -ry * 0.35, rx * 0.1, 0, -ry * 0.25, haloR);
    haloGrad.addColorStop(0, `rgba(255, 206, 118, ${0.18 + breath * 0.12})`);
    haloGrad.addColorStop(0.45, `rgba(74, 212, 206, ${0.10 + breath * 0.06})`);
    haloGrad.addColorStop(1, 'rgba(30, 80, 110, 0)');
    ctx.fillStyle = haloGrad;
    ctx.beginPath();
    ctx.arc(0, -ry * 0.25, haloR, 0, Math.PI * 2);
    ctx.fill();

    // Compute scalloped rib tip coordinates along the front rim
    const ribTips = [];
    for (let i = 0; i <= sp.ribs; i++) {
      const u = (i / sp.ribs) * 2 - 1;
      const x = u * rx;
      const y = Math.cos(u * Math.PI * 0.5) * rimDip;
      ribTips.push({ x, y, u });
    }

    // Back-inner bell dome & radial glowing gills (for open bells)
    if (!sp.isBud) {
      // Dark iridescent inner bell roof
      ctx.beginPath();
      ctx.ellipse(0, 0, rx * 0.96, rimDip * 0.95, 0, Math.PI, Math.PI * 2);
      ctx.ellipse(0, 0, rx * 0.96, rimDip * 0.88, 0, 0, Math.PI);
      const gillBg = ctx.createRadialGradient(0, -2 * s, 2 * s, 0, 0, rx);
      gillBg.addColorStop(0, `rgba(255, 224, 130, ${0.85 + breath * 0.15})`);
      gillBg.addColorStop(0.45, `rgba(242, 138, 108, ${0.65 + breath * 0.12})`);
      gillBg.addColorStop(0.85, 'rgba(64, 178, 185, 0.55)');
      gillBg.addColorStop(1, 'rgba(38, 60, 115, 0.45)');
      ctx.fillStyle = gillBg;
      ctx.fill();

      // Radial glowing gills radiating from stem center to rim
      const gillCount = sp.ribs * 3;
      for (let g = 0; g <= gillCount; g++) {
        const gu = (g / gillCount) * 2 - 1;
        const gx = gu * rx * 0.96;
        const gy = Math.sin(Math.acos(Math.max(-1, Math.min(1, gu)))) * rimDip * 0.85;
        ctx.beginPath();
        ctx.moveTo(0, -1 * s);
        ctx.quadraticCurveTo(gx * 0.5, gy * 0.35, gx, gy);
        ctx.strokeStyle = g % 2 === 0
          ? `rgba(255, 238, 168, ${0.38 + breath * 0.2})`
          : `rgba(115, 248, 232, ${0.24 + breath * 0.14})`;
        ctx.lineWidth = 0.85 * s;
        ctx.stroke();
      }
    }

    // Back hanging veil strands (subtle depth behind front strands)
    if (!sp.isBud) {
      drawVeilStrands(sp, ribTips, t, true, breath);
    }

    // Outer Translucent Fluted Bell Cap
    // Trace scalloped bottom rim from left to right, then bell dome curves up to apex
    ctx.beginPath();
    ctx.moveTo(ribTips[0].x, ribTips[0].y);
    for (let i = 0; i < sp.ribs; i++) {
      const a = ribTips[i];
      const b = ribTips[i + 1];
      const midX = (a.x + b.x) * 0.5;
      const archLift = (sp.isBud ? 2.0 : 5.2) * s * (1 - Math.abs((a.u + b.u) * 0.5) * 0.35);
      const midY = (a.y + b.y) * 0.5 - archLift;
      ctx.quadraticCurveTo(midX, midY, b.x, b.y);
    }

    // Right flank curving up to delicate apex umbo
    ctx.bezierCurveTo(
      rx * 1.02, -ry * 0.38,
      rx * 0.36, -ry * 0.92,
      0, -ry * 1.06
    );
    // Left flank curving back down to left rim tip
    ctx.bezierCurveTo(
      -rx * 0.36, -ry * 0.92,
      -rx * 1.02, -ry * 0.38,
      ribTips[0].x, ribTips[0].y
    );
    ctx.closePath();

    // Iridescent stained-glass cap gradient
    const capGrad = ctx.createLinearGradient(-rx * 0.7, -ry, rx * 0.8, rimDip);
    capGrad.addColorStop(0, 'rgba(68, 46, 134, 0.76)');
    capGrad.addColorStop(0.32, 'rgba(46, 148, 168, 0.62)');
    capGrad.addColorStop(0.68, 'rgba(135, 224, 212, 0.48)');
    capGrad.addColorStop(1, 'rgba(246, 164, 138, 0.62)');
    ctx.fillStyle = capGrad;
    ctx.fill();

    // Warm internal lantern glow shining through the center of the bell
    const coreGrad = ctx.createRadialGradient(0, -ry * 0.25, 2 * s, 0, -ry * 0.2, rx * 0.82);
    coreGrad.addColorStop(0, `rgba(255, 226, 136, ${0.42 + breath * 0.22})`);
    coreGrad.addColorStop(0.5, `rgba(255, 166, 118, ${0.18 + breath * 0.1})`);
    coreGrad.addColorStop(1, 'rgba(70, 180, 195, 0)');
    ctx.fillStyle = coreGrad;
    ctx.fill();

    // Luminous fluted ribs from apex to each scalloped rim tip
    for (let i = 1; i < sp.ribs; i++) {
      const tip = ribTips[i];
      ctx.beginPath();
      ctx.moveTo(0, -ry * 1.02);
      ctx.bezierCurveTo(
        tip.x * 0.28, -ry * 0.78,
        tip.x * 0.88, -ry * 0.35,
        tip.x, tip.y
      );
      const isHighlight = Math.abs(tip.u) < 0.55;
      ctx.strokeStyle = isHighlight
        ? `rgba(218, 255, 250, ${0.42 + breath * 0.15})`
        : 'rgba(136, 220, 226, 0.28)';
      ctx.lineWidth = (isHighlight ? 1.25 : 0.9) * s;
      ctx.stroke();
    }

    // Crisp opalescent specular edge along the outer cap outline
    ctx.beginPath();
    ctx.moveTo(ribTips[0].x, ribTips[0].y);
    for (let i = 0; i < sp.ribs; i++) {
      const a = ribTips[i];
      const b = ribTips[i + 1];
      const midX = (a.x + b.x) * 0.5;
      const archLift = (sp.isBud ? 2.0 : 5.2) * s * (1 - Math.abs((a.u + b.u) * 0.5) * 0.35);
      const midY = (a.y + b.y) * 0.5 - archLift;
      ctx.quadraticCurveTo(midX, midY, b.x, b.y);
    }
    ctx.strokeStyle = `rgba(182, 252, 244, ${0.52 + breath * 0.2})`;
    ctx.lineWidth = 1.15 * s;
    ctx.stroke();

    // Jewel-like glowing crown pearl at the apex
    const apexGlow = ctx.createRadialGradient(0, -ry * 1.02, 0, 0, -ry * 1.02, 7 * s);
    apexGlow.addColorStop(0, `rgba(240, 255, 252, ${0.85 + breath * 0.15})`);
    apexGlow.addColorStop(0.45, 'rgba(130, 240, 232, 0.35)');
    apexGlow.addColorStop(1, 'rgba(130, 240, 232, 0)');
    ctx.fillStyle = apexGlow;
    ctx.beginPath();
    ctx.arc(0, -ry * 1.02, 7 * s, 0, Math.PI * 2);
    ctx.fill();

    // Front hanging crystalline lace veil & glowing dew beads
    drawVeilStrands(sp, ribTips, t, false, breath);

    ctx.restore();
  }

  function drawVeilStrands(sp, ribTips, t, isBack, breath) {
    const step = isBack ? 2 : 1;
    const start = isBack ? 1 : 0;
    for (let i = start; i <= sp.ribs; i += step) {
      const tip = ribTips[i];
      const centerWeight = 1 - Math.abs(tip.u) * 0.38;
      const len = sp.veilLen * s * centerWeight * (isBack ? 0.78 : 1.0);
      const swayPhase = t * 1.35 + sp.phase + i * 0.75 + (isBack ? 1.5 : 0);
      const dx1 = Math.sin(swayPhase) * 3.5 * s + pointer.breeze * 5.0 * s;
      const dx2 = Math.sin(swayPhase - 0.8) * 5.5 * s + pointer.breeze * 8.5 * s;

      const x0 = tip.x * (isBack ? 0.9 : 1);
      const y0 = tip.y - (isBack ? 3 * s : 0);
      const xEnd = x0 + dx2;
      const yEnd = y0 + len;

      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo(x0 + dx1, y0 + len * 0.55, xEnd, yEnd);
      ctx.strokeStyle = isBack
        ? 'rgba(120, 224, 224, 0.18)'
        : `rgba(195, 250, 246, ${0.34 + breath * 0.14})`;
      ctx.lineWidth = (isBack ? 0.65 : 0.85) * s;
      ctx.stroke();

      // Graduated crystalline dew beads along front veil strands
      if (!isBack) {
        const midX = x0 + dx1 * 0.55 + dx2 * 0.25;
        const midY = y0 + len * 0.52;
        ctx.fillStyle = 'rgba(180, 252, 244, 0.62)';
        ctx.beginPath();
        ctx.arc(midX, midY, 1.05 * s, 0, Math.PI * 2);
        ctx.fill();

        // Tip bead with soft opal shimmer
        const tipR = (1.55 + breath * 0.35) * s;
        const bGrad = ctx.createRadialGradient(xEnd, yEnd, 0, xEnd, yEnd, tipR * 2.6);
        bGrad.addColorStop(0, 'rgba(255, 248, 215, 0.92)');
        bGrad.addColorStop(0.4, 'rgba(130, 245, 235, 0.45)');
        bGrad.addColorStop(1, 'rgba(130, 245, 235, 0)');
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.arc(xEnd, yEnd, tipR * 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function updateAndDrawBackgroundMotes(dt, t) {
    for (const m of bgMotes) {
      m.ny -= m.speedY * dt;
      m.nx += (m.driftX + Math.sin(t * 0.4 + m.phase) * 0.004) * dt;
      if (m.ny < -0.05) {
        m.ny = 0.86;
        m.nx = (m.nx + 0.37) % 1;
      }
      if (m.nx < 0) m.nx += 1;
      if (m.nx > 1) m.nx -= 1;

      const x = m.nx * W;
      const y = m.ny * H;
      const r = m.r * s * 2.2;
      const pulse = 0.65 + 0.35 * Math.sin(t * 0.9 + m.phase);
      const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, `rgba(${m.hue}, ${m.alpha * pulse})`);
      grad.addColorStop(1, `rgba(${m.hue}, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function updateAndDrawSpores(dt, t) {
    for (let i = 0; i < spores.length; i++) {
      const sp = spores[i];
      sp.life += dt;
      if (sp.life >= sp.maxLife) {
        spores[i] = createSpore((t * 17.3 + i * 0.618) % 1, false);
        continue;
      }

      const swirl = Math.sin(t * sp.wobbleFreq + sp.phase) * sp.wobbleAmp;
      sp.x += (sp.vx + swirl + pointer.breeze * 16) * dt;
      sp.y += sp.vy * dt;

      const px = cx + sp.x * s;
      const py = by + sp.y * s;

      // Smooth fade-in and fade-out envelope
      const lifeRatio = sp.life / sp.maxLife;
      const alpha = Math.sin(Math.min(1, lifeRatio) * Math.PI) * 0.92;
      const r = sp.size * s;
      const [cr, cg, cb] = sp.col;

      // Soft halo
      const haloR = r * 4.2;
      const grad = ctx.createRadialGradient(px, py, 0, px, py, haloR);
      grad.addColorStop(0, `rgba(255, 255, 245, ${alpha})`);
      grad.addColorStop(0.28, `rgba(${cr}, ${cg}, ${cb}, ${alpha * 0.72})`);
      grad.addColorStop(1, `rgba(${cr}, ${cg}, ${cb}, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, haloR, 0, Math.PI * 2);
      ctx.fill();

      // Tiny crisp 4-point prism glint on larger spores
      if (sp.size > 2.0) {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(t * 0.8 + sp.phase);
        ctx.strokeStyle = `rgba(255, 255, 250, ${alpha * 0.65})`;
        ctx.lineWidth = 0.7 * s;
        const arm = r * 1.9;
        ctx.beginPath();
        ctx.moveTo(-arm, 0); ctx.lineTo(arm, 0);
        ctx.moveTo(0, -arm); ctx.lineTo(0, arm);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // Optional gentle pointer breeze (never blocks scrolling or clicking)
  window.addEventListener('pointermove', (e) => {
    pointer.active = true;
    pointer.x = (e.clientX / Math.max(1, W)) * 2 - 1;
    pointer.y = (e.clientY / Math.max(1, H)) * 2 - 1;
  }, { passive: true });

  window.addEventListener('pointerleave', () => {
    pointer.active = false;
  }, { passive: true });

  window.addEventListener('resize', resize);

  initParticles();
  resize();

  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    const t = now * 0.001;

    // Smooth pointer breeze decay
    const targetBreeze = pointer.active ? pointer.x * 0.75 : 0;
    pointer.breeze += (targetBreeze - pointer.breeze) * Math.min(1, dt * 3.5);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 1. Cached nocturnal background + mossy bark substrate
    ctx.drawImage(offCanvas, 0, 0, W, H);

    // 2. Deep atmospheric motes
    updateAndDrawBackgroundMotes(dt, t);

    // 3. Bioluminescent mycelium pulses
    drawMycelium(t);

    // 4. Fungal cluster (back-to-front order for natural depth)
    drawSpecimen(specimens[2], t); // left companion
    drawSpecimen(specimens[1], t); // right companion
    drawSpecimen(specimens[0], t); // tall central mother
    drawSpecimen(specimens[3], t); // foreground young bud

    // 5. Drifting prism-spores
    updateAndDrawSpores(dt, t);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
