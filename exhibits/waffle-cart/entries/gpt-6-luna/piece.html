<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }
  svg {
    display: block;
    width: 100vw;
    height: 100vh;
    overflow: visible;
  }
  .plate {
    animation: plate-breathe 5s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .waffle {
    animation: waffle-wobble 4.8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .steam {
    animation: steam-rise 3.4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .steam:nth-child(2) { animation-delay: -1.1s; }
  .steam:nth-child(3) { animation-delay: -2.2s; }
  .orbit-berry {
    animation: berry-float 4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .orbit-berry.delay { animation-delay: -2s; }

  @keyframes plate-breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.012); }
  }
  @keyframes waffle-wobble {
    0%, 100% { transform: rotate(-7deg) translateY(0); }
    50% { transform: rotate(-5.8deg) translateY(-3px); }
  }
  @keyframes steam-rise {
    0% { opacity: 0; transform: translateY(9px) scale(.86); }
    25% { opacity: .7; }
    80% { opacity: .42; }
    100% { opacity: 0; transform: translateY(-22px) scale(1.08); }
  }
  @keyframes berry-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
</style>
</head>
