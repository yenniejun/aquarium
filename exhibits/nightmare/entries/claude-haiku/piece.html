<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:transparent}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const W = 300, H = 400;
const INK = '#1d1712';
let s = 1, ox = 0, oy = 0, dpr = 1, VW = 1, VH = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * dpr);
  cv.height = Math.round(VH * dpr);
  s = Math.min(VW / W, VH / H);
  ox = (VW - W * s) / 2;
  oy = (VH - H * s) / 2;
}
window.addEventListener('resize', resize);
resize();

// Pointer as a curious visitor. Passive, never blocks scrolling.
const P = { x: 150, y: 200, has: false, t: -1e9 };
function onMove(e) {
  P.x = (e.clientX - ox) / s;
  P.y = (e.clientY - oy) / s;
  P.has = true;
  P.t = performance.now();
}
window.addEventListener('pointermove', onMove, { passive: true });
window.addEventListener('pointerdown', onMove, { passive: true });

const nz = (x, t) => Math.sin(x * 1.7 + t * 1.1) * 0.5 + Math.sin(x * 3.1 - t * 0.7) * 0.25;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Deterministic random
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// Smooth curve through points (Catmull-Rom to Bezier)
function sp(pts, closed) {
  const n = pts.length;
  const get = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < last; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    ctx.bezierCurveTo(
      p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
      p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6,
      p2[0], p2[1]
    );
  }
  if (closed) ctx.closePath();
}

function jit(p, t, a) {
  return p.map((q, i) => [
    q[0] + nz(i * 1.3 + q[0] * 0.05, t) * a,
    q[1] + nz(i * 1.3 + q[1] * 0.05 + 9, t) * a
  ]);
}

function ink(pts, closed, w, col, t, a = 0.6) {
  sp(jit(pts, t, a), closed);
  ctx.lineWidth = w;
  ctx.strokeStyle = col;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function wash(pts, t, rgb, alpha) {
  ctx.fillStyle = `rgba(${rgb},${alpha})`;
  sp(jit(pts, t, 1.2), true);
  ctx.fill();
  const shifted = pts.map(q => [q[0] + 1.6, q[1] - 1.1]);
  ctx.fillStyle = `rgba(${rgb},${alpha * 0.6})`;
  sp(jit(shifted, t * 1.1, 1.4), true);
  ctx.fill();
}

// Pre-generated hatching
const hatchTorso = [];
for (let i = 0; i < 80; i++) {
  hatchTorso.push([150 + rnd() * 56, 168 + rnd() * 100, 6 + rnd() * 7]);
}
const hatchHead = [];
for (let i = 0; i < 40; i++) {
  hatchHead.push([158 + rnd() * 30, 104 + rnd() * 66, 5 + rnd() * 5]);
}
const hatchBranch = [];
for (let i = 0; i < 50; i++) {
  hatchBranch.push([-10 + rnd() * 320, 262 + rnd() * 12, 3 + rnd() * 4]);
}

// Eyes: a crescent of lenses across the brow
const EYES = [];
for (let i = 0; i < 9; i++) {
  const a = Math.PI * (1.08 + i * 0.1);
  EYES.push({
    x: 152 + Math.cos(a) * 24,
    y: 132 + Math.sin(a) * 15,
    r: 2.6 + rnd() * 2.2,
    phase: rnd()
  });
}

const TORSO = [[128,176],[160,168],[186,192],[196,232],[190,258],[160,266],[124,258],[112,224],[116,192]];
const HEAD = [[124,128],[146,108],[172,112],[184,134],[180,160],[166,176],[146,178],[128,166],[120,146]];
const ARM_L = [[122,192],[92,220],[84,236],[92,286]];
const ARM_R = [[184,192],[214,220],[224,240],[214,282]];
const BRANCH = [[-20,283],[50,267],[120,273],[185,257],[250,247],[320,240]];
const TAIL = [[170,262],[196,276],[206,300],[196,326],[214,350],[204,372],[212,392]];

const L = { x: 150, y: 190, lean: 0, open: 0.2 };
let rings = [];
let nextRing = 1;

function finger(base, ang, len, tap, t, k) {
  const tipX = base[0] + Math.cos(ang) * len;
  const tipY = base[1] + Math.sin(ang) * len + tap;
  const midX = base[0] + Math.cos(ang + nz(k, t) * 0.25) * len * 0.5;
  const midY = base[1] + Math.sin(ang) * len * 0.5 + 1.5;
  ink([base, [midX, midY], [tipX, tipY]], false, 1.5, INK, t, 0.3);
  ctx.beginPath();
  ctx.arc(base[0] + Math.cos(ang) * len * 0.5, midY, 0.9, 0, TAU);
  ctx.fillStyle = INK;
  ctx.fill();
}

function drawBranch(t) {
  ink(BRANCH, false, 7, '#2e231b', t, 0.4);
  ctx.globalAlpha = 0.35;
  ink(BRANCH.map(q => [q[0], q[1] - 2]), false, 1.6, '#8a7a60', t, 0.5);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(29,23,18,0.4)';
  ctx.lineWidth = 0.7;
  for (const [x, y, l] of hatchBranch) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - l * 0.4, y + l * 0.9);
    ctx.stroke();
  }
  ink([[60, 268], [40, 250], [30, 240]], false, 1.2, INK, t, 0.5);
}

function drawTail(t) {
  const pts = TAIL.map((q, i) => {
    const w = Math.sin(t * 2.1 + i * 0.9) * 3.5 * (i / (TAIL.length - 1));
    return [q[0] + w, q[1]];
  });
  ink(pts, false, 2.2, INK, t, 0.4);
  const e = pts[pts.length - 1];
  ctx.save();
  ctx.translate(e[0], e[1]);
  ctx.rotate(0.3 + Math.sin(t * 2.1) * 0.15);
  ctx.fillStyle = '#2a2420';
  ctx.fillRect(-3, 0, 6, 9);
  ctx.restore();
}

function drawEyes(t, tx, ty) {
  for (const e of EYES) {
    const b = ((t * 0.22 + e.phase * 3) % 1) < 0.035 ? 0.12 : 1;
    const dx = tx - e.x, dy = ty - e.y;
    const len = Math.hypot(dx, dy) || 1;
    const px = (dx / len) * e.r * 0.4, py = (dy / len) * e.r * 0.4;
    ctx.beginPath();
    ctx.ellipse(e.x, e.y, e.r, Math.max(0.4, e.r * b), 0, 0, TAU);
    ctx.fillStyle = 'rgba(243,239,226,0.9)';
    ctx.fill();
    ctx.lineWidth = 0.9;
    ctx.strokeStyle = INK;
    ctx.stroke();
    if (b > 0.5) {
      ctx.beginPath();
      ctx.ellipse(e.x + px, e.y + py, e.r * 0.5, e.r * 0.5, 0, 0, TAU);
      ctx.fillStyle = '#1b2a33';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e.x + px - e.r * 0.2, e.y + py - e.r * 0.2, e.r * 0.15, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fill();
    }
  }
}

function draw(t, tx, ty) {
  const lean = L.lean, op = L.open;

  // Notification rings from the mouth, spawned gently
  if (t > nextRing) { rings.push(t); nextRing = t + 2.6; }
  rings = rings.filter(r => t - r < 2.4);

  drawBranch(t);
  drawTail(t);

  ctx.save();
  ctx.translate(150, 262);
  ctx.rotate(lean * 0.03);
  ctx.scale(1 + lean * 0.015, (1 - lean * 0.02) * (1 + 0.012 * Math.sin(t * 1.6)));
  ctx.translate(-150, -262);

  // Legs gripping the branch
  ink([[134, 256], [126, 265], [116, 264]], false, 1.8, INK, t, 0.3);
  ink([[126, 265], [122, 269]], false, 1.2, INK, t, 0.2);
  ink([[168, 256], [177, 265], [186, 264]], false, 1.8, INK, t, 0.3);
  ink([[177, 265], [181, 269]], false, 1.2, INK, t, 0.2);

  // Arms, hanging and tapping at nothing
  ink(ARM_L, false, 2.6, INK, t, 0.4);
  ink(ARM_R, false, 2.6, INK, t, 0.4);
  const wl = ARM_L[ARM_L.length - 1], wr = ARM_R[ARM_R.length - 1];
  const angL = [1.35, 1.6, 1.85, 2.1];
  const angR = [0.4, 0.8, 1.1, 1.4];
  angL.forEach((a, k) => {
    const tap = Math.max(0, Math.sin(t * 7 + k * 1.6)) * 5;
    finger(wl, a, 15 + k % 2 * 3, tap, t, k);
  });
  angR.forEach((a, k) => {
    const tap = Math.max(0, Math.sin(t * 7 + k * 1.6 + 3)) * 5;
    finger(wr, a, 15 + (k + 1) % 2 * 3, tap, t, k + 4);
  });

  // Torso: watercolour, paper strips, hatching, ink
  wash(TORSO, t, '150,130,90', 0.2);
  wash(TORSO, t, '92,70,120', 0.07);

  ctx.save();
  sp(TORSO, true);
  ctx.clip();
  for (let k = 0; k < 6; k++) {
    const y = 176 + k * 14;
    ctx.save();
    ctx.translate(152, y);
    ctx.rotate(Math.sin(t * 0.8 + k) * 0.04);
    ctx.fillStyle = 'rgba(238,230,208,0.5)';
    ctx.fillRect(-50, -4, 100, 7 + Math.sin(t + k) * 0.8);
    ctx.strokeStyle = 'rgba(29,23,18,0.45)';
    ctx.lineWidth = 0.6;
    ctx.strokeRect(-50, -4, 100, 7);
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(29,23,18,0.35)';
  ctx.lineWidth = 0.7;
  for (const [x, y, l] of hatchTorso) {
    const w = nz(x, t) * 0.6;
    ctx.beginPath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x - l * 0.45 + w, y + l);
    ctx.stroke();
  }
  ctx.restore();
  ink(TORSO, true, 1.5, INK, t, 0.6);
  ink(TORSO, true, 0.6, 'rgba(29,23,18,0.4)', t * 1.07 + 3, 1.2);

  // Head: sickly wash, hatching, outline
  wash(HEAD, t, '120,140,100', 0.22);
  ctx.save();
  sp(HEAD, true);
  ctx.clip();
  ctx.strokeStyle = 'rgba(29,23,18,0.3)';
  ctx.lineWidth = 0.7;
  for (const [x, y, l] of hatchHead) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - l * 0.45, y + l);
    ctx.stroke();
  }
  ctx.restore();
  ink(HEAD, true, 1.6, INK, t, 0.5);

  drawEyes(t, tx, ty);

  // Mouth: a dark slit with a pale glow that flickers
  const mh = 1 + op * 6;
  ctx.beginPath();
  ctx.ellipse(152, 158, 11, mh, 0, 0, TAU);
  ctx.fillStyle = '#1a0f0d';
  ctx.fill();
  const flick = 0.35 + 0.25 * Math.sin(t * 9) + 0.1 * Math.sin(t * 23);
  ctx.beginPath();
  ctx.ellipse(152, 157.5, 8, Math.max(0.3, mh * 0.6), 0, 0, TAU);
  ctx.fillStyle = `rgba(220,232,214,${clamp(flick, 0, 0.8)})`;
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = INK;
  ctx.beginPath();
  ctx.ellipse(152, 158, 11, mh, 0, 0, TAU);
  ctx.stroke();

  // Notification rings expanding from the mouth
  for (const r of rings) {
    const age = (t - r) / 2.4;
    const rad = 4 + age * 26;
    ctx.beginPath();
    ctx.ellipse(152, 158, rad, rad * 0.5, 0, 0, TAU);
    ctx.strokeStyle = `rgba(40,60,70,${(1 - age) * 0.45})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  ctx.restore();
}

const t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  const active = P.has && (now - P.t) < 5000;
  let gx, gy;
  if (active) {
    gx = P.x; gy = P.y;
  } else {
    gx = 150 + Math.sin(t * 0.31) * 130;
    gy = 190 + Math.cos(t * 0.19) * 90;
  }
  L.x += (gx - L.x) * 0.06;
  L.y += (gy - L.y) * 0.06;

  const d = Math.hypot(L.x - 152, L.y - 170);
  const near = clamp(1 - d / 170, 0, 1);
  const leanTarget = near - (1 - near) * 0.3;
  L.lean += (leanTarget - L.lean) * 0.05;
  const openTarget = 0.12 + near * 0.8 + 0.08 * Math.sin(t * 2.3);
  L.open += (openTarget - L.open) * 0.06;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  draw(t, L.x, L.y);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
