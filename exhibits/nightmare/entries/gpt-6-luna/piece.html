<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .ink {
    stroke: #342d28;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .fine {
    fill: none;
    stroke: #443831;
    stroke-width: 1.3;
    stroke-linecap: round;
    opacity: .78;
  }
  .hatch {
    fill: none;
    stroke: #463a32;
    stroke-width: 1;
    stroke-linecap: round;
    opacity: .55;
  }
  .wing-vein {
    fill: none;
    stroke: #59483d;
    stroke-width: 1.2;
    stroke-linecap: round;
    opacity: .72;
  }
  #torso {
    transform-box: fill-box;
    transform-origin: 50% 44%;
    animation: breathe 5.8s ease-in-out infinite;
  }
  #mantle {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: mantle 7s ease-in-out infinite;
  }
  #head {
    transform-box: fill-box;
    transform-origin: 50% 75%;
    animation: listen 6.4s ease-in-out infinite;
  }
  .finger-twitch {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: twitch 4.7s ease-in-out infinite;
  }
  .blink {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: blink 6.3s infinite;
  }
  .blink.second { animation-delay: 1.1s; }
  .blink.third { animation-delay: 2.4s; }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    48% { transform: scale(1.018, 1.025); }
  }
  @keyframes mantle {
    0%, 100% { transform: rotate(0deg); }
    48% { transform: rotate(-.8deg); }
    78% { transform: rotate(.45deg); }
  }
  @keyframes listen {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    38% { transform: rotate(1deg) translateY(1px); }
    72% { transform: rotate(-.8deg) translateY(-1px); }
  }
  @keyframes twitch {
    0%, 78%, 100% { transform: rotate(0); }
    82% { transform: rotate(3deg); }
    86% { transform: rotate(-1deg); }
  }
  @keyframes blink {
    0%, 89%, 93%, 100% { transform: scaleY(1); }
    91% { transform: scaleY(.12); }
  }
</style>
</head>

<script>
(() => {
  const svg = document.querySelector("svg");
  const pupils = [
    document.getElementById("pupil-left"),
    document.getElementById("pupil-right"),
    document.getElementById("pupil-top")
  ];
  let targetX = 0, targetY = 0, x = 0, y = 0;

  function point(event) {
    const box = svg.getBoundingClientRect();
    targetX = ((event.clientX - box.left) / box.width - 0.5) * 2;
    targetY = ((event.clientY - box.top) / box.height - 0.5) * 2;
    targetX = Math.max(-1, Math.min(1, targetX));
    targetY = Math.max(-1, Math.min(1, targetY));
  }
  document.addEventListener("pointermove", point, { passive: true });
  document.addEventListener("pointerleave", () => {
    targetX = 0;
    targetY = 0;
  }, { passive: true });

  function drift() {
    x += (targetX - x) * 0.035;
    y += (targetY - y) * 0.035;
    const dx = x * 2.6;
    const dy = y * 2.2;
    pupils[0].setAttribute("transform", `translate(${dx} ${dy})`);
    pupils[1].setAttribute("transform", `translate(${dx} ${dy})`);
    pupils[2].setAttribute("transform", `translate(${dx * 0.65} ${dy * 0.65})`);
    requestAnimationFrame(drift);
  }
  drift();
})();
</script>
