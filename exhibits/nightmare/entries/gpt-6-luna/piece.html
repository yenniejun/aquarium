<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }
  body { display: grid; place-items: center; }
  svg {
    display: block;
    width: 100vw;
    height: 100vh;
    overflow: visible;
  }
  .wash { stroke-linejoin: round; stroke-linecap: round; }
  .ink { fill: none; stroke: #40372f; stroke-linecap: round; stroke-linejoin: round; }
  .fine { fill: none; stroke: #51473b; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .scratch { fill: none; stroke: #51473b; stroke-width: 1; opacity: .48; stroke-linecap: round; }
  #breath {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: breathe 5.8s ease-in-out infinite;
  }
  #head {
    transform-box: fill-box;
    transform-origin: 50% 85%;
    animation: watch 7s ease-in-out infinite;
  }
  #wingL, #wingR {
    transform-box: fill-box;
    transform-origin: 80% 20%;
    animation: wing 6.4s ease-in-out infinite;
  }
  #wingR { transform-origin: 20% 20%; animation-delay: -1.4s; }
  #reach {
    transform-box: fill-box;
    transform-origin: 20% 10%;
    animation: reach 4.8s ease-in-out infinite;
  }
  #lid { animation: blink 6.9s steps(1,end) infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    48% { transform: scale(1.012, 1.025); }
  }
  @keyframes watch {
    0%, 100% { transform: rotate(-1deg) translateY(0); }
    45% { transform: rotate(1.4deg) translateY(2px); }
    72% { transform: rotate(.2deg) translateY(-1px); }
  }
  @keyframes wing {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    50% { transform: rotate(-1deg) scaleY(1.012); }
  }
  @keyframes reach {
    0%, 100% { transform: rotate(0deg); }
    40% { transform: rotate(-1.3deg); }
    76% { transform: rotate(.5deg); }
  }
  @keyframes blink {
    0%, 91%, 94%, 100% { opacity: 0; }
    92%, 93% { opacity: .94; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <linearGradient id="wingWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#849087" stop-opacity=".38"/>
      <stop offset=".52" stop-color="#b0a18b" stop-opacity=".31"/>
      <stop offset="1" stop-color="#735f50" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="bodyWash" x1=".1" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#a8a090" stop-opacity=".55"/>
      <stop offset=".52" stop-color="#776b5e" stop-opacity=".42"/>
      <stop offset="1" stop-color="#51483f" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="faceWash" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#b9b29f" stop-opacity=".68"/>
      <stop offset="1" stop-color="#82786a" stop-opacity=".4"/>
    </linearGradient>
    <radialGradient id="eyeWash">
      <stop offset="0" stop-color="#201f1c"/>
      <stop offset=".38" stop-color="#403a32"/>
      <stop offset=".72" stop-color="#a17b58"/>
      <stop offset="1" stop-color="#ded0b3"/>
    </radialGradient>
  </defs>

    <path d="M149 724l-18 5m302-9 25 8M235 728l-12 4m103-6 15 5"/>

    <ellipse id="pupil" cx="301" cy="133" rx="5.4" ry="8" fill="#171817"/>

    <!-- Uneven stacked plates, like a filing cabinet grown into a rib cage. -->

    <g class="fine" opacity=".84">

    <path class="ink" stroke-width="2" d="M276 435q25 22 51 0m-39 20q12 7 24 0"/>
    <path class="fine" d="M286 477q15 10 30 0m-25 15q11 5 21 0m-20 17q11 4 20 0"/>
  </g>

  <!-- Long arms, bony joints and almost-human hands. -->
  <g class="ink" stroke-width="5">
    <path d="M250 247C221 267 197 300 174 337C157 363 145 391 124 418"/>
    <path d="M350 244C383 259 412 286 434 316C452 341 461 372 477 401"/>

  <g fill="#9e9483" fill-opacity=".44" stroke="#463d34" stroke-width="2">
    <ellipse cx="174" cy="337" rx="11" ry="15" transform="rotate(34 174 337)"/>

    <circle cx="124" cy="418" r="9"/><circle cx="477" cy="401" r="9"/>

  <g class="fine" opacity=".7">

  <!-- Pelvis and limbs, too spindly to carry the upper body. -->

  </g>
</svg>
<script>
  const pupil = document.getElementById('pupil');
  const svg = document.querySelector('svg');

  window.addEventListener('pointermove', event => {
    const point = svg.createSVGPoint();
    point.x = event.clientX;
    point.y = event.clientY;
    const cursor = point.matrixTransform(svg.getScreenCTM().inverse());
    const dx = Math.max(-7, Math.min(7, (cursor.x - 301) * 0.035));
    const dy = Math.max(-4, Math.min(4, (cursor.y - 133) * 0.025));
    pupil.setAttribute('cx', 301 + dx);
    pupil.setAttribute('cy', 133 + dy);
  }, { passive: true });
</script>
</body>
</html>
