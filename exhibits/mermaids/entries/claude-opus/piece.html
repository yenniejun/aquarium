<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}
canvas{display:block;width:100%;height:100%;background:transparent}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=1,H=1,dpr=1,S=1,OX=0,OY=0;
const DH=400/3;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth||innerWidth;H=cv.clientHeight||innerHeight;
  cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr));
  S=Math.min(W/100,H/DH);OX=(W-100*S)/2;OY=(H-DH*S)/2;
}
addEventListener('resize',resize);resize();

const ptr={x:50,y:60,last:-1e9};
function onPtr(e){
  const r=cv.getBoundingClientRect();
  ptr.x=((e.clientX-r.left)-OX)/S;ptr.y=((e.clientY-r.top)-OY)/S;ptr.last=performance.now();
}
addEventListener('pointermove',onPtr,{passive:true});
addEventListener('pointerdown',onPtr,{passive:true});

let sd=11;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
const dots=[];for(let i=0;i<130;i++)dots.push({u:rnd()*2-1,v:-0.33+rnd()*1.33,s:rnd(),r:0.35+rnd()*0.55});
const specks=[];for(let i=0;i<40;i++)specks.push({u:(rnd()<.5?-1:1)*(0.55+rnd()*0.4),v:0.05+rnd()*0.9,s:rnd()*6});

let T=0,PH=0,ex=0,hb=20,tilt=0,lastT=0;
const SK='hsl(14,48%,85%)',SK0='hsla(14,48%,85%,0)',SKD='hsl(8,30%,62%)';
const HAIR='#34202b';

const mw=v=>6+8*Math.pow(Math.max(0,Math.sin(Math.PI*v)),0.9)-2*v;
const my=v=>60+44*v;
const mc=v=>50+Math.sin(T*1.1-v*3)*1.6*v*v;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

function smooth(p,closed){
  ctx.beginPath();
  if(closed){
    const n=p.length;
    ctx.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);
    for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
    ctx.closePath();
  }else{
    ctx.moveTo(p[0][0],p[0][1]);
    for(let i=1;i<p.length-1;i++){const a=p[i],b=p[i+1];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
    const l=p[p.length-1];ctx.lineTo(l[0],l[1]);
  }
}

function headT(){ctx.translate(50,37.5);ctx.rotate(tilt);ctx.translate(0,-7.5);}
function headToWorld(x,y){
  const c=Math.cos(tilt),s=Math.sin(tilt),ly=y-7.5;
  return [50+x*c-ly*s,37.5+x*s+ly*c];
}

function bodyPts(){
  const T0=[[37,2.7],[39.6,3.3],[41.2,7.2],[43.5,8.3],[47.5,7.3],[52.5,5.7],[57,5.9]];
  const L=[],R=[];
  for(const [y,w] of T0){L.push([50-w,y]);R.push([50+w,y]);}
  for(let i=0;i<=16;i++){const v=i/16,x=mc(v),y=my(v),w=mw(v);L.push([x-w,y]);R.push([x+w,y]);}
  const p=L.slice();p.push([mc(1),my(1)+2.5]);
  for(let i=R.length-1;i>=0;i--)p.push(R[i]);
  return p;
}

function backHair(){
  ctx.save();headT();
  ctx.fillStyle=HAIR;
  ctx.beginPath();ctx.ellipse(0,4,6.6,9,0,0,Math.PI*2);ctx.fill();
  ctx.lineCap='round';
  const n=15,tips=[];
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<n;i++){
      const f=i/(n-1),a=Math.PI+0.35+f*(Math.PI-0.7);
      const rx=Math.cos(a)*5.4,ry=Math.sin(a)*6.2;
      const sw=Math.sin(T*0.9+i*0.7)*1.6;
      const tx=-8.5+f*19+sw,ty=16+Math.sin(f*Math.PI)*5+Math.sin(T*0.7+i)*0.8;
      ctx.beginPath();ctx.moveTo(rx,ry);
      ctx.bezierCurveTo(rx*1.9,ry*0.6+1,tx*0.8+sw*0.5,ty*0.45,tx,ty);
      if(pass===0){ctx.strokeStyle=HAIR;ctx.lineWidth=2.6;tips.push([tx,ty,i]);}
      else{ctx.strokeStyle='rgba(175,125,160,0.35)';ctx.lineWidth=0.35;}
      ctx.stroke();
    }
  }
  for(const [x,y,i] of tips){
    for(let k=0;k<2;k++){
      const ph=(T*0.35+i*0.13+k*0.5)%1;
      ctx.fillStyle=`rgba(52,32,43,${0.28*(1-ph)})`;
      ctx.beginPath();ctx.arc(x+Math.sin(i+k*2+T*0.5)*ph*1.6,y+ph*2.2,0.7+ph*1.4,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

function fins(){
  for(const s of [-1,1]){
    const out=[],inn=[];
    for(let i=0;i<=24;i++){
      const v=0.06+i/24*0.9,e=mw(v);
      const f=4.4*Math.sin(Math.PI*(v-0.06)/0.9)*(0.72+0.28*Math.sin(v*30-T*5+s));
      const x=mc(v),y=my(v);
      inn.push([x+s*(e-0.6),y]);
      out.push([x+s*(e+f),y+Math.sin(v*30-T*5)*0.6]);
    }
    ctx.beginPath();ctx.moveTo(out[0][0],out[0][1]);
    for(const p of out)ctx.lineTo(p[0],p[1]);
    for(let i=inn.length-1;i>=0;i--)ctx.lineTo(inn[i][0],inn[i][1]);
    ctx.closePath();
    ctx.fillStyle=`hsla(${hb+15},55%,62%,0.45)`;ctx.fill();
    ctx.strokeStyle=`hsla(${hb+20},60%,55%,0.25)`;ctx.lineWidth=0.2;
    ctx.beginPath();
    for(let i=1;i<out.length-1;i+=2){ctx.moveTo(inn[i][0],inn[i][1]);ctx.lineTo(out[i][0],out[i][1]);}
    ctx.stroke();
    ctx.beginPath();ctx.moveTo(out[0][0],out[0][1]);for(const p of out)ctx.lineTo(p[0],p[1]);
    ctx.strokeStyle=`hsla(${hb+30},75%,88%,0.75)`;ctx.lineWidth=0.35;ctx.stroke();
  }
}

function tentacles(){
  const bx=mc(1),by=my(0.96);
  ctx.lineCap='round';
  const order=[3,6,0,9,1,8,2,7,4,5];
  for(const i of order){
    const o=i-4.5,long=(i===3||i===6);
    let x=bx+o*0.8,y=by,a=Math.PI/2+o*0.14;
    const n=long?14:10,sg=long?1.5:1.2;
    const pts=[[x,y]];
    for(let k=0;k<n;k++){
      a+=Math.sin(T*1.4+i*1.3-k*0.5)*0.12+(k>n*0.55?Math.sign(o)*0.13:0);
      x+=Math.cos(a)*sg;y+=Math.sin(a)*sg;pts.push([x,y]);
    }
    for(let k=0;k<n;k++){
      const f=k/n;
      let w=long?(0.8*(1-f*0.6)+(f>0.72?0.45:0)):1.6*(1-f*0.85);
      ctx.strokeStyle=`hsl(${hb+5},${40+f*10}%,${long?40+f*12:33+f*16}%)`;
      ctx.lineWidth=w;
      ctx.beginPath();ctx.moveTo(pts[k][0],pts[k][1]);ctx.lineTo(pts[k+1][0],pts[k+1][1]);ctx.stroke();
    }
  }
}

function body(){
  const p=bodyPts();
  smooth(p,true);ctx.save();ctx.clip();
  ctx.fillStyle=SK;ctx.fillRect(30,34,40,80);
  const g=ctx.createLinearGradient(0,44,0,106);
  g.addColorStop(0,`hsl(${hb},38%,54%)`);g.addColorStop(1,`hsl(${hb+8},45%,28%)`);
  ctx.fillStyle=g;ctx.fillRect(30,43,40,70);
  for(let j=0;j<8;j++){
    const y=44+((j*9+PH*9)%72);
    const bg=ctx.createLinearGradient(0,y-2,0,y+2);
    bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(0.5,`hsla(${hb+10},50%,16%,0.32)`);bg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bg;ctx.fillRect(30,y-2,40,4);
  }
  for(const d of dots){
    let x,y;
    if(d.v>=0){x=mc(d.v)+d.u*mw(d.v)*0.92;y=my(d.v);}else{x=50+d.u*6.4;y=60+d.v*48;}
    const k=Math.max(0,Math.sin(d.v*9-PH*2.5+d.u*1.5+d.s*6));
    const r=d.r*(0.3+0.7*k);
    ctx.fillStyle=d.s>0.72?`hsla(${hb+35},80%,64%,0.85)`:`hsla(${hb+25+d.s*40},60%,${18+d.s*18}%,0.85)`;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  for(const s of specks){
    const a=0.25+0.5*Math.max(0,Math.sin(T*2+s.s));
    ctx.fillStyle=`hsla(${185+ex*20},80%,88%,${a})`;
    ctx.beginPath();ctx.arc(mc(s.v)+s.u*mw(s.v)*0.95,my(s.v),0.25,0,Math.PI*2);ctx.fill();
  }
  const f=ctx.createLinearGradient(0,44.5,0,51);
  f.addColorStop(0,SK);f.addColorStop(1,SK0);
  ctx.fillStyle=f;ctx.fillRect(30,34,40,17);
  const sh=ctx.createLinearGradient(37,0,63,0);
  sh.addColorStop(0,'rgba(70,30,50,0.32)');sh.addColorStop(0.3,'rgba(70,30,50,0)');
  sh.addColorStop(0.45,'rgba(255,255,255,0.09)');sh.addColorStop(0.6,'rgba(70,30,50,0)');
  sh.addColorStop(1,'rgba(70,30,50,0.34)');
  ctx.fillStyle=sh;ctx.fillRect(30,34,40,80);
  ctx.restore();
  ctx.strokeStyle='rgba(120,60,70,0.28)';ctx.lineWidth=0.22;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(46,42);ctx.quadraticCurveTo(48,42.6,49.3,42.2);
  ctx.moveTo(54,42);ctx.quadraticCurveTo(52,42.6,50.7,42.2);ctx.stroke();
  smooth(p,true);ctx.strokeStyle='rgba(60,25,40,0.28)';ctx.lineWidth=0.3;ctx.stroke();
}

function limb(a,b,c,w1,w2){
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=SKD;
  ctx.lineWidth=w1+0.5;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  ctx.lineWidth=w2+0.5;ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
  ctx.strokeStyle=SK;
  ctx.lineWidth=w1;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  ctx.lineWidth=w2;ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
}
function hand(x,y,rot,rx,ry){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle=SK;ctx.fill();ctx.strokeStyle=SKD;ctx.lineWidth=0.25;ctx.stroke();
  ctx.strokeStyle='rgba(150,90,90,0.45)';ctx.lineWidth=0.18;ctx.beginPath();
  for(let k=-1;k<=1;k++){ctx.moveTo(-rx*0.5,k*ry*0.3);ctx.lineTo(rx*0.6,k*ry*0.3+0.1);}
  ctx.stroke();ctx.restore();
}

function scrollAndArm(){
  const H2=[54+Math.sin(T*0.6)*0.4,52.6+Math.sin(T*0.8)*0.3];
  const E2=[62+Math.sin(T*0.7)*0.3,49];
  limb([57.4,41.8],E2,H2,3.1,2.5);
  ctx.save();ctx.translate(H2[0]+1.3,H2[1]-0.3);ctx.rotate(-0.3);
  const pulse=0.6+0.4*Math.sin(T*1.7);
  const gl=ctx.createRadialGradient(0,0,0,0,0,6.5);
  gl.addColorStop(0,`rgba(255,232,170,${0.42*pulse+0.15*ex})`);gl.addColorStop(1,'rgba(255,232,170,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,6.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#efe2c4';ctx.fillRect(-2.6,-0.75,5.2,1.5);
  ctx.fillStyle='#d9c69e';
  ctx.beginPath();ctx.ellipse(-2.6,0,0.38,0.75,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(2.6,0,0.38,0.75,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='hsl(8,70%,58%)';ctx.fillRect(0.4,-0.82,0.55,1.64);
  ctx.strokeStyle='hsl(8,70%,58%)';ctx.lineWidth=0.25;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0.7,0.8);ctx.quadraticCurveTo(0.4+Math.sin(T*2)*0.3,1.8,0.9,2.5);
  ctx.moveTo(0.7,0.8);ctx.quadraticCurveTo(1.4,1.6,1.3+Math.sin(T*2+1)*0.3,2.3);ctx.stroke();
  ctx.restore();
  hand(H2[0],H2[1],0.2,1.35,1.1);
}

function eye(x,y,gx,gy,open){
  ctx.save();ctx.translate(x,y);
  const path=()=>{ctx.beginPath();ctx.moveTo(-1.25,0);ctx.quadraticCurveTo(0,-1.25*open,1.25,0);ctx.quadraticCurveTo(0,1.0*open,-1.25,0);};
  path();ctx.fillStyle='#fbf3ea';ctx.fill();
  ctx.save();ctx.clip();
  const ix=gx*0.42,iy=gy*0.28;
  const ig=ctx.createRadialGradient(ix,iy,0.1,ix,iy,0.8);
  ig.addColorStop(0,'hsl(48,90%,68%)');ig.addColorStop(1,'hsl(32,75%,38%)');
  ctx.fillStyle=ig;ctx.beginPath();ctx.arc(ix,iy,0.8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#1d1018';ctx.lineWidth=0.24;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(ix-0.45,iy-0.15);ctx.lineTo(ix-0.22,iy+0.22);ctx.lineTo(ix,iy-0.04);ctx.lineTo(ix+0.22,iy+0.22);ctx.lineTo(ix+0.45,iy-0.15);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(ix+0.28,iy-0.32,0.16,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.beginPath();ctx.moveTo(-1.3,0.05);ctx.quadraticCurveTo(0,-1.3*open,1.3,0.05);
  ctx.strokeStyle='#3a2230';ctx.lineWidth=0.32;ctx.stroke();
  const sx=x<0?-1:1;
  ctx.beginPath();ctx.moveTo(sx*1.2,-0.05);ctx.lineTo(sx*1.65,-0.45);ctx.lineWidth=0.22;ctx.stroke();
  ctx.restore();
}

function head(gx,gy,open){
  ctx.save();headT();
  const hg=ctx.createRadialGradient(-1.5,-1.5,1,0,0,7);
  hg.addColorStop(0,'hsl(16,55%,90%)');hg.addColorStop(1,'hsl(10,38%,74%)');
  ctx.beginPath();ctx.ellipse(0,0,5.3,6.3,0,0,Math.PI*2);
  ctx.fillStyle=hg;ctx.fill();ctx.strokeStyle='rgba(90,40,50,0.25)';ctx.lineWidth=0.25;ctx.stroke();
  for(const s of [-1,1]){
    const bl=ctx.createRadialGradient(s*3,2.6,0,s*3,2.6,1.8);
    bl.addColorStop(0,`hsla(${hb-5},70%,68%,${0.35+ex*0.25})`);bl.addColorStop(1,`hsla(${hb-5},70%,68%,0)`);
    ctx.fillStyle=bl;ctx.beginPath();ctx.arc(s*3,2.6,1.8,0,Math.PI*2);ctx.fill();
    for(let k=0;k<4;k++){
      const r=0.14+0.14*Math.max(0,Math.sin(PH*3+k*1.7+s));
      ctx.fillStyle=`hsla(${hb+25},60%,35%,0.7)`;
      ctx.beginPath();ctx.arc(s*(2.3+k*0.45),2.2+(k%2)*0.5,r,0,Math.PI*2);ctx.fill();
    }
  }
  eye(-2.1,0.5,gx,gy,open);eye(2.1,0.5,gx,gy,open);
  const lift=-ex*0.35;
  ctx.strokeStyle='#3a2230';ctx.lineWidth=0.3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-3.2,-1.4+lift);ctx.quadraticCurveTo(-2.1,-2.2+lift,-1.0,-1.7+lift);
  ctx.moveTo(3.2,-1.4+lift);ctx.quadraticCurveTo(2.1,-2.2+lift,1.0,-1.7+lift);ctx.stroke();
  ctx.strokeStyle='rgba(120,60,60,0.45)';ctx.lineWidth=0.22;
  ctx.beginPath();ctx.moveTo(0.2,1.4);ctx.quadraticCurveTo(0.7,2.6,0,2.8);ctx.stroke();
  ctx.strokeStyle='hsl(350,45%,45%)';ctx.lineWidth=0.32;
  ctx.beginPath();ctx.moveTo(-1.1,3.9);ctx.quadraticCurveTo(0,4.5+ex*0.5,1.1,3.9);ctx.stroke();
  ctx.fillStyle=HAIR;
  ctx.beginPath();ctx.ellipse(0,-0.6,5.9,6.5,0,Math.PI*1.03,Math.PI*1.97);
  ctx.quadraticCurveTo(3.5,-4.6,0.5,-3.6);ctx.quadraticCurveTo(-3,-4.7,-5.87,-1.21);ctx.fill();
  ctx.strokeStyle=HAIR;ctx.lineCap='round';
  const s1=Math.sin(T*0.9)*0.8;
  ctx.lineWidth=1.1;
  ctx.beginPath();ctx.moveTo(-0.5,-6);ctx.quadraticCurveTo(-3.5,-4.5,-4.8,-1.5);
  ctx.moveTo(1.5,-6);ctx.quadraticCurveTo(4.2,-4.5,5.0,-1.2);ctx.stroke();
  for(const [w,c] of [[2.4,HAIR],[1.3,HAIR],[0.35,'rgba(175,125,160,0.45)']]){
    ctx.lineWidth=w;ctx.strokeStyle=c;
    ctx.beginPath();ctx.moveTo(4.2,-3.5);ctx.bezierCurveTo(8.5,1,4.5+s1,9,6.6+s1*1.3,17);ctx.stroke();
  }
  ctx.strokeStyle='rgba(175,125,160,0.4)';ctx.lineWidth=0.3;
  ctx.beginPath();ctx.ellipse(0,-0.6,5.4,6.0,0,Math.PI*1.25,Math.PI*1.55);ctx.stroke();
  ctx.restore();
}

function raisedArm(){
  const ear=headToWorld(-5.3,0.6);
  const Hn=[ear[0]-0.6,ear[1]+0.8];
  const E=[35.6+Math.sin(T*0.7)*0.4,36.8+Math.sin(T*0.5)*0.3];
  limb([42.6,41.8],E,Hn,3.1,2.5);
  hand(Hn[0],Hn[1],-0.5+tilt,1.3,1.75);
}

function frame(now){
  const t=now/1000;
  const dt=Math.min(0.05,Math.max(0,t-(lastT||t)));lastT=t;T=t;
  const act=(now-ptr.last)<2500?1:0;
  ex+=(act-ex)*Math.min(1,dt*1.8);
  PH+=dt*(1+ex*1.6);
  const base=18+22*Math.sin(t*0.13);
  hb=base+(195-base)*ex*0.85;
  tilt=-0.1+Math.sin(t*0.37)*0.06;

  let wx=Math.sin(t*0.31)*0.7,wy=Math.sin(t*0.23)*0.4;
  const glance=clamp((Math.sin(t*0.21)-0.55)*4,0,1);
  wx=wx+(0.5-wx)*glance;wy=wy+(1-wy)*glance;
  const px=clamp((ptr.x-50)/22,-1,1),py=clamp((ptr.y-30)/22,-1,1);
  const gx=wx+(px-wx)*ex,gy=wy+(py-wy)*ex;
  const bc=t%4.6;const open=bc<0.16?Math.abs(bc-0.08)/0.08:1;

  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*S,0,0,dpr*S,dpr*OX,dpr*OY);
  const bob=Math.sin(t*0.8)*1.1,sw=Math.sin(t*0.5)*0.035;
  ctx.translate(50,70);ctx.rotate(sw);ctx.translate(-50,-70+bob);

  backHair();
  fins();
  tentacles();
  body();
  scrollAndArm();
  head(gx,gy,Math.max(0.08,open));
  raisedArm();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
