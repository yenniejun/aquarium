<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=1;
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const w=Math.max(60,Math.min(vw,vh*0.75)),h=w*4/3;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  S=cv.width/300;
}
window.addEventListener('resize',resize);
resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>t*t*(3-2*t);
const TAU=Math.PI*2;
const OUT='rgba(30,18,50,0.55)';

/* pointer */
let ptr=null,ptrT=-99;
window.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect();
  ptr={x:clamp((e.clientX-(r.left+r.width*0.5))/(r.width*0.5),-1,1),
       y:clamp((e.clientY-(r.top+r.height*0.3))/(r.height*0.5),-1,1)};
  ptrT=performance.now()/1000;
},{passive:true});
document.addEventListener('pointerleave',()=>{ptr=null;});

/* body width profile */
const WK=[[0,7],[0.04,18],[0.12,14.5],[0.2,11],[0.3,16],[0.42,14.5],[0.6,10],[0.8,6],[1,2.5]];
function widthAt(t){
  for(let i=1;i<WK.length;i++){
    if(t<=WK[i][0]){
      const a=WK[i-1],b=WK[i];
      return lerp(a[1],b[1],sstep((t-a[0])/(b[0]-a[0])));
    }
  }
  return WK[WK.length-1][1];
}

let T=0;
const N=40;
let sp=[];
function spineAt(t){
  const a=2+24*Math.pow(t,1.5);
  const x=150+8*Math.sin(t*2.6+0.4)+a*Math.sin(T*1.5-t*4.2)+4*Math.sin(T*0.5)*t;
  const y=138+t*172+3*Math.sin(T*0.8);
  return {x,y};
}
function buildSpine(){
  sp=[];
  for(let i=0;i<=N;i++){
    const t=i/N,p=spineAt(t);
    sp.push({t,x:p.x,y:p.y,w:widthAt(t),nx:0,ny:0,tx:0,ty:1});
  }
  for(let i=0;i<=N;i++){
    const a=sp[Math.max(0,i-1)],b=sp[Math.min(N,i+1)];
    let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||1;
    dx/=d;dy/=d;
    sp[i].tx=dx;sp[i].ty=dy;sp[i].nx=-dy;sp[i].ny=dx;
  }
}
function getAt(t){
  const f=clamp(t,0,1)*N;
  const i=Math.min(Math.floor(f),N-1),u=f-i;
  const a=sp[i],b=sp[i+1];
  return {x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u),nx:lerp(a.nx,b.nx,u),ny:lerp(a.ny,b.ny,u),
          tx:lerp(a.tx,b.tx,u),ty:lerp(a.ty,b.ty,u),w:lerp(a.w,b.w,u)};
}
function edge(t,s,extra){
  const q=getAt(t),w=q.w+(extra||0);
  return {x:q.x+q.nx*s*w,y:q.y+q.ny*s*w};
}

/* head frame */
let Hd={x:150,y:121},tilt=0,cs=1,sn=0;
function hw(lx,ly){return {x:Hd.x+lx*cs-ly*sn,y:Hd.y+lx*sn+ly*cs};}

/* gaze, blink, song */
const look={x:0,y:0};
let blinkStart=-10,nextBlink=2,blink=0;
let songEnv=0,waveEnv=0;

/* hair */
function rnd(a,b){return a+Math.random()*(b-a);}
const strands=[];
for(let k=0;k<12;k++){
  const ax=-12+k*(24/11);
  strands.push({front:false,ax,ay:-7+Math.abs(ax)*0.12,n:17,seg:rnd(5.4,6.2),wmax:7.5,
    flare:ax/12,k:0.025,ph:rnd(0,6.28),hl:k%4===0,nodes:[],init:false,
    cv:rnd(-14,14)});
}
for(const s of [1,-1]){
  strands.push({front:true,side:s,ax:s*12.5,ay:-2,n:12,seg:5,wmax:6,flare:0,k:0.06,
    ph:rnd(0,6.28),hl:true,nodes:[],init:false,cv:0});
}
function restOf(st,i){
  if(st.front){
    return hw(st.side*(13-0.3*i+1.2*Math.sin(i*0.5)),st.ay+i*st.seg*0.95);
  }
  return hw(st.ax*(1+0.05*i)+st.flare*i*0.9,st.ay+i*st.seg*0.92);
}
function stepStrand(st,f){
  const n=st.n;
  if(!st.init){
    for(let i=0;i<=n;i++){const r=restOf(st,i);st.nodes.push({x:r.x,y:r.y,px:r.x,py:r.y});}
    st.init=true;
  }
  const a=hw(st.ax,st.ay);
  const n0=st.nodes[0];n0.x=a.x;n0.y=a.y;n0.px=a.x;n0.py=a.y;
  for(let i=1;i<=n;i++){
    const nd=st.nodes[i],r=restOf(st,i);
    const fr=i/n;
    const vx=(nd.x-nd.px)*0.88,vy=(nd.y-nd.py)*0.88;
    const cx=(Math.sin(T*1.1+i*0.4+st.ph)*0.4+Math.sin(T*0.6+st.ph*2)*0.18)*fr;
    const cy=(Math.cos(T*0.9+i*0.35+st.ph)*0.16-0.05)*fr;
    nd.px=nd.x;nd.py=nd.y;
    nd.x+=vx+(r.x-nd.x)*st.k*f+cx*f*0.6;
    nd.y+=vy+(r.y-nd.y)*st.k*f+cy*f*0.6;
  }
  for(let i=1;i<=n;i++){
    const p=st.nodes[i-1],nd=st.nodes[i];
    let dx=nd.x-p.x,dy=nd.y-p.y;const d=Math.hypot(dx,dy)||1;
    nd.x=p.x+dx/d*st.seg;nd.y=p.y+dy/d*st.seg;
  }
}
function drawStrand(st){
  const n=st.n,nodes=st.nodes;
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=0;i<n;i++){
    const fr=Math.pow(i/n,1.3);
    const r=Math.round(lerp(38,44,fr)+st.cv*0.3),g=Math.round(lerp(42,150,fr)+st.cv),b=Math.round(lerp(104,160,fr));
    ctx.strokeStyle='rgb('+r+','+g+','+b+')';
    ctx.lineWidth=st.wmax*Math.pow(1-i/n,0.8)+0.9;
    ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[i+1].x,nodes[i+1].y);ctx.stroke();
  }
  if(st.hl){
    ctx.strokeStyle='rgba(120,230,225,0.35)';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(nodes[1].x+1,nodes[1].y);
    for(let i=2;i<n-2;i++)ctx.lineTo(nodes[i].x+1,nodes[i].y);
    ctx.stroke();
  }
}

/* lure bulb */
const bulb={x:172,y:90,vx:0,vy:0};

/* bubbles */
const bubbles=[];
let nextBub=1.5,nextSongBub=0;
function spawnBubble(){
  const m=hw(-3,9.5);
  bubbles.push({x:m.x,y:m.y,x0:m.x,r:rnd(1.4,3.6),ph:rnd(0,6.28),vy:rnd(0.35,0.6),vx:-rnd(0.15,0.4),age:0});
}

/* arms */
function arm(Sh,Tg,a,b){
  const dx=Tg.x-Sh.x,dy=Tg.y-Sh.y;
  const d=clamp(Math.hypot(dx,dy),8,a+b-0.5);
  const base=Math.atan2(dy,dx);
  const A=Math.acos(clamp((a*a+d*d-b*b)/(2*a*d),-1,1));
  return [Sh,{x:Sh.x+Math.cos(base+A)*a,y:Sh.y+Math.sin(base+A)*a},
          {x:Sh.x+Math.cos(base)*d,y:Sh.y+Math.sin(base)*d}];
}
function drawArm(pts){
  const [a,e,h]=pts;
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=OUT;
  ctx.lineWidth=8.6;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(e.x,e.y);ctx.stroke();
  ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(h.x,h.y);ctx.stroke();
  ctx.fillStyle=OUT;ctx.beginPath();ctx.arc(h.x,h.y,4.6,0,TAU);ctx.fill();
  ctx.strokeStyle='#d29268';
  ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(e.x,e.y);ctx.stroke();
  ctx.lineWidth=5.4;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(h.x,h.y);ctx.stroke();
  ctx.fillStyle='#dba073';ctx.beginPath();ctx.arc(h.x,h.y,3.5,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(h.x+(h.x-e.x)*0.12-1,h.y-2.6,1.5,0,TAU);ctx.fill();
}

/* tail fan */
function drawFan(P,ang,sc,alpha,phase,range){
  const M=11,E=[],C=[];
  for(let j=0;j<M;j++){
    const ph=lerp(-range,range,j/(M-1));
    const wob=0.22*Math.sin(T*2.0-j*0.5+phase)*(0.4+Math.abs(ph)/range*0.6);
    const L=sc*(28+22*Math.cos(ph*1.3));
    const a=ang+ph+wob;
    E.push({x:P.x+Math.cos(a)*L,y:P.y+Math.sin(a)*L});
    const ac=ang+ph-0.16*Math.sin(T*2.0-j*0.5+phase+1);
    C.push({x:P.x+Math.cos(ac)*L*0.55,y:P.y+Math.sin(ac)*L*0.55});
  }
  const far=sc*50;
  const g=ctx.createLinearGradient(P.x,P.y,P.x+Math.cos(ang)*far,P.y+Math.sin(ang)*far);
  g.addColorStop(0,'rgba(44,130,175,'+alpha+')');
  g.addColorStop(0.5,'rgba(130,100,200,'+(alpha*0.8)+')');
  g.addColorStop(1,'rgba(255,145,120,'+(alpha*0.5)+')');
  ctx.beginPath();ctx.moveTo(P.x,P.y);
  ctx.quadraticCurveTo(C[0].x,C[0].y,E[0].x,E[0].y);
  for(let j=0;j<M-1;j++){
    const mx=(E[j].x+E[j+1].x)/2,my=(E[j].y+E[j+1].y)/2;
    ctx.quadraticCurveTo(lerp(mx,P.x,0.14),lerp(my,P.y,0.14),E[j+1].x,E[j+1].y);
  }
  ctx.quadraticCurveTo(C[M-1].x,C[M-1].y,P.x,P.y);
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(255,236,222,0.42)';ctx.lineWidth=0.6;
  ctx.beginPath();
  for(let j=0;j<M;j++){ctx.moveTo(P.x,P.y);ctx.quadraticCurveTo(C[j].x,C[j].y,E[j].x,E[j].y);}
  ctx.stroke();
}

function ear(s){
  ctx.save();
  ctx.translate(s*11.5,2);ctx.scale(s,1);ctx.rotate(0.1*Math.sin(T*2.4+s));
  const g=ctx.createLinearGradient(0,0,17,0);
  g.addColorStop(0,'rgba(60,150,170,0.9)');g.addColorStop(1,'rgba(255,150,120,0.6)');
  ctx.beginPath();ctx.moveTo(0,-5);
  ctx.quadraticCurveTo(9,-12,17,-8);ctx.quadraticCurveTo(13,-3,16,1);
  ctx.quadraticCurveTo(10,1,15,7);ctx.quadraticCurveTo(7,6,0,4);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(255,235,220,0.55)';ctx.lineWidth=0.6;
  ctx.beginPath();ctx.moveTo(0,-0.5);ctx.lineTo(17,-8);ctx.moveTo(0,0);ctx.lineTo(16,1);ctx.moveTo(0,1);ctx.lineTo(15,7);ctx.stroke();
  ctx.restore();
}

function eye(ex,ey,s){
  ctx.save();ctx.translate(ex,ey);ctx.scale(1,Math.max(0.1,1-blink));
  ctx.fillStyle='#f4ede2';ctx.beginPath();ctx.ellipse(0,0,3.6,4.2,0,0,TAU);ctx.fill();
  const ix=look.x*1.0,iy=look.y*1.0+0.2;
  ctx.fillStyle='#2b7f8f';ctx.beginPath();ctx.ellipse(ix,iy,2.7,3.1,0,0,TAU);ctx.fill();
  ctx.fillStyle='#0d0b22';ctx.beginPath();ctx.ellipse(ix,iy,1.5,1.8,0,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ix+0.9,iy-1.2,0.9,0,TAU);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#2a1630';ctx.lineWidth=1;ctx.lineCap='round';
  ctx.beginPath();ctx.ellipse(ex,ey,3.7,Math.max(0.3,4.3*(1-blink)),0,Math.PI,TAU);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ex+s*3.5,ey-0.6);ctx.lineTo(ex+s*5.4,ey-2.2);ctx.stroke();
}

function frame(ms){
  const now=ms/1000;
  let dt=T===0?0.016:clamp(now-T,0.001,0.05);
  T=now;
  const f=dt*60;

  /* gaze */
  let tx,ty;
  if(ptr&&T-ptrT<5){tx=ptr.x;ty=ptr.y;}
  else{tx=0.7*Math.sin(T*0.37)+0.3*Math.sin(T*0.91);ty=0.25*Math.sin(T*0.53+1);}
  const k=Math.min(1,dt*4);
  look.x+=(tx-look.x)*k;look.y+=(ty-look.y)*k;

  if(T>nextBlink){blinkStart=T;nextBlink=T+rnd(2.2,5);}
  const bt=T-blinkStart;
  blink=bt<0.16?Math.sin(Math.PI*bt/0.16):0;

  const cs9=T%9;
  songEnv=cs9<2.6?Math.pow(Math.sin(Math.PI*cs9/2.6),0.7):0;
  const cw=T%13,u=(cw-10.2)/2.8;
  waveEnv=(u>0&&u<1)?Math.sin(Math.PI*u):0;

  buildSpine();
  const s0=sp[0];
  Hd={x:s0.x-s0.tx*17,y:s0.y-s0.ty*17};
  tilt=-Math.atan2(s0.tx,s0.ty)*0.7+look.x*0.08+0.04*Math.sin(T*0.7)+songEnv*0.05*Math.sin(T*3);
  cs=Math.cos(tilt);sn=Math.sin(tilt);

  for(const st of strands)stepStrand(st,f);

  const bt0=hw(23+look.x*5,-31+look.y*4);
  bulb.vx+=((bt0.x-bulb.x)*0.05-bulb.vx*0.1+Math.sin(T*1.7)*0.02)*f;
  bulb.vy+=((bt0.y-bulb.y)*0.05-bulb.vy*0.1+Math.cos(T*1.3)*0.02)*f;
  bulb.x+=bulb.vx*f;bulb.y+=bulb.vy*f;

  if(T>nextBub){spawnBubble();nextBub=T+rnd(2.5,4.5);}
  if(songEnv>0.25&&T>nextSongBub){spawnBubble();nextSongBub=T+0.3;}
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];
    b.y-=b.vy*f;b.age+=dt;b.x0+=b.vx*f*0.5;
    b.x=b.x0+Math.sin(T*2+b.ph)*2.2;
    if(b.y<92)bubbles.splice(i,1);
  }

  /* draw */
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(S,0,0,S,0,0);

  /* back hair */
  for(const st of strands)if(!st.front)drawStrand(st);

  /* fans */
  const tip=sp[N],tang=Math.atan2(tip.ty,tip.tx);
  drawFan({x:tip.x,y:tip.y},tang,1.0,0.5,0.9,1.1);
  drawFan({x:tip.x,y:tip.y},tang,0.8,0.85,0,1.15);

  /* pelvic fins */
  for(const s of [1,-1]){
    const q1=getAt(0.29),q2=getAt(0.4);
    const b1={x:q1.x+q1.nx*s*q1.w*0.85,y:q1.y+q1.ny*s*q1.w*0.85};
    const b2={x:q2.x+q2.nx*s*q2.w*0.9,y:q2.y+q2.ny*s*q2.w*0.9};
    const fl=Math.sin(T*2.3+s*1.3)*4;
    const tp={x:b1.x+q1.nx*s*(17+fl)+q1.tx*20,y:b1.y+q1.ny*s*(17+fl)+q1.ty*20};
    ctx.beginPath();ctx.moveTo(b1.x,b1.y);
    ctx.quadraticCurveTo(b1.x+q1.nx*s*18,b1.y+q1.ny*s*18,tp.x,tp.y);
    ctx.quadraticCurveTo(b2.x+q2.nx*s*9,b2.y+q2.ny*s*9,b2.x,b2.y);
    ctx.closePath();
    ctx.fillStyle='rgba(240,130,110,0.78)';ctx.fill();
    ctx.strokeStyle='rgba(255,230,210,0.5)';ctx.lineWidth=0.6;ctx.stroke();
  }

  /* tail */
  const tg=ctx.createLinearGradient(0,175,0,315);
  tg.addColorStop(0,'#2b9aa3');tg.addColorStop(0.45,'#2766a8');tg.addColorStop(1,'#5a3fa3');
  ctx.beginPath();
  for(let t=0.2;t<=1.0001;t+=0.02){const p=edge(t,1);if(t===0.2)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}
  for(let t=1.0;t>=0.1999;t-=0.02){const p=edge(t,-1);ctx.lineTo(p.x,p.y);}
  ctx.closePath();
  ctx.fillStyle=tg;ctx.fill();
  ctx.strokeStyle='rgba(15,35,70,0.6)';ctx.lineWidth=0.9;ctx.stroke();

  /* scales */
  ctx.strokeStyle='rgba(190,240,235,0.3)';ctx.lineWidth=0.7;
  ctx.beginPath();
  let row=0;
  for(let t=0.3;t<0.94;t+=0.032,row++){
    const q=getAt(t),w=q.w*0.8,sps=5.2,ang=Math.atan2(q.ty,q.tx);
    const r=clamp(q.w*0.33,1.6,3.6);
    for(let uu=-w+(row%2)*sps*0.5;uu<=w;uu+=sps){
      const x=q.x+q.nx*uu,y=q.y+q.ny*uu;
      ctx.moveTo(x+Math.cos(ang-1.1)*r,y+Math.sin(ang-1.1)*r);
      ctx.arc(x,y,r,ang-1.1,ang+1.1);
    }
  }
  ctx.stroke();

  /* photophores */
  for(let i=0,t=0.34;t<0.93;i++,t+=0.065){
    const s=i%2?1:-1,q=getAt(t);
    const x=q.x+q.nx*s*q.w*0.55,y=q.y+q.ny*s*q.w*0.55;
    const gl=0.55+0.45*Math.sin(T*2.2-t*7);
    ctx.fillStyle='rgba(255,214,120,'+(0.18*gl)+')';ctx.beginPath();ctx.arc(x,y,4.2,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,238,175,'+(0.5+0.5*gl)+')';ctx.beginPath();ctx.arc(x,y,1.3,0,TAU);ctx.fill();
  }

  /* torso */
  const sg=ctx.createLinearGradient(125,0,175,0);
  sg.addColorStop(0,'#a8694a');sg.addColorStop(1,'#e0a47a');
  ctx.beginPath();
  for(let i=0;i<=10;i++){const p=edge(0.27*i/10,1);if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}
  const hq=getAt(0.27);
  const R27=edge(0.27,-1);
  ctx.quadraticCurveTo(hq.x+hq.tx*16,hq.y+hq.ty*16,R27.x,R27.y);
  for(let i=10;i>=0;i--){const p=edge(0.27*i/10,-1);ctx.lineTo(p.x,p.y);}
  ctx.closePath();
  ctx.fillStyle=sg;ctx.fill();
  ctx.strokeStyle=OUT;ctx.lineWidth=0.9;ctx.stroke();

  /* gills */
  ctx.strokeStyle='rgba(70,30,30,0.35)';ctx.lineWidth=0.7;
  ctx.beginPath();
  for(const s of [1,-1]){
    const q=getAt(0.115);
    const px=q.x+q.nx*s*(q.w-3.5),py=q.y+q.ny*s*(q.w-3.5);
    for(let i=0;i<3;i++){
      ctx.moveTo(px,py+i*2.6-2.6);
      ctx.lineTo(px-q.nx*s*3.2,py+i*2.6-2.2);
    }
  }
  ctx.stroke();

  /* top */
  {
    const t0=0.085,t1=0.17;
    const L0=edge(t0,1,0.8),R0=edge(t0,-1,0.8),q0=getAt(t0);
    const L1=edge(t1,1,0.6),R1=edge(t1,-1,0.6),q1=getAt(t1);
    ctx.beginPath();ctx.moveTo(L0.x,L0.y);
    ctx.quadraticCurveTo(q0.x-q0.tx*4,q0.y-q0.ty*4,R0.x,R0.y);
    ctx.lineTo(R1.x,R1.y);
    const pts=[R1];
    for(let i=1;i<3;i++){pts.push({x:lerp(R1.x,L1.x,i/3),y:lerp(R1.y,L1.y,i/3)});}
    pts.push(L1);
    for(let i=0;i<3;i++){
      const a=pts[i],b=pts[i+1];
      ctx.quadraticCurveTo((a.x+b.x)/2+q1.tx*6,(a.y+b.y)/2+q1.ty*6,b.x,b.y);
    }
    ctx.closePath();
    const bg=ctx.createLinearGradient(0,150,0,170);
    bg.addColorStop(0,'#f2997a');bg.addColorStop(1,'#c9566a');
    ctx.fillStyle=bg;ctx.fill();
    ctx.strokeStyle=OUT;ctx.lineWidth=0.8;ctx.stroke();
    ctx.strokeStyle='rgba(255,225,200,0.5)';ctx.lineWidth=0.6;
    ctx.beginPath();
    for(let i=1;i<3;i++){ctx.moveTo(q0.x,q0.y);ctx.lineTo(pts[i].x,pts[i].y);}
    ctx.stroke();
    ctx.fillStyle='rgba(255,226,150,'+(0.6+0.3*Math.sin(T*2.2))+')';
    ctx.beginPath();ctx.arc(q0.x,q0.y+2.5,1.3,0,TAU);ctx.fill();
  }

  /* arms */
  {
    const q=getAt(0.05);
    const SL={x:q.x+q.nx*(q.w-4.5),y:q.y+q.ny*(q.w-4.5)};
    const SR={x:q.x-q.nx*(q.w-4.5),y:q.y-q.ny*(q.w-4.5)};
    const e=sstep(waveEnv);
    const restT={x:SL.x-15+3*Math.sin(T*1.1),y:SL.y+40+3*Math.sin(T*0.9)};
    const waveT={x:SL.x-34+6*Math.sin(T*9),y:SL.y-22};
    const TL={x:lerp(restT.x,waveT.x,e),y:lerp(restT.y,waveT.y,e)};
    const TR={x:bulb.x+14+3*Math.sin(T*1.6),y:bulb.y+24+2*Math.cos(T*1.3)};
    drawArm(arm(SL,TL,28,26));
    drawArm(arm(SR,TR,28,26));
  }

  /* head */
  ctx.save();
  ctx.translate(Hd.x,Hd.y);ctx.rotate(tilt);
  ctx.fillStyle='#222763';ctx.beginPath();ctx.ellipse(0,1,15.5,17.5,0,0,TAU);ctx.fill();
  ear(1);ear(-1);
  const hg=ctx.createLinearGradient(-13,0,13,0);
  hg.addColorStop(0,'#c28159');hg.addColorStop(1,'#e3aa80');
  ctx.beginPath();ctx.ellipse(0,0,13,15.5,0,0,TAU);
  ctx.fillStyle=hg;ctx.fill();
  ctx.strokeStyle=OUT;ctx.lineWidth=0.9;ctx.stroke();

  ctx.save();
  ctx.translate(look.x*1.2,look.y*0.6);
  ctx.fillStyle='rgba(238,110,110,0.28)';
  ctx.beginPath();ctx.ellipse(-8,6.2,3,1.8,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(8,6.2,3,1.8,0,0,TAU);ctx.fill();
  const pul=0.75+0.25*Math.sin(T*2.2)+0.35*songEnv;
  ctx.fillStyle='rgba(255,215,120,'+clamp(0.55*pul,0,1)+')';
  for(const s of [-1,1]){
    ctx.beginPath();ctx.arc(s*7,4.5,0.5,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(s*5.6,5.4,0.45,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(s*8.4,5.6,0.45,0,TAU);ctx.fill();
  }
  eye(-5.5,2,-1);eye(5.5,2,1);
  ctx.strokeStyle='#22204f';ctx.lineWidth=0.9;ctx.lineCap='round';
  const bl=songEnv*1.2;
  ctx.beginPath();ctx.moveTo(-8.8,-5.2-bl);ctx.quadraticCurveTo(-5.8,-7.4-bl,-2.8,-5.6-bl);ctx.stroke();
  ctx.beginPath();ctx.moveTo(2.8,-6.6-bl);ctx.quadraticCurveTo(5.8,-9.2-bl,8.8,-6.4-bl);ctx.stroke();
  ctx.strokeStyle='rgba(100,50,30,0.5)';ctx.lineWidth=0.7;
  ctx.beginPath();ctx.moveTo(-0.6,5);ctx.quadraticCurveTo(1.2,6.4,0,6.6);ctx.stroke();
  if(songEnv>0.15){
    const m=songEnv;
    ctx.fillStyle='#5b1f33';ctx.beginPath();ctx.ellipse(0.3,9.6,1.7+1.0*m,0.8+2.4*m,0,0,TAU);ctx.fill();
    ctx.fillStyle='#e0667a';ctx.beginPath();ctx.ellipse(0.3,10.4+m,1.2,0.8*m+0.3,0,0,TAU);ctx.fill();
  }else{
    ctx.strokeStyle='#7a2f3a';ctx.lineWidth=0.9;
    ctx.beginPath();ctx.moveTo(-3.4,9);ctx.quadraticCurveTo(0.5,11.2,3.8,8.2);ctx.stroke();
  }
  ctx.restore();

  /* bangs */
  const hr=ctx.createLinearGradient(-14,-17,14,0);
  hr.addColorStop(0,'#1d2150');hr.addColorStop(1,'#2e3584');
  ctx.beginPath();ctx.moveTo(-13.6,1);
  ctx.bezierCurveTo(-14.5,-17,14.5,-17,13.6,1);
  ctx.quadraticCurveTo(10,-8,1,-11);
  ctx.quadraticCurveTo(-7,-7,-13.6,1);
  ctx.closePath();
  ctx.fillStyle=hr;ctx.fill();
  ctx.strokeStyle='rgba(120,230,225,0.45)';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(-9,-8);ctx.quadraticCurveTo(0,-15,9,-9);ctx.stroke();
  ctx.restore();

  /* front locks */
  for(const st of strands)if(st.front)drawStrand(st);

  /* lure stalk */
  const root=hw(0,-15),ctrl=hw(-3,-58);
  ctx.lineCap='round';
  ctx.strokeStyle='#1d2250';ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(root.x,root.y);ctx.quadraticCurveTo(ctrl.x,ctrl.y,bulb.x,bulb.y);ctx.stroke();
  ctx.strokeStyle='rgba(130,150,230,0.7)';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(root.x,root.y);ctx.quadraticCurveTo(ctrl.x,ctrl.y,bulb.x,bulb.y);ctx.stroke();

  /* lure glow */
  const P2=clamp(0.75+0.25*Math.sin(T*2.2)+0.35*songEnv,0,1.4);
  let g=ctx.createRadialGradient(bulb.x,bulb.y,0,bulb.x,bulb.y,75);
  g.addColorStop(0,'rgba(255,225,140,'+(0.5*P2)+')');
  g.addColorStop(0.3,'rgba(255,205,110,'+(0.2*P2)+')');
  g.addColorStop(1,'rgba(255,190,100,0)');
  ctx.fillStyle=g;ctx.fillRect(bulb.x-80,bulb.y-80,160,160);
  ctx.strokeStyle='rgba(255,215,120,0.8)';ctx.lineWidth=0.8;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();ctx.moveTo(bulb.x+i*1.5,bulb.y+3);
    ctx.quadraticCurveTo(bulb.x+i*3,bulb.y+8,bulb.x+i*4+Math.sin(T*3+i)*1.5,bulb.y+11);ctx.stroke();
  }
  g=ctx.createRadialGradient(bulb.x-1,bulb.y-1,0,bulb.x,bulb.y,5.2);
  g.addColorStop(0,'#fffbe8');g.addColorStop(0.5,'#ffe08a');g.addColorStop(1,'#ffb84a');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(bulb.x,bulb.y,4.8,0,TAU);ctx.fill();

  /* bubbles */
  for(const b of bubbles){
    const a=clamp((b.y-92)/30,0,1);
    ctx.fillStyle='rgba(220,245,255,'+(0.12*a)+')';
    ctx.strokeStyle='rgba(235,250,255,'+(0.75*a)+')';
    ctx.lineWidth=0.7;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,'+(0.8*a)+')';
    ctx.beginPath();ctx.arc(b.x-b.r*0.3,b.y-b.r*0.35,b.r*0.25,0,TAU);ctx.fill();
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
