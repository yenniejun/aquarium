<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Listening Light</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: visible;
  }
  .drift {
    transform-origin: 150px 205px;
    animation: drift 7s ease-in-out infinite;
  }
  .tail {
    transform-origin: 148px 217px;
    animation: tail-sway 5.8s ease-in-out infinite;
  }
  .fluke {
    transform-origin: 187px 339px;
    animation: fluke-sway 3.7s ease-in-out infinite;
  }
  .hair-left, .hair-right, .frond {
    transform-box: fill-box;
    transform-origin: 50% 5%;
  }
  .hair-left { animation: hair-left 5.1s ease-in-out infinite; }
  .hair-right { animation: hair-right 5.8s ease-in-out infinite; }
  .frond { animation: frond 4.4s ease-in-out infinite; }
  .fin {
    transform-box: fill-box;
    transform-origin: 10% 50%;
    animation: fin-fan 3.4s ease-in-out infinite;
  }
  .eyes {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 7.2s linear infinite;
  }
  .pupils {
    transform: translate(var(--look-x, 0px), var(--look-y, 0px));
    transition: transform .45s ease-out;
  }
  .lamp-core { animation: lamp 3.2s ease-in-out infinite; }
  .lamp-halo {
    transform-box: fill-box;
    transform-origin: center;
    animation: halo 3.2s ease-in-out infinite;
  }
  .light-speck { animation: speck 3.2s ease-in-out infinite; }
  .light-speck:nth-of-type(2n) { animation-delay: -1.1s; }
  .light-speck:nth-of-type(3n) { animation-delay: -2.2s; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) rotate(-1deg); }
    50% { transform: translate(0, -4px) rotate(1.2deg); }
  }
  @keyframes tail-sway {
    0%, 100% { transform: rotate(-2.5deg); }
    50% { transform: rotate(3.5deg); }
  }
  @keyframes fluke-sway {
    0%, 100% { transform: rotate(-6deg) scaleY(.98); }
    50% { transform: rotate(7deg) scaleY(1.03); }
  }
  @keyframes hair-left {
    0%, 100% { transform: rotate(-3deg) skewX(-1deg); }
    50% { transform: rotate(5deg) skewX(3deg); }
  }
  @keyframes hair-right {
    0%, 100% { transform: rotate(4deg) skewX(1deg); }
    50% { transform: rotate(-5deg) skewX(-3deg); }
  }
  @keyframes frond {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(5deg); }
  }
  @keyframes fin-fan {
    0%, 100% { transform: scaleX(.82) rotate(-3deg); opacity: .68; }
    50% { transform: scaleX(1.08) rotate(4deg); opacity: .96; }
  }
  @keyframes blink {
    0%, 43%, 45%, 78%, 80%, 100% { transform: scaleY(1); }
    44%, 79% { transform: scaleY(.06); }
  }
  @keyframes lamp {
    0%, 100% { opacity: .78; }
    50% { opacity: 1; }
  }
  @keyframes halo {
    0%, 100% { transform: scale(.86); opacity: .34; }
    50% { transform: scale(1.15); opacity: .72; }
  }
  @keyframes speck {
    0%, 100% { opacity: .28; }
    50% { opacity: .95; }
  }
</style>
</head>

<script>
  (() => {
    const root = document.documentElement;
    let frame = 0;
    let x = 0, y = 0;

    function paint() {
      root.style.setProperty('--look-x', x.toFixed(2) + 'px');
      root.style.setProperty('--look-y', y.toFixed(2) + 'px');
      frame = 0;
    }

    window.addEventListener('pointermove', event => {
      if (event.pointerType === 'touch') return;
      x = ((event.clientX / window.innerWidth) - .5) * 3.2;
      y = ((event.clientY / window.innerHeight) - .5) * 2.2;
      if (!frame) frame = requestAnimationFrame(paint);
    }, { passive: true });

    window.addEventListener('pointerleave', () => {
      x = 0;
      y = 0;
      if (!frame) frame = requestAnimationFrame(paint);
    }, { passive: true });
  })();
</script>

</html>
