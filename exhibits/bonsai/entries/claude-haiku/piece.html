<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%;}
body{display:flex;align-items:flex-end;justify-content:center;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var S = 300, dpr = 1, K = 1;

  function size(){
    S = Math.max(1, Math.min(window.innerWidth, window.innerHeight));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = S + 'px';
    cv.style.height = S + 'px';
    cv.width = Math.round(S * dpr);
    cv.height = Math.round(S * dpr);
    K = cv.width / 1000;
  }
  window.addEventListener('resize', size);
  size();

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(917);

  // ---- Tree structure (built once) ----
  var tips = [];
  function mkNode(len, w, d, a){
    return { a: a, len: len, w: w, d: d, ph: rnd() * 6.283, kids: [], lv: null };
  }
  function makeLeaves(n){
    n.lv = [];
    var count = 6;
    for (var i = 0; i < count; i++){
      n.lv.push({
        dx: (rnd() - 0.5) * 30,
        dy: (rnd() - 0.5) * 24 - 4,
        r: 7 + rnd() * 5,
        j: (rnd() - 0.5) * 36
      });
    }
  }
  function grow(n){
    if (n.d >= 6){ makeLeaves(n); return; }
    if (n.d >= 3 && rnd() < 0.18){ makeLeaves(n); return; }
    var cnt = n.d < 2 ? 2 : (rnd() < 0.45 ? 3 : 2);
    for (var i = 0; i < cnt; i++){
      var spread = 0.42 + rnd() * 0.2 + n.d * 0.03;
      var a = (i - (cnt - 1) / 2) * spread + (rnd() - 0.5) * 0.3;
      var child = mkNode(n.len * (0.68 + rnd() * 0.1), n.w * 0.64, n.d + 1, a);
      n.kids.push(child);
      grow(child);
    }
  }
  var root = mkNode(170, 38, 0, -0.08);
  grow(root);

  // ---- Seasons ----
  var SEG = 12;
  var SEAS = [
    { c: [246, 176, 199], a: 1 },   // spring blossom
    { c: [104, 160, 74],  a: 1 },   // summer green
    { c: [214, 116, 46],  a: 1 },   // autumn flame
    { c: [150, 140, 130], a: 0 }    // winter bare
  ];
  function lerp(a, b, t){ return a + (b - a) * t; }
  function season(t){
    var p = (t / SEG) % 4;
    var i = Math.floor(p);
    var f = p - i;
    var e = f * f * (3 - 2 * f);
    var A = SEAS[i], B = SEAS[(i + 1) % 4];
    return {
      r: lerp(A.c[0], B.c[0], e),
      g: lerp(A.c[1], B.c[1], e),
      b: lerp(A.c[2], B.c[2], e),
      a: lerp(A.a, B.a, e)
    };
  }

  var BARK = '#4a3527';

  function drawNode(n, x, y, ang, t, s){
    var amp = 0.012 + 0.01 * n.d;
    var a2 = ang + n.a + Math.sin(t * 0.8 + n.ph) * amp;
    var x2 = x + Math.sin(a2) * n.len;
    var y2 = y - Math.cos(a2) * n.len;
    ctx.lineWidth = n.w;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    if (n.kids.length){
      for (var i = 0; i < n.kids.length; i++){
        drawNode(n.kids[i], x2, y2, a2, t, s);
      }
    } else if (n.lv){
      tips.push([x2, y2]);
    }

    if (n.lv && s.a > 0.03){
      for (var k = 0; k < n.lv.length; k++){
        var L = n.lv[k];
        var j = L.j;
        ctx.fillStyle = 'rgba(' + Math.round(s.r + j) + ',' + Math.round(s.g + j * 0.6) + ',' + Math.round(s.b + j * 0.4) + ',0.92)';
        ctx.beginPath();
        ctx.arc(x2 + L.dx, y2 + L.dy, L.r * s.a, 0, 6.2832);
        ctx.fill();
      }
    }
  }

  // ---- Falling petals / leaves ----
  var parts = [];
  var MAXP = 40;

  function updateParts(dt, t, s){
    if (s.a > 0.6 && tips.length && parts.length < MAXP && Math.random() < dt * 1.2){
      var p = tips[Math.floor(Math.random() * tips.length)];
      parts.push({
        x: p[0] + (Math.random() - 0.5) * 10,
        y: p[1],
        ph: Math.random() * 6.283,
        rot: Math.random() * 6.283,
        vr: (Math.random() - 0.5) * 2,
        col: 'rgba(' + Math.round(s.r) + ',' + Math.round(s.g) + ',' + Math.round(s.b) + ',0.95)'
      });
    }
    for (var i = parts.length - 1; i >= 0; i--){
      var q = parts[i];
      q.x += (Math.sin(t * 1.3 + q.ph) * 10 + 3) * dt;
      q.y += 20 * dt;
      q.rot += q.vr * dt;
      if (q.y > 745) parts.splice(i, 1);
    }
  }
  function drawParts(){
    for (var i = 0; i < parts.length; i++){
      var q = parts[i];
      ctx.save();
      ctx.translate(q.x, q.y);
      ctx.rotate(q.rot);
      ctx.fillStyle = q.col;
      ctx.beginPath();
      ctx.ellipse(0, 0, 5, 3, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
  }

  // ---- Pot (drawn in design units, bottom edge at y = 1000) ----
  function drawPot(){
    // rim
    var g = ctx.createLinearGradient(290, 0, 710, 0);
    g.addColorStop(0, '#22494a');
    g.addColorStop(0.35, '#5d9b92');
    g.addColorStop(0.7, '#3d7670');
    g.addColorStop(1, '#1f4544');

    ctx.fillStyle = g;
    roundRect(262, 780, 476, 32, 12);
    ctx.fill();

    // body
    ctx.beginPath();
    ctx.moveTo(290, 808);
    ctx.bezierCurveTo(300, 900, 320, 960, 340, 1000);
    ctx.lineTo(660, 1000);
    ctx.bezierCurveTo(680, 960, 700, 900, 710, 808);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();

    // glaze highlight
    ctx.beginPath();
    ctx.moveTo(340, 830);
    ctx.bezierCurveTo(345, 880, 352, 930, 368, 975);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.stroke();

    // kintsugi repair
    ctx.beginPath();
    ctx.moveTo(420, 868);
    ctx.lineTo(438, 898);
    ctx.lineTo(426, 928);
    ctx.lineTo(452, 966);
    ctx.lineTo(446, 986);
    ctx.strokeStyle = '#d9a93b';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.fillStyle = '#e8c15a';
    ctx.beginPath(); ctx.arc(438, 898, 3, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(452, 966, 3, 0, 6.2832); ctx.fill();

    // soil
    ctx.fillStyle = '#3b2a20';
    ctx.beginPath();
    ctx.ellipse(500, 780, 236, 13, 0, 0, 6.2832);
    ctx.fill();

    // moss
    var mosses = [
      [352, 778, 34, 9, '#6f9a3c'], [392, 774, 26, 7, '#5d8a33'],
      [600, 776, 40, 9, '#6f9a3c'], [648, 772, 22, 6, '#84ad48'],
      [500, 790, 60, 6, '#5d8a33']
    ];
    for (var i = 0; i < mosses.length; i++){
      var m = mosses[i];
      ctx.fillStyle = m[4];
      ctx.beginPath();
      ctx.ellipse(m[0], m[1], m[2], m[3], 0, 0, 6.2832);
      ctx.fill();
    }

    // stones
    ctx.fillStyle = '#7f827d';
    ctx.beginPath(); ctx.ellipse(322, 790, 14, 8, -0.2, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#9a9d97';
    ctx.beginPath(); ctx.ellipse(319, 787, 6, 3, -0.2, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#6c6f6a';
    ctx.beginPath(); ctx.ellipse(676, 786, 10, 6, 0.3, 0, 6.2832); ctx.fill();
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ---- Main loop ----
  var last = null;
  function frame(now){
    var t = now / 1000;
    var dt = last === null ? 0 : Math.min(0.05, (now - last) / 1000);
    last = now;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(K, 0, 0, K, 0, 0);

    var s = season(t);
    tips.length = 0;

    // tree
    ctx.save();
    ctx.translate(500, 780);
    ctx.scale(0.92, 0.92);
    ctx.translate(-500, -780);
    ctx.strokeStyle = BARK;
    ctx.lineCap = 'round';
    drawNode(root, 500, 780, 0, t, s);
    updateParts(dt, t, s);
    drawParts();
    ctx.restore();

    // pot
    drawPot();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
