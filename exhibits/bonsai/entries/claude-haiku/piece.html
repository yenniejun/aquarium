<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  svg {
    display: block;
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    --leaf: #3f8f4a;
    --blos: 0;
    --fall: 0;
    touch-action: auto;
  }
</style>
</head>
<body>
<svg id="t" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="potGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1f4245"/>
      <stop offset="0.35" stop-color="#3a7478"/>
      <stop offset="0.6" stop-color="#2c5a5e"/>
      <stop offset="1" stop-color="#173538"/>
    </linearGradient>
  </defs>
  <g id="pot"></g>
  <g id="tree" transform="rotate(0 200 322)">
    <g id="wood"></g>
    <g id="foliage"></g>
    <g id="blossoms"></g>
  </g>
  <g id="fall"></g>
</svg>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('t');
  const potG = document.getElementById('pot');
  const treeG = document.getElementById('tree');
  const woodG = document.getElementById('wood');
  const folG = document.getElementById('foliage');
  const blosG = document.getElementById('blossoms');
  const fallG = document.getElementById('fall');

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  // Seeded random so the tree shape stays identical between frames
  let seed = 20240917;
  function rnd() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }

  // Pot: a deep teal bowl with a gold-mended rim and a moss-covered soil
  el('path', {
    d: 'M92,332 C88,366 100,386 128,400 L272,400 C300,386 312,366 308,332 Z',
    fill: 'url(#potGrad)'
  }, potG);
  el('path', {
    d: 'M104,340 C104,360 110,375 124,388',
    fill: 'none', stroke: 'rgba(255,255,255,0.12)', 'stroke-width': 4, 'stroke-linecap': 'round'
  }, potG);
  el('path', {
    d: 'M150,344 L162,364 L154,384 L170,398',
    fill: 'none', stroke: '#d4a84b', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
  }, potG);
  el('path', {
    d: 'M246,350 L240,368 L252,380',
    fill: 'none', stroke: '#d4a84b', 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
  }, potG);
  el('rect', { x: 80, y: 314, width: 240, height: 20, rx: 8, fill: '#46828a' }, potG);
  el('rect', { x: 84, y: 316, width: 232, height: 3, rx: 1.5, fill: 'rgba(255,255,255,0.18)' }, potG);
  el('ellipse', { cx: 200, cy: 318, rx: 112, ry: 7, fill: '#3b2a1d' }, potG);
  for (let i = 0; i < 9; i++) {
    const mx = 120 + i * 17 + (rnd() - 0.5) * 6;
    const my = 316 + (rnd() - 0.5) * 3;
    el('ellipse', {
      cx: mx, cy: my, rx: 5 + rnd() * 4, ry: 2.4 + rnd() * 1.2,
      fill: rnd() < 0.5 ? '#6fa050' : '#5a8a45'
    }, potG);
  }

  // Foliage clusters
  function cluster(x, y, r) {
    const n = 6 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) {
      const cx = x + (rnd() - 0.5) * r * 2.2;
      const cy = y + (rnd() - 0.5) * r * 1.3 - 2;
      const rad = 3 + rnd() * 4;
      const isBlossom = rnd() < 0.14;
      if (isBlossom) {
        el('circle', { cx, cy, r: rad * 0.8, style: 'fill:#f2a6bd' }, blosG);
      } else {
        el('ellipse', {
          cx, cy, rx: rad, ry: rad * 0.6,
          transform: `rotate(${(rnd() * 180).toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})`,
          style: 'fill:var(--leaf)'
        }, folG);
      }
    }
  }

  // Recursive branching: slanted, windswept juniper form
  function branch(x, y, a, len, depth, w) {
    const x2 = x + Math.sin(a) * len;
    const y2 = y - Math.cos(a) * len;
    el('line', {
      x1: x.toFixed(2), y1: y.toFixed(2), x2: x2.toFixed(2), y2: y2.toFixed(2),
      'stroke-width': w.toFixed(2), stroke: '#5a3f2c', 'stroke-linecap': 'round'
    }, woodG);
    if (depth === 0) {
      cluster(x2, y2, 20);
      return;
    }
    const n = depth > 2 ? 2 : (rnd() < 0.5 ? 2 : 3);
    for (let i = 0; i < n; i++) {
      const spread = (i - (n - 1) / 2) * 0.75 + (rnd() - 0.5) * 0.5;
      branch(x2, y2, a + spread, len * (0.68 + rnd() * 0.1), depth - 1, Math.max(0.9, w * 0.62));
    }
    if (depth <= 2) cluster(x2, y2, 12 + depth * 3);
  }

  // Trunk leans right with a sweeping bend, then splits into the crown
  branch(196, 322, 0.14, 56, 6, 12);

  // Deadwood (jin): a bleached strip running up the windward side of the trunk
  el('path', {
    d: 'M192,320 C187,300 195,284 190,262 C187,250 192,240 188,228',
    fill: 'none', stroke: '#e6dccb', 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0.9
  }, woodG);
  el('path', {
    d: 'M190,300 L186,298',
    fill: 'none', stroke: '#8b7660', 'stroke-width': 1, 'stroke-linecap': 'round'
  }, woodG);

  // Falling leaves
  const particles = [];
  for (let i = 0; i < 12; i++) {
    const p = {
      x: 120 + rnd() * 160,
      y: 100 + rnd() * 200,
      vx: 0.2 + rnd() * 0.3,
      vy: 0.25 + rnd() * 0.25,
      rot: rnd() * 360,
      spin: (rnd() - 0.5) * 2.2,
      ph: rnd() * Math.PI * 2
    };
    p.node = el('ellipse', { rx: 4, ry: 2.1, style: 'fill:var(--leaf)' }, fallG);
    particles.push(p);
  }

  // Seasonal palette: spring, summer, autumn, winter
  const palette = [
    [156, 207, 106],
    [63, 143, 74],
    [214, 118, 46],
    [107, 127, 120]
  ];
  const SEASON_TOTAL = 48; // seconds for the full year
  const startTime = performance.now();

  function smooth(f) { return f * f * (3 - 2 * f); }

  function frame(now) {
    const t = (now - startTime) / 1000;

    // Gentle wind sway
    const sway = Math.sin(t * 0.9) * 1.5 + Math.sin(t * 2.3) * 0.35;
    treeG.setAttribute('transform', `rotate(${sway.toFixed(3)} 200 322)`);

    // Season weights
    const p = ((t / SEASON_TOTAL) % 1) * 4;
    const i = Math.floor(p);
    const f = smooth(p - i);
    const w = [0, 0, 0, 0];
    w[i] += 1 - f;
    w[(i + 1) % 4] += f;

    let r = 0, g = 0, b = 0;
    for (let k = 0; k < 4; k++) {
      r += palette[k][0] * w[k];
      g += palette[k][1] * w[k];
      b += palette[k][2] * w[k];
    }

    svg.style.setProperty('--leaf', `rgb(${r | 0},${g | 0},${b | 0})`);
    svg.style.setProperty('--blos', w[0].toFixed(3));
    svg.style.setProperty('--fall', w[2].toFixed(3));
    folG.setAttribute('opacity', (1 - 0.3 * w[3]).toFixed(3));
    blosG.setAttribute('opacity', w[0].toFixed(3));
    fallG.setAttribute('opacity', Math.min(1, w[2] * 1.4).toFixed(3));

    // Drift leaves
    for (const q of particles) {
      q.y += q.vy;
      q.x += q.vx * 0.5 + Math.sin(t * 0.8 + q.ph) * 0.4;
      q.rot += q.spin;
      if (q.y > 330) {
        q.x = 120 + rnd() * 160;
        q.y = 90 + rnd() * 60;
      }
      q.node.setAttribute('transform',
        `translate(${q.x.toFixed(2)} ${q.y.toFixed(2)}) rotate(${q.rot.toFixed(1)})`);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
