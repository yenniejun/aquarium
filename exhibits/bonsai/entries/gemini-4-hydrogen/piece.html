<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: true });

  // Deterministic PRNG for consistent organic composition
  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rand = mulberry32(4192837);

  // Viewport & DPI state
  let W = 0, H = 0, S = 0, DPR = 1, OX = 0, OY = 0;

  // Pointer breeze state (optional gentle hover response)
  const pointer = { x: 0.5, y: 0.5, vx: 0, vy: 0, energy: 0, active: false };

  window.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const nx = (e.clientX - rect.left - OX) / (S || 1);
    const ny = (e.clientY - rect.top - OY) / (S || 1);
    if (pointer.active) {
      pointer.vx = Math.max(-0.5, Math.min(0.5, nx - pointer.x));
      pointer.vy = Math.max(-0.5, Math.min(0.5, ny - pointer.y));
      pointer.energy = Math.min(1, pointer.energy + Math.hypot(pointer.vx, pointer.vy) * 4.5);
    }
    pointer.x = nx;
    pointer.y = ny;
    pointer.active = true;
  }, { passive: true });

  // Build pre-rendered Japanese maple (Acer palmatum) leaf sprites
  const LEAF_PALETTES = [
    ['#3d121a', '#5d1c24', '#75252b'], // deep shadow wine
    ['#4f171e', '#762326', '#942e2a'], // shaded burgundy
    ['#6c1f1e', '#992e26', '#ba402c'], // rich crimson
    ['#872920', '#b83f28', '#d65831'], // terracotta vermilion
    ['#a33b22', '#cf562c', '#e6783a'], // copper flame
    ['#b85024', '#df7434', '#f29b4a'], // sunlit coral amber
    ['#c46824', '#e69138', '#f5bc58'], // burnished honey gold
    ['#684928', '#8d6f32', '#b39542'], // warm olive bronze accent
  ];

  const leafSprites = [];
  function buildLeafSprites() {
    const size = 84;
    const cx = size * 0.5;
    const cy = size * 0.62;

    for (let p = 0; p < LEAF_PALETTES.length; p++) {
      for (let v = 0; v < 2; v++) {
        const oc = document.createElement('canvas');
        oc.width = size;
        oc.height = size;
        const octx = oc.getContext('2d');
        const cols = LEAF_PALETTES[p];
        const asym = v === 0 ? 1 : -1;

        // Petiole (slender stem)
        octx.strokeStyle = cols[0];
        octx.lineWidth = 2.0;
        octx.lineCap = 'round';
        octx.beginPath();
        octx.moveTo(cx, cy + 2);
        octx.quadraticCurveTo(cx + asym * 2.5, cy + 12, cx + asym * 4, cy + 20);
        octx.stroke();

        // 5-lobed palmate leaf silhouette
        const lobes = [
          { ang: -1.68, len: 15, w: 3.8 },
          { ang: -0.84, len: 25, w: 5.2 },
          { ang: 0.0 + asym * 0.03, len: 33, w: 6.2 },
          { ang: 0.84, len: 24, w: 5.1 },
          { ang: 1.68, len: 14, w: 3.7 }
        ];

        octx.beginPath();
        octx.moveTo(cx, cy + 2);

        for (let i = 0; i < lobes.length; i++) {
          const L = lobes[i];
          const a = L.ang - Math.PI * 0.5;
          const tipX = cx + Math.cos(a) * L.len;
          const tipY = cy + Math.sin(a) * L.len;
          const nx = -Math.sin(a);
          const ny = Math.cos(a);

          const mid1X = cx + Math.cos(a) * (L.len * 0.52) - nx * L.w;
          const mid1Y = cy + Math.sin(a) * (L.len * 0.52) - ny * L.w;
          const mid2X = cx + Math.cos(a) * (L.len * 0.52) + nx * L.w;
          const mid2Y = cy + Math.sin(a) * (L.len * 0.52) + ny * L.w;

          if (i === 0) {
            octx.quadraticCurveTo(mid1X, mid1Y, tipX, tipY);
          } else {
            const prev = lobes[i - 1];
            const midA = (prev.ang + L.ang) * 0.5 - Math.PI * 0.5;
            const cleftR = (prev.len + L.len) * 0.16;
            const cleftX = cx + Math.cos(midA) * cleftR;
            const cleftY = cy + Math.sin(midA) * cleftR;
            octx.quadraticCurveTo(mid1X, mid1Y, cleftX, cleftY);
            octx.quadraticCurveTo(mid1X, mid1Y, tipX, tipY);
          }

          if (i < lobes.length - 1) {
            const next = lobes[i + 1];
            const midA = (L.ang + next.ang) * 0.5 - Math.PI * 0.5;
            const cleftR = (L.len + next.len) * 0.16;
            const cleftX = cx + Math.cos(midA) * cleftR;
            const cleftY = cy + Math.sin(midA) * cleftR;
            octx.quadraticCurveTo(mid2X, mid2Y, cleftX, cleftY);
          } else {
            octx.quadraticCurveTo(mid2X, mid2Y, cx, cy + 2);
          }
        }
        octx.closePath();

        const grad = octx.createRadialGradient(cx, cy, 2, cx, cy - 12, 34);
        grad.addColorStop(0, cols[0]);
        grad.addColorStop(0.52, cols[1]);
        grad.addColorStop(1, cols[2]);
        octx.fillStyle = grad;
        octx.fill();

        // Subtle midribs
        octx.strokeStyle = 'rgba(255, 224, 178, 0.22)';
        octx.lineWidth = 0.9;
        for (let i = 0; i < lobes.length; i++) {
          const L = lobes[i];
          const a = L.ang - Math.PI * 0.5;
          octx.beginPath();
          octx.moveTo(cx, cy);
          octx.lineTo(cx + Math.cos(a) * (L.len * 0.82), cy + Math.sin(a) * (L.len * 0.82));
          octx.stroke();
        }

        leafSprites.push(oc);
      }
    }
  }
  buildLeafSprites();

  // Smooth cubic Bezier sampling helper
  function sampleBezier(p0, p1, p2, p3, steps, rStart, rEnd) {
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const u = 1 - t;
      const x = u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0];
      const y = u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1];
      // Non-linear organic taper
      const r = rStart + (rEnd - rStart) * Math.pow(t, 0.86);
      pts.push({ x, y, r, ax: x, ay: y });
    }
    return pts;
  }

  // Tree skeleton data
  const branches = [];
  function addBranch(parentIdx, attachStep, pts, depth, backLayer = false) {
    const idx = branches.length;
    branches.push({
      parentIdx,
      attachStep,
      pts,
      depth,
      backLayer,
      phase: rand() * Math.PI * 2,
      swayAngle: 0
    });
    return idx;
  }

  // 0: Main S-curve Moyogi trunk (from moss mound up to apex)
  const trunkLower = sampleBezier(
    [0.010, -0.125], [-0.024, -0.205], [-0.036, -0.275], [0.030, -0.355],
    14, 0.036, 0.022
  );
  const trunkUpper = sampleBezier(
    [0.030, -0.355], [0.056, -0.430], [-0.032, -0.500], [-0.012, -0.585],
    12, 0.022, 0.0135
  ).slice(1);
  const trunkCrown = sampleBezier(
    [-0.012, -0.585], [0.004, -0.650], [0.022, -0.700], [-0.010, -0.765],
    10, 0.0135, 0.0042
  ).slice(1);

  const trunkIdx = addBranch(-1, 0, [...trunkLower, ...trunkUpper, ...trunkCrown], 0, false);

  // Surface roots (Nebari) anchored to trunk base
  const nebariSpecs = [
    [[-0.006, -0.132], [-0.032, -0.130], [-0.064, -0.120], [-0.088, -0.112], 0.014, 0.0025],
    [[0.002, -0.132], [-0.016, -0.126], [-0.034, -0.118], [-0.048, -0.110], 0.012, 0.0022],
    [[0.012, -0.132], [0.012, -0.124], [0.008, -0.116], [0.004, -0.109], 0.011, 0.0022],
    [[0.022, -0.132], [0.040, -0.127], [0.058, -0.119], [0.072, -0.111], 0.012, 0.0022],
    [[0.028, -0.132], [0.058, -0.130], [0.084, -0.121], [0.104, -0.113], 0.013, 0.0025],
  ];
  for (const spec of nebariSpecs) {
    addBranch(trunkIdx, 0, sampleBezier(spec[0], spec[1], spec[2], spec[3], 6, spec[4], spec[5]), 0, false);
  }

  // Helper to spawn fine ramified twigs from a branch endpoint/segment
  const twigRefs = [];
  function spawnTwigs(bIdx, startStep, count, spreadAngle, baseLen, baseDir, padId, backLayer) {
    const parent = branches[bIdx];
    for (let i = 0; i < count; i++) {
      const step = Math.min(parent.pts.length - 1, Math.max(2, Math.floor(startStep + (parent.pts.length - 1 - startStep) * (i / Math.max(1, count - 1)))));
      const origin = parent.pts[step];
      const frac = i / Math.max(1, count - 1) - 0.5;
      const ang = baseDir + frac * spreadAngle + (rand() - 0.5) * 0.25;
      const len = baseLen * (0.78 + rand() * 0.42);
      const endX = origin.x + Math.cos(ang) * len;
      const endY = origin.y + Math.sin(ang) * len * 0.72 - len * 0.14;
      const c1x = origin.x + Math.cos(ang - 0.12) * len * 0.45;
      const c1y = origin.y + Math.sin(ang - 0.12) * len * 0.35;
      const c2x = origin.x + Math.cos(ang + 0.08) * len * 0.78;
      const c2y = origin.y + Math.sin(ang + 0.08) * len * 0.55 - len * 0.10;
      const twigPts = sampleBezier([origin.x, origin.y], [c1x, c1y], [c2x, c2y], [endX, endY], 5, Math.min(origin.r * 0.75, 0.0045), 0.0014);
      const tIdx = addBranch(bIdx, step, twigPts, 3, backLayer);
      twigRefs.push({ bIdx: tIdx, padId, backLayer });
    }
  }

  // Primary & Secondary Boughs (classic asymmetrical bonsai tiers)
  // 1. Back-depth branch (behind trunk for 3D space)
  const bBack = addBranch(trunkIdx, 21, sampleBezier(
    [-0.005, -0.460], [-0.050, -0.475], [-0.105, -0.495], [-0.150, -0.520],
    8, 0.009, 0.0032
  ), 1, true);
  spawnTwigs(bBack, 3, 4, 1.35, 0.068, -2.55, 'back', true);

  // 2. Lower-Right Primary Bough (Ichi-no-eda)
  const bRight1 = addBranch(trunkIdx, 14, sampleBezier(
    [0.030, -0.355], [0.105, -0.360], [0.175, -0.378], [0.268, -0.395],
    10, 0.0155, 0.0042
  ), 1, false);
  const bRight1SubA = addBranch(bRight1, 4, sampleBezier(
    branches[bRight1].pts[4] ? [branches[bRight1].pts[4].x, branches[bRight1].pts[4].y] : [0.12, -0.365],
    [0.165, -0.345], [0.205, -0.330], [0.252, -0.338],
    6, 0.0082, 0.0028
  ), 2, false);
  const bRight1SubB = addBranch(bRight1, 6, sampleBezier(
    [branches[bRight1].pts[6].x, branches[bRight1].pts[6].y],
    [0.210, -0.415], [0.255, -0.432], [0.305, -0.438],
    6, 0.0072, 0.0025
  ), 2, false);
  spawnTwigs(bRight1, 5, 4, 1.15, 0.065, -0.22, 'rightLow', false);
  spawnTwigs(bRight1SubA, 2, 3, 1.05, 0.055, -0.08, 'rightLow', false);
  spawnTwigs(bRight1SubB, 2, 4, 1.15, 0.058, -0.32, 'rightLow', false);

  // 3. Mid-Left Primary Bough (Ni-no-eda)
  const bLeft1 = addBranch(trunkIdx, 22, sampleBezier(
    [-0.015, -0.480], [-0.088, -0.492], [-0.170, -0.520], [-0.260, -0.545],
    10, 0.0135, 0.0038
  ), 1, false);
  const bLeft1SubA = addBranch(bLeft1, 4, sampleBezier(
    [branches[bLeft1].pts[4].x, branches[bLeft1].pts[4].y],
    [-0.145, -0.472], [-0.188, -0.462], [-0.235, -0.472],
    6, 0.0075, 0.0026
  ), 2, false);
  const bLeft1SubB = addBranch(bLeft1, 6, sampleBezier(
    [branches[bLeft1].pts[6].x, branches[bLeft1].pts[6].y],
    [-0.200, -0.558], [-0.245, -0.578], [-0.295, -0.585],
    6, 0.0068, 0.0024
  ), 2, false);
  spawnTwigs(bLeft1, 5, 4, 1.2, 0.064, -2.88, 'leftMid', false);
  spawnTwigs(bLeft1SubA, 2, 3, 1.05, 0.054, -2.98, 'leftMid', false);
  spawnTwigs(bLeft1SubB, 2, 4, 1.15, 0.058, -2.75, 'leftMid', false);

  // 4. Mid-Right Tier
  const bRight2 = addBranch(trunkIdx, 26, sampleBezier(
    [-0.008, -0.585], [0.055, -0.602], [0.125, -0.625], [0.195, -0.648],
    8, 0.0095, 0.0032
  ), 1, false);
  const bRight2Sub = addBranch(bRight2, 4, sampleBezier(
    [branches[bRight2].pts[4].x, branches[bRight2].pts[4].y],
    [0.128, -0.592], [0.165, -0.582], [0.205, -0.592],
    5, 0.0055, 0.0022
  ), 2, false);
  spawnTwigs(bRight2, 3, 4, 1.25, 0.056, -0.30, 'rightHigh', false);
  spawnTwigs(bRight2Sub, 2, 3, 1.0, 0.048, -0.15, 'rightHigh', false);

  // 5. Upper-Left Tier
  const bLeft2 = addBranch(trunkIdx, 30, sampleBezier(
    [0.005, -0.665], [-0.045, -0.680], [-0.105, -0.705], [-0.158, -0.728],
    7, 0.0072, 0.0026
  ), 1, false);
  spawnTwigs(bLeft2, 2, 4, 1.25, 0.054, -2.75, 'leftHigh', false);

  // 6. Crown Apex branches
  const bApexR = addBranch(trunkIdx, 33, sampleBezier(
    [0.004, -0.725], [0.042, -0.742], [0.082, -0.765], [0.118, -0.785],
    6, 0.0052, 0.0020
  ), 1, false);
  const bApexL = addBranch(trunkIdx, 34, sampleBezier(
    [-0.004, -0.745], [-0.040, -0.765], [-0.075, -0.788], [-0.105, -0.805],
    6, 0.0046, 0.0018
  ), 1, false);
  spawnTwigs(trunkIdx, 34, 3, 1.1, 0.052, -1.55, 'apex', false);
  spawnTwigs(bApexR, 2, 3, 1.15, 0.048, -0.65, 'apex', false);
  spawnTwigs(bApexL, 2, 3, 1.15, 0.048, -2.45, 'apex', false);

  // 7. Tiny character accent shoot on lower-left curve
  const bAccent = addBranch(trunkIdx, 8, sampleBezier(
    [-0.015, -0.255], [-0.048, -0.262], [-0.078, -0.275], [-0.102, -0.285],
    5, 0.0062, 0.0022
  ), 1, false);
  spawnTwigs(bAccent, 2, 2, 0.9, 0.036, -2.75, 'accent', false);

  // Populate foliage clouds along twigs
  const leaves = [];
  for (const ref of twigRefs) {
    const br = branches[ref.bIdx];
    const isAccent = ref.padId === 'accent';
    const perTwig = isAccent ? 9 : (ref.backLayer ? 18 : 24);
    for (let i = 0; i < perTwig; i++) {
      const segIdx = Math.min(br.pts.length - 1, 1 + Math.floor(rand() * (br.pts.length - 1)));
      const spreadR = isAccent ? 0.024 : (0.020 + rand() * 0.038);
      const spreadAng = rand() * Math.PI * 2;
      // Flatten foliage clusters horizontally like pruned bonsai pads
      const offX = Math.cos(spreadAng) * spreadR * 1.32;
      const offY = Math.sin(spreadAng) * spreadR * 0.54 - rand() * 0.012;

      // Height-based & Y-offset-based shading (bottom/back = darker plum/crimson, top/rim = sunlit copper/gold)
      const lightScore = (-offY / 0.045) * 0.55 + (ref.backLayer ? -0.55 : 0.15) + (rand() - 0.45) * 0.55;
      let palIdx;
      if (lightScore < -0.35) palIdx = 0;
      else if (lightScore < -0.05) palIdx = 1;
      else if (lightScore < 0.22) palIdx = 2;
      else if (lightScore < 0.45) palIdx = 3;
      else if (lightScore < 0.68) palIdx = 4;
      else if (lightScore < 0.92) palIdx = 5;
      else palIdx = rand() < 0.18 ? 7 : 6;

      const spriteIdx = palIdx * 2 + (rand() < 0.5 ? 0 : 1);
      const scale = (isAccent ? 0.020 : 0.023) + rand() * 0.014;
      const baseAngle = spreadAng * 0.45 + (rand() - 0.5) * 1.4;

      leaves.push({
        bIdx: ref.bIdx,
        segIdx,
        offX,
        offY,
        spriteIdx,
        scale,
        baseAngle,
        flutterPhase: rand() * Math.PI * 2,
        flutterFreq: 1.6 + rand() * 1.9,
        backLayer: ref.backLayer,
        layerOrder: (ref.backLayer ? -1 : 0) + lightScore * 0.5
      });
    }
  }

  // Sort leaves back-to-front by layerOrder for volumetric depth
  leaves.sort((a, b) => a.layerOrder - b.layerOrder);
  const backLeaves = leaves.filter(l => l.backLayer);
  const frontLeaves = leaves.filter(l => !l.backLayer);

  // Drifting fallen maple leaves pool
  const fallingLeaves = [];
  const MAX_FALLING = 9;
  function spawnFallingLeaf(initialSpread = false) {
    const src = frontLeaves[Math.floor(rand() * frontLeaves.length)];
    const br = branches[src.bIdx];
    const pt = br.pts[src.segIdx];
    const startX = pt.ax + src.offX;
    const startY = pt.ay + src.offY;
    const progress = initialSpread ? rand() * 0.8 : 0;
    return {
      x: startX + progress * 0.06,
      y: startY + progress * 0.35,
      vx: 0.010 + rand() * 0.020,
      vy: 0.040 + rand() * 0.028,
      swayAmp: 0.022 + rand() * 0.022,
      swayFreq: 1.4 + rand() * 1.2,
      swayPhase: rand() * Math.PI * 2,
      rot: rand() * Math.PI * 2,
      rotVel: (rand() - 0.5) * 2.2,
      tiltPhase: rand() * Math.PI * 2,
      tiltFreq: 2.0 + rand() * 1.8,
      spriteIdx: (3 + Math.floor(rand() * 4)) * 2 + (rand() < 0.5 ? 0 : 1),
      scale: 0.024 + rand() * 0.010,
      age: progress * 5.0,
      delay: initialSpread ? 0 : rand() * 2.2
    };
  }
  for (let i = 0; i < MAX_FALLING; i++) {
    fallingLeaves.push(spawnFallingLeaf(true));
  }

  // Cache static Pot + Soil + Moss + River Stone on an offscreen canvas on resize
  let potCache = null;
  function buildPotCache() {
    if (!S) return;
    const pw = Math.ceil(W * DPR);
    const ph = Math.ceil(H * DPR);
    potCache = document.createElement('canvas');
    potCache.width = pw;
    potCache.height = ph;
    const pctx = potCache.getContext('2d');
    pctx.scale(DPR, DPR);

    const X = (nx) => OX + nx * S;
    const Y = (ny) => OY + ny * S;

    // 1. Ceramic Pot Feet (touching exact bottom ny = 0.000)
    const footPositions = [-0.122, 0.122];
    for (let i = 0; i < footPositions.length; i++) {
      const fx = footPositions[i];
      const fw = 0.025;
      pctx.beginPath();
      pctx.moveTo(X(fx - fw * 1.15), Y(-0.024));
      pctx.quadraticCurveTo(X(fx - fw * 0.85), Y(-0.008), X(fx - fw * 0.92), Y(0.000));
      pctx.lineTo(X(fx + fw * 0.92), Y(0.000));
      pctx.quadraticCurveTo(X(fx + fw * 0.85), Y(-0.008), X(fx + fw * 1.15), Y(-0.024));
      pctx.closePath();

      const fGrad = pctx.createLinearGradient(0, Y(-0.024), 0, Y(0.000));
      fGrad.addColorStop(0, '#0f2024');
      fGrad.addColorStop(0.65, fx < 0 ? '#27474c' : '#183035');
      fGrad.addColorStop(0.86, '#5c4b40'); // unglazed stoneware base rim
      fGrad.addColorStop(1, '#4c3d34');
      pctx.fillStyle = fGrad;
      pctx.fill();
    }

    // 2. Pot Belly (Tokoname glazed celadon-slate)
    pctx.beginPath();
    pctx.moveTo(X(-0.194), Y(-0.094));
    pctx.bezierCurveTo(X(-0.198), Y(-0.048), X(-0.172), Y(-0.020), X(-0.145), Y(-0.017));
    pctx.lineTo(X(0.145), Y(-0.017));
    pctx.bezierCurveTo(X(0.172), Y(-0.020), X(0.198), Y(-0.048), X(0.194), Y(-0.094));
    pctx.closePath();

    const bodyGrad = pctx.createLinearGradient(X(-0.195), 0, X(0.195), 0);
    bodyGrad.addColorStop(0.00, '#2a4d52');
    bodyGrad.addColorStop(0.18, '#3f6d6f');
    bodyGrad.addColorStop(0.45, '#2b4f54');
    bodyGrad.addColorStop(0.78, '#1a3339');
    bodyGrad.addColorStop(0.95, '#132529');
    bodyGrad.addColorStop(1.00, '#1e383d');
    pctx.fillStyle = bodyGrad;
    pctx.fill();

    // Vertical glaze depth & soft bottom shading
    const bodyShade = pctx.createLinearGradient(0, Y(-0.094), 0, Y(-0.017));
    bodyShade.addColorStop(0, 'rgba(6, 14, 16, 0.42)'); // under-rim shadow
    bodyShade.addColorStop(0.16, 'rgba(0, 0, 0, 0)');
    bodyShade.addColorStop(0.75, 'rgba(8, 16, 18, 0.14)');
    bodyShade.addColorStop(1, 'rgba(6, 12, 14, 0.45)');
    pctx.fillStyle = bodyShade;
    pctx.fill();

    // Subtle specular glaze sheen on sunlit left shoulder
    pctx.save();
    pctx.clip();
    pctx.beginPath();
    pctx.ellipse(X(-0.115), Y(-0.056), 0.026 * S, 0.036 * S, 0.12, 0, Math.PI * 2);
    const sheen = pctx.createRadialGradient(X(-0.118), Y(-0.062), 0, X(-0.115), Y(-0.056), 0.036 * S);
    sheen.addColorStop(0, 'rgba(205, 240, 232, 0.16)');
    sheen.addColorStop(1, 'rgba(205, 240, 232, 0)');
    pctx.fillStyle = sheen;
    pctx.fill();

    // Delicate artisan horizontal throwing groove
    pctx.strokeStyle = 'rgba(12, 24, 28, 0.25)';
    pctx.lineWidth = Math.max(1, 0.002 * S);
    pctx.beginPath();
    pctx.moveTo(X(-0.185), Y(-0.036));
    pctx.quadraticCurveTo(X(0), Y(-0.032), X(0.185), Y(-0.036));
    pctx.stroke();
    pctx.restore();

    // 3. Flared Ceramic Rim
    pctx.beginPath();
    pctx.moveTo(X(-0.207), Y(-0.106));
    pctx.lineTo(X(0.207), Y(-0.106));
    pctx.quadraticCurveTo(X(0.208), Y(-0.094), X(0.194), Y(-0.092));
    pctx.lineTo(X(-0.194), Y(-0.092));
    pctx.quadraticCurveTo(X(-0.208), Y(-0.094), X(-0.207), Y(-0.106));
    pctx.closePath();

    const rimGrad = pctx.createLinearGradient(X(-0.207), 0, X(0.207), 0);
    rimGrad.addColorStop(0.0, '#365f63');
    rimGrad.addColorStop(0.22, '#4d7d7d');
    rimGrad.addColorStop(0.55, '#31575b');
    rimGrad.addColorStop(0.88, '#1d383d');
    rimGrad.addColorStop(1.0, '#27474c');
    pctx.fillStyle = rimGrad;
    pctx.fill();

    // Rim top highlight edge
    pctx.strokeStyle = 'rgba(195, 232, 224, 0.30)';
    pctx.lineWidth = Math.max(1, 0.0022 * S);
    pctx.beginPath();
    pctx.moveTo(X(-0.205), Y(-0.1055));
    pctx.lineTo(X(0.205), Y(-0.1055));
    pctx.stroke();

    // 4. Soil bed peeking inside rim
    pctx.beginPath();
    pctx.moveTo(X(-0.188), Y(-0.106));
    pctx.quadraticCurveTo(X(0), Y(-0.125), X(0.188), Y(-0.106));
    pctx.closePath();
    pctx.fillStyle = '#2d2119';
    pctx.fill();

    // 5. Lush Velvet Moss Cushions
    const mossMounds = [
      { cx: -0.145, cy: -0.104, rx: 0.042, ry: 0.015, c1: '#6c913e', c2: '#3f5b24' },
      { cx: -0.075, cy: -0.111, rx: 0.056, ry: 0.020, c1: '#7ba347', c2: '#466528' },
      { cx: 0.008,  cy: -0.116, rx: 0.075, ry: 0.024, c1: '#6e9440', c2: '#3d5923' },
      { cx: 0.095,  cy: -0.111, rx: 0.058, ry: 0.019, c1: '#63883a', c2: '#385220' },
      { cx: 0.148,  cy: -0.104, rx: 0.040, ry: 0.014, c1: '#557732', c2: '#324a1c' },
    ];

    for (const m of mossMounds) {
      pctx.beginPath();
      pctx.ellipse(X(m.cx), Y(m.cy), m.rx * S, m.ry * S, 0, Math.PI, Math.PI * 2);
      pctx.quadraticCurveTo(X(m.cx), Y(m.cy + 0.004), X(m.cx - m.rx), Y(m.cy));
      const mg = pctx.createRadialGradient(
        X(m.cx - m.rx * 0.25), Y(m.cy - m.ry * 0.55), 0.002 * S,
        X(m.cx), Y(m.cy), m.rx * S
      );
      mg.addColorStop(0, m.c1);
      mg.addColorStop(1, m.c2);
      pctx.fillStyle = mg;
      pctx.fill();
    }

    // Fine mossy stipple highlights
    const mossRng = mulberry32(9911);
    for (let i = 0; i < 120; i++) {
      const mx = (mossRng() - 0.5) * 0.34;
      const maxH = 0.025 * (1 - Math.pow(mx / 0.18, 2));
      if (maxH <= 0.002) continue;
      const my = -0.106 - mossRng() * maxH;
      pctx.fillStyle = mossRng() < 0.5 ? 'rgba(154, 194, 88, 0.45)' : 'rgba(42, 66, 22, 0.38)';
      pctx.beginPath();
      pctx.arc(X(mx), Y(my), (0.0012 + mossRng() * 0.0018) * S, 0, Math.PI * 2);
      pctx.fill();
    }

    // 6. Sculptural River Stone (Suiseki) nestled on left moss
    pctx.beginPath();
    pctx.moveTo(X(-0.142), Y(-0.107));
    pctx.quadraticCurveTo(X(-0.145), Y(-0.130), X(-0.122), Y(-0.138));
    pctx.quadraticCurveTo(X(-0.098), Y(-0.142), X(-0.084), Y(-0.124));
    pctx.quadraticCurveTo(X(-0.078), Y(-0.112), X(-0.085), Y(-0.107));
    pctx.closePath();

    const rockGrad = pctx.createLinearGradient(X(-0.142), Y(-0.140), X(-0.080), Y(-0.107));
    rockGrad.addColorStop(0, '#72797e');
    rockGrad.addColorStop(0.45, '#4e5459');
    rockGrad.addColorStop(1, '#2f3338');
    pctx.fillStyle = rockGrad;
    pctx.fill();

    // Crisp stone ridge facet
    pctx.strokeStyle = 'rgba(210, 220, 224, 0.25)';
    pctx.lineWidth = Math.max(0.8, 0.0014 * S);
    pctx.beginPath();
    pctx.moveTo(X(-0.134), Y(-0.126));
    pctx.quadraticCurveTo(X(-0.114), Y(-0.133), X(-0.098), Y(-0.120));
    pctx.stroke();

    // Small moss tuft creeping onto base of stone
    pctx.beginPath();
    pctx.ellipse(X(-0.090), Y(-0.108), 0.014 * S, 0.007 * S, -0.2, Math.PI, Math.PI * 2);
    pctx.fillStyle = '#5f8437';
    pctx.fill();
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || window.innerHeight;
    S = Math.min(W, H);
    OX = W * 0.5;
    OY = H;
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    buildPotCache();
  }

  window.addEventListener('resize', resize, { passive: true });
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resize).observe(document.documentElement);
  }
  resize();

  // Draw a smooth tapered branch polygon from animated points
  function drawTaperedBranch(pts, depth) {
    if (pts.length < 2) return;
    const leftX = [];
    const leftY = [];
    const rightX = [];
    const rightY = [];

    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      let dx, dy;
      if (i === 0) {
        dx = pts[1].ax - p.ax;
        dy = pts[1].ay - p.ay;
      } else if (i === pts.length - 1) {
        dx = p.ax - pts[i - 1].ax;
        dy = p.ay - pts[i - 1].ay;
      } else {
        dx = pts[i + 1].ax - pts[i - 1].ax;
        dy = pts[i + 1].ay - pts[i - 1].ay;
      }
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      const r = p.r * S;
      const px = OX + p.ax * S;
      const py = OY + p.ay * S;
      leftX.push(px + nx * r);
      leftY.push(py + ny * r);
      rightX.push(px - nx * r);
      rightY.push(py - ny * r);
    }

    ctx.beginPath();
    ctx.moveTo(leftX[0], leftY[0]);
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(leftX[i], leftY[i]);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
      ctx.lineTo(rightX[i], rightY[i]);
    }
    ctx.closePath();

    // Warm dark ash-umber bark tone
    ctx.fillStyle = depth === 0 ? '#32251f' : (depth === 1 ? '#362821' : '#3d2e26');
    ctx.fill();

    // Sunlit left bark edge highlight on trunk and primary boughs
    if (depth <= 1) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const px = OX + p.ax * S - p.r * S * 0.38;
        const py = OY + p.ay * S - p.r * S * 0.14;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = depth === 0 ? 'rgba(118, 94, 79, 0.52)' : 'rgba(115, 91, 76, 0.35)';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(0.8, (depth === 0 ? 0.0085 : 0.0038) * S);
      ctx.stroke();
    }

    // Subtle weathered bark grain & moss whisper on lower trunk
    if (depth === 0 && pts.length > 15) {
      ctx.strokeStyle = 'rgba(20, 14, 11, 0.45)';
      ctx.lineWidth = Math.max(0.7, 0.0018 * S);
      for (let k = 2; k < 22; k += 4) {
        const a = pts[k];
        const b = pts[k + 2];
        const off = (k % 8 === 2 ? 0.25 : -0.22) * a.r;
        ctx.beginPath();
        ctx.moveTo(OX + (a.ax + off) * S, OY + a.ay * S);
        ctx.lineTo(OX + (b.ax + off * 0.8) * S, OY + b.ay * S);
        ctx.stroke();
      }
      // Faint lichen kiss near collar
      ctx.fillStyle = 'rgba(128, 152, 92, 0.22)';
      ctx.beginPath();
      ctx.ellipse(OX + (pts[2].ax - 0.011) * S, OY + (pts[2].ay - 0.005) * S, 0.008 * S, 0.016 * S, 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawForegroundMossLip() {
    // Soft moss tufts hugging the very tips of nebari roots
    const tufts = [
      [-0.085, -0.111, 0.015, 0.006, '#587c32'],
      [-0.044, -0.109, 0.014, 0.006, '#648a3a'],
      [0.005,  -0.108, 0.016, 0.006, '#5b7f35'],
      [0.066,  -0.110, 0.016, 0.006, '#4f712d'],
      [0.100,  -0.112, 0.014, 0.006, '#4a6b2a'],
    ];
    for (const [cx, cy, rx, ry, col] of tufts) {
      ctx.beginPath();
      ctx.ellipse(OX + cx * S, OY + cy * S, rx * S, ry * S, 0, Math.PI, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.fill();
    }
  }

  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) * 0.001));
    lastTime = now;
    const t = now * 0.001;

    // Decay pointer breeze smoothly
    pointer.energy *= Math.pow(0.25, dt);
    pointer.vx *= Math.pow(0.15, dt);

    // 1. Update skeletal wind kinematics
    const gust = 0.65 + 0.35 * Math.sin(t * 0.29);
    for (let b = 0; b < branches.length; b++) {
      const br = branches[b];
      const pts = br.pts;

      let anchorX = pts[0].x;
      let anchorY = pts[0].y;
      let parentAngle = 0;
      if (br.parentIdx >= 0) {
        const pBr = branches[br.parentIdx];
        const pPt = pBr.pts[br.attachStep];
        anchorX = pPt.ax;
        anchorY = pPt.ay;
        parentAngle = pBr.swayAngle;
      }

      const originX = pts[0].x;
      const originY = pts[0].y;

      // Multi-octave organic breeze wave passing left-to-right across the canopy
      const spatial = anchorX * 3.2 - anchorY * 2.1 + br.phase * 0.35;
      const wave = Math.sin(t * 0.95 - spatial) * 0.55
                 + Math.sin(t * 1.65 - spatial * 1.3 + 1.4) * 0.30
                 + Math.sin(t * 2.70 + br.phase) * 0.15;

      // Optional pointer local breeze influence
      let pPush = 0;
      if (pointer.energy > 0.02) {
        const dist = Math.hypot(anchorX - pointer.x, anchorY - pointer.y);
        if (dist < 0.32) {
          pPush = pointer.vx * pointer.energy * (1 - dist / 0.32) * 0.25;
        }
      }

      const flex = br.depth === 0 ? 0.0032 : (0.006 + br.depth * 0.0065);
      const localSway = parentAngle + (wave * gust * flex + pPush);
      br.swayAngle = localSway;

      const cosA = Math.cos(localSway);
      const sinA = Math.sin(localSway);

      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const frac = i / Math.max(1, pts.length - 1);
        // Subtle progressive bending along branch length
        const bend = localSway * (0.35 + 0.65 * frac);
        const cb = i === 0 ? cosA : Math.cos(bend);
        const sb = i === 0 ? sinA : Math.sin(bend);
        const dx = p.x - originX;
        const dy = p.y - originY;
        p.ax = anchorX + dx * cb - dy * sb;
        p.ay = anchorY + dx * sb + dy * cb;
      }
    }

    // Clear transparent canvas
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // 2. Draw cached pot, soil, moss, and river stone
    if (potCache) {
      ctx.drawImage(potCache, 0, 0, W, H);
    }

    // 3. Draw back-depth branch & its foliage behind trunk
    for (let b = 0; b < branches.length; b++) {
      if (branches[b].backLayer) {
        drawTaperedBranch(branches[b].pts, branches[b].depth);
      }
    }
    for (let i = 0; i < backLeaves.length; i++) {
      const lf = backLeaves[i];
      const br = branches[lf.bIdx];
      const pt = br.pts[lf.segIdx];
      const cosB = Math.cos(br.swayAngle);
      const sinB = Math.sin(br.swayAngle);
      const lx = pt.ax + lf.offX * cosB - lf.offY * sinB;
      const ly = pt.ay + lf.offX * sinB + lf.offY * cosB;
      const flutter = Math.sin(t * lf.flutterFreq + lf.flutterPhase) * (0.09 + 0.07 * gust);
      const sz = lf.scale * S;
      ctx.save();
      ctx.translate(OX + lx * S, OY + ly * S);
      ctx.rotate(lf.baseAngle + br.swayAngle + flutter);
      ctx.drawImage(leafSprites[lf.spriteIdx], -sz * 0.5, -sz * 0.62, sz, sz);
      ctx.restore();
    }

    // 4. Draw trunk, nebari, primary/secondary branches, and twigs
    for (let b = 0; b < branches.length; b++) {
      if (!branches[b].backLayer) {
        drawTaperedBranch(branches[b].pts, branches[b].depth);
      }
    }

    // 5. Tuck nebari tips gently into foreground moss tufts
    drawForegroundMossLip();

    // 6. Draw main foliage pads (back-to-front layered maple leaves)
    for (let i = 0; i < frontLeaves.length; i++) {
      const lf = frontLeaves[i];
      const br = branches[lf.bIdx];
      const pt = br.pts[lf.segIdx];
      const cosB = Math.cos(br.swayAngle);
      const sinB = Math.sin(br.swayAngle);
      const lx = pt.ax + lf.offX * cosB - lf.offY * sinB;
      const ly = pt.ay + lf.offX * sinB + lf.offY * cosB;
      const flutter = Math.sin(t * lf.flutterFreq + lf.flutterPhase) * (0.10 + 0.09 * gust);
      const sz = lf.scale * S;
      ctx.save();
      ctx.translate(OX + lx * S, OY + ly * S);
      ctx.rotate(lf.baseAngle + br.swayAngle + flutter);
      ctx.drawImage(leafSprites[lf.spriteIdx], -sz * 0.5, -sz * 0.62, sz, sz);
      ctx.restore();
    }

    // 7. Update & draw gently drifting falling maple leaves
    for (let i = 0; i < fallingLeaves.length; i++) {
      const fl = fallingLeaves[i];
      if (fl.delay > 0) {
        fl.delay -= dt;
        continue;
      }
      fl.age += dt;
      const breezeX = (0.012 + 0.018 * gust) * dt;
      fl.x += fl.vx * dt + breezeX + Math.cos(fl.age * fl.swayFreq + fl.swayPhase) * fl.swayAmp * dt;
      fl.y += fl.vy * dt;
      fl.rot += fl.rotVel * dt;

      // Fade smoothly in at release, and out softly before reaching moss/pot
      let alpha = 1;
      if (fl.age < 0.45) alpha = fl.age / 0.45;
      if (fl.y > -0.24) alpha = Math.min(alpha, Math.max(0, (-0.13 - fl.y) / 0.11));

      if (fl.y >= -0.13 || fl.x > 0.42 || fl.x < -0.42) {
        fallingLeaves[i] = spawnFallingLeaf(false);
        continue;
      }

      if (alpha > 0.01) {
        const tilt = 0.42 + 0.58 * Math.abs(Math.cos(fl.age * fl.tiltFreq + fl.tiltPhase));
        const sz = fl.scale * S;
        ctx.save();
        ctx.globalAlpha = alpha * 0.92;
        ctx.translate(OX + fl.x * S, OY + fl.y * S);
        ctx.rotate(fl.rot);
        ctx.scale(1, tilt);
        ctx.drawImage(leafSprites[fl.spriteIdx], -sz * 0.5, -sz * 0.62, sz, sz);
        ctx.restore();
      }
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
