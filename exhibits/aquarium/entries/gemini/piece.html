<!doctype html>
<!-- DUMMY PIECE: hand-written stand-in to exercise the pipeline (SVG + d3 from a CDN). Replace with real model output. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pufferfish</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d3b4f; }
  svg { display: block; width: 100%; height: 100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
<script>
  const svg = d3.select('body').append('svg')
    .attr('viewBox', '-50 -50 100 100')
    .attr('preserveAspectRatio', 'xMidYMid slice');

  const defs = svg.append('defs');
  const sea = defs.append('linearGradient').attr('id', 'sea').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 1);
  sea.append('stop').attr('offset', 0).attr('stop-color', '#1d8a9e');
  sea.append('stop').attr('offset', 1).attr('stop-color', '#0b2f45');
  const skin = defs.append('radialGradient').attr('id', 'skin').attr('cx', '40%').attr('cy', '35%');
  skin.append('stop').attr('offset', 0).attr('stop-color', '#fff4c2');
  skin.append('stop').attr('offset', 1).attr('stop-color', '#d9a441');

  svg.append('rect').attr('x', -50).attr('y', -50).attr('width', 100).attr('height', 100).attr('fill', 'url(#sea)');

  // Rocks and coral along the bottom
  svg.append('g').selectAll('ellipse').data(d3.range(7)).join('ellipse')
    .attr('cx', (i) => -48 + i * 16).attr('cy', 50).attr('rx', (i) => 9 + (i % 3) * 3).attr('ry', (i) => 6 + (i % 2) * 4)
    .attr('fill', (i) => d3.interpolateRgb('#3b4f5c', '#5d6f6a')(i / 6));

  const puffer = svg.append('g');
  const spikes = puffer.append('g').attr('stroke', '#b07a2a').attr('stroke-linecap', 'round');
  const tail = puffer.append('path').attr('fill', '#e6b04f');
  puffer.append('circle').attr('r', 10).attr('fill', 'url(#skin)').attr('class', 'body');
  const spots = puffer.append('g').attr('fill', '#8a5a1c').attr('opacity', 0.55);
  spots.selectAll('circle').data(d3.range(9)).join('circle')
    .attr('cx', (i) => Math.cos(i * 2.4) * (2 + (i % 4) * 1.6) - 1)
    .attr('cy', (i) => Math.sin(i * 2.4) * (2 + (i % 4) * 1.4) - 2.5)
    .attr('r', (i) => 0.6 + (i % 3) * 0.3);
  const fin = puffer.append('ellipse').attr('fill', '#f2c66b').attr('opacity', 0.85);
  puffer.append('circle').attr('cx', 5).attr('cy', -3).attr('r', 2.2).attr('fill', '#fff');
  puffer.append('circle').attr('cx', 5.6).attr('cy', -3).attr('r', 1.2).attr('fill', '#1b1b1b');
  const mouth = puffer.append('ellipse').attr('cx', 9.6).attr('cy', 1).attr('fill', '#7a4a14');

  const N = 30;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function render(elapsed) {
    const t = elapsed / 1000;
    const inflate = Math.max(0, Math.sin(t * 0.7)) ** 2; // mostly calm, sometimes puffs up
    const scale = 1 + inflate * 0.65;
    spikes.selectAll('line').data(d3.range(N)).join('line')
      .attr('stroke-width', 0.6)
      .attr('x1', (i) => Math.cos((i / N) * 2 * Math.PI) * 9)
      .attr('y1', (i) => Math.sin((i / N) * 2 * Math.PI) * 9)
      .attr('x2', (i) => Math.cos((i / N) * 2 * Math.PI) * (10 + inflate * 4))
      .attr('y2', (i) => Math.sin((i / N) * 2 * Math.PI) * (10 + inflate * 4));
    const wag = Math.sin(t * 8) * 2;
    tail.attr('d', `M -9 0 L -16 ${-5 + wag} L -15 0 L -16 ${5 + wag} Z`);
    fin.attr('cx', -1).attr('cy', 4).attr('rx', 3).attr('ry', 1.5 + Math.abs(Math.sin(t * 9)) * 1.5)
      .attr('transform', `rotate(${-20 + Math.sin(t * 9) * 15} -1 4)`);
    mouth.attr('rx', 0.6 + inflate * 0.6).attr('ry', 0.5 + inflate * 0.9);
    const x = Math.sin(t * 0.33) * 22;
    const y = Math.sin(t * 0.52) * 10 - 6;
    const facing = Math.cos(t * 0.33) >= 0 ? 1 : -1;
    puffer.attr('transform', `translate(${x} ${y}) scale(${facing * scale} ${scale})`);
  }

  if (still) render(0);
  else d3.timer(render);
</script>
</body>
</html>
