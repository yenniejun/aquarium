<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Doddering Dumpling Ray</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a2c48}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var sand = [], pebbles = [], plants = [], bubbles = [];
  var cx = 0, cy = 0, fs = 1, rot = 0, lastBlow = 0;
  var pointer = null;
  var rnd = Math.random;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildScenery();
    if (!cx) { cx = W * 0.5; cy = H * 0.42; }
  }

  function buildScenery() {
    sand = [];
    for (var i = 0; i < 260; i++) {
      sand.push({ x: rnd(), y: rnd(), s: 0.6 + rnd() * 1.6, a: 0.15 + rnd() * 0.35 });
    }
    pebbles = [];
    for (var j = 0; j < 22; j++) {
      pebbles.push({ x: rnd(), y: rnd(), r: 0.006 + rnd() * 0.012, tone: rnd() });
    }
    plants = [];
    var fx = [0.04, 0.12, 0.23, 0.7, 0.82, 0.93, 0.5];
    var hh = [0.36, 0.5, 0.28, 0.42, 0.55, 0.3, 0.22];
    for (var k = 0; k < fx.length; k++) {
      plants.push({ fx: fx[k], h: hh[k], ph: rnd() * 6.28, hue: k % 2 ? 'a' : 'b' });
    }
  }

  function floorY() { return H * 0.86; }

  function drawWater(t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#6fd6cf');
    g.addColorStop(0.35, '#2aa3ad');
    g.addColorStop(0.7, '#15577a');
    g.addColorStop(1, '#0a2c48');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // soft light shafts from the surface
    for (var i = 0; i < 5; i++) {
      var x0 = W * (0.12 + 0.19 * i) + Math.sin(t * 0.2 + i * 1.3) * W * 0.035;
      var w = W * (0.035 + 0.01 * Math.sin(t * 0.3 + i));
      var lg = ctx.createLinearGradient(0, 0, 0, H * 0.8);
      lg.addColorStop(0, 'rgba(255,255,225,0.22)');
      lg.addColorStop(1, 'rgba(255,255,225,0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(x0, 0);
      ctx.lineTo(x0 + w, 0);
      ctx.lineTo(x0 + w * 3.2 + W * 0.05, H * 0.8);
      ctx.lineTo(x0 + W * 0.02, H * 0.8);
      ctx.closePath();
      ctx.fill();
    }

    // drifting caustic glints near the surface
    ctx.fillStyle = 'rgba(230,255,250,0.07)';
    for (var c = 0; c < 9; c++) {
      var gx = ((c * 0.17 + t * 0.012 * (1 + (c % 3) * 0.3)) % 1.2 - 0.1) * W;
      var gy = H * 0.05 + Math.sin(t * 0.9 + c * 2.1) * H * 0.025 + (c % 4) * H * 0.02;
      ctx.beginPath();
      ctx.ellipse(gx, gy, W * 0.05, H * 0.008, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSand(t) {
    var fy = floorY();
    ctx.fillStyle = '#c9a46c';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, fy + Math.sin(0) * 2);
    for (var x = 0; x <= W; x += 12) {
      var y = fy + Math.sin(x * 0.012) * H * 0.012 + Math.sin(x * 0.031 + 1.7) * H * 0.006;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    var sg = ctx.createLinearGradient(0, fy - H * 0.02, 0, H);
    sg.addColorStop(0, '#d9b57e');
    sg.addColorStop(1, '#8e6b41');
    ctx.fillStyle = sg;
    ctx.fill();

    for (var i = 0; i < sand.length; i++) {
      var p = sand[i];
      ctx.fillStyle = 'rgba(255,240,200,' + p.a.toFixed(2) + ')';
      ctx.fillRect(p.x * W, fy + p.y * (H - fy), p.s, p.s);
    }
    for (var j = 0; j < pebbles.length; j++) {
      var q = pebbles[j];
      var px = q.x * W;
      var py = fy + q.y * (H - fy) * 0.9 + H * 0.02;
      var pr = q.r * Math.min(W, H) * 1.6 + 2;
      ctx.fillStyle = q.tone > 0.5 ? '#6c7b82' : '#8f7c66';
      ctx.beginPath();
      ctx.ellipse(px, py, pr, pr * 0.65, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath();
      ctx.ellipse(px - pr * 0.25, py - pr * 0.25, pr * 0.35, pr * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlants(t) {
    var fy = floorY();
    for (var i = 0; i < plants.length; i++) {
      var p = plants[i];
      var baseX = p.fx * W;
      var height = p.h * H;
      var segs = 12;
      var amp = height * 0.12;
      var col = p.hue === 'a' ? '#2f8a58' : '#3f9e6a';
      ctx.lineCap = 'round';
      for (var side = 0; side < 2; side++) {
        ctx.strokeStyle = side ? 'rgba(160,240,170,0.35)' : col;
        ctx.lineWidth = Math.max(2, H * 0.012) * (side ? 0.4 : 1);
        ctx.beginPath();
        var x = baseX + (side ? 2 : 0);
        var y = fy + 4;
        ctx.moveTo(x, y);
        for (var s = 1; s <= segs; s++) {
          var f = s / segs;
          var sway = Math.sin(t * 0.9 + p.ph + f * 2.2) * amp * f;
          x = baseX + sway + (side ? 2 : 0);
          y = fy - height * f;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
    ctx.lineCap = 'butt';
  }

  function ruffledBody(r, t) {
    var N = 140;
    ctx.beginPath();
    for (var i = 0; i <= N; i++) {
      var a = (i / N) * Math.PI * 2;
      var wingFlap = 1 + 0.12 * Math.sin(t * 2.6) * Math.abs(Math.cos(a));
      var ruffle = 1 + 0.035 * Math.sin(14 * a - t * 2.2) * Math.abs(Math.sin(a));
      var lobe = 1 + 0.04 * Math.sin(5 * a + t * 1.3);
      var x = Math.cos(a) * r * 1.25 * wingFlap * lobe;
      var y = Math.sin(a) * r * 0.78 * ruffle * (1 + 0.1 * Math.sin(t * 2.6) * Math.abs(Math.cos(a)));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawCreature(t, r) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    var sx = fs;
    if (Math.abs(sx) < 0.04) sx = sx < 0 ? -0.04 : 0.04;
    ctx.scale(sx, 1);

    // tail: a sinuous whip trailing behind
    ctx.strokeStyle = '#d99a62';
    ctx.lineCap = 'round';
    for (var k = 0; k < 3; k++) {
      ctx.lineWidth = r * (0.12 - k * 0.035);
      ctx.beginPath();
      ctx.moveTo(-r * 1.1, 0);
      var seg = 6;
      for (var s = 1; s <= seg; s++) {
        var f = s / seg;
        var tx = -r * 1.1 - f * r * 2.4;
        var ty = Math.sin(t * 4 - f * 5) * r * 0.22 * f + k * r * 0.03;
        ctx.lineTo(tx, ty);
      }
      ctx.stroke();
    }
    ctx.lineCap = 'butt';

    // body
    ruffledBody(r, t);
    var bg = ctx.createRadialGradient(r * 0.3, -r * 0.3, r * 0.1, 0, 0, r * 1.3);
    bg.addColorStop(0, '#fff6cf');
    bg.addColorStop(0.6, '#f7d28e');
    bg.addColorStop(1, '#e89f5f');
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,80,40,0.55)';
    ctx.lineWidth = Math.max(1, r * 0.045);
    ctx.stroke();

    // spots
    var spots = [[-0.4, -0.2, 0.09], [-0.6, 0.25, 0.07], [-0.1, 0.35, 0.06], [0.1, -0.42, 0.05], [-0.85, -0.05, 0.05]];
    ctx.fillStyle = 'rgba(180,100,60,0.22)';
    for (var sp = 0; sp < spots.length; sp++) {
      ctx.beginPath();
      ctx.arc(spots[sp][0] * r, spots[sp][1] * r, spots[sp][2] * r, 0, Math.PI * 2);
      ctx.fill();
    }

    // blush
    ctx.fillStyle = 'rgba(255,120,130,0.3)';
    ctx.beginPath();
    ctx.ellipse(0.25 * r, 0.22 * r, 0.22 * r, 0.12 * r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0.62 * r, 0.26 * r, 0.2 * r, 0.11 * r, 0, 0, Math.PI * 2);
    ctx.fill();

    // eyes, with a slow blink and a glance toward the heading
    var blink = (t % 4.6) < 0.14 ? 0.15 : 1;
    var look = Math.sin(t * 0.5) * 0.04 * r;
    var eyes = [[0.42, -0.3], [0.74, -0.24]];
    for (var e = 0; e < eyes.length; e++) {
      var ex = eyes[e][0] * r, ey = eyes[e][1] * r;
      ctx.fillStyle = '#fffdf4';
      ctx.beginPath();
      ctx.ellipse(ex, ey, r * 0.15, r * 0.15 * blink, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(90,50,30,0.6)';
      ctx.lineWidth = Math.max(1, r * 0.03);
      ctx.stroke();
      if (blink > 0.5) {
        ctx.fillStyle = '#2a1a14';
        ctx.beginPath();
        ctx.arc(ex + r * 0.05 + look, ey + r * 0.01, r * 0.075, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ex + r * 0.08 + look, ey - r * 0.02, r * 0.02, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // a content little smile on the front edge
    ctx.strokeStyle = 'rgba(120,60,35,0.7)';
    ctx.lineWidth = Math.max(1, r * 0.04);
    ctx.beginPath();
    ctx.arc(0.98 * r, -0.02 * r, 0.16 * r, 0.3, Math.PI * 0.85);
    ctx.stroke();

    // spiracles behind the eyes
    ctx.fillStyle = 'rgba(120,60,35,0.35)';
    ctx.beginPath();
    ctx.ellipse(0.12 * r, -0.34 * r, r * 0.05, r * 0.025, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function updateCreature(t, r, dt) {
    var tx = W * 0.5 + Math.sin(t * 0.06) * W * 0.34;
    var ty = H * 0.42 + Math.sin(t * 0.21) * H * 0.08 + Math.sin(t * 0.7) * r * 0.12;
    var ox = 0, oy = 0;
    if (pointer) {
      var dx = cx - pointer.x, dy = cy - pointer.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var reach = r * 3;
      if (d < reach && d > 0.001) {
        var push = (reach - d) / reach * r * 0.9;
        ox = dx / d * push;
        oy = dy / d * push;
      }
    }
    var k = 1 - Math.pow(0.04, dt);
    cx += (tx + ox - cx) * k;
    cy += (ty + oy - cy) * k;

    var face = Math.cos(t * 0.06) >= 0 ? 1 : -1;
    fs += (face - fs) * (1 - Math.pow(0.02, dt));
    rot += ((Math.sin(t * 0.21) * -0.08) - rot) * (1 - Math.pow(0.05, dt));
  }

  function spawnBubble(x, y, size) {
    bubbles.push({ x: x, y: y, r: size, vy: 30 + rnd() * 30, ph: rnd() * 6.28 });
  }

  function updateBubbles(t, dt, r) {
    if (rnd() < dt * 0.6) {
      spawnBubble(rnd() * W, floorY() - rnd() * 10, 1 + rnd() * 2.5);
    }
    if (t - lastBlow > 3.2) {
      lastBlow = t;
      for (var i = 0; i < 3; i++) {
        spawnBubble(cx + fs * r * 1.25 + (rnd() - 0.5) * 4, cy + r * 0.05, 1.5 + rnd() * 2.5);
      }
    }
    for (var j = bubbles.length - 1; j >= 0; j--) {
      var b = bubbles[j];
      b.y -= b.vy * dt * (b.r > 3 ? 1.1 : 1);
      b.x += Math.sin(t * 2 + b.ph) * 8 * dt;
      if (b.y < -10) bubbles.splice(j, 1);
    }
    if (bubbles.length > 160) bubbles.splice(0, bubbles.length - 160);
  }

  function drawBubbles() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      ctx.strokeStyle = 'rgba(220,250,255,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGlass() {
    // a faint vignette keeps the edges moody
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,15,30,0.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  var last = performance.now();
  var start = last;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = (now - start) / 1000;
    var r = Math.max(10, Math.min(W * 0.11, H * 0.16));

    updateCreature(t, r, dt);
    updateBubbles(t, dt, r);

    ctx.clearRect(0, 0, W, H);
    drawWater(t);
    drawPlants(t);
    drawSand(t);
    drawBubbles();
    drawCreature(t, r);
    drawGlass();

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', function (e) {
    pointer = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerleave', function () { pointer = null; });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
