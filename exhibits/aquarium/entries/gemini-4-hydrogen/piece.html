<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07192c;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: auto;
    }
  </style>
</head>
<body>
  <canvas id="tank"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById('tank');
      const ctx = canvas.getContext('2d', { alpha: false });

      let width = 0;
      let height = 0;
      let dpr = 1;
      let unit = 1;
      let time = 0;
      let lastTime = performance.now();

      // Pointer state (gentle curiosity only, never blocks touch scrolling)
      const pointer = {
        x: 0.5,
        y: 0.5,
        active: false,
        lastMoved: -10
      };

      // World elements rebuilt on resize
      let bgCanvas = null;
      let rocks = [];
      let kelps = [];
      let corals = [];
      let motes = [];
      let bubbles = [];
      let doodles = [];

      // Creature state (normalized coordinates 0..1 for responsive scaling)
      const nautilus = {
        x: 0.48,
        y: 0.46,
        vx: 0.04,
        vy: -0.01,
        angle: -0.1,
        targetAngle: -0.1,
        facing: 1, // 1 = shell right / eyes left, -1 = mirrored
        targetX: 0.65,
        targetY: 0.38,
        state: 'wandering', // 'wandering' | 'pondering'
        stateTimer: 3.5,
        jetPhase: 0,
        jetCooldown: 1.4,
        blinkTimer: 2.2,
        blinkProgress: 0,
        eyeLookX: 0,
        eyeLookY: 0,
        tentacles: []
      };

      for (let i = 0; i < 8; i++) {
        nautilus.tentacles.push({
          phase: i * 0.85,
          lengthFactor: 0.78 + (i % 3) * 0.14,
          curl: (i - 3.5) * 0.18,
          thickness: 1 - (i % 4) * 0.12
        });
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function buildScenery() {
        // Offscreen static backdrop for crisp performance
        bgCanvas = document.createElement('canvas');
        bgCanvas.width = Math.max(1, Math.floor(width * dpr));
        bgCanvas.height = Math.max(1, Math.floor(height * dpr));
        const bctx = bgCanvas.getContext('2d');
        bctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Deep twilight water gradient
        const waterGrad = bctx.createLinearGradient(0, 0, 0, height);
        waterGrad.addColorStop(0, '#0c2d48');
        waterGrad.addColorStop(0.42, '#0b253c');
        waterGrad.addColorStop(0.82, '#071b2e');
        waterGrad.addColorStop(1, '#051320');
        bctx.fillStyle = waterGrad;
        bctx.fillRect(0, 0, width, height);

        // Distant underwater silhouettes
        bctx.fillStyle = 'rgba(10, 42, 63, 0.45)';
        bctx.beginPath();
        bctx.moveTo(0, height);
        bctx.lineTo(0, height * 0.76);
        bctx.quadraticCurveTo(width * 0.18, height * 0.66, width * 0.36, height * 0.75);
        bctx.quadraticCurveTo(width * 0.56, height * 0.84, width * 0.78, height * 0.70);
        bctx.quadraticCurveTo(width * 0.90, height * 0.64, width, height * 0.73);
        bctx.lineTo(width, height);
        bctx.closePath();
        bctx.fill();

        // Back sand dune
        const sandBack = bctx.createLinearGradient(0, height * 0.78, 0, height);
        sandBack.addColorStop(0, '#133245');
        sandBack.addColorStop(1, '#091b29');
        bctx.fillStyle = sandBack;
        bctx.beginPath();
        bctx.moveTo(0, height);
        bctx.lineTo(0, height * 0.84);
        bctx.bezierCurveTo(width * 0.25, height * 0.78, width * 0.48, height * 0.89, width * 0.72, height * 0.82);
        bctx.bezierCurveTo(width * 0.86, height * 0.78, width * 0.94, height * 0.83, width, height * 0.81);
        bctx.lineTo(width, height);
        bctx.closePath();
        bctx.fill();

        // Front sand floor
        const sandFront = bctx.createLinearGradient(0, height * 0.84, 0, height);
        sandFront.addColorStop(0, '#193e52');
        sandFront.addColorStop(0.5, '#112c3d');
        sandFront.addColorStop(1, '#0a1c28');
        bctx.fillStyle = sandFront;
        bctx.beginPath();
        bctx.moveTo(0, height);
        bctx.lineTo(0, height * 0.89);
        bctx.bezierCurveTo(width * 0.22, height * 0.93, width * 0.45, height * 0.84, width * 0.68, height * 0.89);
        bctx.bezierCurveTo(width * 0.85, height * 0.92, width * 0.93, height * 0.87, width, height * 0.88);
        bctx.lineTo(width, height);
        bctx.closePath();
        bctx.fill();

        // Subtle sand ripples
        bctx.strokeStyle = 'rgba(130, 215, 220, 0.06)';
        bctx.lineWidth = Math.max(1, unit * 0.003);
        for (let i = 0; i < 6; i++) {
          const ry = height * (0.89 + i * 0.018);
          bctx.beginPath();
          bctx.moveTo(width * (0.05 + (i % 2) * 0.08), ry);
          bctx.quadraticCurveTo(width * 0.5, ry + unit * 0.012 * (i % 2 === 0 ? 1 : -1), width * 0.92, ry);
          bctx.stroke();
        }

        // Smooth slate rocks & pebbles
        rocks = [
          { x: 0.14, y: 0.89, rx: 0.09, ry: 0.045, rot: -0.08, c1: '#23465a', c2: '#112838' },
          { x: 0.20, y: 0.875, rx: 0.055, ry: 0.03, rot: 0.12, c1: '#2d556b', c2: '#153042' },
          { x: 0.10, y: 0.91, rx: 0.045, ry: 0.025, rot: 0.04, c1: '#1d3c4e', c2: '#0f2330' },
          { x: 0.79, y: 0.89, rx: 0.08, ry: 0.042, rot: 0.09, c1: '#254a5e', c2: '#122a3a' },
          { x: 0.72, y: 0.905, rx: 0.045, ry: 0.025, rot: -0.15, c1: '#2e586e', c2: '#163142' },
          { x: 0.49, y: 0.915, rx: 0.036, ry: 0.018, rot: 0.05, c1: '#284f63', c2: '#142c3b' },
          { x: 0.53, y: 0.923, rx: 0.022, ry: 0.013, rot: -0.1, c1: '#315d73', c2: '#183546' }
        ];

        for (const r of rocks) {
          bctx.save();
          bctx.translate(r.x * width, r.y * height);
          bctx.rotate(r.rot);
          const rg = bctx.createLinearGradient(0, -r.ry * height, 0, r.ry * height);
          rg.addColorStop(0, r.c1);
          rg.addColorStop(1, r.c2);
          bctx.fillStyle = rg;
          bctx.beginPath();
          bctx.ellipse(0, 0, r.rx * width, r.ry * height, 0, 0, Math.PI * 2);
          bctx.fill();

          // Soft top rim highlight
          bctx.strokeStyle = 'rgba(155, 225, 230, 0.14)';
          bctx.lineWidth = Math.max(1, unit * 0.0025);
          bctx.beginPath();
          bctx.ellipse(0, 0, r.rx * width * 0.96, r.ry * height * 0.92, 0, Math.PI * 1.1, Math.PI * 1.9);
          bctx.stroke();
          bctx.restore();
        }
      }

      function initWorld() {
        kelps = [
          { x: 0.08, y: 0.90, h: 0.52, w: 0.022, blades: 2, hue: 168, phase: 0.2 },
          { x: 0.13, y: 0.89, h: 0.36, w: 0.018, blades: 1, hue: 178, phase: 1.4 },
          { x: 0.26, y: 0.90, h: 0.28, w: 0.015, blades: 1, hue: 160, phase: 2.3 },
          { x: 0.84, y: 0.89, h: 0.48, w: 0.022, blades: 2, hue: 172, phase: 0.9 },
          { x: 0.91, y: 0.89, h: 0.60, w: 0.024, blades: 2, hue: 164, phase: 2.1 },
          { x: 0.76, y: 0.90, h: 0.24, w: 0.014, blades: 1, hue: 184, phase: 3.1 }
        ];

        corals = [
          { x: 0.21, y: 0.855, scale: 1.0, stalks: 5, color: '#ff9e7d', glowColor: '255, 165, 130', phase: 0.4, excite: 0 },
          { x: 0.77, y: 0.855, scale: 0.88, stalks: 4, color: '#7be3e8', glowColor: '123, 227, 232', phase: 1.8, excite: 0 },
          { x: 0.47, y: 0.905, scale: 0.72, stalks: 3, color: '#cfa8ff', glowColor: '207, 168, 255', phase: 2.9, excite: 0 }
        ];

        motes = [];
        for (let i = 0; i < 38; i++) {
          motes.push({
            x: Math.random(),
            y: Math.random(),
            r: rand(0.0018, 0.0052),
            speedY: -rand(0.004, 0.014),
            driftAmp: rand(0.003, 0.012),
            driftFreq: rand(0.4, 1.3),
            phase: rand(0, Math.PI * 2),
            hue: i % 3 === 0 ? '160, 245, 235' : (i % 3 === 1 ? '255, 215, 160' : '185, 215, 255'),
            alpha: rand(0.25, 0.75)
          });
        }
      }

      function spawnBubble(x, y, sizeFactor = 1, vx = 0, vy = -0.05) {
        if (bubbles.length > 35) return;
        bubbles.push({
          x,
          y,
          r: rand(0.004, 0.009) * sizeFactor,
          vx: vx + rand(-0.012, 0.012),
          vy: vy - rand(0.03, 0.06),
          wobblePhase: rand(0, Math.PI * 2),
          life: 1
        });
      }

      function spawnDoodle(x, y, facing) {
        if (doodles.length > 8) return;
        doodles.push({
          x,
          y,
          vx: facing * -0.018 + rand(-0.008, 0.008),
          vy: -0.022,
          age: 0,
          maxAge: 3.4,
          scale: rand(0.85, 1.15),
          spin: rand(-0.4, 0.4),
          hue: Math.random() < 0.5 ? '145, 245, 235' : '255, 210, 155'
        });
      }

      function resize() {
        width = window.innerWidth || document.documentElement.clientWidth;
        height = window.innerHeight || document.documentElement.clientHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        unit = Math.min(width, height);

        canvas.width = Math.max(1, Math.floor(width * dpr));
        canvas.height = Math.max(1, Math.floor(height * dpr));

        buildScenery();
      }

      function pickNewTarget() {
        // Occasionally inspect a coral cluster or open twilight water
        const r = Math.random();
        if (r < 0.35 && corals.length > 0) {
          const c = corals[Math.floor(Math.random() * corals.length)];
          nautilus.targetX = clamp(c.x + rand(-0.08, 0.08), 0.16, 0.84);
          nautilus.targetY = clamp(c.y - rand(0.14, 0.24), 0.18, 0.72);
        } else {
          nautilus.targetX = rand(0.18, 0.82);
          nautilus.targetY = rand(0.18, 0.68);
        }
      }

      function update(dt) {
        time += dt;

        // Pointer influence timeout
        if (pointer.active && time - pointer.lastMoved > 4.5) {
          pointer.active = false;
        }

        // Update corals excitement when nautilus is close
        for (const c of corals) {
          const dist = Math.hypot(nautilus.x - c.x, nautilus.y - c.y);
          const targetExcite = dist < 0.24 ? (1 - dist / 0.24) : 0;
          c.excite = lerp(c.excite, targetExcite, dt * 3);
        }

        // Update motes
        for (const m of motes) {
          m.y += m.speedY * dt;
          m.x += Math.sin(time * m.driftFreq + m.phase) * m.driftAmp * dt;
          if (m.y < -0.04) {
            m.y = 1.04;
            m.x = Math.random();
          }
          if (m.x < -0.02) m.x = 1.02;
          if (m.x > 1.02) m.x = -0.02;
        }

        // Update bubbles
        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          b.x += (b.vx + Math.sin(time * 5 + b.wobblePhase) * 0.015) * dt;
          b.y += b.vy * dt;
          b.vx *= Math.pow(0.25, dt);
          b.vy = lerp(b.vy, -0.09, dt * 1.5);
          b.life -= dt * 0.25;
          if (b.y < 0.03 || b.life <= 0) {
            bubbles.splice(i, 1);
          }
        }

        // Update luminous spiral doodles
        for (let i = doodles.length - 1; i >= 0; i--) {
          const d = doodles[i];
          d.age += dt;
          d.x += (d.vx + Math.sin(time * 2 + i) * 0.008) * dt;
          d.y += d.vy * dt;
          d.vx *= Math.pow(0.4, dt);
          if (d.age >= d.maxAge || d.y < 0.05) {
            doodles.splice(i, 1);
          }
        }

        // Creature state machine
        nautilus.stateTimer -= dt;
        if (nautilus.stateTimer <= 0) {
          if (nautilus.state === 'wandering') {
            nautilus.state = 'pondering';
            nautilus.stateTimer = rand(1.8, 3.2);
            // Blow a luminous spiral doodle while pondering
            const mouthX = nautilus.x - nautilus.facing * 0.06;
            const mouthY = nautilus.y + 0.02;
            spawnDoodle(mouthX, mouthY, nautilus.facing);
          } else {
            nautilus.state = 'wandering';
            nautilus.stateTimer = rand(3.5, 6.0);
            pickNewTarget();
          }
        }

        // Follow pointer gently if active
        let goalX = nautilus.targetX;
        let goalY = nautilus.targetY;
        if (pointer.active) {
          goalX = clamp(pointer.x + (nautilus.x > pointer.x ? 0.1 : -0.1), 0.16, 0.84);
          goalY = clamp(pointer.y, 0.16, 0.72);
        }

        const dx = goalX - nautilus.x;
        const dy = goalY - nautilus.y;
        const dist = Math.hypot(dx, dy);

        // Jet-propulsion rhythm
        nautilus.jetCooldown -= dt;
        if (nautilus.jetCooldown <= 0) {
          nautilus.jetPhase = 1.0;
          nautilus.jetCooldown = nautilus.state === 'wandering' ? rand(1.3, 2.0) : rand(2.2, 3.0);

          if (dist > 0.03) {
            const nx = dx / dist;
            const ny = dy / dist;
            const impulse = nautilus.state === 'wandering' ? 0.075 : 0.025;
            nautilus.vx += nx * impulse;
            nautilus.vy += ny * impulse;

            // Puff tiny siphon bubbles away from movement direction
            const siphonX = nautilus.x - nautilus.facing * 0.04;
            const siphonY = nautilus.y + 0.035;
            spawnBubble(siphonX, siphonY, 0.75, -nx * 0.04, -0.02);
            if (Math.random() < 0.6) {
              spawnBubble(siphonX, siphonY, 0.5, -nx * 0.03, -0.03);
            }
          }
        }
        nautilus.jetPhase = Math.max(0, nautilus.jetPhase - dt * 2.2);

        // Gentle steering & water drag
        if (dist > 0.02) {
          const pull = nautilus.state === 'wandering' ? 0.09 : 0.03;
          nautilus.vx += (dx / dist) * pull * dt;
          nautilus.vy += (dy / dist) * pull * dt;
        }
        // Subtle bobbing
        nautilus.vy += Math.sin(time * 1.9) * 0.015 * dt;

        const drag = Math.pow(0.28, dt);
        nautilus.vx *= drag;
        nautilus.vy *= drag;

        nautilus.x += nautilus.vx * dt;
        nautilus.y += nautilus.vy * dt;

        // Soft tank boundaries
        if (nautilus.x < 0.15) { nautilus.x = 0.15; nautilus.vx = Math.abs(nautilus.vx) * 0.6 + 0.02; }
        if (nautilus.x > 0.85) { nautilus.x = 0.85; nautilus.vx = -Math.abs(nautilus.vx) * 0.6 - 0.02; }
        if (nautilus.y < 0.15) { nautilus.y = 0.15; nautilus.vy = Math.abs(nautilus.vy) * 0.6 + 0.01; }
        if (nautilus.y > 0.74) { nautilus.y = 0.74; nautilus.vy = -Math.abs(nautilus.vy) * 0.6 - 0.01; }

        // Facing direction (eyes face the direction of travel or pointer)
        const lookBiasX = pointer.active ? (pointer.x - nautilus.x) : nautilus.vx;
        if (Math.abs(lookBiasX) > 0.012) {
          // facing = 1 means eyes on left, shell on right; facing = -1 means eyes on right
          nautilus.facing = lookBiasX < 0 ? 1 : -1;
        }

        // Gentle shell tilt
        const desiredAngle = clamp(nautilus.vy * 1.8, -0.24, 0.24) + Math.sin(time * 1.5) * 0.04;
        nautilus.angle = lerp(nautilus.angle, desiredAngle, dt * 3.5);

        // Eye tracking
        let lookX = nautilus.vx * 3;
        let lookY = nautilus.vy * 3;
        if (pointer.active) {
          lookX = clamp((pointer.x - nautilus.x) * 3, -1, 1);
          lookY = clamp((pointer.y - nautilus.y) * 3, -1, 1);
        }
        nautilus.eyeLookX = lerp(nautilus.eyeLookX, clamp(lookX, -1, 1), dt * 6);
        nautilus.eyeLookY = lerp(nautilus.eyeLookY, clamp(lookY, -1, 1), dt * 6);

        // Blinking
        nautilus.blinkTimer -= dt;
        if (nautilus.blinkTimer <= 0) {
          nautilus.blinkProgress += dt * 5.2;
          if (nautilus.blinkProgress >= Math.PI) {
            nautilus.blinkProgress = 0;
            nautilus.blinkTimer = Math.random() < 0.25 ? 0.25 : rand(2.4, 5.0);
          }
        }
      }

      function drawLightShafts() {
        ctx.save();
        for (let i = 0; i < 4; i++) {
          const sway = Math.sin(time * 0.35 + i * 1.6) * 0.04;
          const topX = width * (0.14 + i * 0.23 + sway);
          const botX = topX + width * 0.18;
          const topW = width * (0.07 + (i % 2) * 0.03);
          const botW = width * (0.19 + (i % 2) * 0.04);

          const grad = ctx.createLinearGradient(topX, 0, botX, height * 0.88);
          const alpha = 0.055 + Math.sin(time * 0.6 + i) * 0.015;
          grad.addColorStop(0, `rgba(155, 240, 235, ${alpha})`);
          grad.addColorStop(0.65, `rgba(110, 215, 220, ${alpha * 0.45})`);
          grad.addColorStop(1, 'rgba(90, 190, 210, 0)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(topX - topW * 0.5, 0);
          ctx.lineTo(topX + topW * 0.5, 0);
          ctx.lineTo(botX + botW * 0.5, height * 0.92);
          ctx.lineTo(botX - botW * 0.5, height * 0.92);
          ctx.closePath();
          ctx.fill();
        }

        // Subtle surface water shimmer line at top
        const surfGrad = ctx.createLinearGradient(0, 0, 0, height * 0.07);
        surfGrad.addColorStop(0, 'rgba(170, 245, 240, 0.14)');
        surfGrad.addColorStop(1, 'rgba(170, 245, 240, 0)');
        ctx.fillStyle = surfGrad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(width, 0);
        for (let x = width; x >= 0; x -= width / 14) {
          const waveY = height * 0.035 + Math.sin(x * 0.018 + time * 1.8) * height * 0.008;
          ctx.lineTo(x, waveY);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawKelp() {
        for (const k of kelps) {
          for (let b = 0; b < k.blades; b++) {
            const baseX = (k.x + b * 0.018) * width;
            const baseY = k.y * height;
            const bladeH = k.h * (b === 0 ? 1 : 0.72) * height;
            const bladeW = k.w * unit;
            const segs = 12;

            const leftPts = [];
            const rightPts = [];

            for (let s = 0; s <= segs; s++) {
              const t = s / segs;
              const sway = Math.sin(time * 1.25 + k.phase + b * 0.9 - t * 2.6) * (t * t) * width * 0.035;
              const px = baseX + sway;
              const py = baseY - t * bladeH;
              const halfW = bladeW * Math.sin(t * Math.PI * 0.88 + 0.12) * (1 - t * 0.35);
              leftPts.push({ x: px - halfW, y: py });
              rightPts.push({ x: px + halfW, y: py });
            }

            const kg = ctx.createLinearGradient(baseX, baseY, baseX, baseY - bladeH);
            kg.addColorStop(0, `hsla(${k.hue}, 52%, 18%, 0.95)`);
            kg.addColorStop(0.55, `hsla(${k.hue}, 58%, 30%, 0.88)`);
            kg.addColorStop(1, `hsla(${k.hue + 10}, 75%, 52%, 0.82)`);

            ctx.fillStyle = kg;
            ctx.beginPath();
            ctx.moveTo(leftPts[0].x, leftPts[0].y);
            for (let s = 1; s <= segs; s++) {
              ctx.lineTo(leftPts[s].x, leftPts[s].y);
            }
            for (let s = segs; s >= 0; s--) {
              ctx.lineTo(rightPts[s].x, rightPts[s].y);
            }
            ctx.closePath();
            ctx.fill();

            // Delicate central vein
            ctx.strokeStyle = `hsla(${k.hue + 12}, 80%, 66%, 0.22)`;
            ctx.lineWidth = Math.max(1, unit * 0.002);
            ctx.beginPath();
            for (let s = 0; s <= segs; s++) {
              const mx = (leftPts[s].x + rightPts[s].x) * 0.5;
              const my = leftPts[s].y;
              if (s === 0) ctx.moveTo(mx, my);
              else ctx.lineTo(mx, my);
            }
            ctx.stroke();
          }
        }
      }

      function drawCorals() {
        for (const c of corals) {
          const cx = c.x * width;
          const cy = c.y * height;
          const pulse = 0.55 + 0.25 * Math.sin(time * 2.0 + c.phase) + c.excite * 0.5;

          // Soft ambient glow halo
          const haloR = unit * 0.095 * c.scale * (1 + c.excite * 0.25);
          const halo = ctx.createRadialGradient(cx, cy - haloR * 0.25, 0, cx, cy - haloR * 0.25, haloR);
          halo.addColorStop(0, `rgba(${c.glowColor}, ${0.24 * pulse})`);
          halo.addColorStop(1, `rgba(${c.glowColor}, 0)`);
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(cx, cy - haloR * 0.25, haloR, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < c.stalks; i++) {
            const spread = (i - (c.stalks - 1) / 2) * 0.34;
            const stalkLen = unit * (0.055 + (i % 2) * 0.018) * c.scale;
            const sway = Math.sin(time * 1.7 + c.phase + i) * 0.08;
            const tipX = cx + Math.sin(spread + sway) * stalkLen;
            const tipY = cy - Math.cos(spread * 0.65) * stalkLen;
            const ctrlX = cx + Math.sin(spread * 0.5) * stalkLen * 0.45;
            const ctrlY = cy - stalkLen * 0.55;

            ctx.strokeStyle = 'rgba(35, 82, 98, 0.9)';
            ctx.lineWidth = Math.max(1.5, unit * 0.007 * c.scale);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx, cy + unit * 0.015);
            ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
            ctx.stroke();

            // Glowing bulb tip
            const tipR = unit * 0.011 * c.scale * (0.92 + 0.14 * Math.sin(time * 2.4 + i));
            const tg = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, tipR * 1.8);
            tg.addColorStop(0, '#ffffff');
            tg.addColorStop(0.35, c.color);
            tg.addColorStop(1, `rgba(${c.glowColor}, 0)`);
            ctx.fillStyle = tg;
            ctx.beginPath();
            ctx.arc(tipX, tipY, tipR * 1.8, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawMotes() {
        for (const m of motes) {
          const twinkle = 0.55 + 0.45 * Math.sin(time * 2.5 + m.phase);
          const x = m.x * width;
          const y = m.y * height;
          const r = m.r * unit * (1 + twinkle * 0.4);
          const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.4);
          g.addColorStop(0, `rgba(${m.hue}, ${m.alpha * twinkle})`);
          g.addColorStop(1, `rgba(${m.hue}, 0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r * 2.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawBubbles() {
        for (const b of bubbles) {
          const x = b.x * width;
          const y = b.y * height;
          const r = b.r * unit;
          const a = clamp(b.life, 0, 1);

          ctx.save();
          ctx.globalAlpha = a * 0.85;
          ctx.strokeStyle = 'rgba(185, 245, 250, 0.78)';
          ctx.lineWidth = Math.max(1, unit * 0.002);
          ctx.fillStyle = 'rgba(155, 235, 245, 0.14)';
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Tiny bubble highlight
          ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.beginPath();
          ctx.arc(x - r * 0.32, y - r * 0.32, r * 0.24, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawDoodles() {
        for (const d of doodles) {
          const progress = d.age / d.maxAge;
          const alpha = Math.sin(progress * Math.PI) * 0.85;
          const x = d.x * width;
          const y = d.y * height;
          const s = unit * 0.022 * d.scale * (0.65 + progress * 0.55);

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(d.age * d.spin);

          // Soft glow behind spiral doodle
          const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 1.8);
          glow.addColorStop(0, `rgba(${d.hue}, ${alpha * 0.32})`);
          glow.addColorStop(1, `rgba(${d.hue}, 0)`);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, s * 1.8, 0, Math.PI * 2);
          ctx.fill();

          // Luminous little spiral curlicue
          ctx.strokeStyle = `rgba(${d.hue}, ${alpha})`;
          ctx.lineWidth = Math.max(1.2, unit * 0.0032);
          ctx.lineCap = 'round';
          ctx.beginPath();
          const turns = 2.1;
          const steps = 26;
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const ang = t * Math.PI * 2 * turns;
            const rad = t * s;
            const px = Math.cos(ang) * rad;
            const py = Math.sin(ang) * rad;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawNautilus() {
        const cx = nautilus.x * width;
        const cy = nautilus.y * height;
        const size = unit * 0.125; // Base radius scale
        const jetSquash = 1 - nautilus.jetPhase * 0.06;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(nautilus.facing, 1);
        ctx.rotate(nautilus.angle);
        ctx.scale(jetSquash, 1 / Math.sqrt(jetSquash));

        // Subtle ambient aura around the curious creature
        const aura = ctx.createRadialGradient(0, 0, size * 0.2, 0, 0, size * 1.75);
        aura.addColorStop(0, 'rgba(135, 225, 235, 0.11)');
        aura.addColorStop(1, 'rgba(135, 225, 235, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, size * 1.75, 0, Math.PI * 2);
        ctx.fill();

        // 1. Wiggly noodle tentacles (drawn behind hood)
        const speedMag = Math.hypot(nautilus.vx, nautilus.vy);
        const trailPull = clamp(speedMag * 2.5, 0, 0.65);

        for (let i = 0; i < nautilus.tentacles.length; i++) {
          const t = nautilus.tentacles[i];
          const baseY = size * (-0.08 + i * 0.078);
          const baseX = -size * (0.42 + (i % 2) * 0.04);
          const len = size * 0.88 * t.lengthFactor;
          const freq = nautilus.state === 'pondering' ? 3.2 : 4.5;
          const wave1 = Math.sin(time * freq + t.phase) * size * 0.14;
          const wave2 = Math.cos(time * (freq * 0.85) + t.phase * 1.3) * size * 0.18;

          const cp1x = baseX - len * 0.45;
          const cp1y = baseY + wave1 + t.curl * size * 0.2;
          const cp2x = baseX - len * 0.78;
          const cp2y = baseY + wave2 + t.curl * size * 0.35 - trailPull * size * 0.1;
          const endX = baseX - len * (0.95 + trailPull * 0.2);
          const endY = baseY + wave2 * 1.15 + t.curl * size * 0.48;

          // Tentacle body
          ctx.strokeStyle = i % 2 === 0 ? '#e6a89b' : '#d69086';
          ctx.lineWidth = Math.max(1.5, size * 0.068 * t.thickness);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(baseX, baseY);
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, endX, endY);
          ctx.stroke();

          // Luminous tiny tentacle tip dot
          ctx.fillStyle = 'rgba(255, 228, 200, 0.78)';
          ctx.beginPath();
          ctx.arc(endX, endY, Math.max(1, size * 0.025 * t.thickness), 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. Siphon funnel tucked below face
        ctx.fillStyle = '#cf8b80';
        ctx.beginPath();
        ctx.moveTo(-size * 0.32, size * 0.34);
        ctx.quadraticCurveTo(-size * 0.56, size * 0.42, -size * 0.62, size * 0.50);
        ctx.quadraticCurveTo(-size * 0.42, size * 0.52, -size * 0.22, size * 0.42);
        ctx.closePath();
        ctx.fill();

        // 3. Soft fleshy body/collar under shell opening
        const bodyGrad = ctx.createLinearGradient(-size * 0.55, -size * 0.3, -size * 0.05, size * 0.45);
        bodyGrad.addColorStop(0, '#f0c8ba');
        bodyGrad.addColorStop(1, '#d18e84');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(-size * 0.28, size * 0.14, size * 0.34, size * 0.32, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // 4. Protective speckled hood on top of face
        const hoodGrad = ctx.createLinearGradient(-size * 0.55, -size * 0.55, -size * 0.05, -size * 0.05);
        hoodGrad.addColorStop(0, '#e39b86');
        hoodGrad.addColorStop(1, '#b86452');
        ctx.fillStyle = hoodGrad;
        ctx.beginPath();
        ctx.moveTo(-size * 0.58, -size * 0.06);
        ctx.quadraticCurveTo(-size * 0.48, -size * 0.48, -size * 0.02, -size * 0.46);
        ctx.quadraticCurveTo(-size * 0.05, -size * 0.10, -size * 0.36, -size * 0.04);
        ctx.closePath();
        ctx.fill();

        // Little freckles on hood
        ctx.fillStyle = 'rgba(255, 236, 214, 0.42)';
        const spots = [[-0.36, -0.25, 0.032], [-0.24, -0.32, 0.026], [-0.44, -0.16, 0.022]];
        for (const [sx, sy, sr] of spots) {
          ctx.beginPath();
          ctx.arc(size * sx, size * sy, size * sr, 0, Math.PI * 2);
          ctx.fill();
        }

        // 5. Pearlescent chambered spiral shell
        ctx.save();
        ctx.translate(size * 0.16, -size * 0.05);

        // Outer shell silhouette
        const shellGrad = ctx.createRadialGradient(-size * 0.12, -size * 0.18, size * 0.08, 0, 0, size * 0.72);
        shellGrad.addColorStop(0, '#fffaf0');
        shellGrad.addColorStop(0.55, '#f2e4ce');
        shellGrad.addColorStop(0.88, '#d9bfa0');
        shellGrad.addColorStop(1, '#a8866c');

        ctx.fillStyle = shellGrad;
        ctx.beginPath();
        const shellPts = [];
        const totalSteps = 72;
        for (let i = 0; i <= totalSteps; i++) {
          const t = i / totalSteps;
          const theta = -0.35 + t * Math.PI * 2.05;
          const rad = size * (0.20 + 0.46 * Math.pow(t, 0.85));
          shellPts.push({
            x: Math.cos(theta) * rad,
            y: Math.sin(theta) * rad
          });
        }
        ctx.moveTo(0, 0);
        for (const p of shellPts) ctx.lineTo(p.x, p.y);
        ctx.closePath();
        ctx.fill();

        // Clip inside shell to draw tiger-stripes & iridescent sheen
        ctx.save();
        ctx.clip();

        // Radiating burnt-sienna chamber stripes
        const stripeCount = 14;
        for (let i = 0; i < stripeCount; i++) {
          const ang = -0.2 + (i / stripeCount) * Math.PI * 2.0;
          const rInner = size * 0.16;
          const rOuter = size * 0.76;
          const wobble = Math.sin(i * 1.7) * 0.06;

          ctx.strokeStyle = i % 2 === 0 ? 'rgba(196, 98, 66, 0.56)' : 'rgba(218, 128, 86, 0.42)';
          ctx.lineWidth = Math.max(1.5, size * (0.048 + (i / stripeCount) * 0.032));
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * rInner, Math.sin(ang) * rInner);
          ctx.quadraticCurveTo(
            Math.cos(ang + 0.16 + wobble) * (rInner + rOuter) * 0.52,
            Math.sin(ang + 0.16 + wobble) * (rInner + rOuter) * 0.52,
            Math.cos(ang + 0.08) * rOuter,
            Math.sin(ang + 0.08) * rOuter
          );
          ctx.stroke();
        }

        // Subtle pearlescent cyan-lavender sheen on top arc
        const sheen = ctx.createRadialGradient(-size * 0.15, -size * 0.25, size * 0.04, -size * 0.1, -size * 0.2, size * 0.55);
        sheen.addColorStop(0, 'rgba(180, 250, 245, 0.34)');
        sheen.addColorStop(0.5, 'rgba(210, 195, 255, 0.14)');
        sheen.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = sheen;
        ctx.fillRect(-size, -size, size * 2, size * 2);

        ctx.restore();

        // Crisp inner spiral line & outer shell contour
        ctx.strokeStyle = 'rgba(112, 70, 52, 0.55)';
        ctx.lineWidth = Math.max(1.2, size * 0.025);
        ctx.beginPath();
        for (let i = 0; i <= 60; i++) {
          const t = i / 60;
          const theta = t * Math.PI * 3.8;
          const rad = size * 0.64 * Math.pow(t, 1.35);
          const px = Math.cos(theta) * rad;
          const py = Math.sin(theta) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Dark umbilicus center
        ctx.fillStyle = '#5e3c2f';
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.075, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore(); // End shell

        // 6. Big expressive blinking eye
        const eyeX = -size * 0.34;
        const eyeY = size * 0.06;
        const eyeR = size * 0.135;
        const blinkScaleY = 1 - Math.sin(nautilus.blinkProgress) * 0.88;

        ctx.save();
        ctx.translate(eyeX, eyeY);
        ctx.scale(1, blinkScaleY);

        // Eye socket shadow
        ctx.fillStyle = 'rgba(130, 72, 65, 0.35)';
        ctx.beginPath();
        ctx.arc(0, 0, eyeR * 1.15, 0, Math.PI * 2);
        ctx.fill();

        // Cream sclera
        ctx.fillStyle = '#fff9ee';
        ctx.beginPath();
        ctx.arc(0, 0, eyeR, 0, Math.PI * 2);
        ctx.fill();

        // Pupil tracks movement or pointer
        const px = nautilus.eyeLookX * nautilus.facing * eyeR * 0.28;
        const py = nautilus.eyeLookY * eyeR * 0.28;
        ctx.fillStyle = '#142230';
        ctx.beginPath();
        ctx.arc(px, py, eyeR * 0.58, 0, Math.PI * 2);
        ctx.fill();

        // Bright catchlight
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px - eyeR * 0.18, py - eyeR * 0.2, eyeR * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px + eyeR * 0.18, py + eyeR * 0.18, eyeR * 0.09, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Tiny rosy cheek dot below eye
        ctx.fillStyle = 'rgba(255, 150, 145, 0.38)';
        ctx.beginPath();
        ctx.ellipse(-size * 0.36, size * 0.22, size * 0.065, size * 0.038, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function render() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Static twilight background + sand + rocks
        if (bgCanvas) {
          ctx.drawImage(bgCanvas, 0, 0, width, height);
        }

        drawLightShafts();
        drawKelp();
        drawCorals();
        drawMotes();
        drawDoodles();
        drawNautilus();
        drawBubbles();
      }

      function loop(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;

        update(dt);
        render();

        requestAnimationFrame(loop);
      }

      function handlePointerMove(e) {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        pointer.x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
        pointer.y = clamp((e.clientY - rect.top) / rect.height, 0, 1);
        pointer.active = true;
        pointer.lastMoved = time;
      }

      window.addEventListener('resize', resize);
      canvas.addEventListener('pointermove', handlePointerMove, { passive: true });
      canvas.addEventListener('pointerleave', () => {
        pointer.active = false;
      }, { passive: true });

      initWorld();
      resize();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
