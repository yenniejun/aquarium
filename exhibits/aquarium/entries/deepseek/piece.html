<!doctype html>
<!-- DUMMY PIECE: hand-written stand-in to exercise the pipeline (HTML + CSS only, no JavaScript). Replace with real model output. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shore Crab</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(255,255,255,.18), transparent 70%),
      linear-gradient(#2b8fb3, #12506e 70%, #0c3a50);
  }
  .sand {
    position: absolute; left: -5%; right: -5%; bottom: 0; height: 26vmin;
    border-radius: 50% 50% 0 0 / 4vmin 4vmin 0 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,.08) 0 .5vmin, transparent .6vmin) 0 0 / 7vmin 5vmin,
      linear-gradient(#f0d9a0, #d9b878);
  }
  .shell-deco {
    position: absolute; bottom: 8vmin; right: 18%; width: 7vmin; height: 5vmin;
    border-radius: 50% 50% 10% 10%;
    background: repeating-linear-gradient(90deg, #f6c7b6 0 .8vmin, #e9a48f .8vmin 1.4vmin);
  }
  .weed {
    position: absolute; bottom: 20vmin; left: 12%; width: 3vmin; height: 34vmin;
    border-radius: 50% 50% 0 0; background: linear-gradient(90deg, #2f8f5b, #4fbf7f);
    transform-origin: bottom center; animation: sway 4s ease-in-out infinite alternate;
  }
  .weed:nth-of-type(2) { left: 18%; height: 24vmin; animation-delay: -1.5s; }
  @keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }

  .bubble {
    position: absolute; bottom: 20vmin; width: 2vmin; height: 2vmin; border-radius: 50%;
    border: .3vmin solid rgba(255,255,255,.6); animation: rise 6s linear infinite;
  }
  .bubble:nth-of-type(4) { left: 70%; animation-delay: -1s; }
  .bubble:nth-of-type(5) { left: 74%; width: 1.3vmin; height: 1.3vmin; animation-delay: -3s; }
  .bubble:nth-of-type(6) { left: 30%; animation-delay: -4.5s; }
  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-80vmin); opacity: 0; } }

  /* The crab: scuttles back and forth, legs ticking, claws snapping. */
  .crab {
    position: absolute; left: 50%; bottom: 17vmin; width: 28vmin; height: 18vmin; margin-left: -14vmin;
    animation: scuttle 7s ease-in-out infinite;
  }
  @keyframes scuttle {
    0%, 100% { transform: translateX(-26vmin); }
    40%, 50% { transform: translateX(22vmin); }
  }
  .shell {
    position: absolute; left: 4vmin; right: 4vmin; top: 5vmin; bottom: 3vmin;
    border-radius: 50% 50% 42% 42% / 62% 62% 38% 38%;
    background: radial-gradient(circle at 40% 30%, #ff9a7a, #e0442b 55%, #a92614);
    box-shadow: inset 0 -1vmin 1.5vmin rgba(0,0,0,.25);
    z-index: 2;
  }
  .eye {
    position: absolute; top: 1vmin; width: 1vmin; height: 5vmin; background: #c9381f; z-index: 1;
  }
  .eye.l { left: 10vmin; } .eye.r { right: 10vmin; }
  .eye::after {
    content: ''; position: absolute; top: -2vmin; left: -1.1vmin; width: 3.2vmin; height: 3.2vmin; border-radius: 50%;
    background: radial-gradient(circle at 60% 40%, #fff 0 22%, #111 24%);
    animation: blink 5s infinite;
  }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .leg {
    position: absolute; top: 10vmin; width: 7vmin; height: 1.2vmin; border-radius: 1vmin; background: #c9381f;
    animation: tick .25s ease-in-out infinite alternate;
  }
  .leg.l { left: 0; transform-origin: right center; }
  .leg.r { right: 0; transform-origin: left center; }
  .leg.l:nth-of-type(1), .leg.r:nth-of-type(4) { top: 9vmin; }
  .leg.l:nth-of-type(2), .leg.r:nth-of-type(5) { top: 11.5vmin; animation-delay: -.12s; }
  .leg.l:nth-of-type(3), .leg.r:nth-of-type(6) { top: 14vmin; }
  @keyframes tick { from { rotate: -14deg; } to { rotate: 18deg; } }
  .claw {
    position: absolute; top: 2vmin; width: 6vmin; height: 5vmin; z-index: 3;
  }
  .claw.l { left: -2vmin; } .claw.r { right: -2vmin; }
  .claw::before, .claw::after {
    content: ''; position: absolute; left: 0; width: 6vmin; height: 2.6vmin; background: #e0442b;
  }
  .claw::before { top: 0; border-radius: 3vmin 3vmin 0 3vmin; transform-origin: bottom center; animation: snap 1.4s infinite; }
  .claw::after { bottom: 0; border-radius: 3vmin 0 3vmin 3vmin; background: #c9381f; }
  @keyframes snap { 0%, 60%, 100% { transform: rotate(0); } 70%, 80% { transform: rotate(-25deg); } }
  .claw.r::before { animation-delay: -.7s; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 20s !important; } }
</style>
</head>
<body>
  <div class="weed"></div>
  <div class="weed"></div>
  <div class="sand"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="shell-deco"></div>
  <div class="crab">
    <div class="leg l"></div><div class="leg l"></div><div class="leg l"></div>
    <div class="leg r"></div><div class="leg r"></div><div class="leg r"></div>
    <div class="eye l"></div><div class="eye r"></div>
    <div class="claw l"></div><div class="claw r"></div>
    <div class="shell"></div>
  </div>
</body>
</html>
