<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #061c2b; }
  svg { display: block; width: 100%; height: 100%; }
  .ray { animation: rayGlow 8s ease-in-out infinite alternate; }
  .waterline { animation: shimmer 6s ease-in-out infinite alternate; }
  .plant { transform-box: fill-box; transform-origin: bottom center; animation: sway 5s ease-in-out infinite alternate; }
  .plant.slow { animation-duration: 7s; }
  .plant.quick { animation-duration: 4s; }
  .creature { transform-box: fill-box; transform-origin: center; animation: float 4.7s ease-in-out infinite; }
  .dorsal { transform-box: fill-box; transform-origin: 0% 50%; animation: fin 1.1s ease-in-out infinite alternate; }
  .bubble { animation: rise linear infinite; }
  .bubble:nth-of-type(2n) { animation-direction: reverse; }
  .sparkle { animation: twinkle 2.8s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-11px) rotate(1.5deg); }
  }
  @keyframes fin { from { transform: scaleX(.92) rotate(-2deg); } to { transform: scaleX(1.04) rotate(2deg); } }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    12% { opacity: .7; }
    80% { opacity: .45; }
    100% { transform: translateY(-710px); opacity: 0; }
  }
  @keyframes shimmer { from { opacity: .45; } to { opacity: .8; } }
  @keyframes rayGlow { from { opacity: .12; } to { opacity: .27; } }
  @keyframes twinkle { from { opacity: .25; transform: scale(.75); } to { opacity: 1; transform: scale(1.2); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 12s !important; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 1000 750" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#123d53"/>
      <stop offset=".47" stop-color="#092b42"/>
      <stop offset="1" stop-color="#071c30"/>
    </linearGradient>
    <linearGradient id="sand" x2="0" y2="1">
      <stop stop-color="#8e8165"/>
      <stop offset=".38" stop-color="#4b5360"/>
      <stop offset="1" stop-color="#1d3545"/>
    </linearGradient>
    <linearGradient id="ray" x2=".8" y2="1">
      <stop stop-color="#d8f5df" stop-opacity=".65"/>
      <stop offset="1" stop-color="#7be4d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1=".15" y1=".15" x2=".85" y2="1">
      <stop stop-color="#a9e8ce"/>
      <stop offset=".28" stop-color="#47bba9"/>
      <stop offset=".68" stop-color="#277b8b"/>
      <stop offset="1" stop-color="#174a68"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4d69a"/>
      <stop offset=".55" stop-color="#d4a875"/>
      <stop offset="1" stop-color="#996e68"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e6bd80" stop-opacity=".9"/>
      <stop offset=".48" stop-color="#a1ddd0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#54a9b4" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#a7f1dc" stop-opacity=".32"/>
      <stop offset="1" stop-color="#70d5cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye">
      <stop offset=".25" stop-color="#f6df9d"/>
      <stop offset=".3" stop-color="#142b3c"/>
      <stop offset=".8" stop-color="#061523"/>
      <stop offset="1" stop-color="#72cfc0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="sandgrain" width="80" height="36" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="11" r="1.2" fill="#f2d6a0" opacity=".28"/>
      <circle cx="47" cy="23" r=".9" fill="#e6c995" opacity=".25"/>
      <circle cx="70" cy="6" r=".7" fill="#fff0cc" opacity=".3"/>
      <path d="M25 31h5" stroke="#d1bb94" opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1000" height="750" fill="url(#water)"/>
  <ellipse cx="482" cy="360" rx="330" ry="300" fill="url(#halo)"/>
  <g class="ray">
    <path d="M105 0h155L455 540H345z" fill="url(#ray)"/>
    <path d="M340 0h90l152 488h-90z" fill="url(#ray)" opacity=".55"/>
    <path d="M744 0h114L652 500h-72z" fill="url(#ray)" opacity=".48"/>
  </g>

  <g class="waterline" opacity=".5" fill="none" stroke="#b2e9d9">
    <path d="M0 74q95-14 190 0t190 0 190 0 190 0 240 0" stroke-width="2" opacity=".22"/>
    <path d="M40 91q78-9 156 0t156 0 156 0 156 0 156 0 180 0" stroke-width="1" opacity=".15"/>
  </g>

  <!-- Distant seagrass -->
  <g fill="none" stroke-linecap="round" opacity=".35">
    <path d="M74 611Q88 496 50 402M82 610Q119 500 128 437M96 610Q75 521 98 475" stroke="#58a88e" stroke-width="9"/>
    <path d="M906 622Q879 511 919 420M923 622Q945 526 965 488M940 620Q902 547 894 485" stroke="#63aa91" stroke-width="10"/>
    <path d="M215 627Q231 554 207 505M226 626Q259 552 266 527M784 628Q769 554 797 502" stroke="#507e82" stroke-width="7"/>
  </g>

  <!-- Pebbled bottom -->
  <path d="M0 624Q125 597 253 621T508 616T766 620T1000 607V750H0Z" fill="url(#sand)"/>
  <path d="M0 624Q125 597 253 621T508 616T766 620T1000 607V750H0Z" fill="url(#sandgrain)" opacity=".85"/>
  <path d="M0 650Q190 623 345 645T688 643T1000 630" fill="none" stroke="#c5b28c" stroke-opacity=".2" stroke-width="2"/>

  <!-- Stones -->
  <g>
    <path d="M93 645q12-35 43-34 25 1 36 34z" fill="#526472"/>
    <path d="M101 644q11-24 29-25" fill="none" stroke="#9caeaa" stroke-opacity=".4" stroke-width="4"/>
    <path d="M815 640q9-31 39-33 33 2 45 34z" fill="#425766"/>
    <path d="M824 638q10-21 28-24" fill="none" stroke="#b1b49f" stroke-opacity=".32" stroke-width="4"/>
    <path d="M686 646q7-19 24-20 17 2 23 21z" fill="#68716f"/>
  </g>

  <!-- Foreground plants -->
  <g class="plant slow" fill="none" stroke-linecap="round">
    <path d="M145 680Q142 591 165 486" stroke="#59b99a" stroke-width="7"/>
    <path d="M152 627Q114 604 110 570M156 598Q195 575 198 545M160 558Q128 539 132 514M164 524Q193 502 190 481" stroke="#8bd7aa" stroke-width="5"/>
    <path d="M110 570q-4-29-28-37 2 28 28 37M198 545q20-26 43-21-12 26-43 21M132 514q-4-27-26-33 1 25 26 33M190 481q14-25 37-25-8 27-37 25" fill="#438f83" stroke="#75c89e" stroke-width="2"/>
  </g>
  <g class="plant quick" fill="none" stroke-linecap="round">
    <path d="M851 681Q839 582 861 474" stroke="#6bb794" stroke-width="8"/>
    <path d="M848 626Q812 602 808 569M850 591Q884 570 892 540M854 551Q825 528 830 496M858 514Q889 493 889 465" stroke="#9bd59f" stroke-width="5"/>
    <path d="M808 569q-3-28-28-37 2 28 28 37M892 540q20-26 44-20-12 26-44 20M830 496q-2-28-25-35 0 26 25 35M889 465q14-26 39-25-9 28-39 25" fill="#408e80" stroke="#83c999" stroke-width="2"/>
  </g>
  <g class="plant slow" fill="none" stroke-linecap="round">
    <path d="M335 662Q329 602 347 554" stroke="#538c82" stroke-width="5"/>
    <path d="M338 622q-29-20-30-43 25 7 30 43M342 598q24-24 45-19-12 24-45 19" fill="#397c79" stroke="#67aa8e" stroke-width="3"/>
    <path d="M741 656Q749 594 730 554" stroke="#538c82" stroke-width="5"/>
    <path d="M743 623q27-22 28-44-25 9-28 44M738 594q-24-22-44-16 13 23 44 16" fill="#397c79" stroke="#67aa8e" stroke-width="3"/>
  </g>

  <!-- A quiet cloud of tiny drifting lights -->
  <g fill="#d6f8d8">
    <circle class="sparkle" cx="270" cy="226" r="2.5" style="transform-origin:270px 226px"/>
    <circle class="sparkle" cx="710" cy="270" r="2" style="animation-delay:-1s;transform-origin:710px 270px"/>
    <circle class="sparkle" cx="678" cy="481" r="2.4" style="animation-delay:-.5s;transform-origin:678px 481px"/>
    <circle class="sparkle" cx="350" cy="400" r="1.8" style="animation-delay:-1.7s;transform-origin:350px 400px"/>
    <circle cx="621" cy="210" r="1.5" opacity=".55"/>
    <circle cx="299" cy="501" r="1.6" opacity=".6"/>
    <circle cx="761" cy="383" r="1.3" opacity=".5"/>
  </g>

  <!-- Bubbles -->
  <g fill="none" stroke="#b9e8dc" stroke-width="1.6">
    <circle class="bubble" cx="190" cy="652" r="5" style="animation-duration:9s;animation-delay:-4s"/>
    <circle class="bubble" cx="222" cy="678" r="3" style="animation-duration:7s;animation-delay:-2s"/>
    <circle class="bubble" cx="762" cy="644" r="4" style="animation-duration:10s;animation-delay:-7s"/>
    <circle class="bubble" cx="800" cy="676" r="2.5" style="animation-duration:8s;animation-delay:-3s"/>
    <circle class="bubble" cx="632" cy="598" r="3" style="animation-duration:11s;animation-delay:-6s"/>
  </g>

  <!-- The single resident -->
  <g class="creature">
    <ellipse cx="497" cy="398" rx="112" ry="175" fill="#74ddc4" opacity=".22" filter="url(#softGlow)"/>

    <!-- Fan-shaped swimming fin -->
    <g class="dorsal">
      <path d="M529 330Q566 304 604 320Q591 338 605 351Q586 360 602 378Q581 389 586 406Q555 418 529 395Z"
            fill="url(#finGrad)" stroke="#c6e5bf" stroke-width="2.2"/>
      <path d="M535 337Q562 337 600 322M536 346Q573 350 600 351M535 357Q566 365 597 378M532 370Q561 382 584 405"
            fill="none" stroke="#e6cf9e" stroke-opacity=".72" stroke-width="2"/>
      <path d="M546 334Q552 363 547 402M562 330Q570 363 563 410M578 326Q583 357 579 402"
            fill="none" stroke="#d7e8c0" stroke-opacity=".56" stroke-width="1.6"/>
    </g>

    <!-- Curled tail -->
    <path d="M495 438Q522 469 513 497Q508 516 486 531Q465 545 472 560Q478 574 495 569Q509 565 507 554Q505 547 498 550"
          fill="none" stroke="#276e7d" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M495 438Q522 469 513 497Q508 516 486 531Q465 545 472 560Q478 574 495 569Q509 565 507 554Q505 547 498 550"
          fill="none" stroke="#8cd2b3" stroke-width="3" stroke-linecap="round" opacity=".85"/>

    <!-- Main body -->
    <path d="M490 264
      C476 247 449 250 439 267
      C430 283 445 294 465 298
      L426 304 Q418 307 426 313
      L468 316
      C466 337 476 353 492 365
      C475 383 470 407 476 431
      C481 452 494 465 490 484
      C487 501 473 514 468 527
      C459 548 468 566 487 570
      C503 574 517 562 514 549
      C512 539 502 536 496 542
      C491 547 495 554 501 554
      C507 554 508 559 502 563
      C489 570 477 561 478 550
      C480 533 507 515 516 494
      C526 472 509 449 506 430
      C519 408 535 387 536 362
      C553 342 552 317 534 298
      C528 281 522 267 507 261
      C501 259 495 260 490 264Z"
      fill="url(#body)" stroke="#b6e8c3" stroke-width="2.2"/>

    <!-- Soft belly plate -->
    <path d="M493 365Q475 383 476 421Q477 451 495 466Q507 453 506 430Q520 405 529 379Q516 374 493 365Z"
          fill="url(#belly)" opacity=".92"/>
    <path d="M478 389Q497 398 529 390M475 407Q495 416 520 410M477 427Q493 435 511 431M484 448Q496 453 505 450"
          fill="none" stroke="#f2d9a8" stroke-opacity=".65" stroke-width="2"/>

    <!-- Delicate armor seams -->
    <g fill="none" stroke="#b8ebc7" stroke-width="2" opacity=".68">
      <path d="M473 326Q499 337 543 327"/>
      <path d="M476 343Q502 353 539 344"/>
      <path d="M481 360Q504 369 533 361"/>
      <path d="M480 379Q492 385 507 385"/>
      <path d="M477 467Q493 475 511 467"/>
      <path d="M475 484Q493 492 512 483"/>
      <path d="M470 503Q487 510 503 502"/>
    </g>

    <!-- Tiny pearly spots -->
    <g fill="#f6dfaa">
      <circle cx="519" cy="314" r="3.2"/><circle cx="527" cy="337" r="2.2"/>
      <circle cx="516" cy="351" r="2.8"/><circle cx="493" cy="331" r="2.2"/>
      <circle cx="488" cy="350" r="1.8"/><circle cx="514" cy="472" r="2.6"/>
      <circle cx="490" cy="493" r="2.2"/><circle cx="482" cy="516" r="1.8"/>
    </g>

    <!-- Fin crest and little ear-like flutter -->
    <path d="M493 264Q477 248 480 232Q493 239 499 253Q507 232 520 229Q519 247 508 265"
          fill="#d8b87e" stroke="#f0d9a5" stroke-width="2"/>
    <path d="M485 258Q493 250 499 253M500 255Q510 244 517 239"
          fill="none" stroke="#fff0c9" stroke-width="1.5" opacity=".8"/>
    <path d="M529 319Q548 307 559 319Q550 332 534 337"
          fill="#8ed6be" stroke="#d3ebc4" stroke-width="2"/>

    <!-- Eye and gentle smile -->
    <ellipse cx="454" cy="280" rx="10.5" ry="12" fill="url(#eye)"/>
    <circle cx="451" cy="276" r="2.3" fill="#fff8d6"/>
    <path d="M425 309Q439 315 455 311" fill="none" stroke="#214b58" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="468" cy="285" r="2.1" fill="#f4d89c" opacity=".8"/>
  </g>

  <!-- Foreground sand flecks -->
  <g fill="#e5d4aa" opacity=".55">
    <circle cx="270" cy="655" r="2"/><circle cx="295" cy="671" r="1.4"/>
    <circle cx="628" cy="665" r="1.8"/><circle cx="655" cy="645" r="1.2"/>
    <circle cx="740" cy="680" r="1.7"/><circle cx="392" cy="682" r="1.1"/>
  </g>
</svg>
</body>
</html>
