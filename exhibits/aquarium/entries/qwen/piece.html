<!doctype html>
<!-- DUMMY PIECE: hand-written stand-in to exercise the pipeline (Canvas 2D, pointer interaction). Replace with real model output. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curious Octopus</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1240; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas></canvas>
<script>
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr, S;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.width = innerWidth * dpr;
    H = canvas.height = innerHeight * dpr;
    S = Math.min(W, H);
  }
  addEventListener('resize', resize);
  resize();

  const head = { x: W / 2, y: H / 2 };
  let pointer = null, lastMove = -1e9;
  addEventListener('pointermove', (e) => { pointer = { x: e.clientX * dpr, y: e.clientY * dpr }; lastMove = performance.now(); });
  addEventListener('pointerleave', () => { pointer = null; });

  const SEGS = 16;
  const arms = Array.from({ length: 8 }, (_, k) => ({
    angle: Math.PI * (0.15 + (k / 7) * 0.7),
    pts: Array.from({ length: SEGS }, () => ({ x: head.x, y: head.y })),
  }));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(ms) {
    const t = ms / 1000;
    const idle = !pointer || ms - lastMove > 2500;
    const target = idle
      ? { x: W / 2 + Math.sin(t * 0.4) * W * 0.25, y: H * 0.45 + Math.sin(t * 0.7) * H * 0.15 }
      : pointer;
    const ease = still ? 1 : 0.02;
    head.x += (target.x - head.x) * ease;
    head.y += (target.y - head.y) * ease;

    const bg = ctx.createRadialGradient(W / 2, H * 0.2, 0, W / 2, H * 0.5, S * 0.9);
    bg.addColorStop(0, '#3b2a7a');
    bg.addColorStop(1, '#120c2e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const r = S * 0.08;
    const segLen = S * 0.017;
    for (const [k, arm] of arms.entries()) {
      const p0 = arm.pts[0];
      p0.x = head.x + Math.cos(arm.angle) * r * 0.7;
      p0.y = head.y + Math.sin(arm.angle) * r * 0.6;
      for (let i = 1; i < SEGS; i++) {
        const p = arm.pts[i], prev = arm.pts[i - 1];
        p.x += Math.sin(t * 2 + k * 0.8 + i * 0.35) * 0.6 * dpr;
        p.y += 0.5 * dpr; // sink a little
        const dx = p.x - prev.x, dy = p.y - prev.y;
        const d = Math.hypot(dx, dy) || 1;
        p.x = prev.x + (dx / d) * segLen;
        p.y = prev.y + (dy / d) * segLen;
      }
      ctx.lineCap = 'round';
      for (let i = 1; i < SEGS; i++) {
        ctx.strokeStyle = `hsl(${345 - i * 2} 75% ${62 - i}%)`;
        ctx.lineWidth = r * 0.32 * (1 - i / SEGS) + dpr;
        ctx.beginPath();
        ctx.moveTo(arm.pts[i - 1].x, arm.pts[i - 1].y);
        ctx.lineTo(arm.pts[i].x, arm.pts[i].y);
        ctx.stroke();
      }
    }

    const g = ctx.createRadialGradient(head.x - r * 0.3, head.y - r * 0.5, r * 0.1, head.x, head.y, r * 1.3);
    g.addColorStop(0, '#ffb3c1');
    g.addColorStop(1, '#e0446a');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(head.x, head.y - r * 0.3, r, r * 1.15, 0, 0, Math.PI * 2);
    ctx.fill();

    const look = Math.atan2(target.y - head.y, target.x - head.x);
    for (const side of [-1, 1]) {
      const ex = head.x + side * r * 0.42, ey = head.y - r * 0.05;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ex, ey, r * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a1240';
      ctx.beginPath();
      ctx.arc(ex + Math.cos(look) * r * 0.08, ey + Math.sin(look) * r * 0.08, r * 0.11, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
