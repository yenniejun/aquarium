<!doctype html>
<!-- DUMMY PIECE: hand-written stand-in to exercise the pipeline (WebGL shader + SVG). Replace with real model output. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angelfish</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#1b7f8c, #062b3a); }
  canvas, svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas></canvas>
<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <path id="body-shape" d="M 14 0 C 8 -11, -6 -11, -12 0 C -6 11, 8 11, 14 0 Z"/>
    <clipPath id="body-clip"><use href="#body-shape"/></clipPath>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e3"/><stop offset="1" stop-color="#c9d6df"/>
    </linearGradient>
  </defs>
  <g id="fish">
    <path d="M 3 -8 Q 0 -22 -9 -25 Q -5 -12 -6 -5 Z" fill="#e8eef2" opacity=".75"/>
    <path d="M 3 8 Q 0 22 -9 25 Q -5 12 -6 5 Z" fill="#e8eef2" opacity=".75"/>
    <path id="tail" fill="#e8eef2" opacity=".85"/>
    <use href="#body-shape" fill="url(#silver)"/>
    <g clip-path="url(#body-clip)" fill="#1d2730">
      <rect x="-5" y="-12" width="2.4" height="24"/>
      <rect x="3" y="-12" width="2.8" height="24"/>
      <rect x="9.5" y="-12" width="1.6" height="24"/>
    </g>
    <circle cx="10" cy="-2" r="1.6" fill="#fff"/><circle cx="10.4" cy="-2" r=".9" fill="#111"/>
  </g>
</svg>
<script>
  // Background: a small caustic-light fragment shader.
  const canvas = document.querySelector('canvas');
  const gl = canvas.getContext('webgl');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let u;
  if (gl) {
    const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }'));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, `
      precision mediump float;
      uniform vec2 res; uniform float t;
      void main() {
        vec2 uv = gl_FragCoord.xy / res.y;
        float v = sin(uv.x * 9. + t) + sin(uv.y * 11. - t * 1.3)
                + sin((uv.x + uv.y) * 7. + t * .7) + sin(length(uv - vec2(.6, 1.2)) * 14. - t * 1.6);
        float c = pow(1. - abs(sin(v * 1.1)), 7.);
        float depth = gl_FragCoord.y / res.y;
        vec3 deep = mix(vec3(.02, .17, .23), vec3(.11, .5, .55), depth);
        gl_FragColor = vec4(deep + c * vec3(.35, .6, .55) * depth, 1.);
      }`));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    u = { res: gl.getUniformLocation(prog, 'res'), t: gl.getUniformLocation(prog, 't') };
  }

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', resize);
  resize();

  const fish = document.getElementById('fish');
  const tail = document.getElementById('tail');
  function frame(ms) {
    const t = ms / 1000;
    if (gl) {
      gl.uniform2f(u.res, canvas.width, canvas.height);
      gl.uniform1f(u.t, t * 0.6);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    // Glide slowly left and right, turning around at each end.
    const phase = t * 0.12 % 2;
    const dir = phase < 1 ? 1 : -1;
    const k = phase < 1 ? phase : phase - 1;
    const ease = (1 - Math.cos(k * Math.PI)) / 2;
    const x = dir > 0 ? 25 + ease * 50 : 75 - ease * 50;
    const y = 48 + Math.sin(t * 0.9) * 4;
    const flick = Math.sin(t * 5) * 2;
    tail.setAttribute('d', `M -11 0 L -20 ${-7 + flick} Q -18 0 -20 ${7 + flick} Z`);
    fish.setAttribute('transform', `translate(${x} ${y}) scale(${dir} 1) rotate(${Math.sin(t * 0.9) * 4})`);
    if (!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
