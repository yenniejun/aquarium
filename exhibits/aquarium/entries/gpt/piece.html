<!doctype html>
<!-- DUMMY PIECE: hand-written stand-in to exercise the pipeline (Canvas 2D). Replace with real model output. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goldfish</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f4c75; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas></canvas>
<script>
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.width = innerWidth * dpr;
    H = canvas.height = innerHeight * dpr;
  }
  addEventListener('resize', resize);
  resize();

  const bubbles = Array.from({ length: 22 }, () => ({
    x: 0.75 + Math.random() * 0.12, y: Math.random(), r: Math.random() * 3 + 1.5, v: Math.random() * 0.0015 + 0.001,
  }));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function plant(x, height, t, hue) {
    ctx.strokeStyle = `hsl(${hue} 55% 38%)`;
    ctx.lineWidth = 7 * dpr;
    ctx.lineCap = 'round';
    for (let k = 0; k < 4; k++) {
      ctx.beginPath();
      ctx.moveTo(x + k * 9 * dpr, H * 0.9);
      for (let s = 1; s <= 8; s++) {
        const yy = H * 0.9 - (s / 8) * height;
        ctx.lineTo(x + k * 9 * dpr + Math.sin(t * 1.3 + s * 0.6 + k) * s * 2 * dpr, yy);
      }
      ctx.stroke();
    }
  }

  function draw(ms) {
    const t = ms / 1000;
    const s = Math.min(W, H);

    const water = ctx.createLinearGradient(0, 0, 0, H);
    water.addColorStop(0, '#62cbe6');
    water.addColorStop(1, '#0f4c75');
    ctx.fillStyle = water;
    ctx.fillRect(0, 0, W, H);

    plant(W * 0.12, H * 0.45, t, 140);
    plant(W * 0.8, H * 0.3, t + 2, 160);

    ctx.fillStyle = '#e9d4a3';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += W / 40) ctx.lineTo(x, H * 0.88 + Math.sin((x / W) * 7) * H * 0.015);
    ctx.lineTo(W, H);
    ctx.fill();

    // Figure-eight swim path; heading comes from the path's derivative.
    const ax = W * 0.3, ay = H * 0.13;
    const fx = W / 2 + Math.sin(t * 0.55) * ax;
    const fy = H * 0.45 + Math.sin(t * 1.1) * ay;
    const dx = Math.cos(t * 0.55) * 0.55 * ax;
    const dy = Math.cos(t * 1.1) * 1.1 * ay;
    const L = s * 0.13;
    const wag = Math.sin(t * 11) * 0.3;

    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(Math.atan2(dy, dx));
    if (dx < 0) ctx.scale(1, -1);

    ctx.fillStyle = '#ff7a12';
    ctx.beginPath();
    ctx.moveTo(-L * 0.4, 0);
    ctx.quadraticCurveTo(-L * 0.8, -L * 0.1, -L, -L * 0.38 + wag * L * 0.3);
    ctx.quadraticCurveTo(-L * 0.78, 0, -L, L * 0.38 + wag * L * 0.3);
    ctx.quadraticCurveTo(-L * 0.8, L * 0.1, -L * 0.4, 0);
    ctx.fill();

    const body = ctx.createLinearGradient(0, -L * 0.3, 0, L * 0.3);
    body.addColorStop(0, '#ff9a2e');
    body.addColorStop(1, '#ffcf6b');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.ellipse(0, 0, L * 0.55, L * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,140,30,.85)';
    ctx.beginPath();
    ctx.moveTo(-L * 0.05, -L * 0.26);
    ctx.quadraticCurveTo(-L * 0.25, -L * 0.55, -L * 0.35, -L * 0.2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(L * 0.3, -L * 0.06, L * 0.075, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(L * 0.32, -L * 0.06, L * 0.04, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,.6)';
    ctx.lineWidth = 1.2 * dpr;
    for (const b of bubbles) {
      b.y -= b.v;
      if (b.y < -0.05) b.y = 1;
      ctx.beginPath();
      ctx.arc(b.x * W + Math.sin(t * 2 + b.r) * 4 * dpr, b.y * H * 0.9, b.r * dpr, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
