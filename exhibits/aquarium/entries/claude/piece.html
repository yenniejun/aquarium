<!doctype html>
<!-- DUMMY PIECE: hand-written stand-in to exercise the pipeline (SVG + JS). Replace with real model output. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Jelly</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(circle at 50% 15%, #1f6f8b, #0b2340 65%, #050f1f); }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bell" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffe3f7" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#e88fd8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#9b5de5" stop-opacity=".3"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="motes"></g>
  <g id="jelly" filter="url(#glow)">
    <g id="tentacles" fill="none" stroke="#f7b8ec" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round" opacity=".75"></g>
    <path id="bell-path" fill="url(#bell)"/>
    <path id="rim" fill="none" stroke="#fff0fb" stroke-width=".4" opacity=".6"/>
  </g>
</svg>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const tentacles = Array.from({ length: 8 }, (_, i) => {
    const p = document.createElementNS(NS, 'path');
    $('tentacles').appendChild(p);
    return { p, x: -10.5 + i * 3, phase: i * 0.9, len: 18 + (i % 3) * 5 };
  });
  for (let i = 0; i < 45; i++) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', Math.random() * 100);
    c.setAttribute('cy', Math.random() * 100);
    c.setAttribute('r', Math.random() * 0.35 + 0.1);
    c.setAttribute('fill', '#bfe9ff');
    c.setAttribute('opacity', Math.random() * 0.5 + 0.1);
    $('motes').appendChild(c);
  }
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(ms) {
    const t = ms / 1000;
    const pulse = (Math.sin(t * 2.1) + 1) / 2;
    const w = 12 + pulse * 3;
    const h = 10 - pulse * 2.5;
    const x = 50 + Math.sin(t * 0.31) * 16;
    const y = 42 + Math.sin(t * 0.47) * 12 - pulse * 2;
    $('bell-path').setAttribute('d',
      `M ${-w} 0 C ${-w} ${-h * 1.45}, ${w} ${-h * 1.45}, ${w} 0 Q ${w * 0.5} ${2 + pulse}, 0 1.2 Q ${-w * 0.5} ${2 + pulse}, ${-w} 0 Z`);
    $('rim').setAttribute('d', `M ${-w * 0.8} -1 C ${-w * 0.7} ${-h * 1.1}, ${w * 0.7} ${-h * 1.1}, ${w * 0.8} -1`);
    for (const k of tentacles) {
      const sx = k.x * (w / 12);
      let d = `M ${sx.toFixed(2)} 1`;
      for (let s = 1; s <= 12; s++) {
        const yy = 1 + (s / 12) * k.len;
        const xx = sx + Math.sin(t * 2.2 - s * 0.45 + k.phase) * s * 0.35;
        d += ` L ${xx.toFixed(2)} ${yy.toFixed(2)}`;
      }
      k.p.setAttribute('d', d);
    }
    $('jelly').setAttribute('transform', `translate(${x} ${y}) rotate(${Math.sin(t * 0.31) * 9})`);
    if (!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
