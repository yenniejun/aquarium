<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pleated Puddlewing</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05262e; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas aria-label="An opalescent sea angel slowly fans its pleated wings in a quiet underwater garden."></canvas>
<script>
(() => {
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const backdrop = document.createElement('canvas');
  const bg = backdrop.getContext('2d');
  const TAU = Math.PI * 2;
  let W = 1000, H = 750, scale = 1, pixel = 1;
  let last = 0, time = 0;
  let pointer = { x: 500, y: 330, active: false };
  let drift = { x: 0, y: 0 };

  function random(seed) {
    return function() {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rng = random(9247);
  const dust = Array.from({ length: 70 }, () => ({
    x: rng(), y: rng(), r: .5 + rng() * 1.5,
    speed: 1 + rng() * 3, phase: rng() * TAU
  }));
  const plants = [
    { x: 35, height: 265, n: 8, color: '32,100,95', seed: 22 },
    { x: 116, height: 175, n: 6, color: '51,119,107', seed: 32 },
    { x: 935, height: 245, n: 8, color: '30,102,101', seed: 52 },
    { x: 1010, height: 340, n: 8, color: '27,77,82', seed: 89 },
    { x: 210, height: 86, n: 5, color: '77,130,111', seed: 65 }
  ];

  function ellipse(g, x, y, rx, ry, fill, rotation = 0) {
    g.beginPath();
    g.ellipse(x, y, rx, ry, rotation, 0, TAU);
    g.fillStyle = fill;
    g.fill();
  }
  function glow(g, x, y, r, color) {
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, color);
    grad.addColorStop(1, 'rgba(100,220,200,0)');
    g.fillStyle = grad;
    g.fillRect(x-r, y-r, r*2, r*2);
  }

  function makeBackground() {
    backdrop.width = Math.ceil(W * pixel);
    backdrop.height = Math.ceil(H * pixel);
    bg.setTransform(pixel, 0, 0, pixel, 0, 0);
    const water = bg.createLinearGradient(0, 0, W*.6, H);
    water.addColorStop(0, '#1b6064');
    water.addColorStop(.38, '#0b3b47');
    water.addColorStop(1, '#041d2c');
    bg.fillStyle = water;
    bg.fillRect(0, 0, W, H);
    glow(bg, 265, -90, 660, 'rgba(115,214,181,.19)');
    glow(bg, 725, H*.55, 430, 'rgba(18,78,100,.17)');

    const floor = bg.createLinearGradient(0, H-145, 0, H);
    floor.addColorStop(0, 'rgba(48,91,88,0)');
    floor.addColorStop(.45, 'rgba(48,91,88,.38)');
    floor.addColorStop(1, '#153b40');
    bg.fillStyle = floor;
    bg.beginPath();
    bg.moveTo(0, H-90);
    bg.bezierCurveTo(240,H-145,550,H-60,1000,H-133);
    bg.lineTo(1000,H); bg.lineTo(0,H); bg.fill();

    const rand = random(183);
    for (let i=0; i<1500; i++) {
      const x=rand()*W, y=H-100+rand()*125;
      const horizon=H-97+16*Math.sin(x*.006);
      if(y<horizon) continue;
      ellipse(bg,x,y,rand()*1.8+.3,rand()*.65+.2,
        `rgba(170,195,157,${.025+rand()*.14})`);
    }

    // A weathered, empty ceramic aperture, half buried in the sand.
    bg.save();
    bg.translate(824,H-133);
    bg.rotate(-.2);
    bg.scale(1, .94);
    bg.shadowColor='rgba(0,12,22,.5)';
    bg.shadowBlur=23;
    bg.shadowOffsetY=15;
    let stone=bg.createLinearGradient(-130,-160,125,120);
    stone.addColorStop(0,'#537f7c');
    stone.addColorStop(.34,'#345c60');
    stone.addColorStop(.75,'#23474f');
    stone.addColorStop(1,'#17363e');
    bg.beginPath();
    bg.ellipse(0,0,126,154,0,0,TAU);
    bg.ellipse(0,-3,88,115,0,0,TAU,true);
    bg.fillStyle=stone;
    bg.fill('evenodd');
    bg.shadowColor='transparent';
    for(let j=0;j<4;j++) {
      bg.beginPath();
      bg.ellipse(-2,-3,96+j*6,123+j*6,0,3.25,5.55);
      bg.strokeStyle=`rgba(145,181,159,${.12-j*.02})`;
      bg.lineWidth=1.1;
      bg.stroke();
    }
    bg.strokeStyle='rgba(5,30,38,.35)';
    bg.lineWidth=2;
    bg.beginPath();
    bg.moveTo(48,-141); bg.lineTo(40,-123); bg.lineTo(46,-112);
    bg.moveTo(-117,41); bg.lineTo(-99,34); bg.lineTo(-94,19);
    bg.stroke();
    for(let i=0;i<200;i++){
      const a=rand()*TAU, r=98+rand()*22;
      ellipse(bg,Math.cos(a)*r,Math.sin(a)*r*1.23,
        rand()*1.5+.3,rand()*2+.4,'rgba(140,179,153,.09)');
    }
    bg.restore();

    for(let i=0;i<24;i++) {
      const x=rand()*W, y=H-23-rand()*43;
      const rx=8+rand()*34, ry=4+rand()*12;
      const rock=bg.createLinearGradient(x,y-ry,x,y+ry);
      rock.addColorStop(0,'#3c6260');
      rock.addColorStop(1,'#153239');
      ellipse(bg,x,y,rx,ry,rock,-.2+rand()*.4);
    }
    const vignette=bg.createRadialGradient(W*.47,H*.43,120,W*.5,H*.5,Math.max(W,H)*.7);
    vignette.addColorStop(0,'rgba(0,12,23,0)');
    vignette.addColorStop(.65,'rgba(0,12,23,.08)');
    vignette.addColorStop(1,'rgba(0,10,21,.62)');
    bg.fillStyle=vignette; bg.fillRect(0,0,W,H);
  }

  function resize() {
    const w=innerWidth, h=innerHeight;
    scale=w/1000;
    H=h/scale;
    pixel=Math.min(devicePixelRatio || 1,1.6)*scale;
    canvas.width=Math.round(w*Math.min(devicePixelRatio || 1,1.6));
    canvas.height=Math.round(h*Math.min(devicePixelRatio || 1,1.6));
    makeBackground();
  }

  function plant(p,t) {
    const r=random(p.seed);
    ctx.save();
    ctx.translate(p.x,H-25);
    const size=Math.min(1,H/650);
    ctx.scale(size,size);
    for(let j=0;j<p.n;j++) {
      const h=p.height*(.4+r()*.6);
      const lean=(r()-.5)*115;
      const start=(r()-.5)*65;
      const sway=Math.sin(t*.43+j*1.8+p.seed)*13;
      const tip=lean+sway;
      const width=3+r()*8;
      const gradient=ctx.createLinearGradient(0,0,tip,-h);
      gradient.addColorStop(0,`rgba(${p.color},.25)`);
      gradient.addColorStop(.7,`rgba(${p.color},.8)`);
      gradient.addColorStop(1,`rgba(113,176,142,.56)`);
      ctx.beginPath();
      ctx.moveTo(start,0);
      ctx.bezierCurveTo(start-20,-h*.4,tip+23,-h*.75,tip,-h);
      ctx.bezierCurveTo(tip+width,-h*.62,start+width-8,-h*.25,start+width,0);
      ctx.fillStyle=gradient; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(start+width*.5,-4);
      ctx.bezierCurveTo(start-10,-h*.4,tip+22,-h*.75,tip,-h);
      ctx.strokeStyle='rgba(157,202,156,.13)';
      ctx.lineWidth=.7; ctx.stroke();
    }
    ctx.restore();
  }

  function wing(side,t) {
    const root={x:side*16,y:8};
    const flap=Math.sin(t*1.55+(side===1?.24:0));
    const points=[];
    for(let i=0;i<=90;i++) {
      const u=i/90;
      const spread=Math.pow(Math.sin(Math.PI*u),.68);
      const length=174*spread*(.87+.13*flap);
      const ruffle=Math.sin(u*58-t*2.2+side)*3.1*spread;
      points.push({
        x:side*(17+length+ruffle),
        y:-31+u*72+length*(u-.5)*2+
          Math.sin(u*14-t*1.55+side*.3)*8*spread+flap*length*.13
      });
    }
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(root.x,-25);
    for(const p of points) ctx.lineTo(p.x,p.y);
    ctx.lineTo(root.x,35); ctx.closePath();
    const membrane=ctx.createLinearGradient(0,-65,side*200,90);
    membrane.addColorStop(0,'rgba(157,240,210,.64)');
    membrane.addColorStop(.36,'rgba(114,198,193,.46)');
    membrane.addColorStop(.68,side<0?'rgba(159,164,222,.45)':'rgba(134,207,204,.5)');
    membrane.addColorStop(1,'rgba(255,196,166,.7)');
    ctx.fillStyle=membrane; ctx.fill();
    ctx.save();
    ctx.clip();
    for(let i=0;i<45;i++) {
      const a=points[i*2], b=points[Math.min(i*2+2,90)];
      const light=.5+.5*Math.sin(i*1.7+t*1.55);
      ctx.beginPath();
      ctx.moveTo(root.x,root.y);
      ctx.quadraticCurveTo(a.x*.53,a.y*.35-12,a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.quadraticCurveTo(b.x*.53,b.y*.35-12,root.x,root.y);
      ctx.fillStyle=`rgba(${i%3===0?'255,217,177':'199,250,233'},${.025+light*.115})`;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(root.x,root.y);
      ctx.quadraticCurveTo(a.x*.48,a.y*.28-9,a.x,a.y);
      ctx.strokeStyle=`rgba(229,250,221,${.13+light*.16})`;
      ctx.lineWidth=.65; ctx.stroke();
    }
    ctx.restore();
    ctx.beginPath();
    points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.strokeStyle='rgba(221,248,220,.72)';
    ctx.lineWidth=1.15; ctx.stroke();
    ctx.beginPath();
    for(let i=0;i<points.length;i++){
      const p=points[i];
      const x=p.x*.965, y=p.y*.965+1;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.strokeStyle='rgba(255,185,155,.42)';
    ctx.lineWidth=1.8; ctx.stroke();
    for(let i=7;i<86;i+=9) {
      const p=points[i];
      ellipse(ctx,p.x*.975,p.y*.975,1.1,1.1,'rgba(255,237,193,.8)');
    }
    ctx.restore();
  }

  function ribbon(x,y,length,width,phase,t) {
    const sway=Math.sin(t*1.1+phase)*17;
    ctx.beginPath();
    ctx.moveTo(x-width,y);
    ctx.bezierCurveTo(x-28+sway,y+length*.34,x+39+sway,y+length*.72,x+Math.sin(t+phase)*22,y+length);
    ctx.bezierCurveTo(x+20+sway,y+length*.68,x-11+sway,y+length*.3,x+width,y);
    ctx.closePath();
    const g=ctx.createLinearGradient(0,y,0,y+length);
    g.addColorStop(0,'rgba(176,238,206,.56)');
    g.addColorStop(.6,'rgba(132,207,200,.24)');
    g.addColorStop(1,'rgba(234,210,174,.04)');
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(209,239,206,.24)';
    ctx.lineWidth=.8; ctx.stroke();
  }

  function creature(t) {
    const size=Math.min(1.12,H/620);
    const x=474+Math.sin(t*.22)*49+Math.sin(t*.47)*9+drift.x;
    const y=H*.43+Math.sin(t*.37)*18+drift.y;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(size,size);
    ctx.rotate(Math.sin(t*.34)*.055);
    glow(ctx,0,0,220,'rgba(117,225,197,.055)');
    ribbon(-10,60,119,7,0,t);
    ribbon(13,59,106,6,2,t);
    ribbon(0,81,126,8,4,t);
    wing(-1,t);
    wing(1,t);

    const body=ctx.createLinearGradient(-35,0,35,0);
    body.addColorStop(0,'rgba(103,189,180,.72)');
    body.addColorStop(.28,'rgba(217,250,218,.85)');
    body.addColorStop(.5,'rgba(245,253,219,.92)');
    body.addColorStop(.73,'rgba(176,231,203,.82)');
    body.addColorStop(1,'rgba(67,150,155,.69)');
    ctx.beginPath();
    ctx.moveTo(0,-78);
    ctx.bezierCurveTo(-27,-80,-35,-57,-26,-27);
    ctx.bezierCurveTo(-37,12,-28,59,0,117);
    ctx.bezierCurveTo(25,66,35,17,25,-26);
    ctx.bezierCurveTo(35,-54,27,-78,0,-78);
    ctx.fillStyle=body; ctx.fill();
    ctx.strokeStyle='rgba(230,255,220,.6)';
    ctx.lineWidth=1; ctx.stroke();

    glow(ctx,0,6,59,'rgba(255,172,84,.19)');
    const heart=ctx.createRadialGradient(-5,-6,2,0,10,34);
    heart.addColorStop(0,'#ffe5a0');
    heart.addColorStop(.38,'#edb46c');
    heart.addColorStop(1,'rgba(214,113,77,.18)');
    ctx.beginPath();
    ctx.moveTo(0,-24);
    ctx.bezierCurveTo(-29,-29,-27,5,-16,24);
    ctx.bezierCurveTo(-9,37,-2,47,0,66);
    ctx.bezierCurveTo(4,39,21,22,22,6);
    ctx.bezierCurveTo(25,-16,13,-30,0,-24);
    ctx.fillStyle=heart; ctx.fill();
    ctx.beginPath();
    for(let i=0;i<100;i++) {
      const a=i*.14;
      const radius=14*(1-i/110);
      const xx=Math.cos(a)*radius, yy=Math.sin(a)*radius+2;
      i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
    }
    ctx.strokeStyle='rgba(255,241,175,.68)';
    ctx.lineWidth=1.2; ctx.stroke();

    for(const side of [-1,1]) {
      const bend=Math.sin(t*1.1+side)*4;
      ctx.beginPath();
      ctx.moveTo(side*12,-69);
      ctx.bezierCurveTo(side*20,-85,side*42+bend,-108,side*31+bend,-124);
      ctx.bezierCurveTo(side*26+bend,-129,side*22+bend,-122,side*26+bend,-116);
      ctx.bezierCurveTo(side*27,-98,side*9,-91,side*7,-74);
      ctx.closePath();
      const horn=ctx.createLinearGradient(0,-74,0,-127);
      horn.addColorStop(0,'#bce8c7');
      horn.addColorStop(.65,'#f2d7a0');
      horn.addColorStop(1,'#ffb784');
      ctx.fillStyle=horn; ctx.fill();
      for(let j=0;j<4;j++){
        ctx.beginPath();
        ctx.moveTo(side*(24+j*.9)+bend,-108-j*3);
        ctx.lineTo(side*(32+j*.5)+bend,-111-j*3);
        ctx.strokeStyle='rgba(255,231,183,.58)';
        ctx.lineWidth=1; ctx.stroke();
      }
      ellipse(ctx,side*14,-55,4.2,5.2,'rgba(232,244,204,.82)',side*.22);
      ellipse(ctx,side*14.6,-54.6,2.5,3.3,'#163d43',side*.22);
      ellipse(ctx,side*14.6- .6,-55.8,.8,1,'#f3ffe1');
      ellipse(ctx,side*20,-44,3.7,1.8,'rgba(238,171,139,.4)',side*.25);
      ctx.beginPath();
      ctx.moveTo(side*23,4);
      ctx.bezierCurveTo(side*44,20,side*39,41,side*23,36);
      ctx.bezierCurveTo(side*18,34,side*21,30,side*25,31);
      ctx.strokeStyle='rgba(218,243,204,.68)';
      ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(-4,-41);
    ctx.quadraticCurveTo(0,-38,4,-41);
    ctx.strokeStyle='rgba(55,103,94,.55)';
    ctx.lineWidth=1.2; ctx.stroke();
    for(let i=0;i<12;i++){
      const yy=30+i*5.5;
      ellipse(ctx,Math.sin(i*1.7)*5,yy,.8,.8,'rgba(247,255,216,.65)');
    }
    ctx.restore();
  }

  function frame(ms) {
    const dt=Math.min((ms-last)/1000,.04) || .016;
    last=ms; time+=dt;
    const t=time;
    const targetX=pointer.active?Math.max(-26,Math.min(26,(pointer.x-474)*.07)):0;
    const targetY=pointer.active?Math.max(-17,Math.min(17,(pointer.y-H*.43)*.06)):0;
    drift.x+=(targetX-drift.x)*dt*.65;
    drift.y+=(targetY-drift.y)*dt*.65;
    ctx.setTransform(pixel,0,0,pixel,0,0);
    ctx.drawImage(backdrop,0,0,W,H);

    ctx.save();
    ctx.globalCompositeOperation='screen';
    for(let i=0;i<4;i++) {
      const origin=180+i*73+Math.sin(t*.12+i)*12;
      const ray=ctx.createLinearGradient(origin,0,origin+140,H);
      ray.addColorStop(0,'rgba(151,226,190,.035)');
      ray.addColorStop(1,'rgba(151,226,190,0)');
      ctx.fillStyle=ray;
      ctx.beginPath();
      ctx.moveTo(origin-14,0); ctx.lineTo(origin+14,0);
      ctx.lineTo(origin+300,H); ctx.lineTo(origin+70,H);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    for(let j=0;j<7;j++) {
      ctx.beginPath();
      for(let i=0;i<=30;i++) {
        const x=i*36-40;
        const y=H-61+j*9+Math.sin(i*.68+t*.25+j)*3.5;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.strokeStyle=`rgba(123,191,161,${.016+j*.002})`;
      ctx.lineWidth=1.2; ctx.stroke();
    }

    plants.slice(0,3).forEach(p=>plant(p,t));
    for(const d of dust) {
      const y=((d.y*H-t*d.speed) % (H+20)+H+20)%(H+20)-10;
      const x=d.x*W+Math.sin(t*.16+d.phase)*9;
      const a=.12+.12*(.5+.5*Math.sin(t*.5+d.phase));
      ellipse(ctx,x,y,d.r,d.r,`rgba(191,230,203,${a})`);
    }
    creature(t);
    plants.slice(3).forEach(p=>plant(p,t));
    requestAnimationFrame(frame);
  }

  addEventListener('resize',resize);
  addEventListener('pointermove',e=>{
    const rect=canvas.getBoundingClientRect();
    pointer.x=(e.clientX-rect.left)/scale;
    pointer.y=(e.clientY-rect.top)/scale;
    pointer.active=e.pointerType!=='touch';
  },{passive:true});
  addEventListener('pointerout',()=>pointer.active=false,{passive:true});
  addEventListener('blur',()=>pointer.active=false);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
