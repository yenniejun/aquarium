<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puttering Pearl Nautilus</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#062d38}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas aria-label="A pearlescent nautilus drifts through a softly illuminated underwater garden."></canvas>
<script>
(() => {
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const background = document.createElement('canvas');
  const shell = document.createElement('canvas');
  const B = background.getContext('2d');
  const S = shell.getContext('2d');
  const TAU = Math.PI * 2;
  let width, height, density;
  let pointer = {x:500,y:260,active:false};
  let seed = 7139;
  const random = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const mix = (a,b,t) => a+(b-a)*t;

  function ellipse(c,x,y,rx,ry,color) {
    c.beginPath();
    c.ellipse(x,y,rx,ry,0,0,TAU);
    c.fillStyle=color;
    c.fill();
  }

  function rock(c,x,y,w,h,color) {
    c.beginPath();
    c.moveTo(x-w*.52,y);
    c.bezierCurveTo(x-w*.61,y-h*.5,x-w*.2,y-h*1.09,x+w*.12,y-h);
    c.bezierCurveTo(x+w*.47,y-h*.91,x+w*.63,y-h*.3,x+w*.5,y);
    c.quadraticCurveTo(x,y+h*.14,x-w*.52,y);
    c.fillStyle=color;c.fill();
  }

  function buildBackground() {
    background.width=1000;background.height=750;
    B.setTransform(1.25,0,0,1.25,0,0);
    let g=B.createLinearGradient(0,0,610,600);
    g.addColorStop(0,'#103f4a');
    g.addColorStop(.43,'#15515a');
    g.addColorStop(1,'#042d39');
    B.fillStyle=g;B.fillRect(0,0,800,600);

    g=B.createRadialGradient(465,110,8,465,170,440);
    g.addColorStop(0,'#468a83');
    g.addColorStop(.4,'rgba(53,121,116,.35)');
    g.addColorStop(1,'rgba(8,49,59,0)');
    B.fillStyle=g;B.fillRect(0,0,800,600);

    for(let i=0;i<13;i++) {
      const x=i*78-55,y=503+random()*32;
      rock(B,x,y,90+random()*60,40+random()*70,'rgba(9,49,57,.33)');
    }

    g=B.createLinearGradient(0,475,0,600);
    g.addColorStop(0,'#47746e');
    g.addColorStop(.28,'#47726a');
    g.addColorStop(1,'#153e43');
    B.beginPath();B.moveTo(0,512);
    B.bezierCurveTo(230,469,410,531,800,476);
    B.lineTo(800,600);B.lineTo(0,600);B.closePath();
    B.fillStyle=g;B.fill();

    for(let i=0;i<2600;i++) {
      const x=random()*800,y=490+random()*110;
      const horizon=510-24*Math.sin(x/180);
      if(y<horizon)continue;
      B.fillStyle=random()>.5?'rgba(206,207,161,.13)':'rgba(3,39,46,.17)';
      B.fillRect(x,y,random()*2+.3,.6+random());
    }

    B.save();
    B.translate(114,520);B.rotate(-.17);
    g=B.createLinearGradient(-65,0,50,-160);
    g.addColorStop(0,'#173f47');g.addColorStop(.7,'#386060');g.addColorStop(1,'#64877b');
    rock(B,0,0,112,151,g);
    B.beginPath();B.moveTo(-35,-111);B.lineTo(-9,-128);B.lineTo(26,-120);
    B.strokeStyle='rgba(156,181,151,.25)';B.lineWidth=2;B.stroke();
    B.restore();
    rock(B,159,534,119,63,'#245059');
    rock(B,62,552,124,49,'#163e48');

    // A little current-made spiral of polished stones.
    for(let i=0;i<35;i++) {
      const a=i*.39,r=5+i*1.92;
      const x=437+Math.cos(a)*r*1.65,y=536+Math.sin(a)*r*.34;
      const z=2.2+i*.055;
      ellipse(B,x+1,y+2,z*1.6,z*.65,'rgba(0,29,35,.25)');
      ellipse(B,x,y,z*1.45,z*.72,i%4===0?'#b5b594':i%3===0?'#78958b':'#8a9f90');
      ellipse(B,x-.8,y-.65,z*.7,z*.23,'rgba(218,219,182,.34)');
    }

    for(let i=0;i<65;i++) {
      const x=random()*800,y=535+random()*65;
      ellipse(B,x,y,1+random()*4,.5+random()*1.1,'rgba(119,151,132,.3)');
    }

    g=B.createRadialGradient(420,290,180,410,300,550);
    g.addColorStop(0,'rgba(0,17,29,0)');
    g.addColorStop(1,'rgba(0,17,29,.58)');
    B.fillStyle=g;B.fillRect(0,0,800,600);
  }

  const end=.72, k=.072, R=114;
  function spiral(a) {
    const r=R*Math.exp(k*(a-end));
    return {x:Math.cos(a)*r,y:Math.sin(a)*r};
  }
  function shellOutline(c) {
    c.beginPath();
    for(let i=0;i<=180;i++) {
      const p=spiral(end-TAU+i/180*TAU);
      i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y);
    }
    c.closePath();
  }

  function buildShell() {
    shell.width=shell.height=600;
    S.setTransform(2,0,0,2,300,300);
    shellOutline(S);
    let g=S.createLinearGradient(-90,-110,85,100);
    g.addColorStop(0,'#fff7cc');
    g.addColorStop(.35,'#efcfa0');
    g.addColorStop(.7,'#d08b62');
    g.addColorStop(1,'#7a4744');
    S.fillStyle=g;S.fill();
    S.save();shellOutline(S);S.clip();

    const start=end-TAU*6;
    for(let a=start;a<end;a+=.225) {
      const b=Math.min(a+.225,end);
      const p=spiral(a),q=spiral(b),u=spiral(b-TAU),v=spiral(a-TAU);
      S.beginPath();S.moveTo(p.x,p.y);
      const m=spiral((a+b)/2);
      S.quadraticCurveTo(m.x,m.y,q.x,q.y);
      S.bezierCurveTo(q.x*.91-q.y*.06,q.y*.91+q.x*.06,
        u.x*1.05-u.y*.11,u.y*1.05+u.x*.11,u.x,u.y);
      S.lineTo(v.x,v.y);
      S.bezierCurveTo(v.x*1.05-v.y*.11,v.y*1.05+v.x*.11,
        p.x*.91-p.y*.06,p.y*.91+p.x*.06,p.x,p.y);
      let cg=S.createLinearGradient(v.x,v.y,p.x,p.y);
      const brightness=.5+.5*Math.sin(a*3.8);
      cg.addColorStop(0,'rgba(116,66,54,.35)');
      cg.addColorStop(.15,'rgba(255,245,203,.62)');
      cg.addColorStop(.65,`rgba(248,206,153,${.12+brightness*.22})`);
      cg.addColorStop(1,'rgba(128,72,54,.24)');
      S.fillStyle=cg;S.fill();
      S.strokeStyle='rgba(121,73,54,.36)';S.lineWidth=.65;S.stroke();

      S.beginPath();S.moveTo(p.x*.985,p.y*.985);
      S.bezierCurveTo(p.x*.9-p.y*.055,p.y*.9+p.x*.055,
        v.x*1.06-v.y*.1,v.y*1.06+v.x*.1,v.x*1.02,v.y*1.02);
      S.strokeStyle='rgba(255,246,206,.72)';S.lineWidth=.65;S.stroke();
    }

    S.beginPath();
    for(let a=end-TAU*7;a<=end;a+=.025) {
      const p=spiral(a);S.lineTo(p.x,p.y);
    }
    S.strokeStyle='rgba(107,63,54,.65)';S.lineWidth=1.1;S.stroke();

    g=S.createRadialGradient(-39,-49,3,-18,-17,117);
    g.addColorStop(0,'rgba(255,255,233,.62)');
    g.addColorStop(.4,'rgba(255,249,212,.12)');
    g.addColorStop(.8,'rgba(164,86,65,0)');
    g.addColorStop(1,'rgba(81,44,49,.28)');
    S.fillStyle=g;S.fillRect(-150,-150,300,300);

    for(let i=0;i<290;i++) {
      const a=random()*TAU,r=10+random()*102;
      ellipse(S,Math.cos(a)*r,Math.sin(a)*r,.25+random()*.45,.25,'rgba(255,246,205,.3)');
    }
    S.restore();
    shellOutline(S);S.strokeStyle='#edc99a';S.lineWidth=1.6;S.stroke();
    S.save();S.translate(-.7,-1);
    shellOutline(S);S.strokeStyle='rgba(255,248,211,.62)';S.lineWidth=.65;S.stroke();
    S.restore();
  }

  const dust=Array.from({length:46},()=>({
    x:random()*800,y:random()*650,r:.45+random()*1.35,
    speed:2+random()*6,phase:random()*TAU
  }));

  function plant(x,y,h,lean,t,foreground=false) {
    const sway=Math.sin(t*.45+x)*9;
    ctx.save();ctx.translate(x,y);
    const color=foreground?'#153f44':'#346b69';
    for(let j=0;j<5;j++) {
      const tipX=lean+(j-2)*13+sway,tipY=-h*(.7+j*.065);
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.bezierCurveTo(-9,-h*.3,tipX-15,tipY*.75,tipX,tipY);
      ctx.strokeStyle=color;ctx.lineWidth=foreground?2:1.2;ctx.stroke();
      for(let n=1;n<8;n++) {
        const f=n/9, yy=tipY*f,xx=tipX*f*f-6*Math.sin(f*Math.PI);
        const side=n%2?1:-1;
        ctx.beginPath();ctx.moveTo(xx,yy);
        ctx.quadraticCurveTo(xx+side*27,yy-2,xx+side*(16+f*9),yy-22);
        ctx.quadraticCurveTo(xx+side*5,yy-22,xx,yy);
        ctx.fillStyle=foreground?'rgba(32,80,77,.9)':'rgba(72,123,111,.63)';
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function arm(i,t,front) {
    const rootX=48+i*1.5,rootY=38+i*.95;
    const length=64+(i%4)*12;
    const wave=Math.sin(t*1.25+i*.67);
    const tipX=rootX+length+wave*9;
    const tipY=rootY+20+i*5+Math.sin(t*1.1+i*.6)*12;
    ctx.beginPath();ctx.moveTo(rootX,rootY);
    ctx.bezierCurveTo(rootX+44,rootY-17+i*2,tipX+17,tipY-25,tipX,tipY);
    ctx.bezierCurveTo(tipX-17,tipY+23,tipX-34,tipY+5,tipX-20,tipY-4);
    ctx.lineCap='round';
    ctx.strokeStyle=front?'#9c6058':'#805658';
    ctx.lineWidth=front?5.3:4;ctx.stroke();
    ctx.strokeStyle=front?'#efd7b6':'#bb9687';
    ctx.lineWidth=front?3.4:2.4;ctx.stroke();
    if(front) {
      ctx.strokeStyle='rgba(255,245,213,.8)';ctx.lineWidth=.8;
      ctx.stroke();
    }
  }

  function creature(t) {
    const x=411+Math.sin(t*.18)*38;
    const y=273+Math.sin(t*.37)*16+Math.cos(t*.19)*9;
    ctx.save();ctx.translate(x,y);
    ctx.rotate(-.105+Math.sin(t*.31)*.045);

    for(let i=0;i<5;i++)arm(i,t,false);

    ctx.save();ctx.translate(-19,-20);
    ctx.shadowColor='rgba(0,21,30,.3)';ctx.shadowBlur=20;ctx.shadowOffsetY=12;
    ctx.drawImage(shell,-150,-150,300,300);
    ctx.restore();

    let g=ctx.createLinearGradient(27,10,64,64);
    g.addColorStop(0,'#ffedc9');g.addColorStop(.5,'#dbc2a4');g.addColorStop(1,'#aa7466');
    ctx.beginPath();ctx.moveTo(22,5);
    ctx.bezierCurveTo(51,3,67,18,73,38);
    ctx.bezierCurveTo(82,57,59,71,43,56);
    ctx.bezierCurveTo(25,51,15,30,22,5);
    ctx.fillStyle=g;ctx.fill();

    ctx.beginPath();ctx.moveTo(18,7);
    ctx.bezierCurveTo(40,4,64,19,66,34);
    ctx.strokeStyle='#fff0cf';ctx.lineWidth=5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(21,12);
    ctx.bezierCurveTo(36,11,55,22,58,32);
    ctx.strokeStyle='rgba(151,91,70,.5)';ctx.lineWidth=1;ctx.stroke();

    for(let i=5;i<10;i++)arm(i,t,true);

    // The hood and its single visible pinhole eye.
    ctx.beginPath();ctx.moveTo(37,24);
    ctx.bezierCurveTo(42,7,61,8,72,26);
    ctx.quadraticCurveTo(79,39,66,46);
    ctx.quadraticCurveTo(44,47,37,24);
    g=ctx.createLinearGradient(39,16,72,46);
    g.addColorStop(0,'#f4e4c5');g.addColorStop(1,'#c49b83');
    ctx.fillStyle=g;ctx.fill();
    for(let j=0;j<14;j++) {
      const a=j*2.399,r=3+Math.sqrt(j)*2.7;
      ellipse(ctx,54+Math.cos(a)*r,26+Math.sin(a)*r*.6,.6,.45,'rgba(145,96,76,.4)');
    }

    const blink=Math.pow(Math.max(0,Math.cos(t*.48)),48);
    ctx.save();ctx.translate(64,31);ctx.scale(1,Math.max(.12,1-blink*.9));
    ellipse(ctx,0,0,9.1,9.5,'#ac7964');
    ellipse(ctx,0,-.4,7.5,8,'#ead4ac');
    ellipse(ctx,1,0,5.6,6.3,'#153e43');
    const px=pointer.active?Math.max(-1.4,Math.min(1.4,(pointer.x-x-64)/140)):.7;
    const py=pointer.active?Math.max(-1,Math.min(1,(pointer.y-y-31)/140)):0;
    ellipse(ctx,px+1,py,3.4,4.8,'#071e29');
    ellipse(ctx,-.7,-2.5,1.6,1.8,'#fff8dc');
    ellipse(ctx,3.1,2.6,.65,.7,'#99c7bf');
    ctx.restore();

    ctx.beginPath();ctx.moveTo(69,48);
    ctx.quadraticCurveTo(80,48,84,53);
    ctx.strokeStyle='#a57968';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
    ctx.restore();
  }

  function resize() {
    width=innerWidth;height=innerHeight;
    density=Math.min(devicePixelRatio||1,1.75);
    canvas.width=Math.round(width*density);
    canvas.height=Math.round(height*density);
  }
  addEventListener('resize',resize);
  addEventListener('pointermove',e=>{
    pointer.x=e.clientX/width*800;
    pointer.y=e.clientY/height*600;
    pointer.active=true;
  },{passive:true});
  addEventListener('pointerleave',()=>pointer.active=false);

  buildBackground();buildShell();resize();

  function frame(ms) {
    const t=ms*.001;
    ctx.setTransform(canvas.width/800,0,0,canvas.height/600,0,0);
    ctx.drawImage(background,0,0,800,600);

    ctx.save();ctx.globalCompositeOperation='screen';
    for(let i=0;i<4;i++) {
      const x=244+i*74+Math.sin(t*.11+i)*14;
      const g=ctx.createLinearGradient(x,0,x+130,530);
      g.addColorStop(0,'rgba(181,222,185,.075)');
      g.addColorStop(.65,'rgba(131,201,168,.025)');
      g.addColorStop(1,'rgba(101,179,158,0)');
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+23+i*4,0);
      ctx.lineTo(x+225,570);ctx.lineTo(x+85,570);ctx.closePath();
      ctx.fillStyle=g;ctx.fill();
    }
    ctx.restore();

    plant(715,514,217,-35,t);
    plant(760,530,159,-12,t+.8);
    plant(52,531,123,15,t+1.7);

    ctx.save();ctx.translate(435+Math.sin(t*.18)*20,526);
    ctx.scale(1,.18);
    const shadow=ctx.createRadialGradient(0,0,5,0,0,103);
    shadow.addColorStop(0,'rgba(5,36,40,.21)');
    shadow.addColorStop(1,'rgba(5,36,40,0)');
    ctx.fillStyle=shadow;ctx.fillRect(-105,-105,210,210);ctx.restore();

    creature(t);

    for(const p of dust) {
      const x=p.x+Math.sin(t*.15+p.phase)*13;
      const y=((p.y-t*p.speed)%650+650)%650-25;
      const alpha=.13+.17*(.5+.5*Math.sin(t*.6+p.phase));
      ellipse(ctx,x,y,p.r,p.r,`rgba(214,232,204,${alpha})`);
    }

    ctx.save();ctx.globalAlpha=.17;
    for(let i=0;i<8;i++) {
      const x=240+i*43+Math.sin(t*.48+i)*17;
      ctx.beginPath();ctx.ellipse(x,551+Math.sin(t*.6+i)*8,23+i*2,2.8,.13,0,TAU);
      ctx.strokeStyle='#add3b2';ctx.lineWidth=.8;ctx.stroke();
    }
    ctx.restore();
    plant(789,607,183,-22,t+2,true);
    plant(14,610,141,13,t+.5,true);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
