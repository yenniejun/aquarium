<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pompous Puckerjaw</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#050d12;}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const DW=600, DH=800;
const TRAP={x:300,y:420};
const ZC={x:300,y:388};
const ZR=58;
const BASE={x:300,y:636};

let dpr=1,CW=1,CH=1,S=1,OX=0,OY=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  CW=window.innerWidth; CH=window.innerHeight;
  cv.width=Math.max(1,Math.round(CW*dpr));
  cv.height=Math.max(1,Math.round(CH*dpr));
  S=Math.min(CW/DW,CH/DH);
  OX=(CW-DW*S)/2; OY=(CH-DH*S)/2;
}
window.addEventListener('resize',resize);
resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const bz=(a,b,c,d,t)=>{const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d;};

let T=0;
let spread=1.1, openBase=1.1, state='open', stateT=0;
let lure=0, hairs=0, hairT=0, tremble=0, digestGlow=0, sway=0;
let autoTimer=1.5;
let auto=null;
const sparks=[];
const motes=Array.from({length:34},()=>({x:rand(0,DW),y:rand(0,DH),r:rand(0.7,2.1),ph:rand(0,6.28),sp:rand(4,11)}));
const soilSpecks=Array.from({length:70},()=>{
  const a=rand(0,6.28), r=Math.sqrt(Math.random());
  return {x:BASE.x+Math.cos(a)*r*112, y:BASE.y+6+Math.sin(a)*r*11, s:rand(0.6,1.7), c:Math.random()<0.3?'#4d3d2e':'#2e231b'};
});
const moss=Array.from({length:18},()=>{
  const a=rand(Math.PI*1.05,Math.PI*1.95), r=rand(0.7,1.0);
  return {x:BASE.x+Math.cos(a)*r*118, y:BASE.y+Math.sin(a)*r*15+4, rx:rand(5,11), ry:rand(3,5.5), c:Math.random()<0.5?'#3c7d3e':'#5aa35a'};
});
const pebbles=Array.from({length:6},()=>({x:rand(200,400),y:rand(664,700),rx:rand(3,6),ry:rand(2,3.5)}));

const ptr={x:TRAP.x,y:600,px:TRAP.x,py:600,prevX:TRAP.x,prevY:600,vx:0,vy:0,ph:rand(0,6),
  lastMove:-99,hidden:false,alpha:0,sinking:false,sink:0,inZ:false};

function toDesign(cx,cy){return {x:(cx-OX)/S,y:(cy-OY)/S};}
function onMove(e){
  const p=toDesign(e.clientX,e.clientY);
  ptr.px=p.x; ptr.py=p.y; ptr.lastMove=T; ptr.hidden=false;
}
window.addEventListener('pointermove',onMove,{passive:true});
window.addEventListener('pointerdown',onMove,{passive:true});
document.addEventListener('mouseout',e=>{if(!e.relatedTarget){ptr.lastMove=-99;}});

function spawnSparks(x,y,n,cols,up){
  for(let i=0;i<n;i++){
    sparks.push({x,y,vx:rand(-55,55),vy:rand(-100,up?-20:20),life:0,max:rand(0.6,1.3),c:cols[i%cols.length],r:rand(1,2.4)});
  }
}

function touch(f){
  if(state!=='open') return;
  hairs++; hairT=6;
  if(hairs>=2){ snap(f); } else { tremble=1; }
}
function snap(f){
  state='snap'; stateT=0; hairs=0;
  if(f){ f.sinking=true; f.sink=0; }
  spawnSparks(ZC.x,ZC.y,16,['#ffd1dc','#9be38a','#ff6f95'],true);
}
function checkZone(f){
  if(f.sinking) return;
  const inside=Math.hypot(f.x-ZC.x,f.y-ZC.y)<ZR;
  if(inside && !f.inZ){ f.inZ=true; touch(f); }
  else if(!inside){ f.inZ=false; }
}

function steer(f,tx,ty,speed,dt){
  const dx=tx-f.x, dy=ty-f.y, d=Math.hypot(dx,dy)||1;
  const sp=speed*(0.75+0.25*Math.sin(T*6+f.ph));
  f.vx=lerp(f.vx,dx/d*sp,Math.min(1,dt*3));
  f.vy=lerp(f.vy,dy/d*sp,Math.min(1,dt*3));
  f.x+=f.vx*dt+Math.sin(T*23+f.ph)*dt*30;
  f.y+=f.vy*dt+Math.cos(T*19+f.ph)*dt*30;
}

function spawnAuto(){
  const left=Math.random()<0.5;
  auto={x:left?-30:630,y:rand(170,640),vx:0,vy:0,ph:rand(0,6),age:0,retarget:0,tx:0,ty:0,
    alpha:0,sinking:false,sink:0,inZ:false,leaving:false};
}

function update(dt){
  T+=dt;

  // pointer fly
  const pActive=(T-ptr.lastMove<4)&&!ptr.hidden;
  ptr.alpha=lerp(ptr.alpha,pActive?1:0,Math.min(1,dt*4));
  const pvx=ptr.x, pvy=ptr.y;
  if(ptr.sinking){
    ptr.sink=Math.min(1,ptr.sink+dt*2.2);
    ptr.x=lerp(ptr.x,ZC.x,Math.min(1,dt*8));
    ptr.y=lerp(ptr.y,ZC.y,Math.min(1,dt*8));
    if(ptr.sink>=1){ ptr.sinking=false; ptr.sink=0; ptr.hidden=true; ptr.alpha=0; }
  } else if(pActive){
    const k=Math.min(1,dt*9);
    ptr.x+=(ptr.px-ptr.x)*k;
    ptr.y+=(ptr.py-ptr.y)*k;
    const vx=(ptr.x-pvx)/dt, vy=(ptr.y-pvy)/dt;
    if(Math.hypot(vx,vy)>6){ ptr.vx=lerp(ptr.vx,vx,0.2); ptr.vy=lerp(ptr.vy,vy,0.2); }
    if(ptr.alpha>0.5) checkZone(ptr);
  }

  // autonomous fly
  if(!pActive){
    if(!auto){
      autoTimer-=dt;
      if(autoTimer<=0) spawnAuto();
    }
  } else if(auto && !auto.sinking){
    auto.leaving=true;
  }
  if(auto){
    auto.age+=dt;
    auto.alpha=lerp(auto.alpha,auto.leaving?0:1,Math.min(1,dt*3));
    if(auto.sinking){
      auto.sink=Math.min(1,auto.sink+dt*2.2);
      auto.x=lerp(auto.x,ZC.x,Math.min(1,dt*8));
      auto.y=lerp(auto.y,ZC.y,Math.min(1,dt*8));
      if(auto.sink>=1){ auto=null; autoTimer=rand(2,5); }
    } else if(auto.leaving){
      steer(auto,auto.x<300?-60:660,90,200,dt);
      if(auto.alpha<0.02 || auto.x<-80 || auto.x>680){ auto=null; autoTimer=rand(2,5); }
    } else {
      auto.retarget-=dt;
      const dd=Math.hypot(auto.tx-auto.x,auto.ty-auto.y);
      if(auto.retarget<=0 || dd<12){
        if(Math.random()<0.55){
          auto.tx=ZC.x+rand(-50,50); auto.ty=ZC.y+rand(-40,40);
        } else {
          auto.tx=rand(60,540); auto.ty=rand(170,600);
        }
        auto.retarget=rand(1.2,2.8);
      }
      steer(auto,auto.tx,auto.ty,110,dt);
      if(auto.age>20) auto.leaving=true;
      checkZone(auto);
    }
  }

  // plant
  openBase=1.08+0.1*Math.sin(T*1.1)+0.2*lure;
  stateT+=dt;
  switch(state){
    case 'open':
      spread=lerp(spread,openBase+tremble*0.2*Math.sin(T*55),Math.min(1,dt*3));
      break;
    case 'snap':
      spread=lerp(spread,0.03,Math.min(1,dt*16));
      if(stateT>0.2 && spread<0.12){ state='digest'; stateT=0; }
      break;
    case 'digest':
      spread=lerp(spread,0.03+0.012*Math.sin(T*2),Math.min(1,dt*2));
      digestGlow=lerp(digestGlow,1,Math.min(1,dt*1.5));
      if(Math.random()<dt*4) spawnSparks(ZC.x+rand(-20,20),ZC.y+rand(-6,14),1,['#ffb3c6','#ffe2ea'],true);
      if(stateT>5){ state='reopen'; stateT=0; }
      break;
    case 'reopen':
      digestGlow=lerp(digestGlow,0,Math.min(1,dt*1.2));
      spread=lerp(spread,openBase,Math.min(1,dt*0.8));
      if(stateT>4){ state='open'; stateT=0; }
      break;
  }
  tremble*=Math.max(0,1-dt*2.5);
  hairT-=dt;
  if(hairT<=0) hairs=0;

  // lure and sway
  let bestD=1e9, bestX=TRAP.x;
  const cands=[];
  if(ptr.alpha>0.3 && !ptr.sinking) cands.push(ptr);
  if(auto && !auto.sinking && !auto.leaving) cands.push(auto);
  for(const f of cands){
    const d=Math.hypot(f.x-ZC.x,f.y-ZC.y);
    if(d<bestD){ bestD=d; bestX=f.x; }
  }
  const lt=state==='open'?clamp((240-bestD)/180,0,1):0;
  lure=lerp(lure,lt,Math.min(1,dt*4));
  const st=(bestD<240 && Math.abs(bestX-TRAP.x)<260)?clamp((bestX-TRAP.x)/260,-1,1)*0.1:0;
  sway=lerp(sway,st,Math.min(1,dt*3));

  // particles
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];
    p.life+=dt; p.vy+=120*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.life>p.max) sparks.splice(i,1);
  }
  for(const m of motes){
    m.y-=m.sp*dt;
    m.x+=Math.sin(T+m.ph)*dt*6;
    if(m.y<-10){ m.y=DH+10; m.x=rand(0,DW); }
  }
}

function leaf(x0,y0,x1,y1,w,c1,c2){
  const mx=(x0+x1)/2, my=(y0+y1)/2;
  const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L;
  ctx.beginPath();
  ctx.moveTo(x0,y0);
  ctx.quadraticCurveTo(mx+nx*w,my+ny*w,x1,y1);
  ctx.quadraticCurveTo(mx-nx*w*0.6,my-ny*w*0.6,x0,y0);
  ctx.closePath();
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(8,30,20,0.6)'; ctx.lineWidth=1; ctx.stroke();
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawLobe(dir){
  const L=80, Wd=50;
  ctx.save();
  ctx.rotate(dir);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(L*0.25,-Wd*1.05,L*0.85,-Wd*0.95,L,0);
  ctx.bezierCurveTo(L*0.85,Wd*0.95,L*0.25,Wd*1.05,0,0);
  ctx.closePath();
  const g=ctx.createLinearGradient(0,0,L,0);
  g.addColorStop(0,'#2e6b3a');
  g.addColorStop(0.45,'#7d2f4e');
  g.addColorStop(1,'#c9466b');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(20,40,25,0.75)'; ctx.lineWidth=1.3; ctx.stroke();

  ctx.beginPath(); ctx.moveTo(2,0); ctx.lineTo(L*0.85,0);
  ctx.strokeStyle='rgba(255,200,215,0.25)'; ctx.lineWidth=1; ctx.stroke();

  ctx.fillStyle='#c8eaa0';
  for(let i=1;i<8;i++){
    const t=i/8;
    const x=bz(0,L*0.25,L*0.85,L,t);
    const yu=Math.abs(bz(0,-Wd*1.05,-Wd*0.95,0,t));
    for(const s of [-1,1]){
      const yy=s*yu, ty=yy+s*7;
      ctx.beginPath();
      ctx.moveTo(x-2.5,yy); ctx.lineTo(x+2.5,yy); ctx.lineTo(x+0.5,ty);
      ctx.closePath(); ctx.fill();
    }
  }

  ctx.strokeStyle='rgba(255,235,240,0.55)'; ctx.lineWidth=0.8;
  for(const hx of [L*0.42,L*0.58,L*0.72]){
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(hx,s*Wd*0.3);
      ctx.lineTo(hx+2,s*(Wd*0.3+5));
      ctx.stroke();
    }
  }

  for(let i=0;i<4;i++){
    const gx=L*(0.3+0.15*i), gy=(i%2?1:-1)*Wd*0.35;
    const a=clamp(0.45+0.35*Math.sin(T*2.6+i*1.7)+lure*0.4,0,1);
    ctx.fillStyle=`rgba(255,242,246,${a})`;
    ctx.beginPath(); ctx.arc(gx,gy,1.5+lure*0.9,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawFly(x,y,a,hd,ph,sink){
  if(a<=0.01) return;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(hd);
  const sc=1.5*(1-sink*0.6);
  ctx.scale(sc,sc);
  ctx.globalAlpha=a*(1-sink);
  const fl=Math.abs(Math.sin(T*75+ph));
  ctx.fillStyle='rgba(215,235,245,0.4)';
  ctx.beginPath(); ctx.ellipse(-1,-3,4.2,1.2+2.6*fl,-0.25,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-1,3,4.2,1.2+2.6*fl,0.25,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1b2024';
  ctx.beginPath(); ctx.ellipse(-1.5,0,5,2.8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#34262b';
  ctx.beginPath(); ctx.arc(4,0,2.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#d04d6e';
  ctx.beginPath(); ctx.arc(5,-1.2,1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,1.2,1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(150,200,220,0.5)';
  ctx.beginPath(); ctx.arc(-2.5,-1.2,1.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const bg=ctx.createLinearGradient(0,0,0,CH);
  bg.addColorStop(0,'#0c1d26');
  bg.addColorStop(0.6,'#071117');
  bg.addColorStop(1,'#030608');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,CW,CH);

  ctx.setTransform(dpr*S,0,0,dpr*S,dpr*OX,dpr*OY);

  // lamp light
  const lamp=ctx.createRadialGradient(300,450,20,300,450,340);
  lamp.addColorStop(0,'rgba(90,180,165,0.24)');
  lamp.addColorStop(1,'rgba(90,180,165,0)');
  ctx.fillStyle=lamp;
  ctx.fillRect(-100,-100,800,1000);

  // motes
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const m of motes){
    const a=0.25+0.22*Math.sin(T*2+m.ph);
    ctx.fillStyle=`rgba(180,255,215,${clamp(a,0,1)})`;
    ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // back leaves
  const lw1=Math.sin(T*0.7)*4, lw2=Math.sin(T*0.6+1)*4;
  leaf(BASE.x,BASE.y+6,132+lw1,596,42,'#2b6a3a','#1a4527');
  leaf(BASE.x,BASE.y+6,470+lw2,604,38,'#2f7140','#1c4a2b');

  // bud
  ctx.beginPath();
  ctx.moveTo(BASE.x,BASE.y);
  ctx.bezierCurveTo(280,580,236,560,222,526);
  ctx.strokeStyle='#245c33'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(222,530);
  ctx.bezierCurveTo(206,516,210,488,222,476);
  ctx.bezierCurveTo(234,488,238,516,222,530);
  const bg2=ctx.createLinearGradient(0,476,0,530);
  bg2.addColorStop(0,'#c05a78'); bg2.addColorStop(1,'#3d7b45');
  ctx.fillStyle=bg2; ctx.fill();

  // main petiole
  ctx.beginPath();
  ctx.moveTo(BASE.x,BASE.y);
  ctx.bezierCurveTo(296,560,312,500,TRAP.x,TRAP.y+10);
  ctx.strokeStyle='#1f5530'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.stroke();
  ctx.strokeStyle='#3f8a4a'; ctx.lineWidth=7; ctx.stroke();

  // trap
  ctx.save();
  ctx.translate(TRAP.x,TRAP.y);
  ctx.rotate(sway);
  ctx.fillStyle=`rgba(50,8,28,${0.5+0.3*lure})`;
  ctx.beginPath();
  ctx.ellipse(0,-14,22,Math.max(4,30*spread/1.2),0,0,Math.PI*2);
  ctx.fill();
  drawLobe(-Math.PI/2-spread);
  drawLobe(-Math.PI/2+spread);
  ctx.restore();

  // nectar glow
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const gl=ctx.createRadialGradient(TRAP.x,TRAP.y-25,5,TRAP.x,TRAP.y-25,130);
  const ga=0.12+0.4*lure+0.3*digestGlow;
  gl.addColorStop(0,`rgba(255,110,150,${ga})`);
  gl.addColorStop(1,'rgba(255,110,150,0)');
  ctx.fillStyle=gl;
  ctx.fillRect(TRAP.x-140,TRAP.y-160,280,280);
  ctx.restore();

  // pot body
  const pg=ctx.createLinearGradient(176,0,424,0);
  pg.addColorStop(0,'#6d3524'); pg.addColorStop(0.5,'#b5623f'); pg.addColorStop(1,'#6e3626');
  ctx.beginPath();
  ctx.moveTo(180,668); ctx.lineTo(420,668);
  ctx.lineTo(398,792); ctx.quadraticCurveTo(300,804,202,792);
  ctx.closePath();
  ctx.fillStyle=pg; ctx.fill();

  // painted wave band
  ctx.beginPath();
  for(let i=0;i<=24;i++){
    const x=192+i*(216/24);
    const y=712+Math.sin(i*0.9)*5;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle='rgba(130,225,212,0.5)'; ctx.lineWidth=3; ctx.stroke();

  // soil
  ctx.beginPath();
  ctx.ellipse(BASE.x,BASE.y+4,124,16,0,0,Math.PI*2);
  const sg=ctx.createRadialGradient(BASE.x,BASE.y,10,BASE.x,BASE.y,130);
  sg.addColorStop(0,'#2b2019'); sg.addColorStop(1,'#15100c');
  ctx.fillStyle=sg; ctx.fill();
  for(const s of soilSpecks){
    ctx.fillStyle=s.c;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,Math.PI*2); ctx.fill();
  }
  for(const p of pebbles){
    ctx.fillStyle='#6d6a68';
    ctx.beginPath(); ctx.ellipse(p.x,p.y,p.rx,p.ry,0,0,Math.PI*2); ctx.fill();
  }
  for(const m of moss){
    ctx.fillStyle=m.c;
    ctx.beginPath(); ctx.ellipse(m.x,m.y,m.rx,m.ry,0,0,Math.PI*2); ctx.fill();
  }

  // rim
  const rg=ctx.createLinearGradient(170,0,430,0);
  rg.addColorStop(0,'#7a3b28'); rg.addColorStop(0.5,'#c7714c'); rg.addColorStop(1,'#7a3b28');
  rr(170,646,260,26,9);
  ctx.fillStyle=rg; ctx.fill();
  ctx.strokeStyle='rgba(40,15,8,0.5)'; ctx.lineWidth=1; ctx.stroke();

  // moss on rim
  for(let i=0;i<9;i++){
    const x=186+i*27+Math.sin(i*2.1)*4;
    ctx.fillStyle=i%2?'#3c7d3e':'#4f9450';
    ctx.beginPath(); ctx.ellipse(x,648,7,3.5,0,0,Math.PI*2); ctx.fill();
  }

  // tiny remains
  ctx.strokeStyle='rgba(235,230,215,0.5)'; ctx.lineWidth=1;
  for(const [x,y] of [[246,630],[352,626],[318,632]]){
    ctx.beginPath(); ctx.moveTo(x-2,y-2); ctx.lineTo(x+2,y+2);
    ctx.moveTo(x+2,y-2); ctx.lineTo(x-2,y+2); ctx.stroke();
  }

  // sparks
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const p of sparks){
    const a=1-p.life/p.max;
    ctx.globalAlpha=clamp(a,0,1);
    ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // flies
  if(ptr.alpha>0.01){
    const wx=Math.sin(T*15+ptr.ph)*1.2, wy=Math.cos(T*13+ptr.ph)*1.2;
    const hd=Math.atan2(ptr.vy,ptr.vx);
    drawFly(ptr.x+wx,ptr.y+wy,ptr.alpha,hd,ptr.ph,ptr.sink);
  }
  if(auto){
    const hd=Math.atan2(auto.vy,auto.vx);
    drawFly(auto.x,auto.y,auto.alpha,hd,auto.ph,auto.sink);
  }
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
